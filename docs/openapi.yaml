                  type: string
            activation_url:
              type: string
              format: uri
              description: |
                Lien vers l'application WEB, jamais vers l'API. Affiche UNE
                SEULE FOIS : le jeton n'est stocke qu'en empreinte SHA-256.
                C'est aussi le lien envoye au titulaire (#1620) : il n'y en a qu'un.
            activation_envoyee_a:
              type: string
              format: email
              nullable: true
              description: |
                #1620 — l'adresse du titulaire a laquelle le lien d'activation part
                par courriel. `null` quand aucun canal de courriel n'est configure :
                le lien de secours (`activation_url`) est alors la seule voie.

    # D9 — creation d'une seance LOCALE (POST /lms/seances).
    SeanceLocaleInput:
      type: object
      required:
        - titre
        - date_seance
      properties:
        titre:
          type: string
          minLength: 3
          maxLength: 255
        date_seance:
          type: string
          format: date-time
          pattern: '^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}(\.[0-9]+)?(Z|[+-][0-9]{2}:[0-9]{2})$'
          description: |
            Le debut de la seance, en ISO 8601 AVEC decalage (`Z` ou `+01:00`).
            Une heure seule, une date sans decalage ou une date seule rendent
            422. L'instant est range dans le fuseau de l'application.
          example: "2026-11-03T08:30:00+00:00"
        matiere_nom:
          type: string
          maxLength: 191
          nullable: true
        classe_nom:
          type: string
          maxLength: 191
          nullable: true
          description: "Libelle libre, pour l'affichage."
        classe_id:
          type: integer
          minimum: 1
          nullable: true
          description: |
            Classe de l'etablissement de l'auteur, facultative (une classe locale
            ou le miroir d'une classe KLASSCI). Une classe inexistante ou d'une
            autre ecole rend 404.
        matiere_id:
          type: integer
          minimum: 1
          nullable: true
          description: |
            Matiere LOCALE de l'etablissement de l'auteur, facultative. Une
            matiere inexistante ou d'une autre ecole rend 404. Avec `classe_id`,
            elle doit etre au programme de la classe, sinon 422
            `subject_not_in_class_program`. Donnee, son libelle remplace
            `matiere_nom`.
        type_seance:
          $ref: '#/components/schemas/TypeDeSeance'
        fin_seance:
          type: string
          format: date-time
          nullable: true
          pattern: '^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}(\.[0-9]+)?(Z|[+-][0-9]{2}:[0-9]{2})$'
          description: "Facultative, strictement apres `date_seance`, en ISO 8601 AVEC decalage. Absente, aucune fin n'est ecrite (#1668)."
        forcer_conflit:
          type: boolean
          description: "Passer outre un conflit d'horaire (409 `seance_schedule_conflict`) : la gestion seule ; un enseignant recoit 403 `conflict_override_forbidden`."

    SeanceLocaleCreated:
      type: object
      additionalProperties: false
      required:
        - success
        - message
        - data
      properties:
        success:
          type: boolean
          enum:
            - true
        message:
          type: string
          example: "Séance créée"
        data:
          type: object
          additionalProperties: false
          required:
            - id
            - titre
            - date_seance
            - matiere_nom
            - matiere_id
            - classe_nom
            - classe_id
            - type_seance
            - fin_seance
            - created_by
            - institution_id
            - is_active
            - klassci_seance_id
            - klassci_enseignant_id
            - klassci_matiere_id
            - klassci_classe_id
            - current_participants_count
            - created_at
            - updated_at
          properties:
            matiere_id:
              type: integer
              nullable: true
              description: "La matiere LOCALE choisie, nulle sans matiere."
            id:
              type: integer
            titre:
              type: string
            date_seance:
              type: string
              format: date-time
            matiere_nom:
              type: string
              nullable: true
            classe_nom:
              type: string
              nullable: true
            classe_id:
              type: integer
              nullable: true
            type_seance:
              $ref: '#/components/schemas/TypeDeSeance'
            fin_seance:
              type: string
              format: date-time
              nullable: true
            created_by:
              type: integer
            institution_id:
              type: integer
            is_active:
              type: boolean
            klassci_seance_id:
              type: integer
              nullable: true
              description: "Toujours nul pour une seance locale."
            klassci_enseignant_id:
              type: integer
              nullable: true
              description: "Toujours nul pour une seance locale."
            klassci_matiere_id:
              type: integer
              nullable: true
              description: "Toujours nul pour une seance locale."
            klassci_classe_id:
              type: integer
              nullable: true
              description: "Toujours nul pour une seance locale."
            current_participants_count:
              type: integer
              minimum: 0
            created_at:
              type: string
              format: date-time
            updated_at:
              type: string
              format: date-time

