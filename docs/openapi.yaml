      properties:
        id:
          description: |
            Ecole creee depuis le LMS : l'id du compte (`users.id`). Ecole creee
            depuis KLASSCI, repli local (`meta.source` `lms_local`) : l'id
            d'ENSEIGNANT KLASSCI (`klassci_enseignant_id`), l'espace de la liste
            de KLASSCI et du filtre `teacher_id`, jamais le numero de compte
            `klassci_id` ; un compte sans identite d'enseignant KLASSCI est ecarte
            du repli (#873).
          oneOf:
            - type: integer
            - type: string
        nom:
          type: string
          nullable: true
        name:
          type: string
          nullable: true
        prenom:
          type: string
          nullable: true
        email:
          type: string
          nullable: true
        telephone:
          type: string
          nullable: true
        matricule:
          type: string
          nullable: true
        specialization:
          type: string
          nullable: true
        status:
          type: string
          nullable: true
        matieres:
          type: array
          description: "Avec `with_details`. Ecole creee depuis le LMS : les matieres ou l'enseignant est designe, avec leurs classes ; heures, taux et seances valent `null`."
          items:
            type: object
        classes:
          type: array
          description: "Avec `with_details`. Ecole creee depuis le LMS : ses classes, aux ids de `/proxy/classes` ; filiere et niveau valent `null`."
          items:
            type: object
        statistiques:
          type: object
          description: "Ecole creee depuis KLASSCI seulement."

    RefusApercuEvaluation:
      type: object
      description: |
        Le 403 de `/evaluations/{id}/preview`. Le motif ferme
        `preview_requires_finished_evaluation` dit qu un coordinateur ne previsualise
        que les evaluations terminees ; le refus d acces de la requete n en porte pas.
      additionalProperties: false
      required:
