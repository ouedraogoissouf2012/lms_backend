          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RefusMotive'
        '409':
          description: "Deja marque par l'enseignant (`already_marked_by_teacher`), ou ecole KLASSCI (`attendance_managed_by_klassci`)."
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RefusMotive'
        '410':
          description: "Code expire ou revoque (`attendance_code_expired`)."
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RefusMotive'
        '422':
          description: "Charge invalide (`errors`), ou eleve hors des eleves actifs de la classe (`student_not_in_seance`)."
