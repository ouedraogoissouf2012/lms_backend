        success:
          type: boolean
          enum:
            - false
        message:
          type: string

    AuditLogEntry:
      type: object
      description: |
        Une entree du journal d'audit (`audit_logs`), avec son auteur et son
        ecole. `before` et `after` sont les attributs avant et apres l'action ;
        un tableau vide est serialise en liste vide `[]`, que ce schema ne decrit
        pas (aucun `oneOf` ici).
      additionalProperties: false
      required:
        - id
        - user_id
        - institution_id
        - action
        - auditable_type
        - auditable_id
        - before
        - after
        - ip_address
        - user_agent
        - created_at
        - user
        - institution
      properties:
        id:
          type: integer
        user_id:
          type: integer
          nullable: true
        institution_id:
          type: integer
          nullable: true
        action:
          type: string
          description: |
            Chaine libre (`string(32)`). Valeurs ecrites par le serveur :
            - modeles audites (`Evaluation`, `EvaluationSubmission`, `QuizAttempt`) :
              `create`, `update`, `delete` ;
            - authentification : `login`, `logout`, `login_failed` ;
            - enregistrements visio : `visio_recording_start`,
              `visio_recording_stop`, `visio_recording_read` ;
            - ecoles : `institution.mode_changed`, `institution.soft_deleted`,
              `institution.klassci_token_erased` (#1213),
              `institution.purged` ;
            - comptes : `user.soft_deleted`, `user.purged` ;
            - retention : `recording.purged`, `chapter.purged`,
              `audit-logs.purged.bulk`.
            Un client traite toute autre valeur comme inconnue.
        auditable_type:
          type: string
          nullable: true
          description: |
            Le modele vise, par son nom de classe complet (`App\Models\Evaluation`,
            `EvaluationSubmission`, `QuizAttempt`, `Institution`, `User`,
            `SeanceRecording`, `Chapter`). `null` pour une connexion ou une purge
            groupee.
        auditable_id:
          type: integer
          nullable: true
        before:
          type: object
          nullable: true
          additionalProperties: true
        after:
          type: object
          nullable: true
          additionalProperties: true
        ip_address:
          type: string
          nullable: true
        user_agent:
          type: string
          nullable: true
        created_at:
          type: string
          format: date-time
        user:
          type: object
          nullable: true
          description: |
            L'auteur de l'action, supprime depuis ou non. `null` pour un job
            systeme ou un echec de connexion, ou apres une purge physique du
            compte.
          additionalProperties: false
          required:
            - id
            - name
            - email
            - role
          properties:
            id:
              type: integer
            name:
              type: string
            email:
              type: string
              nullable: true
            role:
              type: string
        institution:
          type: object
          nullable: true
          description: "L'ecole de l'entree, supprimee logiquement ou non ; null sans ecole ou apres une purge physique (D127)"
          additionalProperties: false
          required:
            - id
            - name
          properties:
            id:
              type: integer
            name:
              type: string

    SchoolRequestQueue:
      type: object
      properties:
        success:
          type: boolean
        data:
          type: array
          items:
            type: object
            properties:
              id:
                type: integer
              nom_demandeur:
                type: string
              email_demandeur:
                type: string
              telephone_demandeur:
                type: string
                nullable: true
