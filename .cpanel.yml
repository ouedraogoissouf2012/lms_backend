---
deployment:
  tasks:
    - export DEPLOYPATH=/home/c2569688c/public_html/lms-backend
    # #537 : ne jamais copier .git/ (fuite de l'historique complet si le webroot est
    # mal servi), .env* (déjà présent côté serveur, source non fiable), tests/
    # (inutile en prod) ni .claude/ (specs versionnées décrivant des vulnérabilités
    # réelles du projet — audit sécurité #537). rsync sans --delete est additif
    # uniquement : si $DEPLOYPATH
    # est déjà une copie de travail Git active (mécanisme manuel de
    # docs/DEPLOIEMENT_CPANEL.md), son .git/.env existant reste intact — jamais
    # supprimé ni écrasé. Si /usr/bin/rsync est absent sur ce serveur, la tâche
    # échoue de façon visible dans les logs de déploiement cPanel (fail-closed)
    # plutôt que de retomber silencieusement sur une copie complète.
    - /usr/bin/rsync -a --exclude='.git' --exclude='.env*' --exclude='tests' --exclude='.claude' ./ $DEPLOYPATH
    - cd $DEPLOYPATH && /usr/local/bin/php artisan cache:clear --quiet
    - cd $DEPLOYPATH && /usr/local/bin/php artisan config:clear --quiet
