  # L'upload vit sous /files/upload, pas sous /files (#876) : la spec le
  # documentait en `POST /files`, que le serveur refuse en 405.
  /files/upload:
    post:
      tags:
        - Files
      summary: "Upload file"
      description: "30 Mo maximum, types limités par UploadFileRequest. Limité à 60 requêtes par minute."
      security:
        - sanctum: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - file
              properties:
                file:
                  type: string
                  format: binary
                  description: "pdf, doc, docx, xls, xlsx, ppt, pptx, jpg, jpeg, png ou gif"
                category:
                  type: string
                  enum: [course_material, assignment, resource, other, forum_attachment, profile_picture, general]
                fileable_type:
                  type: string
                  description: "Clé déclarée dans config/fileables.php (morph_map)"
                fileable_id:
                  type: integer
                  minimum: 1
                description:
                  type: string
                  maxLength: 500
                is_public:
                  type: boolean
      responses:
        '201':
          description: "File uploaded"
        '400':
          $ref: '#/components/responses/EtablissementInconnu'
        '401':
          description: "Unauthenticated"
        '403':
          $ref: '#/components/responses/EtablissementDesactive'
        '422':
          description: "Validation error"
        '429':
          description: "Too many requests"
        '500':
          description: "Storage failure"

  /files/{id}/download:
    get:
      tags:
        - Files
      summary: "Download file"
      security:
        - sanctum: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: "File downloaded"
        '400':
          $ref: '#/components/responses/EtablissementInconnu'
        '403':
          $ref: '#/components/responses/EtablissementDesactive'
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /webhooks/visio/recording-ready:
    post:
      tags:
        - Visio
      summary: "Webhook enregistrement visio prêt (#469)"
      security: []
      responses:
        '202':
          description: "Accepted for processing"
        '400':
          $ref: '#/components/responses/EtablissementInconnu'
        '401':
          description: |
            Authentification du webhook refusee, chaque sens avec son motif (#922) :
            `webhook_signature_missing`, `webhook_timestamp_invalid`,
            `webhook_timestamp_expired`, `webhook_signature_invalid`.
        '409':
          description: "Webhook deja traite (rejeu du meme nonce) : `reason: webhook_already_processed` (#922)."

