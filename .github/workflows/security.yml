name: Security Audit

# CI security pipeline: dependency checks, PHPStan, Semgrep, docs/tests and guards.

on:
  pull_request:
    branches:
      - lms
  push:
    branches:
      - lms

permissions:
  contents: read
  pull-requests: read  # required by dependency-review-action

jobs:
  composer-audit:
    name: Composer Audit (CVE scan)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP 8.3
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          coverage: none
          tools: composer:v2

      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: vendor
          key: composer-${{ hashFiles('composer.lock') }}
          restore-keys: composer-

      - name: Install production dependencies
        run: composer install --no-interaction --no-progress --prefer-dist --no-dev --no-scripts

      - name: Run composer audit (fail on HIGH/CRITICAL CVE)
        run: composer audit --abandoned=ignore --no-interaction

      - name: List outdated production packages (informational only)
        if: always()
        continue-on-error: true
        run: composer outdated --direct --no-interaction

  dependency-review:
    name: Dependency Review (PR-level diff)
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Dependency Review
        uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high
          comment-summary-in-pr: on-failure

  phpstan-analysis:
    name: PHPStan / Larastan (level 9 + baseline)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP 8.3
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          coverage: none
          tools: composer:v2

      - name: Cache Composer dependencies (with dev)
        uses: actions/cache@v4
        with:
          path: vendor
          key: composer-phpstan-${{ hashFiles('composer.lock') }}
          restore-keys: composer-phpstan-

      - name: Install dependencies (including dev)
        run: composer install --no-interaction --no-progress --prefer-dist --no-scripts

      - name: Cache PHPStan result cache
        uses: actions/cache@v4
        with:
          path: storage/framework/cache/phpstan
          key: phpstan-${{ hashFiles('**/*.php', 'phpstan.neon.dist', 'phpstan-baseline.neon') }}
          restore-keys: phpstan-

      - name: Run PHPStan / Larastan
        run: vendor/bin/phpstan analyse --memory-limit=2G --no-progress

      - name: Check PHPStan baseline ratchet
        run: php scripts/check-phpstan-baseline.php --max=695

  semgrep-sast:
    name: Semgrep SAST (OWASP + default)
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'

    container:
      image: semgrep/semgrep

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Semgrep scan (block on ERROR severity)
        run: semgrep scan --config p/default --config p/owasp-top-ten --severity ERROR --error

      - name: Semgrep scan (informational, WARNING/INFO)
        if: always()
        continue-on-error: true
        run: semgrep scan --config p/default --config p/owasp-top-ten --severity WARNING --severity INFO

  docs-sync:
    name: Docs Sync (OpenAPI ↔ code)
    runs-on: ubuntu-latest

    env:
      APP_ENV: testing
      APP_KEY: "base64:Cg9vQ0xtc1Rlc3RLZXkxMjM0NTY3ODkwYWJjZGVmZ2g="

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP 8.3
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          coverage: none
          tools: composer:v2

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install PyYAML
        run: pip install pyyaml

      - name: Install PHP dependencies
        run: composer install --no-interaction --no-progress --prefer-dist --no-scripts

      - name: Prepare sqlite test database
        run: mkdir -p database && touch database/database.testing.sqlite

      - name: OpenAPI ↔ routes sync test
        run: vendor/bin/phpunit --filter OpenApiSyncTest

      - name: OpenAPI spec validation (JSON output)
        run: python scripts/openapi-validator.py docs/openapi.yaml --json

  commitlint:
    name: Commit messages (conventional)
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate commit messages
        uses: wagoid/commitlint-github-action@v6
        with:
          configFile: .commitlintrc.json

  sdk-generation:
    name: SDK Generation (smoke test)
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Setup Java (required by openapi-generator)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Generate TypeScript SDK from spec
        run: |
          npx --yes @openapitools/openapi-generator-cli@2.13.4 generate \
            -i docs/openapi.yaml \
            -g typescript-fetch \
            -o sdk-smoke-ts

      - name: Verify SDK artifacts were produced
        run: |
          if [ ! -f sdk-smoke-ts/runtime.ts ]; then
            echo "❌ La génération SDK n'a produit aucun artefact — spec invalide ?"
            exit 1
          fi
          echo "✅ SDK TypeScript généré ($(find sdk-smoke-ts -name '*.ts' | wc -l) fichiers .ts)"

  tests:
    name: Tests (PHPUnit — ${{ matrix.leg }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        leg: [redis, database]

    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      APP_ENV: testing
      APP_KEY: "base64:Cg9vQ0xtc1Rlc3RLZXkxMjM0NTY3ODkwYWJjZGVmZ2g="

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP 8.3
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          coverage: none
          tools: composer:v2
          extensions: ":imagick, redis"

      - name: Install dependencies (including dev)
        run: composer install --no-interaction --no-progress --prefer-dist --no-scripts

      - name: Prepare sqlite test database
        run: mkdir -p database && touch database/database.testing.sqlite

      - name: Wait for Redis (redis leg)
        if: matrix.leg == 'redis'
        run: |
          for i in $(seq 1 30); do
            if (exec 3<>/dev/tcp/127.0.0.1/6379) 2>/dev/null; then
              echo "Redis disponible."
              exit 0
            fi
            sleep 1
          done
          echo "Redis indisponible après 30s" && exit 1

      - name: Run PHPUnit suite (redis)
        if: matrix.leg == 'redis'
        env:
          CACHE_STORE: redis
          SESSION_DRIVER: redis
          QUEUE_CONNECTION: redis
          REDIS_HOST: 127.0.0.1
          REDIS_PORT: 6379
        run: vendor/bin/phpunit --no-coverage

      - name: Run PHPUnit suite (database)
        if: matrix.leg == 'database'
        run: vendor/bin/phpunit --no-coverage

  file-size-guard:
    name: File size guard (app ≤300 / models ≤150)
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup PHP 8.3
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          coverage: none

      - name: Check changed app/ files size
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          git fetch --no-tags origin "$BASE_REF"
          files=$(git diff --name-only --diff-filter=ACMR "origin/$BASE_REF...HEAD" -- app)
          if [ -z "$files" ]; then
            echo "Aucun fichier app/ modifié — rien à contrôler."
            exit 0
          fi
          echo "Fichiers app/ modifiés :"
          echo "$files"
          php scripts/check-file-sizes.php $files
