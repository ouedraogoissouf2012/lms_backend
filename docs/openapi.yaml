          type: boolean
          enum:
            - true
        data:
          type: object
          additionalProperties: false
          required:
            - id
            - status
            - status_url
            - download_url
          properties:
            id:
              type: string
              description: "UUID du rapport."
            status:
              type: string
              enum:
                - pending
            status_url:
              type: string
              description: "Chemin relatif : /api/admin/reports/async/{id}."
            download_url:
              type: string
              description: "Chemin relatif : /api/admin/reports/async/{id}/download."

    RapportSuivi:
      type: object
      additionalProperties: false
      required:
        - success
        - data
      properties:
        success:
          type: boolean
          enum:
            - true
        data:
          type: object
          additionalProperties: false
          required:
            - id
            - type
            - status
            - created_at
            - updated_at
            - meta
          properties:
            id:
              type: string
            type:
              type: string
              enum:
                - attendance
                - grades
                - activity
            status:
              type: string
              enum:
                - pending
                - running
                - completed
                - failed
            created_at:
              type: string
              format: date-time
            updated_at:
              type: string
              format: date-time
            meta:
              type: object
              additionalProperties: false
              required:
                - filters
              properties:
                filters:
                  type: object
                  description: "La charge VALIDEE de la demande, telle quelle."
            filename:
              type: string
              description: "Present une fois le rapport `completed`."
            message:
              type: string
              description: |
                Present une fois le rapport `failed`. Peut apparaitre sur une
                tentative non definitive : le job retente (trois essais), et un
                rapport peut repasser par `running` puis finir `completed`.
              enum:
                - report_generation_failed

    RapportRefus:
      type: object
      additionalProperties: false
      required:
        - success
