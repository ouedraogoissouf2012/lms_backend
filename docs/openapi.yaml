openapi: 3.0.0
info:
  title: "LMS Backend API"
  description: |
    API complète pour la plateforme LMS - Learning Management System avec intégration KLASSCI.

    ## Rate limiting (#214)

    Les routes proxy KLASSCI sont limitées par utilisateur authentifié :
      - `GET /proxy/*` (lecture) : **100 requêtes / minute / utilisateur**.
      - écritures `/proxy/evaluations/{id}/notes`, `/proxy/cours/{id}/presences`,
        `/proxy/cours/{id}/statut` : **30 requêtes / minute / utilisateur**.

    Le rôle `supradmin` (gestionnaire plateforme) est exempté.

    Chaque réponse expose les en-têtes `X-RateLimit-Limit` et
    `X-RateLimit-Remaining`. Au dépassement, l'API répond `429 Too Many
    Requests` avec `Retry-After` (secondes) et `X-RateLimit-Reset`.
  version: "1.0.0"
  contact:
    name: "LMS Team"
    email: "support@lms.local"
  license:
    name: "MIT"

servers:
  - url: "http://localhost:8000/api"
    description: "Development Server"
  - url: "https://api.lms.local/api"
    description: "Production Server"

# Security Schemes
components:
  securitySchemes:
    sanctum:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: "Sanctum token authentication"

  responses:
    # Réponse standard de dépassement du rate limit (#214/#219).
    TooManyRequests:
      description: "Rate limit dépassé (voir en-têtes X-RateLimit-* et Retry-After)."
      headers:
        Retry-After:
          schema:
            type: integer
          description: "Secondes à attendre avant de réessayer."
        X-RateLimit-Limit:
          schema:
            type: integer
          description: "Quota maximum par minute."
        X-RateLimit-Remaining:
          schema:
            type: integer
          description: "Requêtes restantes dans la fenêtre courante."
      content:
        application/json:
          schema:
            type: object
            properties:
              success:
                type: boolean
                example: false
              message:
                type: string
                example: "Trop de requêtes. Veuillez réessayer plus tard."

  schemas:
    ProgramInput:
      type: object
      required:
        - titre
      properties:
        titre:
          type: string
          maxLength: 191
        description:
          type: string
          maxLength: 5000
          nullable: true

    ProgramCreated:
      type: object
      properties:
        success:
          type: boolean
        message:
          type: string
        data:
          type: object
          properties:
            id:
              type: integer
            titre:
              type: string
            version:
              type: integer

    TrainingSessionInput:
      type: object
      required:
        - program_id
        - libelle
      properties:
        program_id:
          type: integer
          description: "Doit appartenir a l etablissement de l appelant."
        libelle:
          type: string
          maxLength: 191
        enrollment_opens_at:
          type: string
          format: date
          nullable: true
        enrollment_closes_at:
          type: string
          format: date
          nullable: true
        starts_on:
          type: string
          format: date
          nullable: true
        ends_on:
          type: string
          format: date
          nullable: true
        certificate_available_at:
          type: string
          format: date
          nullable: true
        min_enrollments:
          type: integer
          minimum: 1
          nullable: true
          description: "Alerte de sous-inscription, pas un verrou."
        tarif:
          type: integer
          minimum: 0
          nullable: true
          description: "Plus petite unite monetaire. Jamais un flottant."
        devise:
          type: string
          minLength: 3
          maxLength: 3
          nullable: true
        heures_stagiaires:
          type: integer
          minimum: 0
          nullable: true

    TrainingSessionView:
      type: object
      properties:
        id:
          type: integer
        libelle:
          type: string
        status:
          type: string
          enum: [brouillon, publiee, annulee, cloturee, archivee, purgee]
          description: "Decision humaine, STOCKEE."
        phase:
          type: string
          enum: [a_venir, inscriptions_ouvertes, en_cours, terminee]
          description: |
            DERIVEE des dates, jamais stockee. Aucune colonne ne la porte : une
            colonne exigerait un job nocturne qui finirait par diverger.
        program_id:
          type: integer
        enrollment_opens_at:
          type: string
          format: date
          nullable: true
        enrollment_closes_at:
          type: string
          format: date
          nullable: true
        starts_on:
          type: string
          format: date
          nullable: true
        ends_on:
          type: string
          format: date
          nullable: true
        certificate_available_at:
          type: string
          format: date
          nullable: true
        min_enrollments:
          type: integer
          nullable: true
        tarif:
          type: integer
          nullable: true
        devise:
          type: string
          nullable: true

    TrainingSessionCreated:
      type: object
      properties:
        success:
          type: boolean
        message:
          type: string
        data:
          $ref: '#/components/schemas/TrainingSessionView'

    TrainingSessionPage:
      type: object
      properties:
        success:
          type: boolean
        data:
          type: array
          items:
            $ref: '#/components/schemas/TrainingSessionView'
        meta:
          type: object
          properties:
            current_page:
              type: integer
            last_page:
              type: integer
            per_page:
              type: integer
            total:
              type: integer

    MessageOnly:
      type: object
      properties:
        success:
          type: boolean
          example: true
        message:
          type: string

    ActivationInput:
      type: object
      required:
        - token
        - password
        - password_confirmation
      properties:
        token:
          type: string
          maxLength: 128
          description: "Le jeton extrait du lien d'activation."
        password:
          type: string
          minLength: 8
          description: "Le secret que le titulaire choisit ; personne d'autre ne l'a connu."
        password_confirmation:
          type: string
          description: "Sur un ecran sans renvoi possible du lien, une faute de frappe enfermerait le titulaire dehors."

    SchoolRequestQueue:
      type: object
      properties:
        success:
          type: boolean
        data:
          type: array
          items:
            type: object
            properties:
              id:
                type: integer
              nom_demandeur:
                type: string
              email_demandeur:
                type: string
              telephone_demandeur:
                type: string
                nullable: true
              nom_ecole:
                type: string
              slug_souhaite:
                type: string
                nullable: true
              usage_prevu:
                type: string
              created_at:
                type: string
                format: date-time
        meta:
          type: object
          properties:
            current_page:
              type: integer
            last_page:
              type: integer
            per_page:
              type: integer
            total:
              type: integer

    SchoolRequestValidated:
      type: object
      properties:
        success:
          type: boolean
        message:
          type: string
        data:
          type: object
          properties:
            institution:
              type: object
              properties:
                id:
                  type: integer
                slug:
                  type: string
                name:
                  type: string
            activation_url:
              type: string
              format: uri
              description: |
                Lien vers l'application WEB, jamais vers l'API. Affiche UNE
                SEULE FOIS : le jeton n'est stocke qu'en empreinte SHA-256.

    VisioConsentInput:
      type: object
      required:
        - captation
        - diffusion
        - reutilisation
      properties:
        captation:
          type: boolean
          description: "Etre filme pendant la seance."
        diffusion:
          type: boolean
          description: "Rediffusion de l'enregistrement au groupe de la seance."
        reutilisation:
          type: boolean
          description: "Reutilisation sur une autre session que celle d'origine."

    VisioConsentState:
      type: object
      properties:
        success:
          type: boolean
          example: true
        data:
          type: object
          properties:
            captation:
              type: boolean
            diffusion:
              type: boolean
            reutilisation:
              type: boolean

    SchoolRegistrationRequestInput:
      type: object
      required:
        - nom_demandeur
        - email_demandeur
        - nom_ecole
        - usage_prevu
      properties:
        nom_demandeur:
          type: string
          maxLength: 191
          description: "Futur superAdmin de l'etablissement, si la demande est validee."
          example: "Awa Kouassi"
        email_demandeur:
          type: string
          format: email
          maxLength: 191
          example: "awa.kouassi@cabinet-kf.ci"
        telephone_demandeur:
          type: string
          maxLength: 40
          nullable: true
          example: "+225 07 00 00 00 00"
        nom_ecole:
          type: string
          maxLength: 191
          example: "Cabinet Kouassi Formation"
        slug_souhaite:
          type: string
          maxLength: 50
          nullable: true
          pattern: '^[a-z0-9\-]+$'
          description: |
            Souhait, JAMAIS une reservation. Le supradmin l'arbitre a la
            validation, collision avec un etablissement existant comprise.
          example: "cabinet-kouassi"
        usage_prevu:
          type: string
          minLength: 10
          maxLength: 2000
          description: "Texte libre. Obligatoire : il augmente le cout d'un depot automatise."
          example: "Formations comptabilite OHADA, promotions de 25 stagiaires."

    # Error Response
    ErrorResponse:
      type: object
      properties:
        success:
          type: boolean
          example: false
        error_code:
          type: string
          example: "UNAUTHENTICATED"
        message:
          type: string
          example: "Unauthenticated."
      required:
        - success
        - error_code
        - message

    # Auth Schemas
    LoginRequest:
      type: object
      properties:
        email:
          type: string
          format: email
          example: "user@example.com"
        password:
          type: string
          format: password
          example: "password123"
      required:
        - email
        - password

    AuthResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        data:
          type: object
          properties:
            token:
              type: string
              example: "token_string_here"
            user:
              type: object

    User:
      type: object
      properties:
        id:
          type: integer
          example: 1
        email:
          type: string
          example: "user@example.com"
        name:
          type: string
          example: "John Doe"
        role:
          type: string
          enum: [etudiant, enseignant, coordinateur, admin, superAdmin]

# Paths
paths:
  # ============ AUTHENTICATION ============
  /school-requests:
    post:
      tags:
        - School registration
      summary: "Deposer une demande d'ouverture d'ecole"
      description: |
        Porte d'entree du monde autonome (ADR-803-01). SEULE ecriture non
        authentifiee du systeme.

        N'ecrit qu'une ligne inerte, hors perimetre multi-tenant : ni compte,
        ni etablissement, ni reservation du `slug_souhaite`. La demande ne
        devient rien tant qu'un supradmin plateforme n'a pas tranche.

        Ne requiert PAS l'en-tete `X-Institution` : il n'y a pas encore
        d'etablissement a resoudre.

        Une seule demande en attente par adresse : un second depot met a jour
        la premiere au lieu d'en creer une seconde.

        Debit limite a 5 requetes par minute et par IP.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SchoolRegistrationRequestInput'
      responses:
        '201':
          description: |
            Demande enregistree. La reponse ne rend NI l'identifiant NI le
            statut : l'endpoint est anonyme, et les exposer offrirait de quoi
            enumerer les dossiers ou confirmer qu'une adresse a deja depose.

            Elle ne promet aucun courriel : le produit n'a aucun canal d'envoi.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: "Votre demande est enregistree. Elle sera examinee par notre equipe."
        '422':
          description: "Validation error"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          description: "Trop de demandes depuis cette adresse IP"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /lms/visio/consent:
    post:
      tags:
        - Visio
      summary: "Deposer son consentement de captation visio"
      description: |
        Les trois finalites sont obligatoires et independantes : accepter
        d'etre filme pour le groupe n'est pas accepter la rediffusion, ni la
        reutilisation sur une autre session.

        Le sujet est TOUJOURS le porteur du jeton : aucun `user_id` n'est
        accepte dans la charge utile.

        La table de consentements est append-only — chaque depot y ajoute trois
        lignes et n'en retire aucune. D'ou la limite de 10 requetes par minute.
      security:
        - sanctum: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VisioConsentInput'
      responses:
        '200':
          description: "Consentement enregistre ; l'etat courant des trois finalites est renvoye."
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VisioConsentState'
        '401':
          description: "Non authentifie"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: |
            Charge invalide, ou compte sans etablissement — un consentement se
            rattache a un etablissement.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          description: "Trop de depots successifs"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    get:
      tags:
        - Visio
      summary: "Lire son consentement de captation visio"
      security:
        - sanctum: []
      responses:
        '200':
          description: "Etat courant des trois finalites pour le porteur du jeton."
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VisioConsentState'
        '401':
          description: "Non authentifie"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /activation:
    post:
      tags:
        - School registration
      summary: "Poser son mot de passe depuis un lien d'activation"
      description: |
        Route ANONYME par nature : celui qui active n'a pas encore de quoi
        s'authentifier. Le jeton EST l'autorisation.

        Le produit n'ayant aucun canal de courriel, le lien circule hors bande
        (WhatsApp, SMS, de vive voix). Il est a usage unique et expirant.

        Debit limite a 5 requetes par minute et par IP.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ActivationInput'
      responses:
        '200':
          description: "Mot de passe enregistre ; le titulaire peut se connecter."
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageOnly'
        '410':
          description: |
            Jeton inconnu, deja consomme, ou perime. Les trois cas rendent le
            MEME code : les distinguer dirait a un inconnu qu'un lien a existe
            pour cette valeur, donc qu'un compte l'attend.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: "Mot de passe absent, trop court, ou confirmation differente"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          description: "Trop de tentatives"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /admin/school-requests:
    get:
      tags:
        - School registration
      summary: "La file des demandes d'ouverture en attente"
      description: |
        Reserve au supradmin PLATEFORME (`role:supradmin` + `platform.supradmin`).

        Seules les demandes en attente sont listees : une demande tranchee
        n'appelle plus de decision. Paginee — cette file est alimentee par un
        endpoint anonyme, et un throttle borne le debit d'entree, pas le volume
        accumule.
      security:
        - sanctum: []
      parameters:
        - name: per_page
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 25
      responses:
        '200':
          description: "Page de demandes en attente"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SchoolRequestQueue'
        '401':
          description: "Non authentifie"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: "Reserve au supradmin plateforme"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /admin/school-requests/{schoolRequest}/validate:
    post:
      tags:
        - School registration
      summary: "Valider une demande : ouvrir l'ecole et son premier compte"
      description: |
        UNE transaction : l'institution (autonome, `klassci_api_url` a null), son
        premier compte en `superAdmin`, et le passage de la demande en validee.
        Si l'une echoue, aucune n'est ecrite.

        Aucun mot de passe n'est choisi ni transmis. La reponse contient un LIEN
        D'ACTIVATION a usage unique, affiche UNE SEULE FOIS : il n'est stocke
        nulle part en clair et ne sera pas reaffiche.

        Le `slug` du corps est facultatif : le demandeur n'a exprime qu'un
        souhait, jamais une reservation, et c'est ici que le supradmin arbitre
        une collision avec un etablissement existant.
      security:
        - sanctum: []
      parameters:
        - name: schoolRequest
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                slug:
                  type: string
                  maxLength: 50
                  pattern: '^[a-z0-9\-]+$'
                  nullable: true
      responses:
        '200':
          description: "Ecole ouverte ; le lien d'activation est renvoye une seule fois."
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SchoolRequestValidated'
        '401':
          description: "Non authentifie"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: "Reserve au supradmin plateforme"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: "Demande deja tranchee"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          description: |
            `ACTIVATION_URL_FRONT` n'est pas configuree : le lien serait mort
            chez son destinataire. Refus fail-closed, rien n'est ecrit.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /admin/school-requests/{schoolRequest}/refuse:
    post:
      tags:
        - School registration
      summary: "Refuser une demande d'ouverture"
      description: |
        Le motif est OBLIGATOIRE : le demandeur peut redeposer un dossier —
        l'unicite partielle ne borne que les demandes en attente — et
        l'exploitant doit pouvoir savoir pourquoi il avait tranche.

        Ne cree ni institution ni compte.
      security:
        - sanctum: []
      parameters:
        - name: schoolRequest
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - motif_refus
              properties:
                motif_refus:
                  type: string
                  minLength: 10
                  maxLength: 2000
      responses:
        '200':
          description: "Demande refusee"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageOnly'
        '401':
          description: "Non authentifie"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: "Reserve au supradmin plateforme"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: "Demande deja tranchee"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: "Motif absent ou trop court"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /admin/institutions/{id}/mode:
    patch:
      tags:
        - Institutions
      summary: "Basculer le mode d'un etablissement"
      description: |
        Declare si l'etablissement tient sa propre liste d'inscrits
        (`standalone`) ou la recoit de KLASSCI (`klassci`).

        Le mode voulu est EXIGE dans le corps, il n'est pas inverse : avec deux
        valeurs aujourd'hui et une troisieme possible demain, une inversion
        implicite deviendrait un piege.

        Cette bascule a sa propre route pour ne jamais etre l'effet de bord d'un
        `PUT` de branding. Elle est tracee dans `audit_logs`
        (`institution.mode_changed`).

        Ce qu'elle change : l'inscription locale devient permise ou interdite —
        l'assistant d'import et la capacite publiee a la connexion. Ce qu'elle ne
        change PAS : les inscriptions deja ecrites et l'acces des eleves a leurs
        cours, la source d'inscription ne consultant jamais le mode. La bascule
        est donc reversible.
      security:
        - sanctum: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - mode
              properties:
                mode:
                  type: string
                  enum: [klassci, standalone]
      responses:
        '200':
          description: "Mode mis a jour ; l'institution est renvoyee a jour."
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  message:
                    type: string
                  data:
                    type: object
        '401':
          description: "Non authentifie"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: "Reserve au supradmin plateforme"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: "Institution introuvable"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: "Mode absent ou hors de la liste fermee"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /programs:
    post:
      tags:
        - Session de formation
      summary: "Creer un Programme"
      description: |
        Le Programme est le contenu pedagogique VERSIONNABLE : il ne porte ni
        dates ni tarif. Ceux-la vivent sur la Periode — poser le tarif ici
        obligerait a dupliquer le contenu pour chaque variante tarifaire.

        `institution_id` n est jamais accepte : il vient du tenant resolu.
        `version` non plus — un Programme nait en version 1.

        Reserve aux roles coordinateur, admin et superAdmin : organiser une
        formation est un acte de gestion.
      security:
        - sanctum: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProgramInput'
      responses:
        '201':
          description: "Programme cree"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProgramCreated'
        '401':
          description: "Non authentifie"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: "Role insuffisant"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: "Charge invalide"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /training-sessions:
    get:
      tags:
        - Session de formation
      summary: "Lister les Periodes de son etablissement"
      description: |
        Bornee a l etablissement de l appelant, explicitement et pas seulement
        par le scope global : ce dernier est fail-open quand aucun tenant n est
        resolu. Paginee.
      security:
        - sanctum: []
      parameters:
        - name: per_page
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 25
      responses:
        '200':
          description: "Page de Periodes"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TrainingSessionPage'
        '401':
          description: "Non authentifie"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: "Role insuffisant"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    post:
      tags:
        - Session de formation
      summary: "Creer une Periode — la session de formation datee"
      description: |
        L entite racine du monde autonome : elle porte les dates, le tarif et
        les inscriptions.

        Les cinq dates sont FACULTATIVES — un brouillon se cree avant qu elles
        soient arretees — mais celles qui sont fournies doivent rester
        ordonnees : `enrollment_opens_at` <= `enrollment_closes_at` <=
        `starts_on` <= `ends_on` <= `certificate_available_at`. Chaque date est
        comparee a la PRECEDENTE RENSEIGNEE, de sorte que l ordre tienne meme
        quand une date intermediaire manque. La base porte la meme contrainte
        en dernier recours.

        `status` et `institution_id` ne sont JAMAIS acceptes : une Periode nait
        `brouillon` — publier est une decision distincte — et l etablissement
        vient du tenant resolu.

        Le `program_id` doit appartenir a l etablissement de l appelant : sinon
        le message d erreur revelerait quels identifiants existent ailleurs.
      security:
        - sanctum: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TrainingSessionInput'
      responses:
        '201':
          description: "Periode creee, en statut brouillon"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TrainingSessionCreated'
        '401':
          description: "Non authentifie"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: "Role insuffisant"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: |
            Dates desordonnees, ou Programme inconnu dans cet etablissement.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /auth/login:
