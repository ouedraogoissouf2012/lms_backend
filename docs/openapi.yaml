        evaluation_id:
          type: integer
        question:
          type: string
        type:
          type: string
          enum: [qcm, qcm_multiple, vrai_faux, reponse_courte, dissertation]
        ordre:
          type: integer
        points:
          $ref: '#/components/schemas/Decimal2'
        options:
          nullable: true
          type: array
          description: "Choix proposes (qcm), une liste de libelles ; `null` pour les autres types."
          items:
            type: string
        is_required:
          type: boolean
        institution_id:
          type: integer
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    PhotoDEleveReponse:
