  # ============ PROXY ROUTES (KLASSCI) ============
  /proxy/structure:
    get:
      tags:
        - Proxy / KLASSCI
      operationId: getInstitutionStructure
      summary: "Les filieres et les niveaux d'etudes de l'etablissement"
      description: |
        Lue par AdminMatieres, avec les matieres. Rate limit : 100 req/min/utilisateur (#214).
        La source est choisie par le mode DECLARE de l'ecole, au point de liaison.

        **Ecole creee depuis KLASSCI.** La reponse de KLASSCI, relayee telle
        quelle, avec le jeton de l'etablissement.

        **Ecole creee depuis le LMS**, ou basculee. Aucune filiere ni aucun
        niveau d'etudes n'existe en local : deux listes vides, sans aucun appel
        a KLASSCI. La cle des niveaux est `niveaux_etudes`, celle de la
        documentation KLASSCI.
      security:
        - sanctum: []
      responses:
        '200':
          description: "La structure de l'etablissement"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StructureEtablissement'
        '401':
          $ref: '#/components/responses/KlassciUnauthorized'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          description: "Defaillance interne, rapportee une fois au journal, sans le message ni les valeurs d'une requete."
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VisioErreurInterne'
        '503':
          description: "Ecole creee depuis KLASSCI : KLASSCI indisponible."
          headers:
            Retry-After:
              schema:
                type: integer
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KlassciIndisponible'

  /proxy/me/teacher-dashboard:
    get:
      tags:
        - Proxy / KLASSCI
      operationId: teacherDashboard
      summary: "Le tableau de bord de l'enseignant"
      description: |
        Reserve aux roles enseignant et coordinateur. La source est choisie par
        le mode DECLARE de l'ecole, au point de liaison, jamais par le client.

        **Ecole en mode KLASSCI.** La reponse de `me/teacher-dashboard`, relayee
        telle quelle avec le jeton KLASSCI du compte, et ses identifiants
        KLASSCI. Sans ce jeton : 401 `klassci_token_missing`. Une panne ou un
        circuit ouvert rendent le 503 avec `Retry-After` ; un refus de KLASSCI
        est relaye. La charge ne porte pas `meta`.

        **Ecole en mode autonome** (creee depuis le LMS, ou creee depuis KLASSCI
        puis passee en mode autonome). La meme forme, lue en local, sans jeton ni
        appel KLASSCI, avec les identifiants LOCAUX, marquee
        `meta.source: lms_local` :
        - `matieres` : les matieres de l'enseignant, comme `/lms/teacher/my-matieres` ;
        - `classes` : ses classes, avec leur effectif actif (`effectif_actuel`),
          comme `/lms/teacher/classes` ;
        - `prochaines_seances` : ses seances des 30 prochains jours, comme
          `/lms/seances/upcoming` (le coordinateur lit aussi les siennes) ;
        - `statistiques.heures` : `total_seances` et `seances_effectuees`,
          comptees sur l'auteur de la seance, sans fenetre de dates. Une seance locale n'a pas d'heure
          de fin : elle n'est comptee effectuee qu'apres sa fin ESTIMEE (deux
          heures apres son debut), et `fin_estimee` vaut `true`.
        `evaluations` et `statistiques.evaluations` sont ABSENTS : la fenetre
        d'une evaluation locale n'est pas encore lue ici. Absent veut dire non
        mesure, et non « aucune evaluation ».
      security:
        - sanctum: []
      responses:
        '200':
          description: "Le tableau de bord de l'enseignant"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TableauDeBordEnseignant'
        '401':
          description: |
            Jeton porteur absent ou invalide (sans `reason`). Ecole en mode
            KLASSCI : compte sans jeton KLASSCI (`reason: klassci_token_missing`),
            ou session refusee par KLASSCI (`reason: klassci_session_expired`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RefusKlassci'
        '403':
          description: |
            Sans `reason` : role non admis, etablissement desactive, ou refus de
            KLASSCI relaye. `no_institution` : compte sans etablissement.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RefusClasseEleves'
        '4XX':
          description: "Ecole en mode KLASSCI : tout autre refus de KLASSCI de 400 a 499, relaye avec le message par defaut du catalogue."
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RefusClasseEleves'
        '500':
          description: |
            Defaillance interne, base de donnees comprise : « Service
            indisponible. Veuillez reessayer. », rapportee une fois au journal,
            sans le message ni les valeurs d'une requete.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VisioErreurInterne'
        '503':
          description: "Ecole en mode KLASSCI : KLASSCI indisponible (panne, circuit ouvert, configuration absente)."
          headers:
            Retry-After:
              schema:
                type: integer
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KlassciIndisponible'

  /proxy/classes:
    get:
      tags:
        - Proxy / KLASSCI
      operationId: listInstitutionClasses
      summary: "Les classes de l'etablissement, pour les ecrans de gestion"
      description: |
        La liste d'administration des classes, le Hub, le tableau de bord, les
        filtres de classe, et le referentiel que « Mes classes » fusionne par
        `id`. Sans garde de role. La source est choisie par le mode DECLARE de
        l'ecole, au point de liaison, jamais par le client.

        **Ecole creee depuis KLASSCI.** La reponse de KLASSCI, relayee telle
        quelle, avec les identifiants KLASSCI. Une panne ou un circuit ouvert
        rendent le 503 avec `Retry-After` ; un refus de KLASSCI (4xx) est relaye.

        **Ecole creee depuis le LMS**, ou basculee en mode autonome. Les classes
        locales, avec les identifiants LOCAUX (ceux de `/lms/classes/{classeId}`),
        triees par libelle puis par identifiant, sans aucun appel a KLASSCI. La
        gestion lit toutes les classes de l'etablissement, un enseignant celles
        ou il est designe formateur, un eleve, et tout role non reconnu, celles
        ou son inscription est active. Chaque classe porte son effectif, jamais
        la liste de ses eleves. Les filtres `filiere_id`, `niveau_id` et
        `annee_id` y sont sans effet : aucune filiere, aucun niveau ni aucune
        annee n'est lu en local, y compris dans une ecole basculee, dont les
        classes gardent leurs identifiants KLASSCI de filiere et de niveau.
      security:
        - sanctum: []
      parameters:
        - name: filiere_id
          in: query
          schema:
            type: integer
        - name: niveau_id
          in: query
          schema:
            type: integer
        - name: annee_id
          in: query
          schema:
            type: integer
      responses:
        '200':
          description: "Les classes de l'etablissement"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClassesEtablissement'
        '401':
          description: |
            Jeton porteur absent ou invalide (sans `reason`). Dans une ecole creee
            depuis KLASSCI : session refusee par KLASSCI
            (`reason: klassci_session_expired`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RefusKlassci'
        '403':
          description: |
            Sans `reason` : etablissement desactive, ou refus de KLASSCI relaye.
            `no_institution` : compte sans etablissement.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RefusClasseEleves'
        '4XX':
          description: "Tout autre refus de KLASSCI de 400 a 499, relaye avec le message par defaut du catalogue."
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RefusClasseEleves'
        '500':
          description: |
            Defaillance interne, base de donnees comprise : « Service
            indisponible. Veuillez reessayer. », rapportee une fois au journal,
            sans le message ni les valeurs d'une requete.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VisioErreurInterne'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '503':
          description: "Ecole creee depuis KLASSCI : KLASSCI indisponible (panne, circuit ouvert, configuration absente)."
          headers:
            Retry-After:
              schema:
                type: integer
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KlassciIndisponible'

