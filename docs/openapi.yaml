  # ============ EVALUATIONS ============
  /evaluations:
    get:
      tags:
        - Evaluations
      summary: "List evaluations"
      security:
        - sanctum: []
      parameters:
        - name: page
          in: query
          schema:
            type: integer
        - name: per_page
          in: query
          schema:
            type: integer
      responses:
        '200':
          description: "List of evaluations"
        '401':
          description: "Unauthenticated"

    post:
      tags:
        - Evaluations
      summary: "Create evaluation"
      description: |
        D72. Le rattachement depend du type d'ecole (meme route, autre source, ADR-EI-01) :
        - ecole creee depuis KLASSCI : mise en ligne d'une evaluation PROGRAMMEE dans KLASSCI,
          designee par `klassci_evaluation_id` (exige), `klassci_classe_id`, `klassci_matiere_id` ;
        - ecole creee depuis le LMS : programmation dans le LMS, sur `classe_id` et `matiere_id`
          LOCAUX (exiges), couple programme dans l'ecole ou l'auteur est designe (la gestion :
          tout couple programme).
        Jamais d'id local sous un nom `klassci_*` (D132) : chaque source refuse la famille de
        l'autre (422 `identifier_out_of_scope`). L'auteur (`enseignant_id`) vient du jeton.
      security:
        - sanctum: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - titre
                - type
                - duree_minutes
              properties:
                klassci_evaluation_id:
                  type: integer
                  nullable: true
                  description: "Ecole creee depuis KLASSCI seulement : l'evaluation programmee a mettre en ligne."
                klassci_classe_id:
                  type: integer
                  nullable: true
                  description: "Ecole creee depuis KLASSCI seulement."
                klassci_matiere_id:
                  type: integer
                  nullable: true
                  description: "Ecole creee depuis KLASSCI seulement."
                classe_id:
                  type: integer
                  nullable: true
                  description: "Ecole creee depuis le LMS seulement : la classe locale."
                matiere_id:
                  type: integer
                  nullable: true
                  description: "Ecole creee depuis le LMS seulement : la matiere locale."
                titre:
                  type: string
                  minLength: 3
                  maxLength: 255
                description:
                  type: string
                  nullable: true
                type:
                  type: string
                  enum: [qcm, reponse_courte, dissertation, mixte]
                date_evaluation:
                  type: string
                  format: date-time
                  nullable: true
                duree_minutes:
                  type: integer
                  minimum: 1
                  maximum: 1440
                coefficient:
                  type: number
                  minimum: 0
                  nullable: true
                bareme:
                  type: number
                  minimum: 0
                  nullable: true
                status:
                  type: string
                  nullable: true
                max_attempts:
                  type: integer
                  minimum: 1
                  nullable: true
                allow_retake:
                  type: boolean
                  nullable: true
                is_online:
                  type: boolean
                  nullable: true
                shuffle_questions:
                  type: boolean
                  nullable: true
                show_results:
                  type: boolean
                  nullable: true
                questions:
                  type: array
                  items:
                    type: object
      responses:
        '201':
          description: "Evaluation created"
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  message:
                    type: string
                  data:
                    $ref: '#/components/schemas/EvaluationRecord'
        '403':
          description: |
            Refus de programmation : compte sans identite enseignant KLASSCI (ecole creee depuis
            KLASSCI), ou auteur non designe pour ce couple classe x matiere (ecole creee depuis le LMS).
            Un 403 du role (coordinateur, apprenant) ne porte pas de `reason` ; un compte sans
            etablissement recoit `no_institution` (middleware d'appartenance).
          content:
            application/json:
              schema:
                type: object
                required:
                  - success
                  - message
                properties:
                  success:
                    type: boolean
                    example: false
                  message:
                    type: string
                  reason:
                    type: string
                    enum:
                      - klassci_teacher_identity_missing
                      - teacher_not_assigned
                      - no_institution
        '409':
          description: "Une version en ligne existe deja pour cette evaluation KLASSCI."
          content:
            application/json:
              schema:
                type: object
                required:
                  - success
                  - message
                properties:
                  success:
                    type: boolean
                    example: false
                  message:
                    type: string
                  data:
                    allOf:
                      - $ref: '#/components/schemas/EvaluationRecord'
                    nullable: true
        '422':
          description: |
            Erreur de validation (`errors`), classe ou matiere hors de l'ecole (`errors`), ou refus
            motive : programmation KLASSCI absente dans une ecole creee depuis KLASSCI
            (`klassci_scheduling_required`), identifiant de l'autre famille (`identifier_out_of_scope`).
          content:
            application/json:
              schema:
                type: object
                required:
                  - success
                  - message
                properties:
                  success:
                    type: boolean
                    example: false
                  message:
                    type: string
                  errors:
                    type: object
                    additionalProperties:
                      type: array
                      items:
                        type: string
                  reason:
                    type: string
                    enum:
                      - klassci_scheduling_required
                      - identifier_out_of_scope
        '500':
          description: "Echec transactionnel de la creation (rollback, journalise)."
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: false
                  message:
                    type: string
                  error:
                    type: string

  /evaluations/{id}:
    get:
      tags:
        - Evaluations
      summary: "Get evaluation details"
      security:
        - sanctum: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: "Evaluation details"
        '404':
          description: "Evaluation not found"

    put:
      tags:
        - Evaluations
      summary: "Update evaluation"
      description: |
        C14 : seuls les champs ci-dessous sont ecrits (liste blanche = validation). Un champ hors de
        cette liste est ignore (`notes_published`, `is_locked`, `locked_at`, `deadline_at`, les
        libelles, les identifiants). `is_published` est refuse quelle que soit sa valeur (`true`,
        `false`, `null`) : la publication passe par `POST /evaluations/{id}/publish`.
      security:
        - sanctum: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                titre:
                  type: string
                  minLength: 3
                  maxLength: 255
                description:
                  type: string
                  nullable: true
                status:
                  type: string
                  enum: [brouillon, planifiee, en_cours, terminee, annulee]
                date_evaluation:
                  type: string
                  description: "Une date lisible par la regle `date` de Laravel."
                  nullable: true
                duree_minutes:
                  type: integer
                  minimum: 1
                  maximum: 1440
                type:
                  type: string
                  enum: [qcm, reponse_courte, dissertation, mixte]
                coefficient:
                  type: number
                  minimum: 0
                  nullable: true
                bareme:
                  type: number
                  minimum: 0
                  nullable: true
                max_attempts:
                  type: integer
                  minimum: 1
                allow_retake:
                  type: boolean
                is_online:
                  type: boolean
                shuffle_questions:
                  type: boolean
                show_results:
                  type: boolean
                questions:
                  type: array
                  description: "Remplacement complet des questions."
                  items:
                    type: object
                    required:
                      - question
                      - type
                    properties:
                      question:
                        type: string
                        maxLength: 1000
                      type:
                        type: string
                        enum: [qcm, qcm_multiple, vrai_faux, reponse_courte, dissertation]
                      points:
                        type: number
                        minimum: 0
                        nullable: true
                      options:
                        type: array
                        nullable: true
                        items: {}
                      correct_answers:
                        type: array
                        nullable: true
                        items: {}
                      explanation:
                        type: string
                        maxLength: 2000
                        nullable: true
      responses:
        '200':
          description: "Evaluation updated"
        '403':
          description: "Permission denied"
        '404':
          description: "Not found"
        '422':
          description: |
            Erreur de validation (`errors`), `is_published` envoye (`publish_via_dedicated_route`, la
            publication passe par sa route), ou remplacement qui viderait une evaluation publiee
            (`evaluation_without_questions`, C16 : publiee est relu sur la ligne verrouillee, avant toute ecriture).
          content:
            application/json:
              schema:
                type: object
                required:
                  - success
                  - message
                properties:
                  success:
                    type: boolean
                    example: false
                  message:
                    type: string
                  errors:
                    type: object
                    additionalProperties:
                      type: array
                      items:
                        type: string
                  reason:
                    type: string
                    enum:
                      - publish_via_dedicated_route
                      - evaluation_without_questions

    delete:
      tags:
        - Evaluations
      summary: "Delete evaluation"
      security:
        - sanctum: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: "Evaluation deleted"
        '403':
          description: "Permission denied"
        '404':
          description: "Not found"

  # ============ CYCLE EVALUATION (#892) ============
  # Chaque code et chaque cle ci-dessous a ete MESURE par appel reel de la
  # route (app.debug=false, comme en production). Les references au code
  # sont dans la PR qui a ecrit ce bloc.

  /evaluations/student:
    get:
      tags:
        - Evaluations
      operationId: listMyEvaluations
      summary: "Evaluations publiees de la classe de l eleve"
      description: |
        La classe est lue sur KLASSCI (`me/dashboard`). Ne remonte que les
        evaluations publiees, de statut `planifiee`, `en_cours` ou `terminee`,
        ayant au moins une question — triees par date decroissante.

        Chaque element est l evaluation enrichie : `questions_count`, la
        derniere copie de l eleve (`student_submission`), et, relayes depuis
        KLASSCI sans garantie de forme, `programmation`, `lms_integration`,
        `classe`, `matiere`. Les questions et les copies des autres eleves ne
        sont PAS chargees.

        Une erreur 4xx renvoyee par KLASSCI est relayee avec SON statut, et un
        message generique.
      security:
        - sanctum: []
      responses:
        '200':
          description: "Liste (eventuellement vide)"
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: array
                    items:
                      allOf:
                        - $ref: '#/components/schemas/EvaluationRecord'
                        - type: object
                          properties:
                            questions_count:
                              type: integer
                            student_submission:
                              $ref: '#/components/schemas/EvaluationSubmissionRecord'
                            programmation:
                              type: object
                              nullable: true
                              additionalProperties: true
                            lms_integration:
                              nullable: true
                            classe:
                              type: object
                              nullable: true
                              description: |
                                L identite de la classe de l eleve, et rien d autre : le
                                LMS ne relaie plus l enveloppe KLASSCI de la classe, qui
                                portait la liste des eleves.
                              properties:
                                id:
                                  type: integer
                                nom:
                                  type: string
                                  nullable: true
                            matiere:
                              nullable: true
                              description: "Relaye depuis KLASSCI, forme non garantie par le LMS."
        '401':
          $ref: '#/components/responses/KlassciUnauthorized'
        '404':
          description: "KLASSCI ne rattache l eleve a aucune classe (« Classe non trouvee »)"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageOnly'
        '503':
          description: "KLASSCI indisponible (en-tete `Retry-After`)"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageOnly'
        '500':
          description: "Erreur interne"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageOnly'

