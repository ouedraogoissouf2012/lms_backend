        nom_ecole:
          type: string
          maxLength: 191
          example: "Cabinet Kouassi Formation"
        slug_souhaite:
          type: string
          maxLength: 50
          nullable: true
          pattern: '^[a-z0-9\-]+$'
          description: |
            Souhait, JAMAIS une reservation. Le supradmin l'arbitre a la
            validation, collision avec un etablissement existant comprise.
          example: "cabinet-kouassi"
        usage_prevu:
          type: string
          minLength: 10
          maxLength: 2000
          description: "Texte libre. Obligatoire : il augmente le cout d'un depot automatise."
          example: "Formations comptabilite OHADA, promotions de 25 stagiaires."

    # Rejoindre une classe avec un code, deja connecte (#885). Meme forme en
    # 201 et en 200 : l apprenant lit la classe qu il a rejointe dans les deux cas.
    ClasseRejointeResponse:
      type: object
      properties:
        success:
          type: boolean
        message:
          type: string
        data:
          type: object
          properties:
            classe:
              type: object
              properties:
                id:
                  type: integer
                libelle:
                  type: string

    # Error Response
    # --- Cycle evaluation (#892) -------------------------------------------
    # Formes MESUREES par appel reel des routes, pas deduites des noms.

    Decimal2:
      type: string
      pattern: '^-?\d+\.\d{2}$'
      example: "16.00"
      description: |
        Nombre decimal SERIALISE EN CHAINE : le cast Eloquent `decimal:2`
        (`EvaluationSubmission`, `Evaluation`, `EvaluationQuestion`) rend
        `"16.00"`, jamais `16`. Un client type doit le convertir.

    EvaluationWindow:
      type: object
      nullable: true
      description: |
        Fenetre de passage. Ecole creee depuis KLASSCI : relayee depuis KLASSCI
        (`programmation.window`), `null` quand l evaluation n en a pas, ou quand
        KLASSCI n a pas pu etre joint. Ecole creee depuis le LMS (D72, E2b) :
        calculee sur la ligne ; `start_at` et `end_at` sont `null` quand
        l evaluation n a pas de date (fenetre fermee). Le LMS ne lit que les
        cles ci-dessous ; les autres passent telles quelles.
      additionalProperties: true
      properties:
        is_open:
          type: boolean
        has_started:
          type: boolean
        has_ended:
          type: boolean
        start_at:
          type: string
          format: date-time
          nullable: true
        end_at:
          type: string
          format: date-time
          nullable: true

    EvaluationSubmissionRecord:
      type: object
      description: |
        Une copie (`evaluation_submissions`), serialisee telle quelle.

        Une copie TOUT JUSTE CREEE n expose que les colonnes ecrites a sa
        creation (`id`, `evaluation_id`, `student_id`, `klassci_etudiant_id`,
        `attempt`, `status`, `started_at`, `institution_id`, `feedback`,
        `created_at`, `updated_at`) ; une copie relue les expose toutes.
      properties:
        id:
          type: integer
        evaluation_id:
          type: integer
        student_id:
          type: integer
          nullable: true
        klassci_etudiant_id:
          type: integer
          nullable: true
          description: "Nul pour une copie d une ecole creee depuis le LMS (D72) : l auteur est `student_id`."
        attempt:
          type: integer
        status:
          type: string
          enum: [en_cours, soumis, corrige, verrouille]
          description: |
            `verrouille` (C28) : remise refusee apres l echeance. La copie garde ses
            reponses, n est pas notee et compte comme une tentative. Une tentative
            `en_cours` dont l echeance est depassee (marge comprise) se LIT
            `verrouille`.
        started_at:
          type: string
          format: date-time
          nullable: true
        ends_at:
          type: string
          format: date-time
          nullable: true
          description: |
            Echeance de la tentative (C28), ecrite au demarrage et figee : la plus
            proche de la fin de la fenetre et de `started_at + duree_minutes`. Nulle
            pour l entrainement et pour une copie d avant C28 : pas d echeance.
        submitted_at:
          type: string
          format: date-time
          nullable: true
        answers:
          type: object
          nullable: true
          description: "MAP `{ \"<question_id>\": reponse }` (chaine, ou tableau de chaines pour `qcm_multiple`)."
          additionalProperties: true
        manual_points:
          type: object
          nullable: true
          description: "Points attribues a la main, par question (dissertations)."
          additionalProperties:
            type: number
        score:
          type: string
          pattern: '^-?\d+\.\d{2}$'
          nullable: true
          description: "Decimal en chaine (voir `Decimal2`)."
        note_sur_20:
          type: string
          pattern: '^-?\d+\.\d{2}$'
          nullable: true
          description: "Decimal en chaine (voir `Decimal2`)."
        feedback:
          type: string
          nullable: true
          description: "Commence par `[PRACTICE]` pour une tentative d entrainement (note non officielle)."
        graded_by:
          type: integer
          nullable: true
        graded_at:
          type: string
          format: date-time
          nullable: true
        synced_to_klassci:
          type: boolean
        synced_at:
          type: string
          format: date-time
          nullable: true
        institution_id:
          type: integer
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        evaluation:
          description: "La relation chargee, presente seulement quand la route la charge (la remise)."
          $ref: '#/components/schemas/EvaluationRecord'
        student:
          description: "L auteur de la copie, relation chargee, presente seulement quand la route la charge (la notation)."
          $ref: '#/components/schemas/User'

    EvaluationRecord:
      type: object
      description: "Une evaluation (`evaluations`), serialisee telle quelle (seul `klassci_link_guard` est masque)."
      additionalProperties: true
      properties:
        id:
          type: integer
        institution_id:
          type: integer
        klassci_evaluation_id:
          type: integer
          nullable: true
        klassci_matiere_id:
          type: integer
          nullable: true
        klassci_classe_id:
          type: integer
          nullable: true
        klassci_enseignant_id:
          type: integer
          nullable: true
        classe_id:
          type: integer
          nullable: true
          description: "D72 : classe LOCALE (ecole creee depuis le LMS). Nulle pour une evaluation KLASSCI."
        matiere_id:
          type: integer
          nullable: true
          description: "D72 : matiere LOCALE (ecole creee depuis le LMS). Nulle pour une evaluation KLASSCI."
        enseignant_id:
          type: integer
          nullable: true
          description: "D72 : l'auteur (users.id), ecrit a chaque creation. Nul pour une ligne d'avant D72."
        titre:
          type: string
        description:
          type: string
          nullable: true
        type:
          type: string
        status:
          type: string
          description: "Statut STOCKE (`brouillon`, `planifiee`, `en_cours`, `terminee`…)."
        date_evaluation:
          type: string
          format: date-time
          nullable: true
        deadline_at:
          type: string
          format: date-time
          nullable: true
        duree_minutes:
          type: integer
          nullable: true
        coefficient:
          $ref: '#/components/schemas/Decimal2'
        bareme:
          $ref: '#/components/schemas/Decimal2'
        is_online:
          type: boolean
        allow_retake:
          type: boolean
        max_attempts:
          type: integer
          nullable: true
        shuffle_questions:
          type: boolean
        show_results:
          type: boolean
          description: "Notes publiees a l eleve (#1699) : note, score et commentaire. Se regle aussi apres les remises, par `PATCH /evaluations/{id}/release`."
        correction_release:
          type: string
          enum: [never, with_results, after_close, at_date]
          description: |
            Quand le corrige s ouvre a l eleve (#1699) : `never`, `with_results` (defaut, a la
            publication des notes), `after_close` (a la fermeture), `at_date` (a
            `correction_release_at`). Jamais avant la fermeture de l evaluation pour tous.
        correction_release_at:
          type: string
          format: date-time
          nullable: true
          description: "La date d ouverture du corrige, seulement pour `at_date`."
        is_published:
          type: boolean
        notes_published:
          type: boolean
          description: "Notes envoyees a KLASSCI (`sync-klassci`). Ne gouverne pas ce que voit l eleve : c est `show_results`."
        is_locked:
          type: boolean
        locked_at:
          type: string
          format: date-time
          nullable: true
        matiere_nom:
          type: string
          nullable: true
        classe_nom:
          type: string
          nullable: true
        enseignant_nom:
          type: string
          nullable: true
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        deleted_at:
          type: string
          format: date-time
          nullable: true

    EvaluationEnrichie:
      type: object
      description: |
        Une evaluation enrichie pour le personnel (`EvaluationEnrichmentService`) :
        les champs de `EvaluationRecord` (portes par `additionalProperties`), et les
        cles ci-dessous. Les identifiants a plat suivent le type d ecole : les
        `klassci_*` dans une ecole creee depuis KLASSCI, `classe_id`, `matiere_id` et
        `enseignant_id` dans une ecole creee depuis le LMS (D72) ; jamais un id local
        sous un nom `klassci_*` (D132).

        Si le catalogue KLASSCI est injoignable, seul ce catalogue est perdu (#1609) :
        `classe` et `matiere` portent les libelles stockes (`classe_nom`,
        `matiere_nom`), et `enseignant` vient de la base, comme dans une ecole creee
        depuis le LMS. Les cles calculees ci-dessous sont donc toujours presentes,
        eventuellement nulles.
      required:
        - id
        - classe
        - matiere
        - enseignant
        - enseignant_nom
      additionalProperties: true
      properties:
        id:
          type: integer
        institution_id:
          type: integer
        titre:
          type: string
        klassci_evaluation_id:
          type: integer
          nullable: true
        klassci_classe_id:
          type: integer
          nullable: true
        klassci_matiere_id:
          type: integer
          nullable: true
        klassci_enseignant_id:
          type: integer
          nullable: true
        classe_id:
          type: integer
          nullable: true
        matiere_id:
          type: integer
          nullable: true
        enseignant_id:
          type: integer
          nullable: true
        questions:
          type: array
          items:
            $ref: '#/components/schemas/EvaluationQuestionPublic'
        submissions:
          type: array
          items:
            $ref: '#/components/schemas/EvaluationSubmissionRecord'
        classe:
          type: object
          nullable: true
          description: |
            Relayee depuis le catalogue KLASSCI, ou, sans lui, faite du
            libelle pose a la creation (`classe_nom`) : `id` est alors
            celui de KLASSCI s il existe, sinon la classe locale.
          additionalProperties: true
          properties:
            id:
              type: integer
              nullable: true
            nom:
              type: string
              nullable: true
        matiere:
          type: object
          nullable: true
          description: "Meme regle que `classe`, avec `matiere_nom`."
          additionalProperties: true
          properties:
            id:
              type: integer
              nullable: true
            nom:
              type: string
              nullable: true
        enseignant:
          type: object
          nullable: true
          description: |
            L enseignant designe par son identite KLASSCI, sinon l auteur
            local (`enseignant_id`, dans l etablissement de l evaluation).
            `id` est dans l espace de l annuaire des enseignants de l ecole
            (#1537) : l id local en ecole autonome, l identite d enseignant
            KLASSCI en ecole KLASSCI. Un auteur hors de l annuaire (sans
            identite, ou qui n est pas enseignant) donne `null`, et son nom
            reste dans `enseignant_nom`.
          properties:
            id:
              type: integer
            nom:
              type: string
            email:
              type: string
              nullable: true
        enseignant_nom:
          type: string
          nullable: true
        date_evaluation_formatted:
          type: string
          nullable: true
          example: "28/09/2026 à 16:44"
        date_evaluation_short:
          type: string
          nullable: true
          example: "28/09/2026"
        is_locked:
          type: boolean
        can_be_edited:
          type: boolean
        submissions_count:
          type: integer
        submissions_to_sync_count:
          type: integer
          description: |
            Liste du personnel (`GET /evaluations`) : les copies que `sync-klassci` enverra, par la meme
            regle (`EvaluationSubmission::aSynchroniser`) : remises (`soumis`, `corrige`), hors
            entrainement (`[PRACTICE]`). `submissions_count`, lui, compte toutes les copies (D540).
        questions_count:
          type: integer
        effective_status:
          type: string
        student_submission:
          nullable: true
          description: |
            Liste du personnel : la derniere copie du compte appelant quand il porte
            une identite KLASSCI, sinon absente.
          oneOf:
            - $ref: '#/components/schemas/EvaluationSubmissionRecord'

    EvaluationQuestionDeLaCopie:
      type: object
      additionalProperties: false
      description: |
        Une question vue dans « ma copie ». Le corrige (`correct_answers`, `explanation`)
        n est present qu une fois `correction_available` vrai. Schema FERME : il remplace
        un `allOf` que le validateur du depot refuse.
      properties:
        id:
          type: integer
        evaluation_id:
          type: integer
        question:
          type: string
        type:
          type: string
          enum: [qcm, qcm_multiple, vrai_faux, reponse_courte, dissertation]
        ordre:
          type: integer
        points:
          $ref: '#/components/schemas/Decimal2'
        options:
          nullable: true
          type: array
          items:
            type: string
        is_required:
          type: boolean
        institution_id:
          type: integer
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        correct_answers:
          type: array
          nullable: true
          description: "Present seulement une fois `correction_available` vrai : des libelles, ou des indices d option."
          items:
            oneOf:
              - type: string
              - type: integer
        explanation:
          type: string
          nullable: true
          description: "Present seulement une fois `correction_available` vrai"

    EvaluationQuestionPublic:
      type: object
      description: "Une question SANS son corrige (`correct_answers` et `explanation` sont masques sur le modele)."
      properties:
        id:
