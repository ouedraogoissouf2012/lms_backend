name: Security Audit

# CI security pipeline (issue #65). Status :
#   Step 1 ✅ — composer-audit + dependency-review + Dependabot (defense-in-depth on deps)
#   Step 2 ✅ — phpstan-analysis (Larastan level 9 + baseline)
#   Step 3 ✅ — semgrep-sast (p/default + p/owasp-top-ten) + GitHub native secret scanning
#   Step 4 ⏳ — OWASP ZAP DAST
#
# Defense-in-depth on dependencies :
#   - composer-audit job        → reactive : blocks merge if a known CVE
#                                  is in composer.lock at PR time
#   - dependency-review job     → reactive : blocks merge if the PR
#                                  ADDS a vulnerable dependency
#   - .github/dependabot.yml    → proactive : opens fix PRs daily
#                                  when an advisory is published

on:
  pull_request:
    branches:
      - lms
  push:
    branches:
      - lms

permissions:
  contents: read
  pull-requests: read  # required by dependency-review-action

jobs:
  composer-audit:
    name: Composer Audit (CVE scan)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP 8.3
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          coverage: none
          tools: composer:v2

      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: vendor
          key: composer-${{ hashFiles('composer.lock') }}
          restore-keys: composer-

      # Production install: only `require` (not `require-dev`).
      # Reflects exactly what ships to prod — auditing dev deps would
      # produce noise (Tinker, Faker, etc. are never in prod).
      - name: Install production dependencies
        run: composer install --no-interaction --no-progress --prefer-dist --no-dev --no-scripts

      # `composer audit` checks `composer.lock` against the public
      # Packagist advisory database (https://packagist.org/security-advisories).
      # --abandoned=ignore : do NOT fail on abandoned packages
      #   (that's a maintenance signal, not a CVE — handle separately).
      # --no-dev was already set at install time.
      - name: Run composer audit (fail on HIGH/CRITICAL CVE)
        run: composer audit --abandoned=ignore --no-interaction

      # Visibility-only: list outdated packages without failing the build.
      # Helps maintenance planning ; never blocks merges.
      - name: List outdated production packages (informational only)
        if: always()
        continue-on-error: true
        run: composer outdated --direct --no-interaction

  dependency-review:
    # GitHub's native Dependency Review action analyses ONLY what the PR
    # adds/removes vs. the base branch. Catches a vulnerable dependency
    # introduced by the PR itself, even if it's not yet known to Packagist
    # (e.g. malicious package via typosquatting).
    #
    # Only runs on pull_request — push events have no diff to review.
    name: Dependency Review (PR-level diff)
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Dependency Review
        uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high
          comment-summary-in-pr: on-failure

  phpstan-analysis:
    # Step 2/4 of the CI security pipeline (issue #65).
    # Larastan = official PHPStan extension for Laravel.
    # Level 9 (maximum strictness) + baseline file to grandfather legacy
    # violations. New code MUST pass level 9 ; legacy migrates per-touched-file.
    #
    # Strategy reference :
    #   https://laravel.io/articles/how-to-get-your-laravel-app-from-0-to-9-with-larastan
    name: PHPStan / Larastan (level 9 + baseline)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP 8.3
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          coverage: none
          tools: composer:v2

      - name: Cache Composer dependencies (with dev)
        uses: actions/cache@v4
        with:
          path: vendor
          key: composer-phpstan-${{ hashFiles('composer.lock') }}
          restore-keys: composer-phpstan-

      # Install dev deps too — Larastan is in require-dev.
      - name: Install dependencies (including dev)
        run: composer install --no-interaction --no-progress --prefer-dist --no-scripts

      - name: Cache PHPStan result cache
        uses: actions/cache@v4
        with:
          path: storage/framework/cache/phpstan
          key: phpstan-${{ hashFiles('**/*.php', 'phpstan.neon.dist', 'phpstan-baseline.neon') }}
          restore-keys: phpstan-

      # The baseline file is checked in. Any violation outside the baseline
      # (= new code, or modified legacy file that now exceeds the grandfathered
      # set) fails the build.
      - name: Run PHPStan / Larastan
        run: vendor/bin/phpstan analyse --memory-limit=2G --no-progress

  semgrep-sast:
    # Step 3/4 of the CI security pipeline (issue #65).
    # Static Application Security Testing via Semgrep Community Edition.
    #
    # Rulesets choisis :
    #   - p/default          : ~600 règles haute confidence, faible FP (recommandé)
    #   - p/owasp-top-ten    : mapping explicite OWASP A01-A10, valeur compliance ASVS
    #
    # Stratégie deux niveaux (analogue PHPStan baseline) :
    #   - ERROR severity → bloque la PR (vraies vulnérabilités)
    #   - WARNING/INFO   → informationnel, continue-on-error: true
    #
    # Diff-aware : ne tourne que sur les PR (pas les push direct).
    # Référence : https://semgrep.dev/docs/getting-started/quickstart
    name: Semgrep SAST (OWASP + default)
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'

    container:
      image: semgrep/semgrep

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Bloque la PR si une vulnérabilité ERROR severity est détectée.
      # Une fois la baseline initiale triée, on peut durcir en abaissant
      # le seuil à WARNING (cf. docs/SECURITY_CI.md section Étape 3).
      - name: Semgrep scan (block on ERROR severity)
        run: semgrep scan --config p/default --config p/owasp-top-ten --severity ERROR --error

      # Remontée informationnelle des WARNING / INFO. Ne bloque jamais.
      # Permet aux contributeurs de voir les findings non-critiques sans
      # impacter le merge. À traiter progressivement.
      - name: Semgrep scan (informational, WARNING/INFO)
        if: always()
        continue-on-error: true
        run: semgrep scan --config p/default --config p/owasp-top-ten --severity WARNING --severity INFO
