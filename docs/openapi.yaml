                seance_id:
                  type: integer
                  minimum: 1
                duree_minutes:
                  type: integer
                  minimum: 60
                  maximum: 1440
                retard_apres_minutes:
                  type: integer
                  minimum: 0
                  maximum: 240
                  nullable: true
