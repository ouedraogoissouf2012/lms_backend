  /knowledge-checks/{id}/submit:
    post:
      tags:
        - Chapters
      operationId: submitKnowledgeCheckAttempt
      summary: "Remettre un quiz de lecon (Testez vos connaissances)"
      description: |
        Note la remise et enregistre la tentative. La progression du chapitre
        (meilleur score, completion, temps) n est ecrite que pour l eleve ;
        l apercu du personnel enregistre la tentative, jamais la progression.

        Les reponses suivent l ordre des questions recues au demarrage
        (`/knowledge-checks/{id}/start`). Chaque reponse est l INDICE d une
        option (C45), le format que le front envoie : un texte, un booleen ou un
        decimal est refuse (422 `answer_not_an_option_index`) avant toute
        ecriture, sans consommer d essai.

        Melange (C44) : le demarrage ouvre la tentative et y ecrit l ordre
        presente (questions et options). La remise, toujours par position
        AFFICHEE, est retraduite vers l ordre enregistre avant la notation ;
        `answers` de la reponse revient dans l ordre affiche. Sans tentative
        ouverte (demarree avant ce lot, ou remise une seconde fois), la remise
        est notee dans l ordre enregistre, comme avant, si le quiz ne melange
        rien ; s il melange, elle est refusee (409 `attempt_not_open`, D520).

        Limite : 60 requetes / minute.
      security:
        - sanctum: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - answers
                - time_spent_seconds
              properties:
                answers:
                  type: array
                  description: |
                    Une reponse par question, dans l ordre recu au demarrage.
                    `null` (ou `[]` pour `multiple`) = non repondue. Un entier
                    >= 0 pour `single` et `true_false` ; une liste d entiers
                    >= 0 DISTINCTS pour `multiple`.
                  items:
                    oneOf:
                      - type: integer
                        minimum: 0
                      - type: array
                        items:
                          type: integer
                          minimum: 0
                    nullable: true
                  example: [1, 0, [0, 2], null]
                time_spent_seconds:
                  type: integer
                  minimum: 0
      responses:
        '200':
          description: "Tentative notee et enregistree"
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                  - success
                  - message
                  - data
                properties:
                  success:
                    type: boolean
                  message:
                    type: string
                  data:
                    type: object
                    additionalProperties: false
                    required:
                      - attempt_id
                      - score
                      - correct_answers
                      - total_questions
                      - passed
                      - passing_score
                      - time_spent
                      - answers
                      - can_retry
                    properties:
                      attempt_id:
                        type: integer
                      score:
                        type: integer
                        minimum: 0
                        maximum: 100
                        description: "Pourcentage entier de bonnes reponses"
                      correct_answers:
                        type: integer
                        minimum: 0
                      total_questions:
                        type: integer
                        minimum: 0
                      passed:
                        type: boolean
                      passing_score:
                        type: integer
                      time_spent:
                        type: string
                        example: "2min 5s"
                      answers:
                        type: array
                        nullable: true
                        description: "`null` quand le quiz n affiche pas les corrections (`show_correct_answers` faux)"
                        items:
                          $ref: '#/components/schemas/KnowledgeCheckAnswerDetail'
                      can_retry:
                        type: boolean
        '400':
          $ref: '#/components/responses/EtablissementInconnu'
        '401':
          description: "Non authentifie"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageOnly'
        '403':
          description: "Compte sans ecole (supradmin plateforme). Aussi, sans `reason` : etablissement desactive ou supprime (ResolveInstitution, #961)."
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageOnly'
        '404':
          description: |
            `Quiz introuvable` : le quiz n existe pas, ou son chapitre n est pas
            lisible par l appelant (meme reponse dans les deux cas). Rien n est
            ecrit.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageOnly'
        '409':
          description: |
            - `reason: quiz_changed_since_start` : une question ou une option a ete
              ajoutee, retiree, reordonnee ou renommee depuis le demarrage (empreinte
              du contenu presente) ; la remise ne se traduit plus. Rien n est note,
              la tentative reste ouverte : la redemarrer.
            - `reason: attempt_not_open` : aucune tentative ouverte (seconde remise,
              double clic) sur un quiz qui melange ; ce que l eleve a vu est inconnu.
              Rien n est ecrit, aucun essai consomme : redemarrer le quiz.
            - `reason: enrolment_not_active` : eleve de la classe de la lecon,
              inscription non active (D57, #1095). Rien n est ecrit.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                  - success
                  - message
                  - reason
                properties:
                  success:
                    type: boolean
                    example: false
                  message:
                    type: string
                  reason:
                    type: string
                    enum:
                      - quiz_changed_since_start
                      - attempt_not_open
                      - enrolment_not_active
        '422':
          description: |
            - `reason: answer_not_an_option_index` : une reponse n est pas un
              indice d option (C45), designe une option qui n a pas ete
              affichee, ou une question de trop (C44). Rien n est ecrit, aucun
              essai consomme.
            - Sans `reason` : `answers` ou `time_spent_seconds` absent ou mal
              forme.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                  - success
                  - message
                  - errors
                properties:
                  success:
                    type: boolean
                    example: false
                  message:
                    type: string
                  reason:
                    type: string
                    enum:
                      - answer_not_an_option_index
                  errors:
                    type: object
                    description: "Messages par champ."
                    additionalProperties:
                      type: array
                      items:
                        type: string
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /chapters/{chapter}/video:
    get:
      tags:
        - Chapters
      summary: "Stream a session recording (signed URL, no bearer)"
      description: >
        Sert l'enregistrement d'une seance depuis le disque PRIVE (#824).
        Volontairement sans `auth:sanctum` : une balise `<video>` ne peut pas
        envoyer d'en-tete `Authorization`. La signature tient lieu de jeton ;
        elle n'est emise que dans la reponse d'un `GET /api/chapters/{id}`
        authentifie, et vaut 4 h. Les requetes `Range` sont prises en charge.
      security: []
      parameters:
        - name: chapter
          in: path
          required: true
          schema:
            type: integer
        - name: signature
          in: query
          required: true
          schema:
            type: string
        - name: expires
          in: query
          required: true
          schema:
            type: integer
        - name: Range
          in: header
          required: false
          schema:
            type: string
          example: "bytes=0-1048575"
      responses:
        '200':
          description: "Media complet (video/mp4)"
        '206':
          description: "Contenu partiel, en reponse a un en-tete Range"
        '400':
          $ref: '#/components/responses/EtablissementInconnu'
        '403':
          description: "Signature absente, alteree ou expiree"
        '404':
          description: "Chapitre inconnu, sans enregistrement, ou media purge"

  /chapters/{id}:
    get:
      tags:
        - Chapters
      summary: "Get chapter details"
      description: >-
        #1330 - `slides_images` et la video interne sont des URL signees. Les chemins du
        stockage (`file_original_path`, `file_converted_path`) ne sont rendus par aucune
        reponse chapitre, televersement compris.
      security:
        - sanctum: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: "Chapter details"
        '400':
          $ref: '#/components/responses/EtablissementInconnu'
        '403':
          $ref: '#/components/responses/EtablissementDesactive'
        '404':
          description: "Chapter not found"
        '409':
          description: "Eleve de la classe de la lecon, inscription non active (`enrolment_not_active`, #1095)."
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RefusMotive'
        '429':
          $ref: '#/components/responses/TooManyRequests'

    put:
      tags:
        - Chapters
      summary: "Update chapter"
      description: >-
        #1287 - `video_url` est ignore pour une video interne (`video_provider` = `jibri` ou
        `upload`) : son chemin prive ne s'ecrit que par le televersement ou l'enregistrement de
        seance. La reponse signe la video interne comme `GET /chapters/{id}`.
      security:
        - sanctum: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: "Chapter updated"
        '400':
          $ref: '#/components/responses/EtablissementInconnu'
        '403':
          $ref: '#/components/responses/EtablissementDesactive'

    delete:
      tags:
        - Chapters
      summary: "Delete chapter"
      security:
        - sanctum: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: "Chapter deleted"
        '400':
          $ref: '#/components/responses/EtablissementInconnu'
        '403':
          $ref: '#/components/responses/EtablissementDesactive'

  # ============ NOTIFICATIONS ============
  /admin/notifications/create:
    post:
      tags:
        - Notifications
      summary: "Envoyer une notification manuelle a un compte"
      description: |
        Reserve au coordinateur, a l'admin d'ecole (`superAdmin`) et au
        supradmin plateforme (#1519). Le coordinateur et l'admin d'ecole
        n'ecrivent qu'a un compte de LEUR ecole ; le supradmin, a tout compte
        qui appartient a une ecole.

        L'autorisation est jugee AVANT la validation : pour un coordinateur ou
        un admin d'ecole, un `user_id` absent, non entier, inconnu ou d'une
        autre ecole rend le MEME 403. C'est voulu : la reponse ne revele pas
        l'existence d'un compte dans une autre ecole.
      security:
        - sanctum: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - user_id
                - title
                - message
              properties:
                user_id:
                  type: integer
                  description: "Le compte destinataire."
                title:
                  type: string
                  maxLength: 255
                message:
                  type: string
                type:
                  type: string
                  nullable: true
                  enum: [info, success, warning, danger]
                  description: "`info` par defaut."
                action_url:
                  type: string
                  nullable: true
                  maxLength: 2048
                  description: |
                    Un chemin interne du LMS (`/...`), ou une adresse `https://`
                    sans identifiants dans l'autorite. Rien d'autre :
                    `http://`, `data:`, `file:` et `javascript:` sont refuses
                    (NotificationActionUrl).
      responses:
        '200':
          description: "Notification enregistree pour le destinataire"
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                  - success
                  - message
                properties:
                  success:
                    type: boolean
                    enum:
                      - true
                  message:
                    type: string
                    example: "Notification envoyée"
        '400':
          $ref: '#/components/responses/EtablissementInconnu'
        '401':
          description: "Non authentifie"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: |
            Role hors liste (eleve, enseignant). Pour un coordinateur ou un
            admin d'ecole : destinataire absent, non entier, inconnu ou d'une
            autre ecole, sans distinction (l'autorisation precede la
            validation ; rien n'y revele un compte d'une autre ecole). Aussi,
            sans `reason` : etablissement desactive ou supprime
            (ResolveInstitution, #961).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: |
            Deux sens, distingues par `reason` (ADR-906-01) :
            - sans `reason` : validation (`title` ou `message` absent, `type`
              hors liste, `action_url` refusee) ; le detail par champ est dans
              `errors`. Pour le supradmin, aussi un `user_id` absent ou inconnu ;
            - `reason: recipient_without_institution` : le destinataire
              n'appartient a aucune ecole, il ne recoit pas de notification
              (#801). Atteint par le seul supradmin : pour les autres roles, un
              tel compte est hors de leur ecole, donc un 403.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /admin/notifications/stats:
    get:
      tags:
        - Notifications
      summary: "Statistiques des notifications"
      description: |
        Reserve au coordinateur, a l'admin d'ecole (`superAdmin`) et au
        supradmin plateforme (#1570). Deux portees, une seule forme : le
        supradmin lit les notifications de TOUTES les ecoles ; les autres
        roles, celles de leur ecole seulement (#497). Mise en cache quelques
        minutes, par portee.
      security:
        - sanctum: []
      responses:
        '200':
          description: "Les compteurs de la portee de l'appelant"
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                  - success
                  - data
                properties:
                  success:
                    type: boolean
                    enum:
                      - true
                  data:
                    $ref: '#/components/schemas/NotificationStats'
        '400':
          $ref: '#/components/responses/EtablissementInconnu'
        '401':
          description: "Non authentifie"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: "Role hors liste (eleve, enseignant). Aussi, sans `reason` : etablissement desactive ou supprime (ResolveInstitution, #961)."
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /notifications:
    get:
      tags:
        - Notifications
      summary: "Les notifications de l appelant, paginees"
      description: |
        Les notifications de l APPELANT seul, les plus recentes d abord. `type` filtre sur un
        type connu : `type=annonce` est le fil « Mes annonces » (#1650, front#690). La page
        est gardee en cache 60 s, par appelant, filtre, taille et numero de page.
      security:
        - sanctum: []
      parameters:
        - name: unread_only
          in: query
          schema:
            type: boolean
            default: false
        - name: type
          in: query
          schema:
            type: string
            enum: [lesson_published, forum_reply, quiz_available, grade_received, lesson_updated, forum_solution, quiz_deadline, visio_scheduled, visio_starting, evaluation_approaching, annonce, absence_justification_decided]
        - name: per_page
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 10
        - name: page
          in: query
          schema:
            type: integer
            minimum: 1
            default: 1
      responses:
        '200':
          description: "Une page de notifications"
          content:
            application/json:
              schema:
                type: object
                required:
                  - success
                  - data
                  - meta
                properties:
                  success:
                    type: boolean
                  data:
                    type: array
                    items:
                      type: object
                      additionalProperties: true
                      required:
                        - id
                        - type
                        - title
                        - message
                      properties:
                        id:
                          type: integer
                        type:
                          type: string
                        title:
                          type: string
                        message:
                          type: string
                        data:
                          type: object
                          additionalProperties: true
                          description: "Les donnees du type (`annonce_id`, `classe_id` pour une annonce). Toujours un objet, `{}` quand il est vide."
                        read_at:
                          type: string
                          format: date-time
                          nullable: true
                        created_at:
                          type: string
                          format: date-time
                  meta:
                    type: object
                    properties:
                      current_page:
                        type: integer
                      last_page:
                        type: integer
                      per_page:
                        type: integer
                      total:
                        type: integer
        '400':
          $ref: '#/components/responses/EtablissementInconnu'
        '403':
          $ref: '#/components/responses/EtablissementDesactive'
        '422':
          description: "`type` inconnu, `per_page` hors bornes, `page` ou `unread_only` invalides."
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationFailed'
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /notifications/unread-count:
    get:
      tags:
        - Notifications
      summary: "Get unread count"
      security:
        - sanctum: []
      responses:
        '200':
          description: "Unread count"
        '400':
          $ref: '#/components/responses/EtablissementInconnu'
        '403':
          $ref: '#/components/responses/EtablissementDesactive'
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /notifications/{id}/mark-as-read:
    post:
      tags:
        - Notifications
      summary: "Mark notification as read"
      security:
        - sanctum: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: "Marked as read"
        '400':
          $ref: '#/components/responses/EtablissementInconnu'
        '403':
          $ref: '#/components/responses/EtablissementDesactive'

