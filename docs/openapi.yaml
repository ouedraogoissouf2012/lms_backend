        '401':
          description: "Non authentifie"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: "Hors de la gestion de l'ecole ; aussi, sans `reason` : etablissement desactive ou supprime (ResolveInstitution, #961)."
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: "Ecole KLASSCI : les heures des enseignants se tiennent dans KLASSCI (`attendance_managed_by_klassci`)."
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RefusMotive'
        '422':
          description: "Plage ou filtres invalides."
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationFailed'
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /lms/seances/{seanceId}/start-visio:
    post:
      tags:
        - Visio
      summary: "Demarrer la visio d'une seance"
      description: |
        Reserve aux roles enseignant et coordinateur. Seul qui gere la seance
        agit : son enseignant (`klassci_enseignant_id` en mode KLASSCI,
        `created_by` pour une seance locale) ou le personnel de gestion de
        l'etablissement (`VisioActorAuthorization::canManage`). La seance se lit
        en local, dans les deux types d'ecole, sans appel KLASSCI.

        La visio passe de `programmee` a `active` ; les eleves de la classe et
        l'enseignant sont avertis (planifie, jamais pendant la requete).
      security:
        - sanctum: []
      parameters:
        - name: seanceId
          in: path
          required: true
          description: "Identifiant KLASSCI de la seance (ecole en mode KLASSCI), ou son identifiant local (ecole en mode autonome). L'id local est lu d'abord."
          schema:
            type: integer
      responses:
        '200':
          description: "Visio demarree."
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VisioDemarree'
        '400':
          description: "La visio de la seance n'est pas activee. Aussi, sans jeton : en-tete `X-Institution` d un etablissement inconnu ou inactif (ResolveInstitution, #961), avant le 401."
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VisioEtatRefuse'
        '401':
          description: "Jeton porteur absent ou invalide. Aucune garde de jeton KLASSCI sur cette route."
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RefusKlassci'
        '403':
          description: |
            Sans `reason` : role non admis (garde de role), ou etablissement
            desactive. Avec `reason: no_institution` : compte sans
            etablissement. Avec `reason: actor_not_authorized` : le compte ne
            gere pas la seance (ni son enseignant, ni le personnel de gestion de
            l'etablissement), refuse avant toute ecriture.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/SeanceLocaleInterdite'
                  - $ref: '#/components/schemas/VisioGestionRefusee'
        '404':
          description: "Seance introuvable dans l'etablissement du compte."
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SeanceLocaleRefus'
        '409':
          description: |
            Seance passee (`reason: seance_past`) : sa fin est depassee de plus de 30
            min. Fin reelle si connue (programmation KLASSCI, `fin_seance`), sinon
            debut + 2 h pour une seance locale ; une ligne KLASSCI sans fin connue n
            est pas refusee. Rien n est demarre.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RefusMotive'
        '500':
          description: |
            Erreur interne. Rattrapee par le service : avec `error`. Non
            rattrapee (gestionnaire global) : sans `error`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VisioErreurInterne'

