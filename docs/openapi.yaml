          schema:
            type: integer
      responses:
        '200':
          description: "Etat temporel"
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: object
                    properties:
                      window:
                        $ref: '#/components/schemas/EvaluationWindow'
                      server_time:
                        type: string
                        format: date-time
        '401':
          $ref: '#/components/responses/KlassciUnauthorized'
        '404':
          description: |
            « Evaluation non trouvee » : l evaluation ne figure pas dans la liste
            de l eleve — la meme regle que `/start`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageOnly'
        '503':
          description: "KLASSCI injoignable : la classe de l eleve ne peut pas etre lue (en-tete `Retry-After`)."
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageOnly'

  /evaluations/{id}/my-submission:
    get:
      tags:
