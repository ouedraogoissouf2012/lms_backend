                        type: integer
                        nullable: true
                      coefficient:
                        $ref: '#/components/schemas/Decimal2'
                      bareme:
                        $ref: '#/components/schemas/Decimal2'
                      date_evaluation:
                        type: string
                        format: date-time
                        nullable: true
                      questions:
                        type: array
                        items:
                          type: object
                          properties:
                            id:
                              type: integer
                            question:
                              type: string
                            type:
                              type: string
                            points:
                              $ref: '#/components/schemas/Decimal2'
                            ordre:
                              type: integer
