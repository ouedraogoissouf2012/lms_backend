openapi: 3.0.0
info:
  title: "LMS Backend API"
  description: |
    API complète pour la plateforme LMS - Learning Management System avec intégration KLASSCI.

    ## Rate limiting (#214)

    Les routes proxy KLASSCI sont limitées par utilisateur authentifié :
      - `GET /proxy/*` (lecture) : **100 requêtes / minute / utilisateur**.
      - écritures `/proxy/evaluations/{id}/notes`, `/proxy/cours/{id}/presences`,
        `/proxy/cours/{id}/statut` : **30 requêtes / minute / utilisateur**.

    Le rôle `supradmin` (gestionnaire plateforme) est exempté.

    Chaque réponse expose les en-têtes `X-RateLimit-Limit` et
    `X-RateLimit-Remaining`. Au dépassement, l'API répond `429 Too Many
    Requests` avec `Retry-After` (secondes) et `X-RateLimit-Reset`.

    Ces quatre en-têtes sont exposés par le CORS (`Access-Control-Expose-Headers`)
    à toute origine admise : un front servi depuis une autre origine que l'API
    peut les lire. `Retry-After` porte aussi le délai d'un 503 KLASSCI.
  version: "1.0.0"
  contact:
    name: "LMS Team"
    email: "support@lms.local"
  license:
    name: "MIT"

servers:
  - url: "http://localhost:8000/api"
    description: "Development Server"
  - url: "https://api.lms.local/api"
    description: "Production Server"

# Security Schemes
components:
  securitySchemes:
    sanctum:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: "Sanctum token authentication"

  responses:
    # Réponse standard de dépassement du rate limit (#214/#219).
    TooManyRequests:
      description: "Rate limit dépassé (voir en-têtes X-RateLimit-* et Retry-After)."
      headers:
        Retry-After:
          schema:
            type: integer
          description: "Secondes à attendre avant de réessayer."
        X-RateLimit-Limit:
          schema:
            type: integer
          description: "Quota maximum par minute."
        X-RateLimit-Remaining:
          schema:
            type: integer
          description: "Requêtes restantes dans la fenêtre courante."
      content:
        application/json:
          # #1134 — le corps REEL (TooManyRequestsPresenter) : `reason` n est
          # pose que par les seaux nommes qui disent quel budget est epuise
          # (`inscriptions`, `rejoindre-classe`, ADR-906-01).
          schema:
            type: object
            required:
              - success
              - message
            properties:
              success:
                type: boolean
                enum:
                  - false
              message:
                type: string
                example: "Trop de requêtes. Veuillez réessayer plus tard."
              reason:
                type: string
                description: "Facultatif : le budget epuise, pour les seaux qui le disent (ADR-906-01)."

    # #961 — les deux refus du middleware global `ResolveInstitution`, rendus
    # AVANT toute route : chaque operation les cite (scripts/
    # openapi-refus-de-la-resolution.py), un client genere ne lit que les siennes.
    EtablissementDesactive:
      description: |
        Requete avec jeton : l etablissement du compte est desactive ou
        supprime (#565). Sans `reason`.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/RefusDeLaResolution'
          example:
            success: false
            message: "Établissement désactivé. Accès suspendu, contactez votre administration."

    EtablissementInconnu:
      description: |
        Requete sans jeton, en-tete `X-Institution` d un etablissement inconnu
        ou inactif. Rendu AVANT le 401 de l authentification. Sans `reason`.
        Message fixe : il ne recopie pas la valeur recue, et ne distingue pas
        un etablissement inconnu d un inactif (#1129).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/RefusDeLaResolution'
          example:
            success: false
            message: "Établissement introuvable ou inactif."

    # #806 — un 401 d'une route adossee a KLASSCI a TROIS sens, que seul
    # `reason` distingue. CIBLE : le client decide sur `reason`, jamais sur le
    # message. Le front lit encore le message aujourd'hui (frontend_lms#420).
    KlassciUnauthorized:
      description: |
        Trois causes, distinguees par `reason` :
        - absent : jeton Sanctum invalide ou expire, session LMS morte ;
        - `klassci_token_missing` : ce compte n a aucun jeton KLASSCI, ou aucune
          identite KLASSCI (compte local, ecole autonome). Se reconnecter n y
          change rien ;
        - `klassci_session_expired` : KLASSCI refuse le jeton utilise. Selon la
          route, c est le jeton du compte, ou a defaut celui de l etablissement
          (`/proxy/structure`, `classes`, `enseignants`, `filieres`,
          `niveaux-etudes`). Se reconnecter ne renouvelle que le jeton du compte.
        Selon la route, l un des deux motifs KLASSCI peut ne jamais survenir.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/RefusKlassci'
          example:
            success: false
            message: "Aucun accès KLASSCI n'est enregistré pour ce compte : ces données, qui proviennent de KLASSCI, ne peuvent pas être affichées."
            reason: klassci_token_missing

  schemas:
    ProgramInput:
      type: object
      required:
        - titre
      properties:
        titre:
          type: string
          maxLength: 191
        description:
          type: string
          maxLength: 5000
          nullable: true

    ProgramCreated:
      type: object
      properties:
        success:
          type: boolean
        message:
          type: string
        data:
          type: object
          properties:
            id:
              type: integer
            titre:
              type: string
            version:
              type: integer

    MatiereInput:
      type: object
      required:
        - libelle
      properties:
        libelle:
          type: string
          maxLength: 191
        code:
          type: string
          maxLength: 50
          nullable: true
          description: |
            FACULTATIF. Unique dans l ecole parmi les matieres LOCALES, sans
            tenir compte de la casse ni des blancs (#1653) : sinon 422
            `subject_code_already_used`. Un code vide devient nul.
        description:
          type: string
          maxLength: 2000
          nullable: true
        coefficient:
          type: integer
          minimum: 1
          maximum: 20
          default: 1
        credit:
          type: integer
          minimum: 1
          maximum: 60
          default: 1

    MatiereUpdateInput:
      type: object
      description: "#1653 : un PATCH ; chaque champ est facultatif, seul un champ envoye change."
      properties:
        libelle:
          type: string
          maxLength: 191
        code:
          type: string
          maxLength: 50
          nullable: true
          description: "Vide ou nul : efface le code. Unique dans l ecole parmi les matieres locales."
        description:
          type: string
          maxLength: 2000
          nullable: true
        coefficient:
          type: integer
          minimum: 1
          maximum: 20
        credit:
          type: integer
          minimum: 1
          maximum: 60

    MatiereCreated:
      type: object
      properties:
        success:
          type: boolean
        message:
          type: string
        data:
          type: object
          properties:
            id:
              type: integer
            libelle:
              type: string
            code:
              type: string
              nullable: true
            description:
              type: string
              nullable: true
            coefficient:
              type: integer
            credit:
              type: integer

    ClasseMatiereUpdateInput:
      type: object
      description: "#1653 : un PATCH ; seul un champ envoye change, nul est une valeur."
      properties:
        enseignant_id:
          type: integer
          nullable: true
          description: "Un enseignant de l ecole ; nul retire le formateur."
        coefficient:
          type: integer
          minimum: 1
          maximum: 20
          nullable: true
          description: "Coefficient propre a la classe ; nul : celui de la matiere s applique."

    ClasseMatiereLigne:
      type: object
      properties:
        success:
          type: boolean
        message:
          type: string
        data:
          type: object
          properties:
            classe_id:
              type: integer
            matiere_id:
              type: integer
            enseignant_id:
              type: integer
              nullable: true
            coefficient:
              type: integer
              nullable: true

    ClasseMatiereInput:
      type: object
      required:
        - matiere_id
      properties:
        matiere_id:
          type: integer
          minimum: 1
        enseignant_id:
          type: integer
          minimum: 1
          nullable: true
          description: |
            FACULTATIF : on compose souvent un programme avant de savoir qui
            l assurera. S il est nomme, il doit appartenir a l etablissement ET
            avoir le role enseignant.

    ClasseMatiereLinked:
      type: object
      properties:
        success:
          type: boolean
        message:
          type: string
        data:
          type: object
          properties:
            classe_id:
              type: integer
            matiere_id:
              type: integer
            enseignant_id:
              type: integer
              nullable: true

    # Ecole independante, lot 1 : « Mes matieres » et la page d une matiere.
    # La MEME route sert les deux volets ; seule la source change. Les cles
    # decrites sont celles que le front LIT (fichier cite pour chacune) ; les
    # objets restent ouverts la ou la source KLASSCI relaie sa propre charge.
    MesMatieresListe:
      type: object
      additionalProperties: false
      required:
        - success
        - data
      properties:
        success:
          type: boolean
          enum:
            - true
        data:
          type: array
          items:
            $ref: '#/components/schemas/MesMatieresCarte'

    MesMatieresCarte:
      type: object
      description: |
        Une matiere enseignee par l appelant (`MatiereCourseCard.vue`). Ouvert :
        la source KLASSCI relaie la matiere telle que KLASSCI la decrit.
      required:
        - id
        - statistiques
      properties:
        source:
          type: string
          enum:
            - lms_local
          description: |
            Ecole creee depuis le LMS : `lms_local`, sur chaque carte. Ses ids sont
            LOCAUX, a envoyer tels quels (`classe_id`, `matiere_id`). Ecole creee
            depuis KLASSCI : cle absente. Aucun mode d'ecole n'est expose.
        id:
          type: integer
          description: |
            Navigation vers la page de la matiere (useTeacherMatieres.js:37, qui
            lit `matiere_id` d abord). Requis : la source KLASSCI n ajoute ses
            compteurs qu a une matiere identifiee (`MyMatieresQueryService`).
        matiere_id:
          type: integer
          description: "Variante de `id` que KLASSCI peut employer ; la source locale ne l emet pas."
        nom:
          type: string
          description: "Titre de la carte (MatiereCourseCard.vue:12)."
        coefficient:
          type: number
          nullable: true
        classes:
          type: array
          description: "Badges de classes (MatiereCourseCard.vue:41-48)."
          items:
            $ref: '#/components/schemas/PageMatiereClasse'
        statistiques:
          type: object
          additionalProperties: false
          required:
            - nombre_lessons_publiees
            - nombre_lessons_brouillons
            - nombre_seances
            - nombre_evaluations
          properties:
            nombre_lessons_publiees:
              type: integer
            nombre_lessons_brouillons:
              type: integer
            nombre_seances:
              type: integer
              nullable: true
              description: |
                `null` = inconnu : une seance locale ne porte que le NOM de sa
                matiere, en texte. Jamais un zero fabrique.
            nombre_evaluations:
              type: integer

    PageMatiere:
      type: object
      additionalProperties: false
      required:
        - success
        - data
      properties:
        success:
          type: boolean
          enum:
            - true
        data:
          type: object
          additionalProperties: false
          required:
            - matiere
            - combinaisons
            - enseignants
            - lessons
            - seances_programmees
            - evaluations_programmees
            - statistiques
            - matiere_id_local
            - classes_concernees
          properties:
            matiere:
              type: object
              description: "En-tete de la page (MatiereDetailsHeader.vue)."
              required:
                - nom
              properties:
                nom:
                  type: string
                code:
                  type: string
                  nullable: true
                coefficient:
                  type: integer
                  nullable: true
            combinaisons:
              type: array
              items:
                type: object
            enseignants:
              type: array
              items:
                type: object
            lessons:
              type: array
              description: |
                Onglet Lecons (LessonCard.vue). Dans la source locale, un
                enseignant n y voit que les siennes.
              items:
                type: object
                required:
                  - id
                  - title
                properties:
                  id:
                    type: integer
                  title:
                    type: string
            seances_programmees:
              type: array
              items:
                type: object
            evaluations_programmees:
              type: array
              items:
                type: object
            statistiques:
              type: object
              required:
                - nombre_lessons
                - nombre_evaluations
                - nombre_seances_programmees
              properties:
                nombre_lessons:
                  type: integer
                nombre_evaluations:
                  type: integer
                nombre_seances_programmees:
                  type: integer
                  nullable: true
            matiere_id_local:
              type: integer
              nullable: true
              description: |
                L id LOCAL que la creation de lecon envoie (matiereDetails.js:116-124).
                `null` quand la matiere KLASSCI n est pas encore miroitee.
            classes_concernees:
              type: array
              description: "Ids LOCAUX (#740). La premiere sert de `classe_id` a la creation de lecon."
              items:
                $ref: '#/components/schemas/PageMatiereClasse'

    PageMatiereClasse:
      type: object
      additionalProperties: false
      required:
        - id
        - nom
      properties:
        id:
          type: integer
        nom:
          type: string

    PageMatiereRefus:
      type: object
      description: |
        Tout refus de « Mes matieres » et de la page d une matiere, hors 401.
        `reason` quand la couche qui refuse en pose un (`no_institution` a la
        porte des comptes sans etablissement) ; `error` dans le seul 500 de la
        page matiere (`LMSMatieresQueryController::echecDetails`).
      additionalProperties: false
      required:
        - success
        - message
      properties:
        success:
          type: boolean
          enum:
            - false
        message:
          type: string
        reason:
          type: string
        error:
          type: string

    ClasseInput:
      type: object
      required:
        - libelle
      properties:
        libelle:
          type: string
          maxLength: 191
        code:
          type: string
          maxLength: 50
          nullable: true
          description: |
            Code de la classe, FACULTATIF. Unique par etablissement parmi les
            classes qui en portent un : une chaine vide est normalisee en nul,
            sans quoi la deuxieme classe sans code entrerait en collision.
        description:
          type: string
          maxLength: 2000
          nullable: true
        effectif:
          description: |
            La CAPACITE de la classe, que l inscription par code respecte (#1115,
            #1358). Facultative : absente, `null` ou 0 = sans limite.
          type: integer
          minimum: 0
          maximum: 10000
          nullable: true
          default: 0
        training_session_id:
          type: integer
          minimum: 1
          nullable: true
          description: |
            Periode de formation a laquelle la classe nait rattachee (#1208),
            FACULTATIF. Elle doit etre de cet etablissement et recevoir encore des
            inscriptions (ni annulee, ni close, ni archivee, ni purgee) : sinon 422
            sur `training_session_id`, sans qu aucune classe soit creee.

    # #905 — une ligne de la collection des classes locales ; #1652 la rend aussi apres un
    # archivage ou un desarchivage, pour que l ecran la remplace sur place.
    ClasseLocaleLigne:
      type: object
      properties:
        id:
          type: integer
        libelle:
          type: string
        code:
          type: string
          nullable: true
        description:
          type: string
          nullable: true
          description: "Pour preremplir sa modification sans relire la fiche (front#659)."
        training_session_id:
          type: integer
          nullable: true
        effectif:
          type: integer
          nullable: true
          description: "La CAPACITE de la classe (#1358) ; `null` quand elle n est pas renseignee, jamais 0."
        code_inscription:
          type: object
          properties:
            etat:
              type: string
              enum: [actif, retire, absent]
            valeur:
              type: string
              nullable: true
              description: "Presente seulement si etat = actif"
              example: BUR7K2
        archivee_le:
          type: string
          format: date-time
          nullable: true
          description: "Date d archive (#1652) ; `null` pour une classe active."

    # #1652 — la reponse d un archivage ou d un desarchivage.
    ClasseLocaleArchivage:
      type: object
      properties:
        success:
          type: boolean
        message:
          type: string
        data:
          $ref: '#/components/schemas/ClasseLocaleLigne'

    # #905 — une page de classes locales, chacune avec l etat de son code.
    # #1806 - une sous-periode d une periode de formation.
    SousPeriode:
      type: object
      properties:
        id:
          type: integer
        training_session_id:
          type: integer
        libelle:
          type: string
        debut:
          type: string
          format: date
        fin:
          type: string
          format: date
        ordre:
          type: integer
          nullable: true

    ClassesLocalesPage:
      type: object
      properties:
        success:
          type: boolean
        message:
          type: string
        data:
          type: array
          items:
            $ref: '#/components/schemas/ClasseLocaleLigne'
        meta:
          type: object
          properties:
            current_page:
              type: integer
            last_page:
              type: integer
            per_page:
              type: integer
            total:
              type: integer

    ClassesDeLEtablissementPage:
      type: object
      description: |
        Reponse de `GET /lms/classes/etablissement` (#1709) : les classes de
        l etablissement par leur id LOCAL, et rien d autre — aucune donnee du
        code d inscription.
      additionalProperties: false
      required: [success, data, meta]
      properties:
        success:
          type: boolean
        data:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [id, libelle]
            properties:
              id:
                type: integer
                description: "Cle primaire LOCALE de la classe (table `classes`), dans les deux volets."
              libelle:
                type: string
        meta:
          type: object
          properties:
            current_page:
              type: integer
            last_page:
              type: integer
            per_page:
              type: integer
            total:
              type: integer

    MyCoursesPage:
      type: object
      description: |
        Reponse de `GET /lessons/my-courses` (#938). Hors enveloppe
        `successResponse` : `filters`, `total` et `meta` vivent a la RACINE,
        a cote de `data`. `data` est un tableau PLAT, jamais `data.data`.
      required:
        - success
        - data
        - filters
        - total
        - meta
      properties:
        success:
          type: boolean
          example: true
        data:
          type: array
          items:
            $ref: '#/components/schemas/MyCourse'
        filters:
          type: object
          description: |
            Dictionnaires des menus de filtre, calcules sur TOUTE la selection
            filtree, pas sur la seule page. Avec `matiere_id` ou
            `enseignant_id`, ils se reduisent donc a cette selection : le
            dictionnaire complet est celui d une reponse sans filtre.
          required:
            - matieres
            - enseignants
          properties:
            matieres:
              type: array
              items:
                type: object
                required:
                  - id
                  - name
                properties:
                  id:
                    type: integer
                    description: "matieres.id LOCAL"
                  name:
                    type: string
            enseignants:
              type: array
              items:
                type: object
                required:
                  - id
                  - name
                properties:
                  id:
                    type: integer
                    description: "users.id LOCAL de l auteur (#869), l espace qu accepte `enseignant_id`"
                  name:
                    type: string
        total:
          type: integer
          description: "Nombre de cours de TOUTE la selection, toutes pages confondues (egal a meta.total)"
        meta:
          type: object
          required:
            - current_page
            - last_page
            - per_page
            - total
          properties:
            current_page:
              type: integer
            last_page:
              type: integer
            per_page:
              type: integer
            total:
              type: integer

    MyCourse:
      type: object
      description: |
        Les 12 cles sont TOUJOURS emises par MyCoursesPresenter, certaines a
        null (`nullable`) : `required` ne dit pas « non nul », il dit
        « toujours present ».
      required:
        - id
        - title
        - description
        - type
        - duree_estimee
        - niveau_difficulte
        - enseignant
        - matiere
        - classe
        - progress
        - published_at
        - created_at
      properties:
        id:
          type: integer
          description: "lessons.id LOCAL"
        title:
          type: string
        description:
          type: string
          nullable: true
        type:
          type: string
          enum: [cours, tp, td, projet, autre]
        duree_estimee:
          type: integer
          nullable: true
          description: "Duree ESTIMEE en minutes (lessons.duree_estimee_minutes). Ce n est pas un temps passe."
        niveau_difficulte:
          type: string
          enum: [debutant, intermediaire, avance]
        enseignant:
          type: object
          nullable: true
          required:
            - id
            - klassci_id
            - name
          properties:
            id:
              type: integer
              description: "users.id LOCAL"
            klassci_id:
              type: integer
              nullable: true
            name:
              type: string
        matiere:
          type: object
          nullable: true
          required:
            - id
            - name
          properties:
            id:
              type: integer
            name:
              type: string
        classe:
          type: object
          nullable: true
          required:
            - id
            - name
          properties:
            id:
              type: integer
            name:
              type: string
              description: "Libelle de la classe (classes.libelle, jamais null). Valait toujours \"Classe\" avant #939"
        progress:
          type: object
          nullable: true
          description: "Progression de l appelant sur la lecon ; null s il ne l a jamais commencee"
          required:
            - percentage
            - status
            - completed_at
          properties:
            percentage:
              type: integer
              minimum: 0
              maximum: 100
            status:
              type: string
              enum: [not_started, in_progress, completed]
            completed_at:
              type: string
              format: date-time
              nullable: true
        published_at:
          type: string
          format: date-time
        created_at:
          type: string
          format: date-time

    ClasseCreated:
      type: object
      properties:
        success:
          type: boolean
        message:
          type: string
        data:
          type: object
          properties:
            id:
              type: integer
            libelle:
              type: string
            code:
              type: string
              nullable: true
            description:
              type: string
              nullable: true
            effectif:
              type: integer
              nullable: true
              description: "La CAPACITE de la classe (#1358) ; `null` quand elle n est pas renseignee."

    ClasseUpdateInput:
      type: object
      description: "#1652 : un PATCH ; chaque champ est facultatif, seul un champ envoye change."
      properties:
        libelle:
          type: string
          maxLength: 191
        code:
          type: string
          maxLength: 50
          nullable: true
          description: "Vide ou nul : efface le code. Unique dans l ecole."
        description:
          type: string
          maxLength: 2000
          nullable: true

    TrainingSessionInput:
      type: object
      required:
        - program_id
        - libelle
      properties:
        program_id:
          type: integer
          description: "Doit appartenir a l etablissement de l appelant."
        libelle:
          type: string
          maxLength: 191
        enrollment_opens_at:
          type: string
          format: date
          nullable: true
        enrollment_closes_at:
          type: string
          format: date
          nullable: true
        starts_on:
          type: string
          format: date
          nullable: true
        ends_on:
          type: string
          format: date
          nullable: true
        certificate_available_at:
          type: string
          format: date
          nullable: true
        min_enrollments:
          type: integer
          minimum: 1
          nullable: true
          description: "Alerte de sous-inscription, pas un verrou."
        tarif:
          type: integer
          minimum: 0
          nullable: true
          description: "Plus petite unite monetaire. Jamais un flottant."
        devise:
          type: string
          minLength: 3
          maxLength: 3
          nullable: true
        heures_stagiaires:
          type: integer
          minimum: 0
          nullable: true

    TrainingSessionView:
      type: object
      properties:
        id:
          type: integer
        libelle:
          type: string
        status:
          type: string
          enum: [brouillon, publiee, annulee, cloturee, archivee, purgee]
          description: "Decision humaine, STOCKEE."
        phase:
          type: string
          enum: [a_venir, inscriptions_ouvertes, en_cours, terminee]
          description: |
            DERIVEE des dates, jamais stockee. Aucune colonne ne la porte : une
            colonne exigerait un job nocturne qui finirait par diverger.
        en_cours:
          type: boolean
          description: |
            #1651 — la periode en cours de l ecole : UNE au plus, et seulement une
            periode publiee. Designee par `POST /training-sessions/{id}/en-cours` ;
            la liste la rend en premier.
        program_id:
          type: integer
        program:
          type: object
          nullable: false
          description: |
            Le Programme de la Periode (#1206), charge en une requete pour toute la
            page. Supprime en douceur compris : son titre reste l histoire de la
            Periode. Le titre se lit ICI, jamais en relisant `program_id`.
          properties:
            id:
              type: integer
            titre:
              type: string
        enrollment_opens_at:
          type: string
          format: date
          nullable: true
        enrollment_closes_at:
          type: string
          format: date
          nullable: true
        starts_on:
          type: string
          format: date
          nullable: true
        ends_on:
          type: string
          format: date
          nullable: true
        certificate_available_at:
          type: string
          format: date
          nullable: true
        min_enrollments:
          type: integer
          nullable: true
        tarif:
          type: integer
          nullable: true
        devise:
          type: string
          nullable: true

    TrainingSessionCreated:
      type: object
      properties:
        success:
          type: boolean
        message:
          type: string
        data:
          $ref: '#/components/schemas/TrainingSessionView'

    ProgramView:
      type: object
      properties:
        id:
          type: integer
        titre:
          type: string
        version:
          type: integer

    ProgramPage:
      type: object
      properties:
        success:
          type: boolean
        data:
          type: array
          items:
            $ref: '#/components/schemas/ProgramView'
        meta:
          type: object
          properties:
            current_page:
              type: integer
            last_page:
              type: integer
            per_page:
              type: integer
            total:
              type: integer

    TrainingSessionPage:
      type: object
      properties:
        success:
          type: boolean
        data:
          type: array
          items:
            $ref: '#/components/schemas/TrainingSessionView'
        meta:
          type: object
          properties:
            current_page:
              type: integer
            last_page:
              type: integer
            per_page:
              type: integer
            total:
              type: integer

    # Les eleves d'une classe (lot C ; source locale au lot 2).
    ClasseEleves:
      type: object
      additionalProperties: false
      required:
        - success
        - data
      properties:
        success:
          type: boolean
          enum:
            - true
        data:
          type: object
          additionalProperties: false
          required:
            - etudiants
            - total
          properties:
            etudiants:
              type: array
              description: |
                Ecole creee depuis KLASSCI : les eleves de l'enveloppe KLASSCI de
                la classe, de statut `actif` ou sans statut ; chaque element est
                l'objet KLASSCI, non normalise. Ecart connu : un element vide cote
                KLASSCI ressortirait en tableau vide `[]`, que ce schema ne decrit
                pas. Ecole creee depuis le LMS : les inscriptions actives, chaque
                element `{id, name, email, matricule: null, statut: actif}`.
              items:
                type: object
            total:
              type: integer
              minimum: 0

    RefusEleveSansClasseActive:
      type: object
      description: |
        Le 404 de `/lms/seances/my-classes`. Le motif ferme `student_without_active_class`
        dit que l eleve n a aucune classe active ; un 404 relaye de KLASSCI n en porte pas.
      additionalProperties: false
      required:
        - success
        - message
      properties:
        success:
          type: boolean
          enum:
            - false
        message:
          type: string
        reason:
          type: string
          enum:
            - student_without_active_class

    RefusClasseEleves:
      type: object
      description: |
        Un refus sans donnees : la garde de role, un etablissement desactive, un
        compte sans etablissement (`reason: no_institution`), ou un refus de
        KLASSCI relaye avec le message de son catalogue.
      additionalProperties: false
      required:
        - success
        - message
      properties:
        success:
          type: boolean
          enum:
            - false
        message:
          type: string
        reason:
          type: string
          enum:
            - no_institution
            - enrolment_not_active

    TableauDeBordEleve:
      description: |
        Le tableau de bord de l'eleve, selon la source de son etablissement : la
        charge KLASSCI relayee telle quelle, ou la charge locale, marquee
        `meta.source: lms_local`. La marque departage les deux formes.
      oneOf:
        - $ref: '#/components/schemas/TableauDeBordEleveKlassci'
        - $ref: '#/components/schemas/TableauDeBordEleveLocal'

    TableauDeBordEleveKlassci:
      type: object
      description: |
        Ecole en mode KLASSCI : la charge de `me/dashboard`, relayee telle quelle ;
        ses cles ne sont pas fermees ici. Elle ne porte pas `meta` : la propriete
        n'admet qu'un objet vide, ce qui refuse la marque locale.
      required:
        - success
      properties:
        success:
          type: boolean
        data:
          type: object
        meta:
          type: object
          description: "Absent de la charge KLASSCI."
          additionalProperties: false

    TableauDeBordEleveLocal:
      type: object
      description: "Ecole en mode autonome : la meme forme, lue en local, fermee. Les identifiants sont LOCAUX."
      additionalProperties: false
      required:
        - success
        - data
        - meta
      properties:
        success:
          type: boolean
          enum:
            - true
        data:
          type: object
          additionalProperties: false
          required:
            - classe
            - cours
            - quiz
            - notes
            - statistiques
          properties:
            classe:
              type: object
              nullable: true
              additionalProperties: false
              required:
                - id
                - name
                - libelle
                - code
                - filiere
                - niveau
              properties:
                id:
                  type: integer
                name:
                  type: string
                libelle:
                  type: string
                code:
                  type: string
                  nullable: true
                filiere:
                  type: object
                  nullable: true
                  description: "Toujours null : le LMS ne tient pas la filiere."
                niveau:
                  type: object
                  nullable: true
                  description: "Toujours null : le LMS ne tient pas le niveau."
            cours:
              type: array
              items:
                type: object
                additionalProperties: false
                required:
                  - id
                  - nom
                  - libelle
                properties:
                  id:
                    type: integer
                  nom:
                    type: string
                  libelle:
                    type: string
            quiz:
              type: array
              items:
                type: object
                additionalProperties: false
                required:
                  - id
                  - titre
                  - type
                  - date_evaluation
                properties:
                  id:
                    type: integer
                  titre:
                    type: string
                  type:
                    type: string
                    nullable: true
                  date_evaluation:
                    type: string
                    format: date-time
                    nullable: true
            notes:
              type: array
              items:
                type: object
                additionalProperties: false
                required:
                  - id
                  - evaluation
                  - matiere
                  - note
                properties:
                  id:
                    type: integer
                  evaluation:
                    type: object
                    additionalProperties: false
                    required:
                      - id
                      - titre
                    properties:
                      id:
                        type: integer
                      titre:
                        type: string
                  matiere:
                    type: object
                    additionalProperties: false
                    required:
                      - id
                      - name
                    properties:
                      id:
                        type: integer
                      name:
                        type: string
                  note:
                    type: number
            statistiques:
              type: object
              additionalProperties: false
              required:
                - moyenne_generale
                - taux_presence
              properties:
                moyenne_generale:
                  type: number
                  nullable: true
                taux_presence:
                  type: number
                  nullable: true
                  description: "Toujours null : non mesure en local, et non 0."
        meta:
          type: object
          additionalProperties: false
          required:
            - source
          properties:
            source:
              type: string
              enum:
                - lms_local

    TableauDeBordEnseignant:
      description: |
        Le tableau de bord de l'enseignant, selon la source de son etablissement :
        la charge KLASSCI relayee telle quelle, ou la charge locale, marquee
        `meta.source: lms_local`. La marque departage les deux formes.
      oneOf:
        - $ref: '#/components/schemas/TableauDeBordKlassci'
        - $ref: '#/components/schemas/TableauDeBordLocal'

    TableauDeBordKlassci:
      type: object
      description: |
        Ecole en mode KLASSCI : la charge de `me/teacher-dashboard`, relayee
        telle quelle ; ses cles ne sont pas fermees ici. Elle ne porte pas
        `meta` : la propriete n'admet qu'un objet vide, ce qui refuse la marque
        locale (OpenAPI 3.0 n'a pas d'autre facon de dire « absent » ici).
      required:
        - success
        - data
      properties:
        success:
          type: boolean
          enum:
            - true
        data:
          type: object
          required:
            - matieres
            - classes
            - prochaines_seances
            - statistiques
          properties:
            matieres:
              type: array
              items:
                type: object
            classes:
              type: array
              items:
                type: object
            evaluations:
              type: array
              items:
                type: object
            prochaines_seances:
              type: array
              items:
                type: object
            statistiques:
              type: object
              properties:
                heures:
                  type: object
                  properties:
                    total_seances:
                      type: integer
                      minimum: 0
                    seances_effectuees:
                      type: integer
                      minimum: 0
                evaluations:
                  type: object
        meta:
          type: object
          description: "Absent de la charge KLASSCI."
          additionalProperties: false

    TableauDeBordLocal:
      type: object
      description: |
        Ecole en mode autonome : la meme forme, lue en local, fermee. Les
        identifiants de `data` sont LOCAUX. Pas d'`evaluations` : non mesure, et
        non vide.
      additionalProperties: false
      required:
        - success
        - data
        - meta
      properties:
        success:
          type: boolean
          enum:
            - true
        data:
          type: object
          additionalProperties: false
          required:
            - matieres
            - classes
            - prochaines_seances
            - statistiques
          properties:
            matieres:
              type: array
              items:
                $ref: '#/components/schemas/MesMatieresCarte'
            classes:
              type: array
              items:
                $ref: '#/components/schemas/MesClassesCarte'
            prochaines_seances:
              type: array
              items:
                $ref: '#/components/schemas/SeanceCalendrier'
            statistiques:
              type: object
              additionalProperties: false
              required:
                - heures
              properties:
                heures:
                  type: object
                  additionalProperties: false
                  required:
                    - total_seances
                    - seances_effectuees
                    - fin_estimee
                  properties:
                    total_seances:
                      type: integer
                      minimum: 0
                      description: "Toutes les seances actives et datees de l'enseignant dans l'etablissement, SANS fenetre de dates (passees et a venir)."
                    seances_effectuees:
                      type: integer
                      minimum: 0
                    fin_estimee:
                      type: boolean
                      description: "`true` : une seance est effectuee apres sa fin ESTIMEE (deux heures apres son debut)."
        meta:
          type: object
          additionalProperties: false
          required:
            - source
          properties:
            source:
              type: string
              enum:
                - lms_local

    ProgrammationDesEvaluations:
      description: |
        La programmation des evaluations du porteur, selon la source de son
        etablissement : la charge KLASSCI relayee telle quelle, ou la liste locale,
        vide et marquee `meta.source: lms_local`. La marque departage les deux formes.
      oneOf:
        - $ref: '#/components/schemas/ProgrammationKlassci'
        - $ref: '#/components/schemas/ProgrammationLocale'

    ProgrammationKlassci:
      type: object
      description: |
        Ecole en mode KLASSCI : la charge de KLASSCI, relayee telle quelle ; ses
        cles ne sont pas fermees ici. Elle ne porte pas `meta` : la propriete
        n'admet qu'un objet vide, ce qui refuse la marque locale.
      properties:
        success:
          type: boolean
        data:
          type: array
          items:
            type: object
        meta:
          type: object
          description: "Absent de la charge KLASSCI."
          additionalProperties: false

    ProgrammationLocale:
      type: object
      description: |
        Ecole en mode autonome : il n y a pas de programmation KLASSCI. La liste
        est VIDE, sans 401 ni appel a KLASSCI.
      additionalProperties: false
      required:
        - success
        - data
        - meta
      properties:
        success:
          type: boolean
          enum:
            - true
        data:
          type: array
          description: "Toujours vide."
          items:
            type: object
        meta:
          type: object
          additionalProperties: false
          required:
            - source
          properties:
            source:
              type: string
              enum:
                - lms_local

    KlassciIndisponible:
      type: object
      description: |
        KLASSCI ne peut pas rendre la donnee pour l'instant : panne, circuit
        ouvert, reponse illisible, ou bloc attendu absent. Rendu avec l'en-tete
        `Retry-After` ; le client reessaie apres ce delai. Le client classe
        cette panne par `reason`, jamais par l'en-tete : `Retry-After` ne porte
        que le delai (frontend_lms#426).
      additionalProperties: false
      required:
        - success
        - message
        - reason
      properties:
        success:
          type: boolean
          enum:
            - false
        message:
          type: string
        reason:
          type: string
          enum:
            - klassci_unavailable

    # Les refus de la porte locale des classes (lot D).
    ClasseLocaleRefus:
      type: object
      additionalProperties: false
      required:
        - success
        - message
      properties:
        success:
          type: boolean
          enum:
            - false
        message:
          type: string
        reason:
          type: string
          description: |
            Present sur le 409 seulement : `classe_local_only` (la classe a ete
            creee dans le LMS), ou `enrolment_not_active` (inscription non active,
            #1095).
          enum:
            - classe_local_only
            - enrolment_not_active

    # Les classes de l'enseignant et la fiche d'une classe (lot 2).
    MesClassesListe:
      type: object
      additionalProperties: false
      required:
        - success
        - data
      properties:
        success:
          type: boolean
          enum:
            - true
        data:
          type: array
          items:
            $ref: '#/components/schemas/MesClassesCarte'

    MesClassesCarte:
      type: object
      description: |
        Une classe de l appelant (`TeacherClassCard.vue`). `id` mene a la fiche
        par `/lms/classes/{classeId}` : identifiant KLASSCI dans une ecole creee
        depuis KLASSCI, identifiant local dans une ecole creee depuis le LMS.
      additionalProperties: false
      required:
        - id
        - libelle
        - code
        - effectif
        - effectif_actuel
      properties:
        id:
          type: integer
        libelle:
          type: string
          nullable: true
        code:
          type: string
          nullable: true
        effectif:
          type: integer
          nullable: true
          description: |
            L effectif tenu par KLASSCI, quand la classe est miroitee. Toujours
            `null` dans une ecole creee depuis le LMS : la colonne n y est pas
            tenue, et un 0 serait une fausse mesure.
        effectif_actuel:
          type: integer
          nullable: true
          description: "Les inscriptions actives ; `null` quand la classe n est pas miroitee."

    FicheClasse:
      type: object
      additionalProperties: false
      required:
        - success
        - data
      properties:
        success:
          type: boolean
          enum:
            - true
        data:
          type: object
          additionalProperties: false
          required:
            - classe
            - etudiants
            - matieres_disponibles
            - emploi_temps_semaine
            - evaluations_programmees
            - statistiques
          properties:
            classe:
              type: object
              description: |
                La classe. L en-tete lit `id`, `name` (ou `libelle`, `nom`),
                `code`, `filiere.nom` et `niveau.nom`. Ouvert : la source KLASSCI
                relaie la classe telle que KLASSCI la decrit. Dans une ecole creee
                depuis le LMS, `filiere` et `niveau` valent `null`.
            etudiants:
              type: array
              description: |
                Les eleves actifs, pour le personnel seulement : `[]` pour un
                eleve, et pour tout role qui n est pas du personnel.
              items:
                type: object
            matieres_disponibles:
              type: array
              description: |
                Le programme de la classe. Dans une ecole creee depuis le LMS :
                `id`, `nom`, `code`, `coefficient` (celui de la MATIERE),
                `coefficient_classe` (#1653 : celui que la classe lui donne, nul
                quand celui de la matiere s applique) et `enseignants` (le formateur
                designe, 0 ou 1, `{id, nom}`).
              items:
                type: object
            emploi_temps_semaine:
              type: array
              description: "Toujours `[]` dans une ecole creee depuis le LMS : l emploi du temps est une notion KLASSCI."
              items:
                type: object
            evaluations_programmees:
              type: array
              description: |
                Ecole creee depuis le LMS (D72, E4c) : les evaluations de la classe,
                selon l appelant (l eleve sa liste, l enseignant les siennes brouillons
                compris, la gestion toutes). Chaque element porte `id` (l id LMS, que
                la fiche ouvre), `lms_id`, `duree_minutes`, `matiere {id, nom}`,
                `programmation.window`, `has_online: true`, `online_version.id` et
                `source: lms_local` ; la copie de l eleve est masquee si les resultats
                sont caches (C25).
              items:
                type: object
            statistiques:
              type: object
              additionalProperties: false
              required:
                - nombre_etudiants
                - nombre_seances_semaine
                - nombre_evaluations_programmees
                - nombre_matieres
                - capacite_classe
                - taux_remplissage
              description: |
                Un bloc que la source ne livre pas vaut `null`, jamais 0. Dans
                une ecole creee depuis le LMS, `nombre_seances_semaine`,
                `capacite_classe` et `taux_remplissage` valent `null`.
              properties:
                nombre_etudiants:
                  type: integer
                nombre_seances_semaine:
                  type: integer
                  nullable: true
                nombre_evaluations_programmees:
                  type: integer
                  description: "Le nombre d elements de `evaluations_programmees`."
                nombre_matieres:
                  type: integer
                  nullable: true
                capacite_classe:
                  type: integer
                  nullable: true
                  description: |
                    Le nombre de places tel que KLASSCI le donne (`nombre_places`),
                    ou `null`. Ecart connu : la source KLASSCI relaie la valeur sans
                    la normaliser ; une chaine numerique ressortirait telle quelle.
                taux_remplissage:
                  type: number
                  nullable: true

    # Les classes de l'etablissement, pour la gestion (lot 3a).
    ClassesEtablissement:
      type: object
      required:
        - success
        - data
      properties:
        success:
          type: boolean
          enum:
            - true
        data:
          type: array
          items:
            $ref: '#/components/schemas/ClasseEtablissement'

    ClasseEtablissement:
      type: object
      description: |
        Ecole creee depuis KLASSCI : la classe telle que KLASSCI la decrit
        (schema ouvert, types variables : seuls ceux que KLASSCI tient sont
        fixes). Ecole creee depuis le LMS : exactement les cles ci-dessous.
      required:
        - id
      properties:
        id:
          description: "Entier. KLASSCI l'envoie parfois en chaine numerique ; le LMS, toujours en entier."
          oneOf:
            - type: integer
            - type: string
        name:
          type: string
        libelle:
          type: string
          nullable: true
          description: "Ecole creee depuis KLASSCI : souvent `null`, le libelle vit dans `name`."
        code:
          type: string
          nullable: true
        filiere:
          description: |
            Ecole creee depuis KLASSCI : un objet ou un identifiant. Toujours
            `null` dans une ecole creee depuis le LMS, ou basculee : aucune
            filiere n'est lue en local.
          nullable: true
          oneOf:
            - type: object
            - type: integer
            - type: string
        niveau:
          description: |
            Ecole creee depuis KLASSCI : un objet ou un identifiant. Toujours
            `null` dans une ecole creee depuis le LMS, ou basculee : aucun
            niveau n'est lu en local.
          nullable: true
          oneOf:
            - type: object
            - type: integer
            - type: string
        is_active:
          type: boolean
          nullable: true
          description: |
            Ecole creee depuis le LMS : vrai si la Periode de la classe est
            publiee et pas terminee ; faux pour toute autre Periode ; `null`
            sans Periode, ou quand la Periode est supprimee (etat inconnu).
        periode:
          type: object
          nullable: true
          additionalProperties: false
          required: [id, libelle]
          description: |
            #1785. Ecole creee depuis le LMS : la Periode de la classe, `null`
            sans Periode ou quand elle est supprimee. Ecole creee depuis
            KLASSCI : absente (la reponse de KLASSCI est relayee telle quelle).
          properties:
            id:
              type: integer
            libelle:
              type: string
              nullable: true
        places_occupees:
          type: integer
          description: "Ecole creee depuis le LMS : les inscriptions actives d'eleves de l'etablissement."
        places_totales:
          type: integer
          nullable: true
          description: "Toujours `null` dans une ecole creee depuis le LMS : aucune capacite n'est tenue."
        nb_matieres:
          type: integer
          description: "Ecole creee depuis le LMS : le programme de la classe, en matieres de l'etablissement."

    # La structure, les matieres et l'administration des matieres (lot 3c).
    StructureEtablissement:
      type: object
      description: |
        Ecole creee depuis KLASSCI : la reponse de KLASSCI (schema ouvert).
        Ecole creee depuis le LMS : `{filieres: [], niveaux_etudes: []}`.
      required:
        - success
        - data
      properties:
        success:
          type: boolean
          enum:
            - true
        data:
          type: object
          properties:
            filieres:
              type: array
              items:
                type: object
            niveaux_etudes:
              type: array
              items:
                type: object

    MatieresEtablissement:
      type: object
      required:
        - success
        - data
      properties:
        success:
          type: boolean
          enum:
            - true
        data:
          type: array
          items:
            $ref: '#/components/schemas/MatiereEtablissement'

    MatiereEtablissement:
      type: object
      description: |
        Ecole creee depuis KLASSCI : la matiere telle que KLASSCI la decrit
        (schema ouvert, types non garantis). Ecole creee depuis le LMS :
        exactement les cles ci-dessous. Ce sont les tests de la source qui
        fixent cette exactitude : le schema reste ouvert, puisqu'il decrit
        aussi la forme de KLASSCI.
      required:
        - id
      properties:
        source:
          type: string
          enum:
            - lms_local
          description: |
            Ecole creee depuis le LMS : `lms_local`, sur chaque carte. Ses ids sont
            LOCAUX, a envoyer tels quels (`classe_id`, `matiere_id`). Ecole creee
            depuis KLASSCI : cle absente. Aucun mode d'ecole n'est expose.
        id:
          description: "Ecole creee depuis le LMS : l'identifiant LOCAL, un entier."
          oneOf:
            - type: integer
            - type: string
        nom:
          type: string
          nullable: true
        code:
          type: string
          nullable: true
        description:
          type: string
          nullable: true
        coefficient:
          description: "Ecole creee depuis le LMS : un nombre. Ecole creee depuis KLASSCI : tel que KLASSCI le rend, parfois en chaine."
          nullable: true
          oneOf:
            - type: number
            - type: string
        classes:
          type: array
          description: "Ecole creee depuis le LMS : les classes ou l'appelant atteint la matiere, triees par libelle puis par identifiant."
          items:
            type: object
            properties:
              id:
                oneOf:
                  - type: integer
                  - type: string
              nom:
                type: string
                nullable: true

    MatieresAdministration:
      type: object
      required:
        - success
        - data
      properties:
        success:
          type: boolean
          enum:
