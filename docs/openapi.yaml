  /lms/seances/local/{seanceId}:
    delete:
      tags:
        - Visio
      operationId: deleteLocalSeance
      summary: "Supprimer une seance designee par son id local"
      description: |
        #1154, ADR-1154-01 (etape A de la pile ADR-760-01). La porte de l'espace
        LOCAL : la seance est designee par son id local, et seulement par lui,
        dans l'etablissement du compte, quel que soit son mode. Un identifiant
        qui n'est qu'un `klassci_seance_id` ne designe rien.

        La porte historique `DELETE /lms/seances/{seanceId}` recoit, dans une
        ecole KLASSCI, l'id KLASSCI ou l'id local, et tranche par l'id local
        d'abord (#933). Cette porte donne a l'historique un espace unique.

        Memes regles que la porte historique : le personnel ; un enseignant, sur
        une seance dont il est l'auteur. Suppression douce (`deleted_at`).
      security:
        - sanctum: []
      parameters:
        - name: seanceId
          in: path
          required: true
          description: "Identifiant LOCAL de la seance (`seances.id`)."
          schema:
            type: integer
            minimum: 1
      responses:
        '200':
          description: "Seance supprimee"
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  message:
                    type: string
        '400':
          $ref: '#/components/responses/EtablissementInconnu'
        '401':
          description: "Non authentifie"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: "Role hors du personnel, enseignant qui n'est pas l'auteur, ou seance que cette porte ne designe pas (absente, ou d'un autre etablissement), comme la porte historique. Aussi : etablissement desactive."
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: "Visio en cours : la seance ne se supprime pas."
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /lms/seances/upcoming:
    get:
      tags:
        - Visio
      operationId: listUpcomingSeances
      summary: "Les seances a venir de l'utilisateur"
      description: |
        Les ecrans Seances et Visio, et le calendrier de la gestion. Sans garde
        de role. La source est choisie par le mode DECLARE de l'ecole, au point
        de liaison.

        **Ecole creee depuis KLASSCI.** Le jeton KLASSCI PERSONNEL est exige
        (sinon 401 `klassci_token_missing`). La gestion lit les seances miroirs
        du LMS, avec les ids KLASSCI ; les autres roles, l'emploi du temps
        KLASSCI de leurs matieres.

        **Ecole creee depuis le LMS**, ou basculee. Les seances locales, avec
        les ids LOCAUX, sans jeton et sans aucun appel a KLASSCI. La gestion lit
        toutes les seances de l'ecole ; un enseignant les siennes (son compte en
        est l'auteur) ; un eleve, et tout role non reconnu, celles de ses classes
        a inscription active, moins celles qu'il a masquees. Une seance sans
        classe n'est montree a aucun eleve.

        Dans les deux ecoles : seances actives, du jour a `days` jours, triees
        par date. `teacher_id` ne filtre que pour la gestion (l'auteur, en ecole
        creee depuis le LMS) ; `classe_id` filtre pour tous, dans ce qu'ils
        voient deja.
      security:
        - sanctum: []
      parameters:
        - name: days
          in: query
          schema:
            type: integer
            default: 30
        - name: teacher_id
          in: query
          schema:
            type: integer
        - name: classe_id
          in: query
          schema:
            type: integer
        - name: type
          in: query
          required: false
          description: "#1668 : ne garder que les seances de ce type (liste fermee) ; une seance sans type n'y passe jamais. Hors de la liste : 422."
          schema:
            type: string
            enum: [cm, td, tp, projet, travail_personnel, examen]
      responses:
        '200':
          description: "Les seances, et la fenetre lue"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SeancesAVenir'
        '400':
          $ref: '#/components/responses/EtablissementInconnu'
        '401':
          $ref: '#/components/responses/KlassciUnauthorized'
        '403':
          description: "Etablissement desactive, compte sans etablissement (`no_institution`), ou refus de KLASSCI relaye."
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RefusClasseEleves'
        '422':
          description: "`type` hors de la liste fermee (#1668)."
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationFailed'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          description: "Defaillance interne, rapportee une fois au journal, sans le message ni les valeurs d'une requete."
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VisioErreurInterne'
        '503':
          description: "Ecole creee depuis KLASSCI : KLASSCI indisponible."
          headers:
            Retry-After:
              schema:
                type: integer
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KlassciIndisponible'

  /lms/seances/my-teaching:
    get:
      tags:
