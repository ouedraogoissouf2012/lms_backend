  /proxy/me/dashboard:
    get:
      tags:
        - Proxy / KLASSCI
      operationId: studentDashboard
      summary: "Le tableau de bord de l'eleve"
      description: |
        La source est choisie par le mode DECLARE de l'ecole, au point de
        liaison, jamais par le client.

        **Ecole en mode KLASSCI.** La reponse de `me/dashboard`, relayee telle
        quelle avec le jeton KLASSCI du compte. Sans ce jeton : 401
        `klassci_token_missing`. Une panne ou un circuit ouvert rendent le 503
        avec `Retry-After` ; un refus de KLASSCI est relaye. La charge ne porte
        pas `meta`.

        **Ecole en mode autonome.** La meme forme, lue en local, sans jeton ni
        appel KLASSCI, avec les identifiants LOCAUX, marquee
        `meta.source: lms_local` :
        - `classe` : sa classe a inscription active, dans son etablissement (la
          plus ancienne inscription s'il en a plusieurs) ; `filiere` et
          `niveau` valent `null` ;
        - `cours` : les matieres au programme de ses classes actives ;
        - `quiz` : les evaluations qu'il voit, l'audience de sa liste ;
        - `notes` : ses notes finales visibles, la plus recente d'abord ; une
          note aux resultats caches n'y figure pas ;
        - `statistiques.moyenne_generale` : `null` sans note ;
          `statistiques.taux_presence` : `null`, non mesure.
        Toutes ses inscriptions inactives : 409 `enrolment_not_active`. Aucune
        inscription : un tableau vide, `classe` a `null`.
      security:
        - sanctum: []
      responses:
        '200':
          description: "Le tableau de bord de l'eleve"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TableauDeBordEleve'
        '400':
          $ref: '#/components/responses/EtablissementInconnu'
        '401':
          description: |
            Jeton porteur absent ou invalide (sans `reason`). Ecole en mode
            KLASSCI : compte sans jeton KLASSCI (`reason: klassci_token_missing`),
            ou session refusee par KLASSCI (`reason: klassci_session_expired`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RefusKlassci'
        '403':
          $ref: '#/components/responses/EtablissementDesactive'
        '409':
          description: "Ecole en mode autonome : toutes les inscriptions de l'eleve sont inactives (`enrolment_not_active`)."
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RefusMotive'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          description: "Defaillance interne : « Service indisponible. Veuillez reessayer. »"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VisioErreurInterne'
        '503':
          description: "Ecole en mode KLASSCI : KLASSCI indisponible (panne, circuit ouvert, configuration absente)."
          headers:
            Retry-After:
              schema:
                type: integer
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KlassciIndisponible'

