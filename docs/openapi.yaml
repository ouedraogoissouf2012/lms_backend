  # ============ CYCLE EVALUATION (#892) ============
  # Chaque code et chaque cle ci-dessous a ete MESURE par appel reel de la
  # route (app.debug=false, comme en production). Les references au code
  # sont dans la PR qui a ecrit ce bloc.

  /evaluations/student:
    get:
      tags:
        - Evaluations
      operationId: listMyEvaluations
      summary: "Evaluations publiees de la classe de l eleve"
      description: |
        La classe est lue sur KLASSCI (`me/dashboard`). Ne remonte que les
        evaluations publiees, de statut `planifiee`, `en_cours` ou `terminee`,
        ayant au moins une question — triees par date decroissante.

        Chaque element est l evaluation enrichie : `questions_count`, la
        derniere copie de l eleve (`student_submission`), et, relayes depuis
        KLASSCI sans garantie de forme, `programmation`, `lms_integration`,
        `classe`, `matiere`. Les questions et les copies des autres eleves ne
        sont PAS chargees.

        Une erreur 4xx renvoyee par KLASSCI est relayee avec SON statut, et un
        message generique.
      security:
        - sanctum: []
      responses:
        '200':
          description: "Liste (eventuellement vide)"
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: array
                    items:
                      allOf:
                        - $ref: '#/components/schemas/EvaluationRecord'
                        - type: object
                          properties:
                            questions_count:
                              type: integer
                            student_submission:
                              $ref: '#/components/schemas/EvaluationSubmissionRecord'
                            programmation:
                              type: object
                              nullable: true
                              additionalProperties: true
                            lms_integration:
                              nullable: true
                            classe:
                              nullable: true
                              description: "Relaye depuis KLASSCI, forme non garantie par le LMS."
                            matiere:
                              nullable: true
                              description: "Relaye depuis KLASSCI, forme non garantie par le LMS."
        '401':
          description: |
            Non authentifie, compte sans identifiant KLASSCI synchronise, ou
            sans jeton KLASSCI.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageOnly'
        '404':
          description: "KLASSCI ne rattache l eleve a aucune classe (« Classe non trouvee »)"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageOnly'
        '503':
          description: "KLASSCI indisponible (en-tete `Retry-After`)"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageOnly'
        '500':
          description: "Erreur interne"
          content:
