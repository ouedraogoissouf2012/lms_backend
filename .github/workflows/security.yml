name: Security Audit

# CI security pipeline: dependency checks, PHPStan, Semgrep, docs/tests and guards.

on:
  pull_request:
    branches:
      - lms
  push:
    branches:
      - lms

permissions:
  contents: read
  pull-requests: read  # required by dependency-review-action

jobs:
  composer-audit:
    name: Composer Audit (CVE scan)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP 8.3
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          coverage: none
          tools: composer:v2

      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: vendor
          key: composer-${{ hashFiles('composer.lock') }}
          restore-keys: composer-

      - name: Install production dependencies
        run: composer install --no-interaction --no-progress --prefer-dist --no-dev --no-scripts

      - name: Run composer audit (fail on HIGH/CRITICAL CVE)
        run: composer audit --abandoned=ignore --no-interaction

      - name: List outdated production packages (informational only)
        if: always()
        continue-on-error: true
        run: composer outdated --direct --no-interaction

  dependency-review:
    name: Dependency Review (PR-level diff)
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Dependency Review
        uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high
          comment-summary-in-pr: on-failure

  phpstan-analysis:
    name: PHPStan / Larastan (level 9 + baseline)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP 8.3
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          coverage: none
          tools: composer:v2

      - name: Cache Composer dependencies (with dev)
        uses: actions/cache@v4
        with:
          path: vendor
          key: composer-phpstan-${{ hashFiles('composer.lock') }}
          restore-keys: composer-phpstan-

      - name: Install dependencies (including dev)
        run: composer install --no-interaction --no-progress --prefer-dist --no-scripts

      - name: Cache PHPStan result cache
        uses: actions/cache@v4
        with:
          path: storage/framework/cache/phpstan
          key: phpstan-${{ hashFiles('**/*.php', 'phpstan.neon.dist', 'phpstan-baseline.neon') }}
          restore-keys: phpstan-

      - name: Run PHPStan / Larastan
        run: vendor/bin/phpstan analyse --memory-limit=2G --no-progress

      - name: Check PHPStan baseline ratchet
        run: php scripts/check-phpstan-baseline.php --max=443

  semgrep-sast:
    name: Semgrep SAST (OWASP + default)
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'

    container:
      image: semgrep/semgrep

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Semgrep scan (block on ERROR severity)
        run: semgrep scan --config p/default --config p/owasp-top-ten --severity ERROR --error

      - name: Semgrep scan (informational, WARNING/INFO)
        if: always()
        continue-on-error: true
        run: semgrep scan --config p/default --config p/owasp-top-ten --severity WARNING --severity INFO

  docs-sync:
    name: Docs Sync (OpenAPI ↔ code)
    runs-on: ubuntu-latest

    env:
      APP_ENV: testing

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Generate ephemeral APP_KEY
        run: echo "APP_KEY=base64:$(openssl rand -base64 32)" >> "$GITHUB_ENV"

      - name: Setup PHP 8.3
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          coverage: none
          tools: composer:v2

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install PyYAML
        run: pip install pyyaml

      - name: Install PHP dependencies
        run: composer install --no-interaction --no-progress --prefer-dist --no-scripts

      - name: Prepare sqlite test database
        run: mkdir -p database && touch database/database.testing.sqlite

      - name: OpenAPI ↔ routes sync test
        run: vendor/bin/phpunit --filter OpenApiSyncTest

      - name: OpenAPI spec validation (JSON output)
        run: python scripts/openapi-validator.py docs/openapi.yaml --json

  commitlint:
    name: Commit messages (conventional)
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate commit messages
        uses: wagoid/commitlint-github-action@v6
        with:
          configFile: .commitlintrc.json

  sdk-generation:
    name: SDK Generation (smoke test)
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Setup Java (required by openapi-generator)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Generate TypeScript SDK from spec
        run: |
          npx --yes @openapitools/openapi-generator-cli@2.13.4 generate \
            -i docs/openapi.yaml \
            -g typescript-fetch \
            -o sdk-smoke-ts

      - name: Verify SDK artifacts were produced
        run: |
          if [ ! -f sdk-smoke-ts/runtime.ts ]; then
            echo "❌ La génération SDK n'a produit aucun artefact — spec invalide ?"
            exit 1
          fi
          echo "✅ SDK TypeScript généré ($(find sdk-smoke-ts -name '*.ts' | wc -l) fichiers .ts)"

  tests:
    name: Tests (PHPUnit — ${{ matrix.db }} / ${{ matrix.cache }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      # Matrice volontairement NON cartésienne (`include:` seul → exactement 3 jambes).
      # Les deux dimensions sont orthogonales : le moteur SQL ne change rien au store de
      # cache, et réciproquement — une 4e jambe (mysql+redis) coûterait une exécution
      # complète pour zéro signal supplémentaire.
      #   sqlite / database → parité poste de dev (procédure locale documentée, inchangée)
      #   sqlite / redis    → runtime Redis (#374), couverture conservée à l'identique
      #   mysql  / database → parité PRODUCTION (#574) : moteur réel ET cache/session/queue
      #                       en base, comme GUIDE_DEPLOIEMENT_PRODUCTION.md:95-96
      matrix:
        include:
          - db: sqlite
            cache: database
            db_database: database/database.testing.sqlite
          - db: sqlite
            cache: redis
            db_database: database/database.testing.sqlite
          - db: mysql
            cache: database
            db_database: lms_testing

    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

      # #574 — la prod tourne sur MySQL (GUIDE_DEPLOIEMENT_PRODUCTION.md:73) alors que la
      # suite ne tournait que sur SQLite : toute la suite verte n'attestait rien du moteur
      # qui sert les utilisateurs.
      #
      # Version ÉPINGLÉE, jamais le tag flottant `mysql:8` : le moteur de référence d'un
      # projet à 10 ans ne doit pas changer sans commit. 8.4 est la branche LTS ; sur les
      # divergences visées ici elle est identique à 8.0, car Laravel impose le même
      # sql_mode dès 8.0.11 (MySqlConnector.php:147-149).
      #
      # GitHub Actions ne sait pas conditionner un service : ce conteneur démarre aussi
      # sur les jambes SQLite qui n'en ont pas l'usage. C'est le compromis déjà en place
      # pour `redis` sur la jambe `database` — les jambes tournant en parallèle, le chemin
      # critique reste la jambe MySQL, donc le portail n'est pas rallongé pour autant.
      mysql:
        image: mysql:8.4
        ports:
          - 3306:3306
        env:
          # Aucun identifiant d'administration en clair (PRODUCTION_STANDARDS.md §1.2) :
          # le mot de passe root est aléatoire et n'est jamais utilisé. L'application se
          # connecte avec un utilisateur DÉDIÉ non-root, comme en production
          # (GUIDE_DEPLOIEMENT_PRODUCTION.md:77 « jamais root ») — ce qui vérifie au
          # passage que les migrations n'exigent aucun privilège d'administration.
          MYSQL_RANDOM_ROOT_PASSWORD: "yes"
          MYSQL_DATABASE: lms_testing
          MYSQL_USER: lms_test
          # Pas un secret : cette valeur doit être connue à la fois du service et de
          # l'application, dans un conteneur éphémère joignable depuis ce seul job.
          MYSQL_PASSWORD: lms_test
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 --silent"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
          --health-start-period 30s

    env:
      APP_ENV: testing

      # Moteur et stores pilotés par la MATRICE, pas par phpunit.xml.
      # phpunit.xml:48-53 déclare ses <env> sans force="true" ; PHPUnit ne surcharge alors
      # jamais une variable déjà exportée (PhpHandler.php:112-119 : `if ($force ||
      # getenv($name) === false)`). Les valeurs ci-dessous gagnent donc — c'est déjà le
      # mécanisme dont vivait la jambe redis depuis #374.
      # ⚠️ Ne PAS « corriger » phpunit.xml en y ajoutant force="true" : cela rendrait cette
      # matrice inopérante. Idem pour un .env.testing versionné (Laravel charge
      # .env.{APP_ENV} en priorité et écraserait ce bloc).
      DB_CONNECTION: ${{ matrix.db }}
      DB_DATABASE: ${{ matrix.db_database }}
      # Inertes sur les jambes sqlite : le bloc `sqlite` de config/database.php:34-44 ne
      # lit ni host, ni port, ni identifiants.
      DB_HOST: 127.0.0.1
      DB_PORT: "3306"
      DB_USERNAME: lms_test
      DB_PASSWORD: lms_test
      CACHE_STORE: ${{ matrix.cache }}
      SESSION_DRIVER: ${{ matrix.cache }}
      QUEUE_CONNECTION: ${{ matrix.cache }}
      REDIS_HOST: 127.0.0.1
      REDIS_PORT: "6379"

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Generate ephemeral APP_KEY
        run: echo "APP_KEY=base64:$(openssl rand -base64 32)" >> "$GITHUB_ENV"

      - name: Setup PHP 8.3
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          coverage: none
          tools: composer:v2
          # pdo_mysql n'est pas garanti par le jeu d'extensions par défaut de setup-php ;
          # config/database.php:61 le teste d'ailleurs déjà via extension_loaded().
          extensions: ":imagick, redis, pdo_mysql"

      - name: Install dependencies (including dev)
        run: composer install --no-interaction --no-progress --prefer-dist --no-scripts

      - name: Prepare sqlite test database
        if: matrix.db == 'sqlite'
        run: mkdir -p database && touch database/database.testing.sqlite

      - name: Wait for Redis (jambe redis)
        if: matrix.cache == 'redis'
        run: |
          for i in $(seq 1 30); do
            if (exec 3<>/dev/tcp/127.0.0.1/6379) 2>/dev/null; then
              echo "Redis disponible."
              exit 0
            fi
            sleep 1
          done
          echo "Redis indisponible après 30s" && exit 1

      # Le healthcheck du conteneur ne prouve que « le serveur répond ». On exige ici une
      # preuve APPLICATIVE : une connexion PDO avec les identifiants de l'application, sur
      # la base attendue — l'utilisateur et le schéma sont créés APRÈS le démarrage du
      # serveur, un port ouvert ne suffit donc pas.
      # L'étape consigne aussi l'identité du moteur réellement testé : la preuve de ce qui
      # a été validé doit être dans le log du run (critère de fermeture #574).
      # NB : @@GLOBAL.sql_mode est le mode du SERVEUR. Le mode réellement appliqué est
      # celui que Laravel impose par session via config/database.php:59 ('strict' => true)
      # → ONLY_FULL_GROUP_BY,STRICT_TRANS_TABLES,… (MySqlConnector.php:147-149), donc
      # identique à la production quelle que soit la configuration du conteneur.
      - name: Wait for MySQL and record engine identity (jambe mysql)
        if: matrix.db == 'mysql'
        run: |
          php -r '
          $dsn = sprintf("mysql:host=%s;port=%s;dbname=%s", getenv("DB_HOST"), getenv("DB_PORT"), getenv("DB_DATABASE"));
          for ($attempt = 1; $attempt <= 60; $attempt++) {
              try {
                  $pdo = new PDO($dsn, getenv("DB_USERNAME"), getenv("DB_PASSWORD"));
                  $row = $pdo->query("SELECT VERSION() AS version, @@GLOBAL.sql_mode AS sql_mode")->fetch(PDO::FETCH_ASSOC);
                  echo "MySQL accessible avec les identifiants applicatifs (tentative {$attempt}).\n";
                  echo "  version           = {$row["version"]}\n";
                  echo "  sql_mode serveur  = {$row["sql_mode"]}\n";
                  exit(0);
              } catch (PDOException) {
                  sleep(1);
              }
          }
          fwrite(STDERR, "MySQL injoignable apres 60 tentatives.\n");
          exit(1);
          '

      # Garde-fou de schéma, volontairement redondant : RefreshDatabase relance de toute
      # façon migrate:fresh une fois par process (RefreshDatabase.php:83-90 et :119).
      # L'intérêt est durable, pas ponctuel : le jour où une migration écrite sous SQLite
      # sera invalide sous MySQL (index sur TEXT sans longueur, types de FK dépareillés,
      # ALTER ... MODIFY ENUM), l'échec apparaîtra comme UNE étape rouge nommée plutôt que
      # comme toute la suite en erreur dans un log illisible.
      # Honnêteté : au moment de #574, les 69 migrations ont été vérifiées vertes sur
      # mysql:8.4 (migrate:fresh, utilisateur non-root) — cette étape n'est donc pas là
      # pour rattraper une dette connue, mais pour protéger les migrations à venir.
      # Coût assumé : une passe de migrations supplémentaire, sur la seule jambe MySQL.
      - name: Run migrations on MySQL (garde-fou de schéma)
        if: matrix.db == 'mysql'
        run: php artisan migrate --force --no-interaction

      # Une seule étape, sans `if:` : tout l'environnement vient du bloc `env:` du job,
      # lui-même piloté par la matrice. Ajouter une jambe ne coûte désormais qu'une entrée
      # dans `include:`.
      - name: Run PHPUnit suite
        run: vendor/bin/phpunit --no-coverage

  file-size-guard:
    name: File size guard (app ≤300 / models ≤150)
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup PHP 8.3
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          coverage: none

      - name: Check changed app/ files size
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          git fetch --no-tags origin "$BASE_REF"
          files=$(git diff --name-only --diff-filter=ACMR "origin/$BASE_REF...HEAD" -- app)
          if [ -z "$files" ]; then
            echo "Aucun fichier app/ modifié — rien à contrôler."
            exit 0
          fi
          echo "Fichiers app/ modifiés :"
          echo "$files"
          php scripts/check-file-sizes.php $files

      - name: Check changed app/ method length
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          git fetch --no-tags origin "$BASE_REF"
          files=$(git diff --name-only --diff-filter=ACMR "origin/$BASE_REF...HEAD" -- app)
          if [ -z "$files" ]; then
            echo "Aucun fichier app/ modifié — rien à contrôler."
            exit 0
          fi
          php scripts/check-method-sizes.php $files

      - name: Ensure tests are tracked by default
        run: |
          if git check-ignore -q tests/.tracking-probe.php; then
            echo "tests/ est ignore : les nouveaux tests seraient invisibles en CI."
            exit 1
          fi
          echo "Politique tests OK : un nouveau test PHP est versionnable par defaut."
