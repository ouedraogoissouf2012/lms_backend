              type: string

    # Les rapports (POST /admin/reports/*, suivi et telechargement
    # asynchrones). Schemas SERRES, propres a ces routes.
    RapportPresencesInput:
      type: object
      properties:
        date_start:
          type: string
          format: date
          nullable: true
        date_end:
          type: string
          format: date
          nullable: true
        classe_id:
          type: integer
          nullable: true
          description: |
            Filtre les seances d une classe liee a KLASSCI. Pour une classe
            creee dans le LMS, le filtre est aujourd hui sans effet et le
            rapport couvre l etablissement.
        seance_id:
          type: integer
          nullable: true
          description: "Rapport d'UNE seance : toujours synchrone."
        format:
          type: string
          nullable: true
          description: |
            Lu seulement avec `seance_id`. Sans lui, le rapport de periode est
            toujours un PDF. `excel` et `xlsx` rendent tous deux un tableur au
            format Excel 97-2003 (`application/vnd.ms-excel`).
          enum:
            - pdf
            - excel
            - xlsx
            - null

    RapportNotesInput:
      type: object
