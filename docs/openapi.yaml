  # ============ LESSONS ============
  /lessons/my-courses:
    get:
      operationId: listMyCourses
      tags:
        - Lessons
      summary: "Lister les cours de l appelant, pagines"
      description: |
        La vue « Mes cours » (#938). La forme de cette reponse est le contrat
        (decision D1 du pilote my-courses) : `data` est un tableau PLAT, et la
        pagination se lit dans `meta`. Un client qui ne lit que `data` ne voit
        que la premiere page, 15 cours par defaut.

        Ce que l appelant voit, regle REELLE du code a ce jour :
        - un compte dont le role est reconnu comme apprenant (`etudiant`,
          `student`, `étudiant`, correspondance exacte) : les lecons PUBLIEES de
          SES classes (pivot local `classe_etudiant`, puis repli sur le cache
          KLASSCI `user_classes`) ; sans classe, `data` est vide ;
        - TOUT AUTRE compte, y compris un role non reconnu (`Etudiant`,
          `eleve`...) : toutes les lecons publiees de son etablissement. Ce
          repli ouvert est un defaut suivi par #941, qui donnera la vue
          apprenant a tout compte hors personnel reconnu ;
        - un compte sans etablissement : le supradmin plateforme voit tous les
          etablissements, par conception ; tout autre compte sans etablissement
          aussi, ce qui est un defaut suivi par #942.
        Meme forme dans une ecole reliee a KLASSCI et dans une ecole autonome.

        Ordre TOTAL : `order`, puis `created_at`, puis `id` (#937). Aucune page
        ne double ni ne perd une lecon.

        Au-dela de `last_page`, la reponse est 200 avec `data` vide, pas 404.

        401 : le corps reel est `{"success": false, "message": "Unauthenticated."}`
        (bootstrap/app.php:72-76), sans `error_code`. Il est donc decrit par
        `MessageOnly`, pas par `ErrorResponse`, qui exige un `error_code` que
        l API n emet jamais (ecart suivi par #919).
      security:
        - sanctum: []
      parameters:
        - name: page
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
        - name: per_page
          in: query
          required: false
          description: "Entre 1 et 100 ; absent vaut 15. Hors bornes ou non entier : 422 (spec #548)"
          schema:
            type: integer
            minimum: 1
            maximum: 100
        - name: matiere_id
          in: query
          required: false
          description: "matieres.id LOCAL"
          schema:
            type: integer
            minimum: 1
        - name: enseignant_id
          in: query
          required: false
          description: "users.id LOCAL de l auteur. Un identifiant KLASSCI ne ramene rien (#869)"
          schema:
            type: integer
            minimum: 1
      responses:
        '200':
          description: "Une page des cours de l appelant"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MyCoursesPage'
        '401':
          description: "Non authentifie (corps reel sans error_code, voir #919)"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageOnly'
        '422':
          description: "`page`, `per_page`, `matiere_id` ou `enseignant_id` hors bornes, ou non entier"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationFailed'

