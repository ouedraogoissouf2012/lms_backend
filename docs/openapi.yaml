openapi: 3.0.0
info:
  title: "LMS Backend API"
  description: |
    API complète pour la plateforme LMS - Learning Management System avec intégration KLASSCI.

    ## Rate limiting (#214)

    Les routes proxy KLASSCI sont limitées par utilisateur authentifié :
      - `GET /proxy/*` (lecture) : **100 requêtes / minute / utilisateur**.
      - écritures `/proxy/evaluations/{id}/notes`, `/proxy/cours/{id}/presences`,
        `/proxy/cours/{id}/statut` : **30 requêtes / minute / utilisateur**.

    Le rôle `supradmin` (gestionnaire plateforme) est exempté.

    Chaque réponse expose les en-têtes `X-RateLimit-Limit` et
    `X-RateLimit-Remaining`. Au dépassement, l'API répond `429 Too Many
    Requests` avec `Retry-After` (secondes) et `X-RateLimit-Reset`.

    Ces quatre en-têtes sont exposés par le CORS (`Access-Control-Expose-Headers`)
    à toute origine admise : un front servi depuis une autre origine que l'API
    peut les lire. `Retry-After` porte aussi le délai d'un 503 KLASSCI.
  version: "1.0.0"
  contact:
    name: "LMS Team"
    email: "support@lms.local"
  license:
    name: "MIT"

servers:
  - url: "http://localhost:8000/api"
    description: "Development Server"
  - url: "https://api.lms.local/api"
    description: "Production Server"

# Security Schemes
components:
  securitySchemes:
    sanctum:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: "Sanctum token authentication"

  responses:
    # Réponse standard de dépassement du rate limit (#214/#219).
    TooManyRequests:
      description: "Rate limit dépassé (voir en-têtes X-RateLimit-* et Retry-After)."
      headers:
        Retry-After:
          schema:
            type: integer
          description: "Secondes à attendre avant de réessayer."
        X-RateLimit-Limit:
          schema:
            type: integer
          description: "Quota maximum par minute."
        X-RateLimit-Remaining:
          schema:
            type: integer
          description: "Requêtes restantes dans la fenêtre courante."
      content:
        application/json:
          schema:
            type: object
            properties:
              success:
                type: boolean
                example: false
              message:
                type: string
                example: "Trop de requêtes. Veuillez réessayer plus tard."

    # #806 — un 401 d'une route adossee a KLASSCI a TROIS sens, que seul
    # `reason` distingue. CIBLE : le client decide sur `reason`, jamais sur le
    # message. Le front lit encore le message aujourd'hui (frontend_lms#420).
    KlassciUnauthorized:
      description: |
        Trois causes, distinguees par `reason` :
        - absent : jeton Sanctum invalide ou expire, session LMS morte ;
        - `klassci_token_missing` : ce compte n a aucun jeton KLASSCI, ou aucune
          identite KLASSCI (compte local, ecole autonome). Se reconnecter n y
          change rien ;
        - `klassci_session_expired` : KLASSCI refuse le jeton utilise. Selon la
          route, c est le jeton du compte, ou a defaut celui de l etablissement
          (`/proxy/structure`, `classes`, `enseignants`, `filieres`,
          `niveaux-etudes`). Se reconnecter ne renouvelle que le jeton du compte.
        Selon la route, l un des deux motifs KLASSCI peut ne jamais survenir.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/RefusKlassci'
          example:
            success: false
            message: "Aucun accès KLASSCI n'est enregistré pour ce compte : ces données, qui proviennent de KLASSCI, ne peuvent pas être affichées."
            reason: klassci_token_missing

  schemas:
    ProgramInput:
      type: object
      required:
        - titre
      properties:
        titre:
          type: string
          maxLength: 191
        description:
          type: string
          maxLength: 5000
          nullable: true

    ProgramCreated:
      type: object
      properties:
        success:
          type: boolean
        message:
          type: string
        data:
          type: object
          properties:
            id:
              type: integer
            titre:
              type: string
            version:
              type: integer

    MatiereInput:
      type: object
      required:
        - libelle
      properties:
        libelle:
          type: string
          maxLength: 191
        code:
          type: string
          maxLength: 50
          nullable: true
          description: |
            FACULTATIF, et volontairement SANS contrainte d unicite : mesure
            faite sur app/, aucun acces ne retrouve une matiere par son code.
            En poser une garderait un chemin qui n existe pas.
        description:
          type: string
          maxLength: 2000
          nullable: true
        coefficient:
          type: integer
          minimum: 1
          maximum: 20
          default: 1
        credit:
          type: integer
          minimum: 1
          maximum: 60
          default: 1

    MatiereCreated:
      type: object
      properties:
        success:
          type: boolean
        message:
          type: string
        data:
          type: object
          properties:
            id:
              type: integer
            libelle:
              type: string
            code:
              type: string
              nullable: true
            coefficient:
              type: integer
            credit:
              type: integer

    ClasseMatiereInput:
      type: object
      required:
        - matiere_id
      properties:
        matiere_id:
          type: integer
          minimum: 1
        enseignant_id:
          type: integer
          minimum: 1
          nullable: true
          description: |
            FACULTATIF : on compose souvent un programme avant de savoir qui
            l assurera. S il est nomme, il doit appartenir a l etablissement ET
            avoir le role enseignant.

    ClasseMatiereLinked:
      type: object
      properties:
        success:
          type: boolean
        message:
          type: string
        data:
          type: object
          properties:
            classe_id:
              type: integer
            matiere_id:
              type: integer
            enseignant_id:
              type: integer
              nullable: true

    # Ecole independante, lot 1 : « Mes matieres » et la page d une matiere.
    # La MEME route sert les deux volets ; seule la source change. Les cles
    # decrites sont celles que le front LIT (fichier cite pour chacune) ; les
    # objets restent ouverts la ou la source KLASSCI relaie sa propre charge.
    MesMatieresListe:
      type: object
      additionalProperties: false
      required:
        - success
        - data
      properties:
        success:
          type: boolean
          enum:
            - true
        data:
          type: array
          items:
            $ref: '#/components/schemas/MesMatieresCarte'

    MesMatieresCarte:
      type: object
      description: |
        Une matiere enseignee par l appelant (`MatiereCourseCard.vue`). Ouvert :
        la source KLASSCI relaie la matiere telle que KLASSCI la decrit.
      required:
        - id
        - statistiques
      properties:
        source:
          type: string
          enum:
            - lms_local
          description: |
            Ecole creee depuis le LMS : `lms_local`, sur chaque carte. Ses ids sont
            LOCAUX, a envoyer tels quels (`classe_id`, `matiere_id`). Ecole creee
            depuis KLASSCI : cle absente. Aucun mode d'ecole n'est expose.
        id:
          type: integer
          description: |
            Navigation vers la page de la matiere (useTeacherMatieres.js:37, qui
            lit `matiere_id` d abord). Requis : la source KLASSCI n ajoute ses
            compteurs qu a une matiere identifiee (`MyMatieresQueryService`).
        matiere_id:
          type: integer
          description: "Variante de `id` que KLASSCI peut employer ; la source locale ne l emet pas."
        nom:
          type: string
          description: "Titre de la carte (MatiereCourseCard.vue:12)."
        coefficient:
          type: number
          nullable: true
        classes:
          type: array
          description: "Badges de classes (MatiereCourseCard.vue:41-48)."
          items:
            $ref: '#/components/schemas/PageMatiereClasse'
        statistiques:
          type: object
          additionalProperties: false
          required:
            - nombre_lessons_publiees
            - nombre_lessons_brouillons
            - nombre_seances
            - nombre_evaluations
          properties:
            nombre_lessons_publiees:
              type: integer
            nombre_lessons_brouillons:
              type: integer
            nombre_seances:
              type: integer
              nullable: true
              description: |
                `null` = inconnu : une seance locale ne porte que le NOM de sa
                matiere, en texte. Jamais un zero fabrique.
            nombre_evaluations:
              type: integer

    PageMatiere:
      type: object
      additionalProperties: false
      required:
        - success
        - data
      properties:
        success:
          type: boolean
          enum:
            - true
        data:
          type: object
          additionalProperties: false
          required:
            - matiere
            - combinaisons
            - enseignants
            - lessons
            - seances_programmees
            - evaluations_programmees
            - statistiques
            - matiere_id_local
            - classes_concernees
          properties:
            matiere:
              type: object
              description: "En-tete de la page (MatiereDetailsHeader.vue)."
              required:
                - nom
              properties:
                nom:
                  type: string
                code:
                  type: string
                  nullable: true
                coefficient:
                  type: integer
                  nullable: true
            combinaisons:
              type: array
              items:
                type: object
            enseignants:
              type: array
              items:
                type: object
            lessons:
              type: array
              description: |
                Onglet Lecons (LessonCard.vue). Dans la source locale, un
                enseignant n y voit que les siennes.
              items:
                type: object
                required:
                  - id
                  - title
                properties:
                  id:
                    type: integer
                  title:
                    type: string
            seances_programmees:
              type: array
              items:
                type: object
            evaluations_programmees:
              type: array
              items:
                type: object
            statistiques:
              type: object
              required:
                - nombre_lessons
                - nombre_evaluations
                - nombre_seances_programmees
              properties:
                nombre_lessons:
                  type: integer
                nombre_evaluations:
                  type: integer
                nombre_seances_programmees:
                  type: integer
                  nullable: true
            matiere_id_local:
              type: integer
              nullable: true
              description: |
                L id LOCAL que la creation de lecon envoie (matiereDetails.js:116-124).
                `null` quand la matiere KLASSCI n est pas encore miroitee.
            classes_concernees:
              type: array
              description: "Ids LOCAUX (#740). La premiere sert de `classe_id` a la creation de lecon."
              items:
                $ref: '#/components/schemas/PageMatiereClasse'

    PageMatiereClasse:
      type: object
      additionalProperties: false
      required:
        - id
        - nom
      properties:
        id:
          type: integer
        nom:
          type: string

    PageMatiereRefus:
      type: object
      description: |
        Tout refus de « Mes matieres » et de la page d une matiere, hors 401.
        `reason` quand la couche qui refuse en pose un (`no_institution` a la
        porte des comptes sans etablissement) ; `error` dans le seul 500 de la
        page matiere (`LMSMatieresQueryController::echecDetails`).
      additionalProperties: false
      required:
        - success
        - message
      properties:
        success:
          type: boolean
          enum:
            - false
        message:
          type: string
        reason:
          type: string
        error:
          type: string

    ClasseInput:
      type: object
      required:
        - libelle
      properties:
        libelle:
          type: string
          maxLength: 191
        code:
          type: string
          maxLength: 50
          nullable: true
          description: |
            Code de la classe, FACULTATIF. Unique par etablissement parmi les
            classes qui en portent un : une chaine vide est normalisee en nul,
            sans quoi la deuxieme classe sans code entrerait en collision.
        description:
          type: string
          maxLength: 2000
          nullable: true
        effectif:
          type: integer
          minimum: 0
          maximum: 10000
          default: 0

    # #905 — une page de classes locales, chacune avec l etat de son code.
    ClassesLocalesPage:
      type: object
      properties:
        success:
          type: boolean
        message:
          type: string
        data:
          type: array
          items:
            type: object
            properties:
              id:
                type: integer
              libelle:
                type: string
              code:
                type: string
                nullable: true
              training_session_id:
                type: integer
                nullable: true
              code_inscription:
                type: object
                properties:
                  etat:
                    type: string
                    enum: [actif, retire, absent]
                  valeur:
                    type: string
                    nullable: true
                    description: "Presente seulement si etat = actif"
                    example: BUR7K2
        meta:
          type: object
          properties:
            current_page:
              type: integer
            last_page:
              type: integer
            per_page:
              type: integer
            total:
              type: integer

    MyCoursesPage:
      type: object
      description: |
        Reponse de `GET /lessons/my-courses` (#938). Hors enveloppe
        `successResponse` : `filters`, `total` et `meta` vivent a la RACINE,
        a cote de `data`. `data` est un tableau PLAT, jamais `data.data`.
      required:
        - success
        - data
        - filters
        - total
        - meta
      properties:
        success:
          type: boolean
          example: true
        data:
          type: array
          items:
            $ref: '#/components/schemas/MyCourse'
        filters:
          type: object
          description: |
            Dictionnaires des menus de filtre, calcules sur TOUTE la selection
            filtree, pas sur la seule page. Avec `matiere_id` ou
            `enseignant_id`, ils se reduisent donc a cette selection : le
            dictionnaire complet est celui d une reponse sans filtre.
          required:
            - matieres
            - enseignants
          properties:
            matieres:
              type: array
              items:
                type: object
                required:
                  - id
                  - name
                properties:
                  id:
                    type: integer
                    description: "matieres.id LOCAL"
                  name:
                    type: string
            enseignants:
              type: array
              items:
                type: object
                required:
                  - id
                  - name
                properties:
                  id:
                    type: integer
                    description: "users.id LOCAL de l auteur (#869), l espace qu accepte `enseignant_id`"
                  name:
                    type: string
        total:
          type: integer
          description: "Nombre de cours de TOUTE la selection, toutes pages confondues (egal a meta.total)"
        meta:
          type: object
          required:
            - current_page
            - last_page
            - per_page
            - total
          properties:
            current_page:
              type: integer
            last_page:
              type: integer
            per_page:
              type: integer
            total:
              type: integer

    MyCourse:
      type: object
      description: |
        Les 12 cles sont TOUJOURS emises par MyCoursesPresenter, certaines a
        null (`nullable`) : `required` ne dit pas « non nul », il dit
        « toujours present ».
      required:
        - id
        - title
        - description
        - type
        - duree_estimee
        - niveau_difficulte
        - enseignant
        - matiere
        - classe
        - progress
        - published_at
        - created_at
      properties:
        id:
          type: integer
          description: "lessons.id LOCAL"
        title:
          type: string
        description:
          type: string
          nullable: true
        type:
          type: string
          enum: [cours, tp, td, projet, autre]
        duree_estimee:
          type: integer
          nullable: true
          description: "Duree ESTIMEE en minutes (lessons.duree_estimee_minutes). Ce n est pas un temps passe."
        niveau_difficulte:
          type: string
          enum: [debutant, intermediaire, avance]
        enseignant:
          type: object
          nullable: true
          required:
            - id
            - klassci_id
            - name
          properties:
            id:
              type: integer
              description: "users.id LOCAL"
            klassci_id:
              type: integer
              nullable: true
            name:
              type: string
        matiere:
          type: object
          nullable: true
          required:
            - id
            - name
          properties:
            id:
              type: integer
            name:
              type: string
        classe:
          type: object
          nullable: true
          required:
            - id
            - name
          properties:
            id:
              type: integer
            name:
              type: string
              description: "Libelle de la classe (classes.libelle, jamais null). Valait toujours \"Classe\" avant #939"
        progress:
          type: object
          nullable: true
          description: "Progression de l appelant sur la lecon ; null s il ne l a jamais commencee"
          required:
            - percentage
            - status
            - completed_at
          properties:
            percentage:
              type: integer
              minimum: 0
              maximum: 100
            status:
              type: string
              enum: [not_started, in_progress, completed]
            completed_at:
              type: string
              format: date-time
              nullable: true
        published_at:
          type: string
          format: date-time
        created_at:
          type: string
          format: date-time

    ClasseCreated:
      type: object
      properties:
        success:
          type: boolean
        message:
          type: string
        data:
          type: object
          properties:
            id:
              type: integer
            libelle:
              type: string
            code:
              type: string
              nullable: true
            effectif:
              type: integer

    TrainingSessionInput:
      type: object
      required:
        - program_id
        - libelle
      properties:
        program_id:
          type: integer
          description: "Doit appartenir a l etablissement de l appelant."
        libelle:
          type: string
          maxLength: 191
        enrollment_opens_at:
          type: string
          format: date
          nullable: true
        enrollment_closes_at:
          type: string
          format: date
          nullable: true
        starts_on:
          type: string
          format: date
          nullable: true
        ends_on:
          type: string
          format: date
          nullable: true
        certificate_available_at:
          type: string
          format: date
          nullable: true
        min_enrollments:
          type: integer
          minimum: 1
          nullable: true
          description: "Alerte de sous-inscription, pas un verrou."
        tarif:
          type: integer
          minimum: 0
          nullable: true
          description: "Plus petite unite monetaire. Jamais un flottant."
        devise:
          type: string
          minLength: 3
          maxLength: 3
          nullable: true
        heures_stagiaires:
          type: integer
          minimum: 0
          nullable: true

    TrainingSessionView:
      type: object
      properties:
        id:
          type: integer
        libelle:
          type: string
        status:
          type: string
          enum: [brouillon, publiee, annulee, cloturee, archivee, purgee]
          description: "Decision humaine, STOCKEE."
        phase:
          type: string
          enum: [a_venir, inscriptions_ouvertes, en_cours, terminee]
          description: |
            DERIVEE des dates, jamais stockee. Aucune colonne ne la porte : une
            colonne exigerait un job nocturne qui finirait par diverger.
        program_id:
          type: integer
        enrollment_opens_at:
          type: string
          format: date
          nullable: true
        enrollment_closes_at:
          type: string
          format: date
          nullable: true
        starts_on:
          type: string
          format: date
          nullable: true
        ends_on:
          type: string
          format: date
          nullable: true
        certificate_available_at:
          type: string
          format: date
          nullable: true
        min_enrollments:
          type: integer
          nullable: true
        tarif:
          type: integer
          nullable: true
        devise:
          type: string
          nullable: true

    TrainingSessionCreated:
      type: object
      properties:
        success:
          type: boolean
        message:
          type: string
        data:
          $ref: '#/components/schemas/TrainingSessionView'

    TrainingSessionPage:
      type: object
      properties:
        success:
          type: boolean
        data:
          type: array
          items:
            $ref: '#/components/schemas/TrainingSessionView'
        meta:
          type: object
          properties:
            current_page:
              type: integer
            last_page:
              type: integer
            per_page:
              type: integer
            total:
              type: integer

    # Les eleves d'une classe (lot C ; source locale au lot 2).
    ClasseEleves:
      type: object
      additionalProperties: false
      required:
        - success
        - data
      properties:
        success:
          type: boolean
          enum:
            - true
        data:
          type: object
          additionalProperties: false
          required:
            - etudiants
            - total
          properties:
            etudiants:
              type: array
              description: |
                Ecole creee depuis KLASSCI : les eleves de l'enveloppe KLASSCI de
                la classe, de statut `actif` ou sans statut ; chaque element est
                l'objet KLASSCI, non normalise. Ecart connu : un element vide cote
                KLASSCI ressortirait en tableau vide `[]`, que ce schema ne decrit
                pas. Ecole creee depuis le LMS : les inscriptions actives, chaque
                element `{id, name, email, matricule: null, statut: actif}`.
              items:
                type: object
            total:
              type: integer
              minimum: 0

    RefusClasseEleves:
      type: object
      description: |
        Un refus sans donnees : la garde de role, un etablissement desactive, un
        compte sans etablissement (`reason: no_institution`), ou un refus de
        KLASSCI relaye avec le message de son catalogue.
      additionalProperties: false
      required:
        - success
        - message
      properties:
        success:
          type: boolean
          enum:
            - false
        message:
          type: string
        reason:
          type: string
          enum:
            - no_institution

    TableauDeBordEnseignant:
      type: object
      description: |
        Ecole en mode KLASSCI : la charge de `me/teacher-dashboard`, relayee
        telle quelle ; ses cles ne sont pas fermees ici, et elle ne porte pas
        `meta`. Ecole en mode autonome : la meme forme, lue en local, avec
        `meta.source: lms_local`.
      required:
        - success
        - data
      properties:
        success:
          type: boolean
          enum:
            - true
        data:
          type: object
          required:
            - matieres
            - classes
            - prochaines_seances
            - statistiques
          properties:
            matieres:
              type: array
              items:
                type: object
            classes:
              type: array
              items:
                type: object
            evaluations:
              type: array
              description: "Ecole en mode KLASSCI seulement. ABSENT en mode autonome : non mesure, et non vide."
              items:
                type: object
            prochaines_seances:
              type: array
              items:
                type: object
            statistiques:
              type: object
              properties:
                heures:
                  type: object
                  properties:
                    total_seances:
                      type: integer
                      minimum: 0
                      description: "Ecole en mode autonome : toutes les seances actives et datees de l'enseignant dans l'etablissement, SANS fenetre de dates (passees et a venir)."
                    seances_effectuees:
                      type: integer
                      minimum: 0
                    fin_estimee:
                      type: boolean
                      description: "Ecole en mode autonome : `true`, une seance est effectuee apres sa fin ESTIMEE (deux heures apres son debut)."
                evaluations:
                  type: object
                  description: "Ecole en mode KLASSCI seulement."
        meta:
          type: object
          description: "Ecole en mode autonome seulement : les identifiants de `data` sont LOCAUX."
          additionalProperties: false
          required:
            - source
          properties:
            source:
              type: string
              enum:
                - lms_local

    KlassciIndisponible:
      type: object
      description: |
        KLASSCI ne peut pas rendre la donnee pour l'instant : panne, circuit
        ouvert, reponse illisible, ou bloc attendu absent. Rendu avec l'en-tete
        `Retry-After` ; le client reessaie apres ce delai. Le client classe
        cette panne par `reason`, jamais par l'en-tete : `Retry-After` ne porte
        que le delai (frontend_lms#426).
      additionalProperties: false
      required:
        - success
        - message
        - reason
      properties:
        success:
          type: boolean
          enum:
            - false
        message:
          type: string
        reason:
          type: string
          enum:
            - klassci_unavailable

    # Les refus de la porte locale des classes (lot D).
    ClasseLocaleRefus:
      type: object
      additionalProperties: false
      required:
        - success
        - message
      properties:
        success:
          type: boolean
          enum:
            - false
        message:
          type: string
        reason:
          type: string
          description: "Present sur le 409 seulement : la classe a ete creee dans le LMS."
          enum:
            - classe_local_only

    # Les classes de l'enseignant et la fiche d'une classe (lot 2).
    MesClassesListe:
      type: object
      additionalProperties: false
      required:
        - success
        - data
      properties:
        success:
          type: boolean
          enum:
            - true
        data:
          type: array
          items:
            $ref: '#/components/schemas/MesClassesCarte'

    MesClassesCarte:
      type: object
      description: |
        Une classe de l appelant (`TeacherClassCard.vue`). `id` mene a la fiche
        par `/lms/classes/{classeId}` : identifiant KLASSCI dans une ecole creee
        depuis KLASSCI, identifiant local dans une ecole creee depuis le LMS.
      additionalProperties: false
      required:
        - id
        - libelle
        - code
        - effectif
        - effectif_actuel
      properties:
        id:
          type: integer
        libelle:
          type: string
          nullable: true
        code:
          type: string
          nullable: true
        effectif:
          type: integer
          nullable: true
          description: |
            L effectif tenu par KLASSCI, quand la classe est miroitee. Toujours
            `null` dans une ecole creee depuis le LMS : la colonne n y est pas
            tenue, et un 0 serait une fausse mesure.
        effectif_actuel:
          type: integer
          nullable: true
          description: "Les inscriptions actives ; `null` quand la classe n est pas miroitee."

    FicheClasse:
      type: object
      additionalProperties: false
      required:
        - success
        - data
      properties:
        success:
          type: boolean
          enum:
            - true
        data:
          type: object
          additionalProperties: false
          required:
            - classe
            - etudiants
            - matieres_disponibles
            - emploi_temps_semaine
            - evaluations_programmees
            - statistiques
          properties:
            classe:
              type: object
              description: |
                La classe. L en-tete lit `id`, `name` (ou `libelle`, `nom`),
                `code`, `filiere.nom` et `niveau.nom`. Ouvert : la source KLASSCI
                relaie la classe telle que KLASSCI la decrit. Dans une ecole creee
                depuis le LMS, `filiere` et `niveau` valent `null`.
            etudiants:
              type: array
              description: |
                Les eleves actifs, pour le personnel seulement : `[]` pour un
                eleve, et pour tout role qui n est pas du personnel.
              items:
                type: object
            matieres_disponibles:
              type: array
              description: |
                Le programme de la classe. Dans une ecole creee depuis le LMS :
                `id`, `nom`, `code`, `coefficient` et `enseignants` (le formateur
                designe, 0 ou 1, `{id, nom}`).
              items:
                type: object
            emploi_temps_semaine:
              type: array
              description: "Toujours `[]` dans une ecole creee depuis le LMS : l emploi du temps est une notion KLASSCI."
              items:
                type: object
            evaluations_programmees:
              type: array
              description: "Toujours `[]` dans une ecole creee depuis le LMS, en attendant ses evaluations."
              items:
                type: object
            statistiques:
              type: object
              additionalProperties: false
              required:
                - nombre_etudiants
                - nombre_seances_semaine
                - nombre_evaluations_programmees
                - nombre_matieres
                - capacite_classe
                - taux_remplissage
              description: |
                Un bloc que la source ne livre pas vaut `null`, jamais 0. Dans
                une ecole creee depuis le LMS, `nombre_seances_semaine`,
                `capacite_classe` et `taux_remplissage` valent `null`.
              properties:
                nombre_etudiants:
                  type: integer
                nombre_seances_semaine:
                  type: integer
                  nullable: true
                nombre_evaluations_programmees:
                  type: integer
                nombre_matieres:
                  type: integer
                  nullable: true
                capacite_classe:
                  type: integer
                  nullable: true
                  description: |
                    Le nombre de places tel que KLASSCI le donne (`nombre_places`),
                    ou `null`. Ecart connu : la source KLASSCI relaie la valeur sans
                    la normaliser ; une chaine numerique ressortirait telle quelle.
                taux_remplissage:
                  type: number
                  nullable: true

    # Les classes de l'etablissement, pour la gestion (lot 3a).
    ClassesEtablissement:
      type: object
      required:
        - success
        - data
      properties:
        success:
          type: boolean
          enum:
            - true
        data:
          type: array
          items:
            $ref: '#/components/schemas/ClasseEtablissement'

    ClasseEtablissement:
      type: object
      description: |
        Ecole creee depuis KLASSCI : la classe telle que KLASSCI la decrit
        (schema ouvert, types variables : seuls ceux que KLASSCI tient sont
        fixes). Ecole creee depuis le LMS : exactement les cles ci-dessous.
      required:
        - id
      properties:
        id:
          description: "Entier. KLASSCI l'envoie parfois en chaine numerique ; le LMS, toujours en entier."
          oneOf:
            - type: integer
            - type: string
        name:
          type: string
        libelle:
          type: string
          nullable: true
          description: "Ecole creee depuis KLASSCI : souvent `null`, le libelle vit dans `name`."
        code:
          type: string
          nullable: true
        filiere:
          description: |
            Ecole creee depuis KLASSCI : un objet ou un identifiant. Toujours
            `null` dans une ecole creee depuis le LMS, ou basculee : aucune
            filiere n'est lue en local.
          nullable: true
          oneOf:
            - type: object
            - type: integer
            - type: string
        niveau:
          description: |
            Ecole creee depuis KLASSCI : un objet ou un identifiant. Toujours
            `null` dans une ecole creee depuis le LMS, ou basculee : aucun
            niveau n'est lu en local.
          nullable: true
          oneOf:
            - type: object
            - type: integer
            - type: string
        is_active:
          type: boolean
          nullable: true
          description: |
            Ecole creee depuis le LMS : vrai si la Periode de la classe est
            publiee et pas terminee ; faux pour toute autre Periode ; `null`
            sans Periode, ou quand la Periode est supprimee (etat inconnu).
        places_occupees:
          type: integer
          description: "Ecole creee depuis le LMS : les inscriptions actives d'eleves de l'etablissement."
        places_totales:
          type: integer
          nullable: true
          description: "Toujours `null` dans une ecole creee depuis le LMS : aucune capacite n'est tenue."
        nb_matieres:
          type: integer
          description: "Ecole creee depuis le LMS : le programme de la classe, en matieres de l'etablissement."

    # La structure, les matieres et l'administration des matieres (lot 3c).
    StructureEtablissement:
      type: object
      description: |
        Ecole creee depuis KLASSCI : la reponse de KLASSCI (schema ouvert).
        Ecole creee depuis le LMS : `{filieres: [], niveaux_etudes: []}`.
      required:
        - success
        - data
      properties:
        success:
          type: boolean
          enum:
            - true
        data:
          type: object
          properties:
            filieres:
              type: array
              items:
                type: object
            niveaux_etudes:
              type: array
              items:
                type: object

    MatieresEtablissement:
      type: object
      required:
        - success
        - data
      properties:
        success:
          type: boolean
          enum:
            - true
        data:
          type: array
          items:
            $ref: '#/components/schemas/MatiereEtablissement'

    MatiereEtablissement:
      type: object
      description: |
        Ecole creee depuis KLASSCI : la matiere telle que KLASSCI la decrit
        (schema ouvert, types non garantis). Ecole creee depuis le LMS :
        exactement les cles ci-dessous. Ce sont les tests de la source qui
        fixent cette exactitude : le schema reste ouvert, puisqu'il decrit
        aussi la forme de KLASSCI.
      required:
        - id
      properties:
        source:
          type: string
          enum:
            - lms_local
          description: |
            Ecole creee depuis le LMS : `lms_local`, sur chaque carte. Ses ids sont
            LOCAUX, a envoyer tels quels (`classe_id`, `matiere_id`). Ecole creee
            depuis KLASSCI : cle absente. Aucun mode d'ecole n'est expose.
        id:
          description: "Ecole creee depuis le LMS : l'identifiant LOCAL, un entier."
          oneOf:
            - type: integer
            - type: string
        nom:
          type: string
          nullable: true
        code:
          type: string
          nullable: true
        description:
          type: string
          nullable: true
        coefficient:
          description: "Ecole creee depuis le LMS : un nombre. Ecole creee depuis KLASSCI : tel que KLASSCI le rend, parfois en chaine."
          nullable: true
          oneOf:
            - type: number
            - type: string
        classes:
          type: array
          description: "Ecole creee depuis le LMS : les classes ou l'appelant atteint la matiere, triees par libelle puis par identifiant."
          items:
            type: object
            properties:
              id:
                oneOf:
                  - type: integer
                  - type: string
              nom:
                type: string
                nullable: true

    MatieresAdministration:
      type: object
      required:
        - success
        - data
      properties:
        success:
          type: boolean
          enum:
            - true
        message:
          type: string
          example: "2 matiere(s) recuperee(s)"
        data:
          type: object
          additionalProperties: false
          required:
            - matieres
            - statistiques
          properties:
            matieres:
              type: array
              items:
                $ref: '#/components/schemas/MatiereAdministration'
            statistiques:
              type: object
              additionalProperties: false
              required:
                - total
                - total_heures
                - total_seances
              properties:
                total:
                  type: integer
                total_heures:
                  type: integer
                  nullable: true
                  description: "`null` si aucune matiere ne porte d'heures ; 0 sans matiere."
                total_seances:
                  type: integer
                  nullable: true
                  description: "Toujours `null` : aucune des deux sources ne porte cette donnee."

    MatiereAdministration:
      type: object
      additionalProperties: false
      required:
        - id
        - nom
        - code
        - couleur
        - heures_total
        - nb_evaluations
        - nb_seances_programmees
        - nb_lecons
        - combinaisons
      properties:
        id:
          description: "Ecole creee depuis le LMS : l'identifiant LOCAL. Ecole creee depuis KLASSCI : celui de KLASSCI, tel quel."
          nullable: true
          oneOf:
            - type: integer
            - type: string
        nom:
          type: string
          description: "`N/A` si absent."
        code:
          type: string
          description: "`N/A` si absent."
        description:
          type: string
          nullable: true
        coefficient:
          description: "Tel que la source le porte."
          nullable: true
          oneOf:
            - type: number
            - type: string
        couleur:
          type: string
          example: "#6366f1"
        heures_total:
          type: integer
          nullable: true
          description: "Toujours `null` dans une ecole creee depuis le LMS : aucune heure n'est tenue."
        nb_evaluations:
          type: integer
          nullable: true
          description: "0 dans une ecole creee depuis le LMS (provisoire, D72)."
        nb_seances_programmees:
          type: integer
          nullable: true
          description: "Toujours `null` : la donnee n'est pas connue."
        nb_lecons:
          type: integer
          nullable: true
          description: "Ecole creee depuis le LMS : les lecons de la matiere, tous statuts. Ecole creee depuis KLASSCI : `null`."
        combinaisons:
          type: array
          description: "Toujours vide dans une ecole creee depuis le LMS : aucune filiere ni aucun niveau local."
          items:
            type: object

    # Les listes de seances de l'utilisateur (lot 3d).
    SeancesAVenir:
      type: object
      additionalProperties: false
      required:
        - success
        - data
        - meta
      properties:
        success:
          type: boolean
          enum:
            - true
        data:
          type: array
          items:
            $ref: '#/components/schemas/SeanceCalendrier'
        meta:
          type: object
          additionalProperties: false
          required:
            - total_seances
            - date_debut
            - date_fin
            - filtres
          properties:
            total_seances:
              type: integer
            date_debut:
              type: string
              format: date
            date_fin:
              type: string
              format: date
            filtres:
              type: object
              additionalProperties: false
              required:
                - teacher_id
                - classe_id
              properties:
                teacher_id:
                  type: integer
                  nullable: true
                classe_id:
                  type: integer
                  nullable: true

    SeancesListe:
      type: object
      additionalProperties: false
      required:
        - success
        - data
      properties:
        success:
          type: boolean
          enum:
            - true
        message:
          type: string
          description: "Ecole creee depuis KLASSCI, classe sans matiere : `Aucune matiere trouvee pour cet etudiant`."
        data:
          type: array
          items:
            $ref: '#/components/schemas/SeanceCalendrier'

    SeanceCalendrier:
      type: object
      description: |
        Une seance dans la forme du calendrier et des ecrans Seances et Visio :
        Dans une ecole basculee, une seance miroir de KLASSCI n'a ni auteur ni
        classe locaux : seule la gestion la lit, avec le nom d'enseignant
        qu'elle porte, et ses ids d'enseignant et de classe valent `null`.
        structures plate ET imbriquee. Ecole creee depuis KLASSCI : selon le
        role et la route, une partie de ces cles, avec les ids KLASSCI (schema
        ouvert). Ecole creee depuis le LMS : exactement ces cles, avec les ids
        LOCAUX. Une seance locale n'a ni heure de fin, ni salle, ni identifiant
        de matiere.
      required:
        - id
      properties:
        id:
          description: "Ecole creee depuis le LMS : l'id de `/lms/seances/{seanceId}`."
          nullable: true
          oneOf:
            - type: integer
            - type: string
        klassci_seance_id:
          type: integer
          nullable: true
        date_seance:
          type: string
          nullable: true
        date_debut:
          type: string
          format: date-time
          nullable: true
          description: "ISO 8601, avec fuseau."
        date_fin:
          type: string
          format: date-time
          nullable: true
          description: "ISO 8601, avec fuseau. Estimee quand `heure_fin_estimee` vaut `true`."
        heure_debut:
          type: string
          nullable: true
          pattern: '^[0-9]{2}:[0-9]{2}$'
          description: "Heure locale, au format `H:i`."
        heure_fin:
          type: string
          nullable: true
          pattern: '^[0-9]{2}:[0-9]{2}$'
          description: "Heure locale, au format `H:i`. Estimee quand `heure_fin_estimee` vaut `true`."
        heure_fin_estimee:
          type: boolean
          description: |
            `true` : la fin n'est pas tenue, elle est ESTIMEE (debut plus une duree
            supposee de 2 h, non mesuree). C'est le cas de toute seance lue dans la
            table du LMS : celles d'une ecole creee depuis le LMS, et celles du
            chemin de la gestion d'une ecole creee depuis KLASSCI. `false` : la fin
            est celle que KLASSCI rend. Absente quand la ligne ne porte aucune fin
            a sa racine.
        salle:
          type: string
          nullable: true
        programmation:
          type: object
          properties:
            date:
              type: string
              nullable: true
              description: "Le jour de la seance, au format `Y-m-d`."
            heure_debut:
              type: string
              nullable: true
              description: "Datetime ISO 8601, realigne sur le jour de la seance. Avec fuseau quand la seance est lue dans le LMS ; tel que KLASSCI le rend sinon."
            heure_fin:
              type: string
              nullable: true
              description: "Datetime ISO 8601, comme `heure_debut`. Estimee quand `heure_fin_estimee` vaut `true`."
            heure_fin_estimee:
              type: boolean
              description: "Meme sens qu'a la racine : `true` pour une fin estimee, `false` pour une fin rendue par KLASSCI."
            salle:
              type: string
              nullable: true
        matiere:
          type: object
          description: "Ecole creee depuis le LMS : la matiere designee par la seance. `id` est l'id local de la matiere (`null` sans matiere choisie) ; `nom` est son libelle actuel, ou le nom libre de la seance sans matiere."
        classe:
          type: object
          description: "Ecole creee depuis le LMS : la classe designee par la seance. `id` est l'id de `/proxy/classes` (`null` sans classe) ; `nom` est son libelle et `effectif` ses inscriptions actives."
        enseignant:
          type: object
          description: "Ecole creee depuis le LMS : l'auteur de la seance ; `id` est l'id de son compte, celui du filtre `teacher_id`."
        visio:
          type: object
          nullable: true
        statut:
          type: string
        visio_enabled:
          type: boolean
          nullable: true
        visio_type:
          type: string
          nullable: true
        visio_room_id:
          type: string
          nullable: true
        visio_active:
          type: boolean
          nullable: true
        visio_status:
          type: string
          nullable: true
        visio_started_at:
          type: string
          nullable: true
        visio_ended_at:
          type: string
          nullable: true
        visio_participants_count:
          type: integer

    # Les enseignants de l'etablissement (lot 3b).
    EnseignantsAnnuaire:
      type: object
      required:
        - success
        - data
      properties:
        success:
          type: boolean
          enum:
            - true
        data:
          type: array
          items:
            $ref: '#/components/schemas/EnseignantEtablissement'
        meta:
          type: object

    EnseignantsListe:
      type: object
      additionalProperties: false
      required:
        - success
        - data
        - meta
      properties:
        success:
          type: boolean
          enum:
            - true
        data:
          type: array
          items:
            $ref: '#/components/schemas/EnseignantEtablissement'
        meta:
          type: object
          description: "Sans `source` quand l'appelant ne lit aucune ligne (`{total: 0}`, sans aucune lecture)."
          properties:
            total:
              type: integer
            source:
              type: string
              enum:
                - klassci_externe
                - lms_local

    EnseignantsErreur:
      type: object
      additionalProperties: false
      required:
        - success
        - message
        - data
      properties:
        success:
          type: boolean
          enum:
            - false
        message:
          type: string
        data:
          type: array
          items:
            type: object

    EnseignantEtablissement:
      type: object
      description: |
        Ecole creee depuis KLASSCI : l'enseignant tel que KLASSCI le decrit
        (schema ouvert). Ecole creee depuis le LMS : exactement les cles
        ci-dessous, sans `statistiques`, et sans aucun id KLASSCI. Ce sont les
        tests de la source qui fixent cette exactitude : le schema reste
        ouvert, puisqu'il decrit aussi la forme de KLASSCI.
      required:
        - id
      properties:
        id:
          description: "Ecole creee depuis le LMS : l'id du compte (`users.id`)."
          oneOf:
            - type: integer
            - type: string
        nom:
          type: string
          nullable: true
        name:
          type: string
          nullable: true
        prenom:
          type: string
          nullable: true
        email:
          type: string
          nullable: true
        telephone:
          type: string
          nullable: true
        matricule:
          type: string
          nullable: true
        specialization:
          type: string
          nullable: true
        status:
          type: string
          nullable: true
        matieres:
          type: array
          description: "Avec `with_details`. Ecole creee depuis le LMS : les matieres ou l'enseignant est designe, avec leurs classes ; heures, taux et seances valent `null`."
          items:
            type: object
        classes:
          type: array
          description: "Avec `with_details`. Ecole creee depuis le LMS : ses classes, aux ids de `/proxy/classes` ; filiere et niveau valent `null`."
          items:
            type: object
        statistiques:
          type: object
          description: "Ecole creee depuis KLASSCI seulement."

    MessageOnly:
      type: object
      properties:
        success:
          type: boolean
          example: true
        message:
          type: string

    ActivationInput:
      type: object
      required:
        - token
        - password
        - password_confirmation
      properties:
        token:
          type: string
          maxLength: 128
          description: "Le jeton extrait du lien d'activation."
        password:
          type: string
          minLength: 8
          description: "Le secret que le titulaire choisit ; personne d'autre ne l'a connu."
        password_confirmation:
          type: string
          description: "Sur un ecran sans renvoi possible du lien, une faute de frappe enfermerait le titulaire dehors."

    AuditLogPage:
      type: object
      description: |
        Reponse de `GET /admin/audit-log` : l'enveloppe `successResponse`
        autour d'une page Laravel (`data.data` porte les entrees).
      additionalProperties: false
      required:
        - success
        - data
      properties:
        success:
          type: boolean
        data:
          type: object
          required:
            - current_page
            - data
            - per_page
            - total
          properties:
            current_page:
              type: integer
            data:
              type: array
              items:
                $ref: '#/components/schemas/AuditLogEntry'
            per_page:
              type: integer
            total:
              type: integer
            last_page:
              type: integer

    AuditLogRefus:
      type: object
      additionalProperties: false
      required:
        - success
        - message
      properties:
        success:
          type: boolean
          enum:
            - false
        message:
          type: string

    AuditLogEntry:
      type: object
      description: |
        Une entree du journal d'audit (`audit_logs`), avec son auteur et son
        ecole. `before` et `after` sont les attributs avant et apres l'action ;
        un tableau vide est serialise en liste vide `[]`, que ce schema ne decrit
        pas (aucun `oneOf` ici).
      additionalProperties: false
      required:
        - id
        - user_id
        - institution_id
        - action
        - auditable_type
        - auditable_id
        - before
        - after
        - ip_address
        - user_agent
        - created_at
        - user
        - institution
      properties:
        id:
          type: integer
        user_id:
          type: integer
          nullable: true
        institution_id:
          type: integer
          nullable: true
        action:
          type: string
          description: |
            Chaine libre (`string(32)`). Valeurs ecrites par le serveur :
            - modeles audites (`Evaluation`, `EvaluationSubmission`, `QuizAttempt`) :
              `create`, `update`, `delete` ;
            - authentification : `login`, `logout`, `login_failed` ;
            - enregistrements visio : `visio_recording_start`,
              `visio_recording_stop`, `visio_recording_read` ;
            - ecoles : `institution.mode_changed`, `institution.soft_deleted`,
              `institution.purged` ;
            - comptes : `user.soft_deleted`, `user.purged` ;
            - retention : `recording.purged`, `chapter.purged`,
              `audit-logs.purged.bulk`.
            Un client traite toute autre valeur comme inconnue.
        auditable_type:
          type: string
          nullable: true
          description: |
            Le modele vise, par son nom de classe complet (`App\Models\Evaluation`,
            `EvaluationSubmission`, `QuizAttempt`, `Institution`, `User`,
            `SeanceRecording`, `Chapter`). `null` pour une connexion ou une purge
            groupee.
        auditable_id:
          type: integer
          nullable: true
        before:
          type: object
          nullable: true
          additionalProperties: true
        after:
          type: object
          nullable: true
          additionalProperties: true
        ip_address:
          type: string
          nullable: true
        user_agent:
          type: string
          nullable: true
        created_at:
          type: string
          format: date-time
        user:
          type: object
          nullable: true
          description: |
            L'auteur de l'action, supprime depuis ou non. `null` pour un job
            systeme ou un echec de connexion, ou apres une purge physique du
