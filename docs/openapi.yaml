      summary: "Generer le code d'emargement d'une seance"
      description: |
        #1680. L'auteur de la seance ou la gestion genere un code de 6
        caracteres dictables, valable de 60 a 1440 minutes, avec un seuil de
        retard facultatif (minutes apres le debut). Le code est rendu en clair
