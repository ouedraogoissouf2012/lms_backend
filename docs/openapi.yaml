        '500':
          description: |
            Erreur interne. Rattrapee par le service : avec `error`. Non
            rattrapee (gestionnaire global) : sans `error`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VisioErreurInterne'

  /lms/seances/{seanceId}/toggle-visio:
    post:
      tags:
        - Visio
      summary: "Activer ou desactiver la visio d'une seance"
      description: |
        Reserve aux roles coordinateur et superAdmin. La source est celle du
        MODE de l'etablissement (ADR-EI-01, « meme route, autre source »).

        **Ecole en mode KLASSCI.** `seanceId` est l'identifiant KLASSCI de la
        seance. La bascule ne verifie pas que KLASSCI connait cette seance : un
        identifiant inconnu cree une seance locale sous cet identifiant, et la
        reponse est 200. Chaque activation tire un salon neuf, y compris sur une
        seance deja activee : l'adresse precedente cesse de valoir. Sans jeton
        KLASSCI, la route rend le 401 `klassci_token_missing` avant toute
        ecriture.

        **Ecole en mode autonome.** `seanceId` est l'id LOCAL de la seance,
        cherchee dans l'etablissement, sans jeton ni appel KLASSCI. Activer est
        l'activation locale (`activate-visio`) : le salon deja attribue est
        garde, et les eleves de la classe sont avertis. Desactiver est la
        desactivation commune (`deactivate-visio`). Une seance inconnue, ou une
        visio deja desactivee, rend 404. Une ecole creee depuis KLASSCI passee
        en mode autonome est servie ainsi, jetons ou non.
      security:
        - sanctum: []
      parameters:
        - name: seanceId
          in: path
          required: true
          description: "Identifiant KLASSCI de la seance (ecole en mode KLASSCI), ou son identifiant local (ecole en mode autonome)."
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VisioBasculeInput'
      responses:
        '200':
          description: "Visio activee (`enabled: true`) ou desactivee (`enabled: false`)."
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VisioBasculee'
        '400':
          $ref: '#/components/responses/EtablissementInconnu'
        '401':
          description: |
            Jeton porteur absent ou invalide (sans `reason`), ou, dans une ecole
            en mode KLASSCI, compte sans jeton KLASSCI (`reason:
            klassci_token_missing`). Voir la reponse partagee `KlassciUnauthorized`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RefusKlassci'
        '403':
          description: |
            Sans `reason` : role non admis, ou etablissement desactive. Avec
            `reason: no_institution` : compte sans etablissement.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SeanceLocaleInterdite'
        '404':
          description: "Ecole en mode autonome : seance inconnue dans l'etablissement, ou visio deja desactivee."
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SeanceLocaleRefus'
        '422':
          description: "Charge invalide"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SeanceLocaleInvalide'
        '409':
          description: |
            Reactiver (`enabled: true`) une seance passee (`reason: seance_past`) : sa
            fin connue est depassee de plus de 30 min. Desactiver reste permis.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RefusMotive'
        '500':
          description: |
            Erreur interne. Rattrapee par le service : avec `error`. Non
            rattrapee (gestionnaire global, par exemple un `seanceId` non
            numerique) : sans `error`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VisioErreurInterne'

  /activation:
    post:
      tags:
        - School registration
      summary: "Poser son mot de passe depuis un lien d'activation"
      description: |
        Route ANONYME par nature : celui qui active n'a pas encore de quoi
        s'authentifier. Le jeton EST l'autorisation.

        Le produit n'ayant aucun canal de courriel, le lien circule hors bande
        (WhatsApp, SMS, de vive voix). Il est a usage unique et expirant.

        Debit limite a 5 requetes par minute et par IP.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ActivationInput'
      responses:
        '200':
          description: "Mot de passe enregistre ; le titulaire peut se connecter."
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageOnly'
        '400':
          $ref: '#/components/responses/EtablissementInconnu'
        '403':
          $ref: '#/components/responses/EtablissementDesactive'
        '410':
          description: |
            Jeton inconnu, deja consomme, ou perime. Les trois cas rendent le
            MEME code : les distinguer dirait a un inconnu qu'un lien a existe
            pour cette valeur, donc qu'un compte l'attend.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: "Mot de passe absent, trop court, ou confirmation differente"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          description: "Trop de tentatives"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /lms/seances/{seanceId}/validate-participant:
    post:
      tags:
        - Visio
      summary: "Decider si un participant peut entrer dans une visio"
      description: |
        Reserve aux roles enseignant, coordinateur, admin et superAdmin. La
        decision ne lit que des donnees locales : aucun jeton KLASSCI n'est exige.

        `seanceId` est l'identifiant local de la seance ou son identifiant
        KLASSCI. `user_id` designe un compte du meme etablissement ; un compte
        supprime passe la validation de la requete, puis rend le 404.

        Decision : une visio `active` ou `programmee` se valide ; l'acteur doit
        etre coordinateur, administrateur, ou l'enseignant de la seance ; un
        enseignant cible doit etre celui de la seance ; un eleve cible doit etre
        inscrit dans la classe de la seance.

        La classe de la seance : sa classe locale (`classe_id`) pour une seance
        creee dans le LMS (`POST /lms/seances`), quel que soit le type d'ecole,
        l'inscription etant lue dans l'etablissement de la seance ; sinon sa
        classe KLASSCI (`klassci_classe_id`) pour une seance miroitee. Une seance
        sans classe refuse l'eleve (`no_classe_id`) : une seance creee dans le
        LMS sans classe, ou une seance activee par `toggle-visio`, qui efface sa
        classe KLASSCI.

        Un compte dont le role n'est ni du personnel ni un eleve recoit un REFUS
        rendu en 200 (`authorized: false`, `reason: invalid_role`).
      security:
        - sanctum: []
      parameters:
        - name: seanceId
          in: path
          required: true
          description: "Identifiant local de la seance, ou son identifiant KLASSCI."
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
                - user_id
              properties:
                user_id:
                  type: integer
                  description: "Un compte du meme etablissement. Sinon : 422."
      responses:
        '200':
          description: "Acces accorde, ou refus rendu en 200 (`invalid_role`)."
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ParticipantValide'
        '400':
          $ref: '#/components/responses/EtablissementInconnu'
        '401':
          description: "Jeton porteur absent ou invalide. Aucun jeton KLASSCI n'est exige ici."
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SeanceLocaleRefus'
        '403':
          description: |
            Sans `reason` : role non admis, ou etablissement desactive.
            `no_institution` : compte sans etablissement. Decision d'acces
            (`authorized: false`) : `visio_not_enabled` (seance absente ou visio
            non activee), `visio_ended`, `actor_not_authorized`,
            `teacher_not_owner`, `no_classe_id`, `not_enrolled`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RefusParticipant'
        '404':
          description: "Le compte designe par `user_id` a ete supprime."
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ParticipantIntrouvable'
        '422':
          description: "`user_id` absent, non entier, ou hors de l'etablissement."
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SeanceLocaleInvalide'
        '500':
          description: |
            Erreur interne. Rattrapee par le service : avec `error`. Non
            rattrapee (gestionnaire global) : sans `error`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VisioErreurInterne'

  /lms/seances/{seanceId}/join:
    post:
      tags:
        - Visio
      summary: "Entrer dans une visio"
      description: |
        Ouvert a tout compte de l'etablissement. Enregistre la presence, puis
        rend la cle d'entree du salon. Un coordinateur entre en observateur.

        `seanceId` est l'identifiant local de la seance, a defaut son
        identifiant KLASSCI. Seule une visio `active` s'ouvre ; l'etat est dit
        (400) AVANT que le droit d'entrer ne soit verifie (403). Le droit est
        celui de la validation d'un participant, l'appelant etant sa propre
        cible. La decision ne lit que des donnees locales : aucun jeton KLASSCI
        n'est exige.

        Une ecole en mode autonome active la visio de ses seances par
        `activate-visio`. Dans une ecole en mode KLASSCI, rien ne peut activer
        celle d'une seance creee dans le LMS : elle rend le 400
        `visio_not_enabled`. L'eleve entre s'il est inscrit dans la classe de
        la seance, telle que la validation d'un participant la decrit ; une
        seance sans classe le refuse (`no_classe_id`).
      security:
        - sanctum: []
      parameters:
        - name: seanceId
          in: path
          required: true
          description: "Identifiant local de la seance, ou son identifiant KLASSCI."
          schema:
            type: integer
      responses:
        '200':
          description: "Presence enregistree, cle d'entree du salon."
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VisioRejointe'
        '400':
          description: "La visio n'est pas active : programmee, terminee, ou non activee. Aussi, sans jeton : en-tete `X-Institution` d un etablissement inconnu ou inactif (ResolveInstitution, #961), avant le 401."
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VisioNonActive'
        '401':
          description: "Jeton porteur absent ou invalide. Aucun jeton KLASSCI n'est exige ici."
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SeanceLocaleRefus'
        '403':
          description: |
            Sans `reason` : etablissement desactive. `no_institution` : compte
            sans etablissement. Decision d'acces (`authorized: false`) :
            `visio_not_enabled`, `actor_not_authorized` (enseignant d'une autre
            seance, ou role sans droit), `no_classe_id`, `not_enrolled`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RefusParticipant'
        '404':
          description: "Aucune seance de cet identifiant dans l'etablissement."
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SeanceLocaleRefus'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '409':
          description: |
            Seance passee (`reason: seance_past`) : la fin est depassee et la visio n
            est plus active depuis moins de 4 h (`is_accessible`). Une visio demarree
            a temps reste joignable 4 h.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RefusMotive'
        '500':
          description: |
            Erreur interne. Rattrapee par le service : avec `error`. Non
            rattrapee (gestionnaire global) : sans `error`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VisioErreurInterne'

  /annonces:
    post:
      tags:
        - Notifications
      operationId: publierUneAnnonce
      summary: "Annoncer a toute une classe"
      description: |
        #1650. Le personnel de l ecole (admin, superAdmin, coordinateur ; l enseignant pour ses
        seules classes) annonce a toute une classe. L annonce est enregistree, et chaque eleve
        inscrit et ACTIF de la classe en recoit une notification `annonce` (`data.annonce_id`,
        `data.classe_id`). Les eleves viennent de la source d inscription de l ecole, dans les deux
        types d ecole.

        Si un canal de courriel existe, une tache en file ecrit aussi a chaque destinataire
        (`courriel` vrai) ; sans canal, aucun courriel (`courriel` faux). Une classe sans eleve
        n est pas une erreur : `destinataires` vaut 0.

        `classe_id` est l id de la classe dans l ESPACE SOURCE de l ecole (`ClasseDeLEspaceSource`,
        comme `/lms/classes/{classe}/resultats`) : l id KLASSCI dans une ecole KLASSCI, celui que
        donnent ses ecrans de classe ; l id local dans une ecole autonome. La reponse le rend tel
        quel. Limite nommee `annonce` (10 par minute et par compte).
      security:
        - sanctum: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
                - classe_id
                - titre
                - message
              properties:
                classe_id:
                  type: integer
                  minimum: 1
                titre:
                  type: string
                  maxLength: 150
                message:
                  type: string
                  maxLength: 2000
      responses:
        '201':
          description: "Annonce envoyee"
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                  - success
                  - message
                  - data
                properties:
                  success:
                    type: boolean
                  message:
                    type: string
                  data:
                    type: object
                    additionalProperties: false
                    required:
                      - id
                      - classe_id
                      - titre
                      - destinataires
                      - courriel
                    properties:
                      id:
                        type: integer
                      classe_id:
                        type: integer
                      titre:
                        type: string
                      destinataires:
                        type: integer
                        minimum: 0
                        description: "Le nombre d eleves prevenus."
                      courriel:
                        type: boolean
                        description: "Vrai si un courriel part aussi (canal disponible et au moins un eleve)."
        '400':
          $ref: '#/components/responses/EtablissementInconnu'
        '401':
          description: "Non authentifie"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageOnly'
        '403':
          description: |
            Role hors du personnel de l ecole (eleve), ou enseignant hors de ses classes. Aussi,
            sans `reason` : etablissement desactive ou supprime (ResolveInstitution, #961).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageOnly'
        '404':
          description: |
            Classe introuvable : absente, supprimee, d une AUTRE ecole, ou designee hors de
            l espace source (un id local dans une ecole KLASSCI). Le meme corps dans tous les cas
            (isolation).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageOnly'
        '422':
          description: "Classe, titre (150 au plus) ou message (2 000 au plus) absent ou invalide."
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationFailed'
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /eleves/{eleve}/dossier:
    get:
      tags:
        - Eleves
      operationId: lireLeDossierDeLEleve
      summary: "Lire le dossier d un eleve"
      description: |
        #1657. La gestion et l eleve lui-meme lisent tout. Un enseignant d une classe de l eleve ne lit
        que `matricule`, `nom`, `prenoms` et `photo_url` (loi 2013-450). Tout autre compte : 403. Un eleve
        d une autre ecole, un compte qui n est pas un eleve, ou un id absent : 404, du meme corps.

        `source` : `lms` (ecole autonome ; `dossier` est nul tant qu il n existe pas) ou `klassci` (ce que
        le LMS recoit de KLASSCI, nom et prenom ; les autres champs sont nuls, non fournis).
      security:
        - sanctum: []
      parameters:
        - name: eleve
          in: path
          required: true
          description: "Identifiant LOCAL du compte eleve."
          schema:
            type: integer
      responses:
        '200':
          description: "Le dossier, selon le lecteur"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DossierDEleveReponse'
        '400':
          $ref: '#/components/responses/EtablissementInconnu'
        '401':
          description: "Non authentifie"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageOnly'
        '403':
          description: "Ni la gestion, ni l eleve lui-meme, ni un enseignant d une de ses classes. Aussi, sans `reason` : etablissement desactive ou supprime (ResolveInstitution, #961)."
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageOnly'
        '404':
          description: "Eleve introuvable dans l etablissement."
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageOnly'
        '429':
          $ref: '#/components/responses/TooManyRequests'
    put:
      tags:
        - Eleves
      operationId: ecrireLeDossierDeLEleve
      summary: "Creer ou mettre a jour le dossier d un eleve (ecole autonome)"
      description: |
        #1657. Gestion d une ecole autonome. Cree le dossier (201) ou le met a jour (200) ; seuls les
        champs recus changent. Le matricule est GENERE a la creation selon le gabarit de l ecole
        (`{AAAA}-{NNNN}` par defaut), ou saisi : unique dans l ecole (422 sinon). `nom` et `prenoms`
        vivent dans le dossier ; le nom du compte en est recalcule.

        Doublon possible (memes nom, prenoms et date de naissance sans casse ni accents, ou meme
        telephone) : 409 `doublon_possible` avec `candidats`, sauf `confirmer_doublon`. Ecole KLASSCI :
        403 `catalogue_managed_by_klassci`. Aucun champ libre (loi 2013-450).
      security:
        - sanctum: []
      parameters:
        - name: eleve
          in: path
          required: true
          description: "Identifiant LOCAL du compte eleve."
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
                - nom
                - prenoms
              properties:
                matricule:
                  type: string
                  maxLength: 40
                nom:
                  type: string
                  maxLength: 100
                prenoms:
                  type: string
                  maxLength: 150
                genre:
                  type: string
                  enum: [F, M]
                  nullable: true
                date_naissance:
                  type: string
                  format: date
                  nullable: true
                lieu_naissance:
                  type: string
                  maxLength: 100
                  nullable: true
                nationalite:
                  type: string
                  description: "Code pays ISO 3166-1 alpha-2."
                  nullable: true
                adresse:
                  type: string
                  maxLength: 255
                  nullable: true
                ville:
                  type: string
                  maxLength: 100
                  nullable: true
                commune:
                  type: string
                  maxLength: 100
                  nullable: true
                statut:
                  type: string
                  enum: [actif, suspendu, diplome, parti]
                confirmer_doublon:
                  type: boolean
      responses:
        '200':
          description: "Dossier mis a jour"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DossierDEleveReponse'
        '201':
          description: "Dossier cree"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DossierDEleveReponse'
        '400':
          $ref: '#/components/responses/EtablissementInconnu'
        '401':
          description: "Non authentifie"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageOnly'
        '403':
          description: "Hors de la gestion ; ou ecole KLASSCI (`reason: catalogue_managed_by_klassci`). Aussi, sans `reason` : etablissement desactive ou supprime (ResolveInstitution, #961)."
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageOnly'
        '404':
          description: "Eleve introuvable dans l etablissement."
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageOnly'
        '409':
          description: "Un eleve semblable existe deja (`reason: doublon_possible`) : rien n est ecrit."
          content:
            application/json:
              schema:
                type: object
                required:
                  - success
                  - message
                  - reason
                  - candidats
                properties:
                  success:
                    type: boolean
                  message:
                    type: string
                  reason:
                    type: string
                    enum: [doublon_possible]
                  candidats:
                    type: array
                    items:
                      type: object
                      required:
                        - eleve_id
                        - nom
                        - prenoms
                        - matricule
                      properties:
                        eleve_id:
                          type: integer
                        nom:
                          type: string
                        prenoms:
                          type: string
                        matricule:
                          type: string
        '422':
          description: "Champ absent ou invalide ; matricule deja pris dans l ecole."
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationFailed'
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /eleves/{eleve}/photo:
    get:
      tags:
        - Eleves
      operationId: lireLaPhotoDeLEleve
      summary: "La photo d un eleve"
      description: |
        #1657 (PR 2). Servie par cette route seule, jamais par une URL publique, selon les regles de
        lecture du dossier : la gestion, l eleve lui-meme, un enseignant d une de ses classes. Une image
        JPEG re-encodee par le serveur.
      security:
        - sanctum: []
      parameters:
        - name: eleve
          in: path
          required: true
          description: "Identifiant LOCAL du compte eleve."
          schema:
            type: integer
      responses:
        '200':
          description: "La photo"
          content:
            image/jpeg:
              schema:
                type: string
                format: binary
        '400':
          $ref: '#/components/responses/EtablissementInconnu'
        '401':
          description: "Non authentifie"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageOnly'
        '403':
          description: "Ni la gestion, ni l eleve lui-meme, ni un enseignant d une de ses classes. Aussi, sans `reason` : etablissement desactive ou supprime (ResolveInstitution, #961)."
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageOnly'
        '404':
          description: "Eleve introuvable dans l etablissement, ou sans photo."
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageOnly'
        '429':
          $ref: '#/components/responses/TooManyRequests'
    post:
      tags:
        - Eleves
      operationId: deposerLaPhotoDeLEleve
      summary: "Deposer la photo d un eleve (ecole autonome)"
      description: |
        #1657 (PR 2). Gestion d une ecole autonome, sur un eleve qui a un dossier. Une image JPEG, PNG ou
        WebP (type lu sur le contenu), 5 Mo au plus. Le serveur la DECODE puis la RE-ENCODE en JPEG, 512 px
        au plus de cote : le fichier d origine et ses metadonnees ne sont jamais gardes. Stockage prive.
        Remplace la photo precedente (201 la premiere fois, 200 ensuite).
      security:
        - sanctum: []
      parameters:
        - name: eleve
          in: path
          required: true
          description: "Identifiant LOCAL du compte eleve."
          schema:
