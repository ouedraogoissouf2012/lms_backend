  /lms/visio/consent:
    post:
      tags:
        - Visio
      summary: "Deposer son consentement de captation visio"
      description: |
        Les trois finalites sont obligatoires et independantes : accepter
        d'etre filme pour le groupe n'est pas accepter la rediffusion, ni la
        reutilisation sur une autre session.

        Le sujet est TOUJOURS le porteur du jeton : aucun `user_id` n'est
        accepte dans la charge utile.

        La table de consentements est append-only — chaque depot y ajoute trois
        lignes et n'en retire aucune. D'ou la limite de 10 requetes par minute.
      security:
        - sanctum: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VisioConsentInput'
      responses:
        '200':
          description: "Consentement enregistre ; l'etat courant des trois finalites est renvoye."
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VisioConsentState'
        '401':
          description: "Non authentifie"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: |
            Charge invalide, ou compte sans etablissement — un consentement se
            rattache a un etablissement.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          description: "Trop de depots successifs"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    get:
      tags:
        - Visio
      summary: "Lire son consentement de captation visio"
      security:
        - sanctum: []
      responses:
        '200':
          description: "Etat courant des trois finalites pour le porteur du jeton."
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VisioConsentState'
        '401':
          description: "Non authentifie"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /lms/seances/upcoming:
    get:
      tags:
        - Visio
      operationId: listUpcomingSeances
      summary: "Les seances a venir de l'utilisateur"
      description: |
        Les ecrans Seances et Visio, et le calendrier de la gestion. Sans garde
        de role. La source est choisie par le mode DECLARE de l'ecole, au point
        de liaison.

        **Ecole creee depuis KLASSCI.** Le jeton KLASSCI PERSONNEL est exige
        (sinon 401 `klassci_token_missing`). La gestion lit les seances miroirs
        du LMS, avec les ids KLASSCI ; les autres roles, l'emploi du temps
        KLASSCI de leurs matieres.

        **Ecole creee depuis le LMS**, ou basculee. Les seances locales, avec
        les ids LOCAUX, sans jeton et sans aucun appel a KLASSCI. La gestion lit
        toutes les seances de l'ecole ; un enseignant les siennes (son compte en
        est l'auteur) ; un eleve, et tout role non reconnu, celles de ses classes
        a inscription active, moins celles qu'il a masquees. Une seance sans
        classe n'est montree a aucun eleve.

        Dans les deux ecoles : seances actives, du jour a `days` jours, triees
        par date. `teacher_id` ne filtre que pour la gestion (l'auteur, en ecole
        creee depuis le LMS) ; `classe_id` filtre pour tous, dans ce qu'ils
        voient deja.
      security:
        - sanctum: []
      parameters:
        - name: days
          in: query
          schema:
            type: integer
            default: 30
        - name: teacher_id
          in: query
          schema:
            type: integer
        - name: classe_id
          in: query
          schema:
            type: integer
      responses:
        '200':
          description: "Les seances, et la fenetre lue"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SeancesAVenir'
        '401':
          $ref: '#/components/responses/KlassciUnauthorized'
        '403':
          description: "Etablissement desactive, compte sans etablissement (`no_institution`), ou refus de KLASSCI relaye."
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RefusClasseEleves'
        '500':
          description: "Defaillance interne, rapportee une fois au journal, sans le message ni les valeurs d'une requete."
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VisioErreurInterne'
        '503':
          description: "Ecole creee depuis KLASSCI : KLASSCI indisponible."
          headers:
            Retry-After:
              schema:
                type: integer
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KlassciIndisponible'

  /lms/seances/my-teaching:
    get:
      tags:
        - Visio
      operationId: listMyTeachingSeances
      summary: "L'emploi du temps de l'enseignant"
      description: |
        Reservee a `enseignant` et `coordinateur`. Fenetre glissante de six mois
        de part et d'autre du jour.

        **Ecole creee depuis KLASSCI.** Les seances KLASSCI des matieres de
        l'enseignant, avec le jeton KLASSCI PERSONNEL (sinon 401
        `klassci_token_missing`).

        **Ecole creee depuis le LMS**, ou basculee. Les seances locales actives
        dont ce compte est l'auteur, avec les ids LOCAUX, sans aucun appel a
        KLASSCI.
      security:
        - sanctum: []
      responses:
        '200':
          description: "Les seances de l'enseignant"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SeancesListe'
        '401':
          $ref: '#/components/responses/KlassciUnauthorized'
        '403':
          description: "Role hors de `enseignant` et `coordinateur`, etablissement desactive, compte sans etablissement (`no_institution`), ou refus de KLASSCI relaye."
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RefusClasseEleves'
        '500':
          description: "Defaillance interne, rapportee une fois au journal, sans le message ni les valeurs d'une requete."
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VisioErreurInterne'
        '503':
          description: "Ecole creee depuis KLASSCI : KLASSCI indisponible."
          headers:
            Retry-After:
              schema:
                type: integer
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KlassciIndisponible'

  /lms/seances/my-classes:
    get:
      tags:
        - Visio
      operationId: listMyClassesSeances
      summary: "L'emploi du temps de l'eleve"
      description: |
        Sans garde de role. Fenetre glissante de six mois de part et d'autre du
        jour.

        **Ecole creee depuis KLASSCI.** Les seances KLASSCI de la classe de
        l'eleve, avec le jeton KLASSCI PERSONNEL (sinon 401
        `klassci_token_missing`). Une classe sans matiere rend 200, une liste
        vide et un message.

        **Ecole creee depuis le LMS**, ou basculee. Les seances locales actives
        des classes ou ce compte est inscrit (inscription active), moins celles
        qu'il a masquees, avec les ids LOCAUX, sans aucun appel a KLASSCI.

        Sans classe : 404.
      security:
        - sanctum: []
      responses:
        '200':
          description: "Les seances de l'eleve"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SeancesListe'
        '401':
          $ref: '#/components/responses/KlassciUnauthorized'
        '403':
          description: "Etablissement desactive, compte sans etablissement (`no_institution`), ou refus de KLASSCI relaye."
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RefusClasseEleves'
        '404':
          description: "Aucune classe : `Aucune classe trouvee pour cet etudiant`."
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RefusClasseEleves'
        '500':
          description: "Defaillance interne, rapportee une fois au journal, sans le message ni les valeurs d'une requete."
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VisioErreurInterne'
        '503':
          description: "Ecole creee depuis KLASSCI : KLASSCI indisponible."
          headers:
            Retry-After:
              schema:
                type: integer
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KlassciIndisponible'

  /lms/seances/{seanceId}/activate-visio:
    post:
      tags:
        - Visio
      summary: "Activer la visio d'une seance"
      description: |
        Reserve aux roles enseignant et coordinateur. Un salon deja attribue est
        conserve. La source suit le mode de l'etablissement, le client ne le lit
        pas.

        Ecole en mode KLASSCI : la seance est cherchee dans l'emploi du temps
        KLASSCI, parmi des matieres : celles du tableau de bord pour un
        enseignant, le catalogue des matieres pour un coordinateur. `seanceId`
        est l'identifiant KLASSCI de la seance. La route lit KLASSCI avec le
        jeton KLASSCI du compte. Sans ce jeton, elle rend le 401
        `klassci_token_missing` avant toute ecriture. Une panne de KLASSCI
        pendant la recherche (jeton refuse, service indisponible) rend le 500,
        sans motif ni `Retry-After`. Une reponse de KLASSCI qui ne livre aucune
        matiere, echec declare (`success: false`) compris, rend le 404.

        Ecole en mode autonome (creee depuis le LMS, ou creee depuis KLASSCI
        puis passee en mode autonome) : `seanceId` est l'identifiant LOCAL de la
        seance, cherchee dans l'etablissement du compte. Aucun jeton KLASSCI
        n'est lu, aucun appel KLASSCI n'est fait, et rien n'est ecrit sous un nom
        `klassci_*`. La seance est activee par qui la gere : son auteur, ou un
        coordinateur de l'etablissement ; tout autre enseignant recoit le 403
        `actor_not_authorized`.
      security:
        - sanctum: []
      parameters:
        - name: seanceId
          in: path
          required: true
          description: "Identifiant KLASSCI de la seance (ecole en mode KLASSCI), ou son identifiant local (ecole en mode autonome)."
          schema:
            type: integer
      responses:
        '200':
          description: "Visio activee, en statut `programmee`."
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VisioActivee'
        '401':
          description: |
            Jeton porteur absent ou invalide (sans `reason`), ou compte sans jeton
            KLASSCI (`reason: klassci_token_missing`). Voir la reponse partagee
            `KlassciUnauthorized`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RefusKlassci'
        '403':
          description: |
            Sans `reason` : role non admis (refuse par la garde de role ; un
            superAdmin, que cette garde laisse passer, est refuse par la requete
            avec un message generique), ou etablissement desactive. Avec
            `reason: no_institution` : compte sans etablissement. Avec
            `reason: actor_not_authorized` (ecole en mode autonome) : un
            enseignant qui ne gere pas la seance.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/SeanceLocaleInterdite'
                  - $ref: '#/components/schemas/VisioGestionRefusee'
        '404':
          description: |
            Ecole en mode KLASSCI : aucune seance de cet identifiant dans l'emploi
            du temps KLASSCI des matieres lues, ou aucune matiere lue. Ecole en
            mode autonome : aucune seance de cet identifiant dans l'etablissement
            du compte.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SeanceLocaleRefus'
        '500':
          description: |
            Erreur interne, y compris une panne de KLASSCI pendant la recherche.
            Rattrapee par le service : avec `error`. Non rattrapee (gestionnaire
            global, par exemple un `seanceId` non numerique) : sans `error`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VisioErreurInterne'

  /lms/seances/{seanceId}/toggle-visio:
    post:
      tags:
        - Visio
      summary: "Activer ou desactiver la visio d'une seance KLASSCI"
      description: |
        Reserve aux roles coordinateur et superAdmin.

        `seanceId` est l'identifiant KLASSCI de la seance. La bascule ne verifie
        pas que KLASSCI connait cette seance : un identifiant inconnu cree une
        seance locale sous cet identifiant, et la reponse est 200. Chaque
        activation tire un salon neuf, y compris sur une seance deja activee :
        l'adresse precedente cesse de valoir.

        Sans jeton KLASSCI, la route rend le 401 `klassci_token_missing` avant
        toute ecriture. Le refus porte sur le jeton du compte, pas sur le type
        ni le mode de l'ecole. Un compte d'une ecole creee depuis le LMS n'a
        jamais de jeton KLASSCI : il recoit ce 401. Une ecole creee depuis
        KLASSCI passee en mode autonome garde les jetons de ses comptes : ils
        ne sont pas refuses.
      security:
        - sanctum: []
      parameters:
        - name: seanceId
          in: path
          required: true
          description: "Identifiant KLASSCI de la seance."
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VisioBasculeInput'
      responses:
        '200':
          description: "Visio activee (`enabled: true`) ou desactivee (`enabled: false`)."
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VisioBasculee'
        '401':
          description: |
            Jeton porteur absent ou invalide (sans `reason`), ou compte sans jeton
            KLASSCI (`reason: klassci_token_missing`). Voir la reponse partagee
            `KlassciUnauthorized`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RefusKlassci'
        '403':
          description: |
            Sans `reason` : role non admis, ou etablissement desactive. Avec
            `reason: no_institution` : compte sans etablissement.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SeanceLocaleInterdite'
        '422':
          description: "Charge invalide"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SeanceLocaleInvalide'
        '500':
          description: |
            Erreur interne. Rattrapee par le service : avec `error`. Non
            rattrapee (gestionnaire global, par exemple un `seanceId` non
            numerique) : sans `error`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VisioErreurInterne'

  /activation:
    post:
      tags:
        - School registration
      summary: "Poser son mot de passe depuis un lien d'activation"
      description: |
        Route ANONYME par nature : celui qui active n'a pas encore de quoi
        s'authentifier. Le jeton EST l'autorisation.

        Le produit n'ayant aucun canal de courriel, le lien circule hors bande
        (WhatsApp, SMS, de vive voix). Il est a usage unique et expirant.

        Debit limite a 5 requetes par minute et par IP.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ActivationInput'
      responses:
        '200':
          description: "Mot de passe enregistre ; le titulaire peut se connecter."
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageOnly'
        '410':
          description: |
            Jeton inconnu, deja consomme, ou perime. Les trois cas rendent le
            MEME code : les distinguer dirait a un inconnu qu'un lien a existe
            pour cette valeur, donc qu'un compte l'attend.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: "Mot de passe absent, trop court, ou confirmation differente"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          description: "Trop de tentatives"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /lms/seances/{seanceId}/validate-participant:
    post:
      tags:
        - Visio
      summary: "Decider si un participant peut entrer dans une visio"
      description: |
        Reserve aux roles enseignant, coordinateur, admin et superAdmin. La
        decision ne lit que des donnees locales : aucun jeton KLASSCI n'est exige.

        `seanceId` est l'identifiant local de la seance ou son identifiant
        KLASSCI. `user_id` designe un compte du meme etablissement ; un compte
        supprime passe la validation de la requete, puis rend le 404.

        Decision : une visio `active` ou `programmee` se valide ; l'acteur doit
        etre coordinateur, administrateur, ou l'enseignant de la seance ; un
        enseignant cible doit etre celui de la seance ; un eleve cible doit etre
        inscrit dans la classe de la seance.

        La classe de la seance : sa classe locale (`classe_id`) pour une seance
        creee dans le LMS (`POST /lms/seances`), quel que soit le type d'ecole,
        l'inscription etant lue dans l'etablissement de la seance ; sinon sa
        classe KLASSCI (`klassci_classe_id`) pour une seance miroitee. Une seance
        sans classe refuse l'eleve (`no_classe_id`) : une seance creee dans le
        LMS sans classe, ou une seance activee par `toggle-visio`, qui efface sa
        classe KLASSCI.

        Un compte dont le role n'est ni du personnel ni un eleve recoit un REFUS
        rendu en 200 (`authorized: false`, `reason: invalid_role`).
      security:
        - sanctum: []
      parameters:
        - name: seanceId
          in: path
          required: true
          description: "Identifiant local de la seance, ou son identifiant KLASSCI."
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
                - user_id
              properties:
                user_id:
                  type: integer
                  description: "Un compte du meme etablissement. Sinon : 422."
      responses:
        '200':
          description: "Acces accorde, ou refus rendu en 200 (`invalid_role`)."
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ParticipantValide'
        '401':
          description: "Jeton porteur absent ou invalide. Aucun jeton KLASSCI n'est exige ici."
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SeanceLocaleRefus'
        '403':
          description: |
            Sans `reason` : role non admis, ou etablissement desactive.
            `no_institution` : compte sans etablissement. Decision d'acces
            (`authorized: false`) : `visio_not_enabled` (seance absente ou visio
            non activee), `visio_ended`, `actor_not_authorized`,
            `teacher_not_owner`, `no_classe_id`, `not_enrolled`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RefusParticipant'
        '404':
          description: "Le compte designe par `user_id` a ete supprime."
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ParticipantIntrouvable'
        '422':
          description: "`user_id` absent, non entier, ou hors de l'etablissement."
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SeanceLocaleInvalide'
        '500':
          description: |
            Erreur interne. Rattrapee par le service : avec `error`. Non
            rattrapee (gestionnaire global) : sans `error`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VisioErreurInterne'

  /lms/seances/{seanceId}/join:
    post:
      tags:
        - Visio
      summary: "Entrer dans une visio"
      description: |
        Ouvert a tout compte de l'etablissement. Enregistre la presence, puis
        rend la cle d'entree du salon. Un coordinateur entre en observateur.

        `seanceId` est l'identifiant local de la seance, a defaut son
        identifiant KLASSCI. Seule une visio `active` s'ouvre ; l'etat est dit
        (400) AVANT que le droit d'entrer ne soit verifie (403). Le droit est
        celui de la validation d'un participant, l'appelant etant sa propre
        cible. La decision ne lit que des donnees locales : aucun jeton KLASSCI
        n'est exige.

        Une ecole en mode autonome active la visio de ses seances par
        `activate-visio`. Dans une ecole en mode KLASSCI, rien ne peut activer
        celle d'une seance creee dans le LMS : elle rend le 400
        `visio_not_enabled`. L'eleve entre s'il est inscrit dans la classe de
        la seance, telle que la validation d'un participant la decrit ; une
        seance sans classe le refuse (`no_classe_id`).
      security:
        - sanctum: []
      parameters:
        - name: seanceId
          in: path
          required: true
          description: "Identifiant local de la seance, ou son identifiant KLASSCI."
          schema:
            type: integer
      responses:
        '200':
          description: "Presence enregistree, cle d'entree du salon."
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VisioRejointe'
        '400':
          description: "La visio n'est pas active : programmee, terminee, ou non activee."
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VisioNonActive'
        '401':
          description: "Jeton porteur absent ou invalide. Aucun jeton KLASSCI n'est exige ici."
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SeanceLocaleRefus'
        '403':
          description: |
            Sans `reason` : etablissement desactive. `no_institution` : compte
            sans etablissement. Decision d'acces (`authorized: false`) :
            `visio_not_enabled`, `actor_not_authorized` (enseignant d'une autre
            seance, ou role sans droit), `no_classe_id`, `not_enrolled`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RefusParticipant'
        '404':
          description: "Aucune seance de cet identifiant dans l'etablissement."
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SeanceLocaleRefus'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          description: |
            Erreur interne. Rattrapee par le service : avec `error`. Non
            rattrapee (gestionnaire global) : sans `error`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VisioErreurInterne'

  /admin/audit-log:
    get:
      tags:
        - Audit
      summary: "Le journal d'audit, toutes ecoles confondues"
      description: |
        Route PLATEFORME (D51) : reservee au supradmin, qui lit les entrees de
        toutes les ecoles pour diagnostiquer. Le superAdmin d'une ecole n'y a pas
        acces. Lecture seule, triee de la plus recente a la plus ancienne.

        Chaque entree porte son ecole, `institution: {id, name}` (D127), y compris
        une ecole supprimee depuis (suppression logique). `institution` vaut
        `null` quand l'entree n'a pas d'ecole (`institution_id` nul), ou quand
        l'ecole a ete purgee physiquement depuis. L'ecole d'une entree est celle
        de l'utilisateur authentifie AU MOMENT de l'ecriture : les connexions
        (`login`, `login_failed`) et les actions du supradmin n'en ont pas.

        Le filtre `action` n'accepte que les neuf valeurs historiques ; les
        actions plus recentes (voir `AuditLogEntry.action`) se lisent sans filtre.
      security:
        - sanctum: []
      parameters:
        - name: per_page
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 50
        - name: page
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
        - name: action
          in: query
          required: false
          schema:
            type: string
            enum: [create, update, delete, view, export, import, login, logout, login_failed]
        - name: user_id
          in: query
          required: false
          schema:
            type: integer
      responses:
        '200':
          description: "Une page du journal"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuditLogPage'
        '401':
          description: "Non authentifie"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuditLogRefus'
        '403':
          description: "Reserve au supradmin plateforme (le superAdmin d'une ecole est refuse)"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuditLogRefus'
        '422':
          description: "Filtre invalide (`per_page` hors de 1-100, `action` hors liste, `user_id` inconnu)"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationFailed'

  /admin/school-requests:
    get:
      tags:
        - School registration
      summary: "La file des demandes d'ouverture en attente"
      description: |
        Reserve au supradmin PLATEFORME (`role:supradmin` + `platform.supradmin`).

        Seules les demandes en attente sont listees : une demande tranchee
        n'appelle plus de decision. Paginee — cette file est alimentee par un
        endpoint anonyme, et un throttle borne le debit d'entree, pas le volume
        accumule.
      security:
        - sanctum: []
      parameters:
        - name: per_page
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 25
      responses:
        '200':
          description: "Page de demandes en attente"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SchoolRequestQueue'
        '401':
          description: "Non authentifie"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: "Reserve au supradmin plateforme"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /admin/school-requests/{schoolRequest}/validate:
    post:
      tags:
        - School registration
      summary: "Valider une demande : ouvrir l'ecole et son premier compte"
      description: |
        UNE transaction : l'institution (autonome, `klassci_api_url` a null), son
        premier compte en `superAdmin`, et le passage de la demande en validee.
        Si l'une echoue, aucune n'est ecrite.

        Aucun mot de passe n'est choisi ni transmis. La reponse contient un LIEN
        D'ACTIVATION a usage unique, affiche UNE SEULE FOIS : il n'est stocke
        nulle part en clair et ne sera pas reaffiche.

        Le `slug` du corps est facultatif : le demandeur n'a exprime qu'un
        souhait, jamais une reservation, et c'est ici que le supradmin arbitre
        une collision avec un etablissement existant.
      security:
        - sanctum: []
      parameters:
        - name: schoolRequest
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                slug:
                  type: string
                  maxLength: 50
                  pattern: '^[a-z0-9\-]+$'
                  nullable: true
      responses:
        '200':
          description: "Ecole ouverte ; le lien d'activation est renvoye une seule fois."
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SchoolRequestValidated'
        '401':
          description: "Non authentifie"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: "Reserve au supradmin plateforme"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: "Demande deja tranchee"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          description: |
            `ACTIVATION_URL_FRONT` n'est pas configuree : le lien serait mort
            chez son destinataire. Refus fail-closed, rien n'est ecrit.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /admin/school-requests/{schoolRequest}/refuse:
    post:
      tags:
        - School registration
      summary: "Refuser une demande d'ouverture"
      description: |
        Le motif est OBLIGATOIRE : le demandeur peut redeposer un dossier —
        l'unicite partielle ne borne que les demandes en attente — et
        l'exploitant doit pouvoir savoir pourquoi il avait tranche.

        Ne cree ni institution ni compte.
      security:
        - sanctum: []
      parameters:
        - name: schoolRequest
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - motif_refus
              properties:
                motif_refus:
                  type: string
                  minLength: 10
                  maxLength: 2000
      responses:
        '200':
          description: "Demande refusee"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageOnly'
        '401':
          description: "Non authentifie"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: "Reserve au supradmin plateforme"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: "Demande deja tranchee"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: "Motif absent ou trop court"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /admin/institutions/{id}/mode:
    patch:
      tags:
        - Institutions
      summary: "Basculer le mode d'un etablissement"
      description: |
        Declare si l'etablissement tient sa propre liste d'inscrits
        (`standalone`) ou la recoit de KLASSCI (`klassci`).

        Le mode voulu est EXIGE dans le corps, il n'est pas inverse : avec deux
        valeurs aujourd'hui et une troisieme possible demain, une inversion
        implicite deviendrait un piege.

        Cette bascule a sa propre route pour ne jamais etre l'effet de bord d'un
        `PUT` de branding. Elle est tracee dans `audit_logs`
        (`institution.mode_changed`).

        Ce qu'elle change : l'inscription locale devient permise ou interdite —
        l'assistant d'import et la capacite publiee a la connexion. Ce qu'elle ne
        change PAS : les inscriptions deja ecrites et l'acces des eleves a leurs
        cours, la source d'inscription ne consultant jamais le mode. La bascule
        est donc reversible.
      security:
        - sanctum: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - mode
              properties:
                mode:
                  type: string
                  enum: [klassci, standalone]
      responses:
        '200':
          description: "Mode mis a jour ; l'institution est renvoyee a jour."
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  message:
                    type: string
                  data:
                    type: object
        '401':
          description: "Non authentifie"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: "Reserve au supradmin plateforme"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: "Institution introuvable"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: "Mode absent ou hors de la liste fermee"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /programs:
    post:
      tags:
        - Session de formation
      summary: "Creer un Programme"
      description: |
        Le Programme est le contenu pedagogique VERSIONNABLE : il ne porte ni
        dates ni tarif. Ceux-la vivent sur la Periode — poser le tarif ici
        obligerait a dupliquer le contenu pour chaque variante tarifaire.

        `institution_id` n est jamais accepte : il vient du tenant resolu.
        `version` non plus — un Programme nait en version 1.

        Reserve aux roles coordinateur, admin et superAdmin : organiser une
        formation est un acte de gestion.
      security:
        - sanctum: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProgramInput'
      responses:
        '201':
          description: "Programme cree"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProgramCreated'
        '401':
          description: "Non authentifie"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: "Role insuffisant"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: "Charge invalide"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /lms/classes/{classeId}/etudiants:
    get:
      tags:
        - Classes
      summary: "Les eleves actifs d'une classe"
      description: |
        Reserve aux roles enseignant, coordinateur et admin, alias compris
        (`teacher`, `coordinator`, `administrateur`, `administrator`). La garde de
        role laisse aussi passer `superAdmin`. La source est choisie par le mode
        DECLARE de l'ecole, au point de liaison, jamais par le client.

        **Ecole creee depuis le LMS**, ou basculee en mode autonome. `classeId`
        est l'identifiant local. Les eleves dont l'inscription est active, lus
        dans les tables locales, sans aucun appel a KLASSCI : toute classe de
        l'etablissement pour la gestion, une classe ou il est designe formateur
        pour un enseignant. Sinon, 404. Ecart connu : la garde de role admet
        l'alias `administrator`, que la grille d'acces ne reconnait pas ; un tel
        compte y est traite comme un eleve, et recoit 404.

        **Ecole creee depuis KLASSCI.** `classeId` est l'identifiant KLASSCI. Lit
        le roster dans l'enveloppe KLASSCI `classes/{id}`, avec le jeton KLASSCI
        du compte, et ne garde que les eleves de statut `actif` ou sans statut.
        Sans jeton KLASSCI, la route rend le 401 `klassci_token_missing` avant
        tout appel.

        Un refus de KLASSCI (4xx) est relaye avec son statut et le message du
        catalogue, jamais le message amont : 401 (`klassci_session_expired`),
        403, et tout autre code de 400 a 499. Une panne de KLASSCI, une reponse
        illisible ou une enveloppe sans roster rendent le 503, avec
        `Retry-After`. Une reponse 2xx en echec (`success: false`, ou sans
        roster) n'est gardee en cache que ce delai ; les autres erreurs ne sont
        pas gardees.
      security:
        - sanctum: []
      parameters:
        - name: classeId
          in: path
          required: true
          description: "Identifiant KLASSCI dans une ecole creee depuis KLASSCI, identifiant local dans une ecole creee depuis le LMS."
          schema:
            type: integer
      responses:
        '200':
          description: "Les eleves actifs de la classe, et leur nombre."
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClasseEleves'
        '400':
          description: |
            Requete refusee par KLASSCI, relayee (message par defaut du
            catalogue). Ou, sans jeton porteur, un en-tete `X-Institution`
            inconnu : refuse avant l'authentification.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RefusClasseEleves'
        '401':
          description: |
            Jeton porteur absent ou invalide (sans `reason`). Dans une ecole creee
            depuis KLASSCI : compte sans jeton KLASSCI (`reason:
            klassci_token_missing`), ou session refusee par KLASSCI (`reason:
            klassci_session_expired`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RefusKlassci'
        '403':
          description: |
            Sans `reason` : role non admis, etablissement desactive, ou refus de
            KLASSCI relaye. `no_institution` : compte sans etablissement.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RefusClasseEleves'
        '404':
          description: |
            « Classe non trouvee » : dans une ecole creee depuis le LMS, une
            classe que l'appelant n'atteint pas. Ou aucune donnee KLASSCI pour ce
            compte, relaye.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RefusClasseEleves'
        '409':
          description: "Conflit signale par KLASSCI, relaye."
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RefusClasseEleves'
        '422':
          description: "Donnees refusees par KLASSCI, relaye. Sans detail par champ."
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RefusClasseEleves'
        '429':
          description: |
            KLASSCI limite les requetes, relaye, SANS son en-tete `Retry-After`.
            La route elle-meme n'a pas de limite propre.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RefusClasseEleves'
        '4XX':
          description: |
            Tout autre refus de KLASSCI de 400 a 499 est relaye avec son statut et
            le message par defaut du catalogue.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RefusClasseEleves'
        '500':
          description: |
            Erreur interne. Rattrapee par le controleur : avec `error`. Sans
            `error` : erreur sans detail, ou gestionnaire global (par exemple un
            `classeId` non numerique).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VisioErreurInterne'
        '503':
          description: |
            KLASSCI indisponible (panne, circuit ouvert, transport, URL absente),
            reponse illisible, ou enveloppe sans roster.
          headers:
            Retry-After:
              schema:
                type: integer
              description: "Secondes a attendre avant de reessayer."
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KlassciIndisponible'

  /classes:
    post:
      tags:
        - Session de formation
      summary: "Creer une Classe sans KLASSCI"
      description: |
        Avant cette route, le SEUL createur d une Classe du depot etait la
        synchronisation KLASSCI : une ecole autonome n en avait aucune, jamais,
        et l import CSV produisait des apprenants qui n appartenaient a rien.

        Reservee aux etablissements qui tiennent leur propre catalogue. Le droit
        est une CAPACITE verifiee au point d ecriture, jamais une comparaison de
        mode : un etablissement branche a KLASSCI recoit 403, parce que deux
        sources ecrivant la meme realite est la cause racine de #673.

        `institution_id` et `klassci_id` ne sont JAMAIS acceptes : le premier
        vient du tenant resolu, et une classe locale n a pas d identifiant
        KLASSCI — lui en inventer un la rendrait indiscernable d une classe
        miroitee.

        L unicite du `code` est portee par la BASE et non par une validation
        prealable, qui ouvrirait une fenetre que deux requetes concurrentes
        franchiraient toutes les deux.
      security:
        - sanctum: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ClasseInput'
      responses:
        '201':
          description: "Classe creee"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClasseCreated'
        '401':
          description: "Non authentifie"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: |
            Role insuffisant, ou etablissement dont le catalogue vient de
            KLASSCI.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: "Aucun etablissement resolu"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: "Libelle manquant, ou code deja employe dans cet etablissement"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    get:
      operationId: listLocalClasses
      tags:
        - Session de formation
      summary: "Lister les classes locales et leur code d inscription"
      description: |
        La collection de `POST /classes` (#905, ADR-905-01) : les classes
        LOCALES de l etablissement de l appelant — sans identifiant KLASSCI.
        Rien ne les listait : la liste d administration vient de KLASSCI, et
        `GET /lms/classes/local/{id}` repond 409 a une classe sans identifiant
        KLASSCI, parce qu elle traduit vers KLASSCI.

        Le code d inscription revient avec la classe : le RELIRE ne le
        regenere plus, donc n invalide plus celui deja dicte. Sa valeur ne
        sort que s il est `actif` ; un code retire ne sort plus.

        Pas d `effectif` : pour une classe locale, cette colonne vaut toujours 0.

        Meme droit que l emission : un etablissement branche a KLASSCI recoit
        403. Meme garde de role : un apprenant ne lit pas les codes des classes.
      security:
        - sanctum: []
      parameters:
        - name: per_page
          in: query
          required: false
          description: "Entre 1 et 100 ; absent vaut 25. Hors bornes ou non entier : 422 (spec #548)"
          schema:
            type: integer
            minimum: 1
            maximum: 100
        - name: page
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
      responses:
        '200':
          description: "Classes locales, triees par libelle"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClassesLocalesPage'
        '401':
          description: "Non authentifie"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: "Role insuffisant, ou catalogue venant de KLASSCI"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: |
            Le compte n est rattache a aucun etablissement — compte de
            plateforme. Controle AVANT le droit du catalogue : sans
            etablissement, aucune classe ne sort, d aucune ecole. Motif
            `no_institution` (#924).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RefusMotive'
              example:
                success: false
                message: "Aucun établissement résolu."
                reason: no_institution
        '422':
          description: "`per_page` ou `page` hors bornes, ou non entier (spec #548)"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationFailed'

  /inscriptions:
    post:
      operationId: registerWithEnrolmentCode
      tags:
        - Session de formation
      summary: "S inscrire dans une classe avec un code"
      description: |
        La troisieme porte d ADR-803-03 : l apprenant s inscrit LUI-MEME.
        L import suppose que l ecole detienne deja la liste ; c est faux d un
        formateur qui diffuse son code par WhatsApp.

        Route ANONYME — celui qui s inscrit n a pas encore de compte. Le code
        EST son autorisation, et il choisit son mot de passe : contrairement a
        l import, il est present et n a besoin d aucun lien d activation.

        En-tete `X-Institution` OBLIGATOIRE : le code n est unique que par
        etablissement, donc une requete qui ne porterait que le code serait
        ambigue entre deux ecoles.

        Debit borne par un seau NOMME a deux bornes, dont une journaliere
        globale : la borne par IP seule ne freine pas une enumeration repartie.

        La reponse ne rend NI jeton NI session : l inscrit se connecte ensuite
        avec le mot de passe qu il vient de choisir.
      security: []
      parameters:
        - name: X-Institution
          in: header
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - code
                - nom
                - password
                - password_confirmation
              properties:
                code:
                  type: string
                  minLength: 4
                  maxLength: 12
                  example: BUR7K2
                nom:
                  type: string
                  maxLength: 191
                email:
                  type: string
                  format: email
                  nullable: true
                telephone:
                  type: string
                  maxLength: 40
                  nullable: true
                  description: "Une adresse OU un numero est exige, sans imposer lequel."
                password:
                  type: string
                  minLength: 8
                password_confirmation:
                  type: string
      responses:
        '201':
          description: "Inscription enregistree"
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  message:
                    type: string
                  data:
                    type: object
                    properties:
                      classe:
                        type: object
                        properties:
                          id:
                            type: integer
                          libelle:
                            type: string
        '400':
          description: "En-tete X-Institution absent, ou etablissement non resolu"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: |
            Ce code n ouvre aucune inscription. Un code INCONNU, un code
            RETIRE et le code d un etablissement dont la liste des apprenants
            vient de KLASSCI rendent le MEME message : les separer dirait qu un
            code a existe pour cette valeur.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: |
            Un compte existe deja avec ces coordonnees. Il n est PAS touche —
            ni mot de passe, ni role, ni inscription. Sur un endpoint anonyme,
            une adresse n est pas une preuve de propriete (#812).

            `reason: account_exists` — le front y lit « connectez-vous », puis
            la porte authentifiee `/me/inscriptions` (#906).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RefusMotive'
              example:
                success: false
                message: "Un compte existe deja avec ces coordonnees. Connectez-vous pour rejoindre cette classe."
                reason: account_exists
        '422':
          description: "Charge invalide, ou ni adresse ni telephone"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationFailed'
        '429':
          description: |
            Debit depasse. Le motif dit QUEL budget (#906), avec `Retry-After` :
            - `ip_quota_exceeded` : 5 par minute depuis cette adresse ;
            - `global_cap_reached` : 100 par jour pour toute la plateforme.
          headers:
            Retry-After:
              schema:
                type: integer
              description: "Secondes a attendre avant de reessayer."
            X-RateLimit-Limit:
              schema:
                type: integer
              description: "Quota de la borne qui a refuse."
            X-RateLimit-Remaining:
              schema:
                type: integer
              description: "Requetes restantes dans la fenetre courante."
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RefusMotive'

  /me/inscriptions:
    post:
      operationId: joinClassWithEnrolmentCode
      tags:
        - Session de formation
      summary: "Rejoindre une classe avec un code, deja connecte"
      description: |
        La MEME troisieme porte d ADR-803-03, authentifiee (#885). La porte
        anonyme `/inscriptions` refuse tout compte existant — une adresse n y
        prouve rien — et renvoie l apprenant ici. Meme code, meme resolution,
        meme service.

        L etablissement vient du COMPTE, jamais d un en-tete : un
        `X-Institution` est ignore.

        Un code fait ENTRER, il ne rouvre pas : une adhesion existante non
        active (suspendue, abandonnee, expiree...) est refusee sans etre
        touchee. Seul l etablissement la rouvre.

        Debit compte PAR APPRENANT, jamais par IP : une classe entiere rejoint
        depuis le wifi de l ecole.
      security:
        - sanctum: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - code
              properties:
                code:
                  type: string
                  minLength: 4
                  maxLength: 12
                  example: BUR7K2
      responses:
        '201':
          description: "Adhesion creee"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClasseRejointeResponse'
        '200':
          description: "L apprenant etait deja inscrit : rien n est reecrit"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClasseRejointeResponse'
        '401':
          description: "Non authentifie"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: |
            Le compte n est pas un apprenant — y compris l administrateur
            d etablissement, que la garde de route laisserait passer.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: |
            Ce code n ouvre aucune inscription dans l etablissement du compte.
            Inconnu, retire, d une autre ecole, ou d un etablissement dont la
            liste des apprenants vient de KLASSCI : MEME message.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: |
            Rien n est ecrit. Deux sens, deux motifs (#906) :
            - `enrolment_not_active` : une adhesion non active existe deja —
              decision de l etablissement, pas une panne ;
            - `no_institution` : le compte n est rattache a aucun etablissement.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RefusMotive'
        '422':
          description: "Code absent ou hors bornes"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationFailed'
        '429':
          description: |
            Debit depasse. Le motif dit QUEL budget (#906) :
            - `account_quota_exceeded` : le seau du compte, borne de la
              minute (10/min), avec `Retry-After` ;
            - `account_daily_cap_reached` : le meme seau, borne du jour
              (30/jour) ;
            - `institution_cap_reached` : le plafond d ECHECS de l etablissement
              (200/jour), qui ferme la porte a tous ses apprenants jusqu au
              lendemain.
          headers:
            Retry-After:
              schema:
                type: integer
              description: "Secondes a attendre avant de reessayer. Absent sur `institution_cap_reached`, refus metier et non seau."
            X-RateLimit-Limit:
              schema:
                type: integer
              description: "Quota de la borne qui a refuse. Sur `institution_cap_reached`, decrit le seau du COMPTE, pas le plafond de l etablissement."
            X-RateLimit-Remaining:
              schema:
                type: integer
              description: "Requetes restantes dans la fenetre courante. Sur `institution_cap_reached`, decrit le seau du COMPTE, pas le plafond de l etablissement."
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RefusMotive'

  /classes/{classe}/code-inscription:
    post:
      tags:
        - Session de formation
      summary: "Emettre le code d inscription d une classe"
      description: |
        Le code court qu on dicte pour rejoindre une classe (ADR-803-03).

        Rendu EN CLAIR, et c est voulu : contrairement au lien d activation, il
        circule par telephone et par WhatsApp, se reaffiche autant que
        necessaire, et se revoque. Le hacher le rendrait indictable.

        SIX caracteres tires dans un alphabet de 31, sans `0` `1` `I` `L` `O` —
        les glyphes qu on confond en dictant. Casse normalisee EN PHP, jamais
        par la collation : SQLite est sensible a la casse, MySQL ne l est pas.

        Emettre REMPLACE le code precedent, qui cesse aussitot de fonctionner,
        et rouvre une classe dont le code avait ete retire. Aucune inscription
        deja faite n est touchee.

        Reserve aux etablissements qui tiennent leur propre catalogue : un
        etablissement branche a KLASSCI recoit 403.
      security:
        - sanctum: []
      parameters:
        - name: classe
          in: path
          required: true
          schema:
            type: integer
            minimum: 1
      responses:
        '201':
          description: "Code emis"
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  message:
                    type: string
                  data:
                    type: object
                    properties:
                      classe_id:
                        type: integer
                      code_inscription:
                        type: string
                        example: BUR7K2
        '403':
          description: "Role insuffisant, ou catalogue venant de KLASSCI"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: "Classe introuvable DANS CET ETABLISSEMENT"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          description: |
            Aucun code disponible apres cinq tirages. Sur 31^6 combinaisons par
            etablissement, signale une source d alea en panne, pas de la
            malchance.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    delete:
      tags:
        - Session de formation
      summary: "Retirer le code d inscription d une classe"
      description: |
        Ferme la porte aux suivants SANS desinscrire personne : les inscriptions
        vivent dans `classe_etudiant`, que ce chemin ne touche pas.

        La valeur du code DEMEURE en base. L effacer perdrait l unicite d un
        code tout juste dicte, qui pourrait alors etre reattribue ailleurs.
      security:
        - sanctum: []
      parameters:
        - name: classe
          in: path
          required: true
          schema:
            type: integer
            minimum: 1
      responses:
        '200':
          description: "Code retire"
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  message:
                    type: string
        '403':
          description: "Role insuffisant, ou catalogue venant de KLASSCI"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: "Classe introuvable DANS CET ETABLISSEMENT"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: "Cette classe n a pas de code a retirer"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /classes/{classe}/matieres:
    post:
      tags:
        - Session de formation
      summary: "Composer le programme d une classe"
      description: |
        Troisieme et dernier lot de l ADR-848-01 : apres la Classe et la
        Matiere, ce qui les relie — et le formateur qui l assure.

        Ecrit `classe_matiere`, le pivot LOCAL que LocalEnrollmentSource lit
        DEJA pour repondre « quelles classes ce formateur enseigne-t-il ».
        `matiere_enseignant` n est PAS touchee : c est le miroir KLASSCI.

        TROIS appartenances sont verifiees, pas une : la classe, la matiere ET
        le formateur doivent etre de cet etablissement. Controler la classe
        seule laisserait rattacher la matiere d une autre ecole — une ligne
        d apparence normale, donc une fuite silencieuse.

        Le 404 ne distingue pas « n existe pas » de « appartient a quelqu un
        d autre » : les separer dirait a un etablissement quels identifiants
        existent chez ses voisins.

        Rejouer le meme rattachement REAFFECTE le formateur au lieu d echouer :
        `classe_matiere` porte un unique (classe_id, matiere_id), et reaffecter
        un cours est une operation courante.
      security:
        - sanctum: []
      parameters:
        - name: classe
          in: path
          required: true
          schema:
            type: integer
            minimum: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ClasseMatiereInput'
      responses:
        '201':
          description: "Matiere rattachee a la classe"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClasseMatiereLinked'
        '401':
          description: "Non authentifie"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: |
            Role insuffisant, ou etablissement dont le programme vient de
            KLASSCI.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: |
            Classe, matiere ou formateur introuvable DANS CET ETABLISSEMENT.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: "Aucun etablissement resolu"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: "matiere_id manquant ou invalide"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /matieres:
    post:
      tags:
        - Session de formation
      summary: "Creer une Matiere sans KLASSCI"
      description: |
        Le SEUL createur d une Matiere du depot etait la synchronisation
        KLASSCI. Une ecole autonome avait des classes depuis #860, mais aucune
        matiere : un formateur n avait rien a enseigner.

        Second des trois verrous de l ADR-848-01, et le premier a exiger une
        MIGRATION avant son ecrivain : `matieres.klassci_id` etait NOT NULL sans
        valeur par defaut.

        Reservee aux etablissements qui tiennent leur propre catalogue. Le droit
        est une CAPACITE verifiee au point d ecriture, jamais une comparaison de
        mode : un etablissement branche a KLASSCI recoit 403.

        `institution_id` et `klassci_id` ne sont JAMAIS acceptes. Inventer un
        identifiant KLASSCI ferait entrer la matiere dans les correspondances
        par `whereIn('klassci_id', ...)`, ou elle n a rien a faire.

        `coefficient` et `credit` valent 1 par defaut : une matiere se cree
        souvent avant d etre ponderee.
      security:
        - sanctum: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MatiereInput'
      responses:
        '201':
          description: "Matiere creee"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MatiereCreated'
        '401':
          description: "Non authentifie"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: |
            Role insuffisant, ou etablissement dont le catalogue vient de
            KLASSCI.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: "Aucun etablissement resolu"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: "Libelle manquant ou ponderation hors bornes"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /lms/teacher/classes:
    get:
      tags:
        - Classes
      operationId: listMyTeachingClasses
      summary: "Les classes de l appelant"
      description: |
        Les classes de l appelant, pour l ecran « Mes classes ». La route admet
        enseignant et coordinateur. La source est choisie par le mode DECLARE de
        l ecole, au point de liaison, jamais par le client.

        **Ecole creee depuis KLASSCI.** Les classes que KLASSCI reconnait a
        l enseignant, avec les identifiants KLASSCI, triees par libelle ; a
        defaut, le miroir local des classes reliees a KLASSCI. Un echec de
        KLASSCI n est pas une erreur : la liste se replie sur le miroir.

        **Ecole creee depuis le LMS**, ou basculee en mode autonome. Les classes
        ou l appelant est designe formateur d au moins une matiere du programme
        local (`classe_matiere`), triees par libelle puis par identifiant, avec
        les identifiants locaux, sans aucun appel a KLASSCI. Le programme local
        ne designe qu'un compte de role enseignant : un coordinateur recoit une
        liste vide. `effectif` vaut `null` et `effectif_actuel` compte les
        inscriptions actives d'eleves de l'etablissement.

        **Ecole basculee.** Le referentiel que l'ecran fusionne par `id`
        (`/proxy/classes`) suit le mode, et rend les memes identifiants locaux.
      security:
        - sanctum: []
      responses:
        '200':
          description: "Les classes de l appelant"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MesClassesListe'
        '401':
          description: "Non authentifie (sans `reason`)."
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RefusKlassci'
        '403':
          description: |
            Role non admis, etablissement desactive, ou compte sans etablissement
            (`reason: no_institution`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RefusClasseEleves'
        '500':
          description: "Erreur non rattrapee, rendue par le gestionnaire global, sans `error`."
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VisioErreurInterne'

  /lms/teacher/my-matieres:
    get:
      tags:
        - Matieres
      operationId: listMyTeachingSubjects
      summary: "Les matieres qu enseigne l appelant"
      description: |
        Les matieres ou l appelant est designe formateur, avec les classes ou il
        les enseigne et quatre compteurs, qui ne portent que sur SES lecons. La
        route dit « my » : dans la source locale, seul un compte de role
        enseignant peut etre designe formateur, et un coordinateur ou un
        superAdmin, que la route admet, recoit donc une liste vide.

        Deux sources, choisies par l etablissement au point de liaison, jamais
        par le client : KLASSCI (`me/teacher-dashboard`, avec le jeton du
        compte), ou le programme local (`classe_matiere`) dans une ecole
        independante. Les ids sont ceux de la source.
      security:
        - sanctum: []
      responses:
        '200':
          description: "Les matieres de l appelant"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MesMatieresListe'
        '401':
          description: |
            Non authentifie, ou, dans un etablissement relie a KLASSCI, compte
            sans jeton KLASSCI (`reason: klassci_token_missing`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RefusKlassci'
        '403':
          description: |
            Role non admis (la route admet enseignant et coordinateur, et le
            superAdmin passe toute garde de role d etablissement),
            compte sans etablissement (`reason: no_institution`), etablissement
            desactive, ou refus relaye de KLASSCI (source KLASSCI).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PageMatiereRefus'
        '404':
          description: "Refus relaye de KLASSCI (profil enseignant introuvable), source KLASSCI seulement"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PageMatiereRefus'
        '500':
          description: |
            Defaillance interne, journalisee (base de donnees comprise). Le corps
            ne porte jamais le detail technique.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PageMatiereRefus'
        '503':
          description: |
            Source KLASSCI injoignable ou mal configuree. En-tete `Retry-After`.
            Les autres 4xx de KLASSCI sont relayes avec leur statut.
          headers:
            Retry-After:
              schema:
                type: integer
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PageMatiereRefus'

  /lms/matieres/{matiereId}:
