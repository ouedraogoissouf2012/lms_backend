  /classes/{classe}/eleves/{eleve}/muter:
    post:
      operationId: moveStudentToAnotherClass
      tags:
        - Session de formation
      summary: "Changer un eleve de classe dans son ecole"
      description: |
        Un geste NOMME (#1652), en UNE transaction : l eleve entre dans la classe
        cible, puis son adhesion source se ferme (`inactif`, datee par `ends_on`,
        ADR-711-02, motif `mutation`). Une ancienne adhesion de l eleve dans la cible
        est REACTIVEE, jamais doublee. Un refus ne change rien, ni a la source ni a
        la cible.

        La cible doit recevoir : ni archivee (`class_archived`), ni rattachee a une
        Periode close (`class_period_closed`), ni deja l eleve actif
        (`already_in_class`), ni complete (`class_full`).
      security:
        - sanctum: []
      parameters:
        - name: classe
          in: path
          required: true
          description: "La classe SOURCE"
          schema:
            type: integer
            minimum: 1
        - name: eleve
          in: path
          required: true
          schema:
            type: integer
            minimum: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - classe_id
              properties:
                classe_id:
                  type: integer
                  minimum: 1
                  description: "La classe CIBLE, differente de la source"
      responses:
        '200':
          description: "L eleve a change de classe"
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  message:
                    type: string
                  data:
                    type: object
                    properties:
                      eleve_id:
                        type: integer
                      depuis:
                        type: integer
                      vers:
                        type: integer
        '400':
          $ref: '#/components/responses/EtablissementInconnu'
        '401':
          description: "Non authentifie"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: "Role insuffisant, catalogue venant de KLASSCI, ou classe miroir de KLASSCI (`catalogue_managed_by_klassci`). Aussi, sans `reason` : etablissement desactive ou supprime (ResolveInstitution, #961)."
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: "Classe source ou cible, ou eleve, introuvable DANS CET ETABLISSEMENT ; ou eleve sans adhesion dans la classe source"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: |
            `enrolment_not_active` : l adhesion source n est pas active.
            `class_archived`, `class_period_closed`, `already_in_class`, `class_full` :
            la classe cible ne recoit pas cet eleve.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RefusMotive'
        '422':
          description: "`classe_id` absent, invalide, ou egal a la classe source"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationFailed'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /classes/{classe}/code-inscription:
    post:
      tags:
        - Session de formation
      summary: "Emettre le code d inscription d une classe"
      description: |
        Le code court qu on dicte pour rejoindre une classe (ADR-803-03).

        Rendu EN CLAIR, et c est voulu : contrairement au lien d activation, il
        circule par telephone et par WhatsApp, se reaffiche autant que
        necessaire, et se revoque. Le hacher le rendrait indictable.

        SIX caracteres tires dans un alphabet de 31, sans `0` `1` `I` `L` `O` —
        les glyphes qu on confond en dictant. Casse normalisee EN PHP, jamais
        par la collation : SQLite est sensible a la casse, MySQL ne l est pas.

        Emettre REMPLACE le code precedent, qui cesse aussitot de fonctionner,
        et rouvre une classe dont le code avait ete retire. Aucune inscription
        deja faite n est touchee.

        Reserve aux etablissements qui tiennent leur propre catalogue : un
        etablissement branche a KLASSCI recoit 403.
      security:
        - sanctum: []
      parameters:
        - name: classe
          in: path
          required: true
          schema:
            type: integer
            minimum: 1
      responses:
        '201':
          description: "Code emis"
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  message:
                    type: string
                  data:
                    type: object
                    properties:
                      classe_id:
                        type: integer
                      code_inscription:
                        type: string
                        example: BUR7K2
        '400':
          $ref: '#/components/responses/EtablissementInconnu'
        '403':
          description: "Role insuffisant, ou catalogue venant de KLASSCI (`catalogue_managed_by_klassci`, #1184). Aussi, sans `reason` : etablissement desactive ou supprime (ResolveInstitution, #961)."
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: "Classe introuvable DANS CET ETABLISSEMENT"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: "La classe est archivee (`class_archived`, #1652) : aucun code n est emis."
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RefusMotive'
        '503':
          description: |
            Aucun code disponible apres cinq tirages. Sur 31^6 combinaisons par
            etablissement, signale une source d alea en panne, pas de la
            malchance.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    delete:
      tags:
        - Session de formation
      summary: "Retirer le code d inscription d une classe"
      description: |
        Ferme la porte aux suivants SANS desinscrire personne : les inscriptions
        vivent dans `classe_etudiant`, que ce chemin ne touche pas.

        La valeur du code DEMEURE en base. L effacer perdrait l unicite d un
        code tout juste dicte, qui pourrait alors etre reattribue ailleurs.
      security:
        - sanctum: []
      parameters:
        - name: classe
          in: path
          required: true
          schema:
            type: integer
            minimum: 1
      responses:
        '200':
          description: "Code retire"
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  message:
                    type: string
        '400':
          $ref: '#/components/responses/EtablissementInconnu'
        '403':
          description: "Role insuffisant, ou catalogue venant de KLASSCI (`catalogue_managed_by_klassci`, #1184). Aussi, sans `reason` : etablissement desactive ou supprime (ResolveInstitution, #961)."
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: "Classe introuvable DANS CET ETABLISSEMENT"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: "Cette classe n a pas de code a retirer"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /classes/{classe}/matieres:
    post:
      tags:
        - Session de formation
      summary: "Composer le programme d une classe"
      description: |
        Troisieme et dernier lot de l ADR-848-01 : apres la Classe et la
        Matiere, ce qui les relie — et le formateur qui l assure.

        Ecrit `classe_matiere`, le pivot LOCAL que LocalEnrollmentSource lit
        DEJA pour repondre « quelles classes ce formateur enseigne-t-il ».
        `matiere_enseignant` n est PAS touchee : c est le miroir KLASSCI.

        TROIS appartenances sont verifiees, pas une : la classe, la matiere ET
        le formateur doivent etre de cet etablissement. Controler la classe
        seule laisserait rattacher la matiere d une autre ecole — une ligne
        d apparence normale, donc une fuite silencieuse.

        Le 404 ne distingue pas « n existe pas » de « appartient a quelqu un
        d autre » : les separer dirait a un etablissement quels identifiants
        existent chez ses voisins.

        Rejouer le meme rattachement REAFFECTE le formateur au lieu d echouer :
        `classe_matiere` porte un unique (classe_id, matiere_id), et reaffecter
        un cours est une operation courante.
      security:
        - sanctum: []
      parameters:
        - name: classe
          in: path
          required: true
          schema:
            type: integer
            minimum: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ClasseMatiereInput'
      responses:
        '201':
          description: "Matiere rattachee a la classe"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClasseMatiereLinked'
        '400':
          $ref: '#/components/responses/EtablissementInconnu'
        '401':
          description: "Non authentifie"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: |
            Role insuffisant, ou etablissement dont le programme vient de
            KLASSCI (`catalogue_managed_by_klassci`, #1184).
            Aussi, sans `reason` : etablissement desactive ou supprime (ResolveInstitution, #961).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: |
            Classe, matiere ou formateur introuvable DANS CET ETABLISSEMENT (#1707), chacun avec son motif :
            `class_out_of_scope`, `subject_out_of_scope`, `teacher_out_of_scope`. Un compte de l'ecole qui
            n'enseigne pas rend le MEME corps qu'un formateur d'une autre ecole : l'existence d'un compte ne se
            devine pas.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProgrammeHorsEtablissement'
        '409':
          description: |
            Aucun etablissement resolu. Controle AVANT le droit du
            catalogue (#910). Motif `no_institution`. Par HTTP, la porte
            des comptes sans etablissement repond 403 avant.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RefusMotive'
              example:
                success: false
                message: "Aucun établissement résolu."
                reason: no_institution
        '422':
          description: "matiere_id manquant ou invalide"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /classes/{classe}/matieres/{matiere}:
    patch:
      tags:
        - Session de formation
      summary: "Modifier une matiere au programme d une classe"
      description: |
        #1653. Le formateur (de l ecole, et enseignant ; nul le retire) et le
        coefficient PROPRE a la classe (nul : celui de la matiere s applique).
        Seuls les champs ENVOYES changent. Ecole qui tient son catalogue ; la
        classe, la matiere et le formateur sont cherches dans SON ecole.
      security:
        - sanctum: []
      parameters:
        - name: classe
          in: path
          required: true
          schema:
            type: integer
        - name: matiere
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ClasseMatiereUpdateInput'
      responses:
        '200':
          description: "Ligne du programme, relue"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClasseMatiereLigne'
        '400':
          $ref: '#/components/responses/EtablissementInconnu'
        '401':
          description: "Non authentifie"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: |
            Role insuffisant, ou etablissement dont le catalogue vient de
            KLASSCI (`catalogue_managed_by_klassci`).
            Aussi, sans `reason` : etablissement desactive ou supprime (ResolveInstitution, #961).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: |
            Classe, matiere ou formateur hors de l ecole (un formateur qui
            n enseigne pas compte comme absent), ou matiere absente du programme
            de la classe.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: "Aucun etablissement resolu (`no_institution`)."
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RefusMotive'
        '422':
          description: "Formateur ou coefficient invalide"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    delete:
      tags:
        - Session de formation
      summary: "Retirer une matiere du programme d une classe"
      description: |
        #1653. Retire le couple du programme ; la matiere elle-meme reste.
        Refuse tant qu une trace pedagogique de CETTE ecole renvoie au couple
        (lecon, seance, evaluation, quiz, discussion), meme supprimee en
        douceur : l historique reste lisible avec sa classe et sa matiere.
      security:
        - sanctum: []
      parameters:
        - name: classe
          in: path
          required: true
          schema:
            type: integer
        - name: matiere
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: "Matiere retiree de la classe"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageOnly'
        '400':
          $ref: '#/components/responses/EtablissementInconnu'
        '401':
          description: "Non authentifie"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: |
            Role insuffisant, ou etablissement dont le catalogue vient de
            KLASSCI (`catalogue_managed_by_klassci`).
            Aussi, sans `reason` : etablissement desactive ou supprime (ResolveInstitution, #961).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: "Classe ou matiere hors de l ecole, ou matiere absente du programme de la classe"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: |
            `subject_in_use_in_class` : une trace pedagogique renvoie au couple ;
            le message dit lesquelles et combien. Ou `no_institution`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RefusMotive'
              example:
                success: false
                message: "Cette matière est employée dans cette classe (2 leçon(s), 1 séance(s)) : elle ne peut pas en être retirée."
                reason: subject_in_use_in_class

  /matieres:
    post:
      tags:
        - Session de formation
      summary: "Creer une Matiere sans KLASSCI"
      description: |
        Le SEUL createur d une Matiere du depot etait la synchronisation
        KLASSCI. Une ecole autonome avait des classes depuis #860, mais aucune
        matiere : un formateur n avait rien a enseigner.

        Second des trois verrous de l ADR-848-01, et le premier a exiger une
        MIGRATION avant son ecrivain : `matieres.klassci_id` etait NOT NULL sans
        valeur par defaut.

        Reservee aux etablissements qui tiennent leur propre catalogue. Le droit
        est une CAPACITE verifiee au point d ecriture, jamais une comparaison de
        mode : un etablissement branche a KLASSCI recoit 403.

        `institution_id` et `klassci_id` ne sont JAMAIS acceptes. Inventer un
        identifiant KLASSCI ferait entrer la matiere dans les correspondances
        par `whereIn('klassci_id', ...)`, ou elle n a rien a faire.

        `coefficient` et `credit` valent 1 par defaut : une matiere se cree
        souvent avant d etre ponderee.
      security:
        - sanctum: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MatiereInput'
      responses:
        '201':
          description: "Matiere creee"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MatiereCreated'
        '400':
          $ref: '#/components/responses/EtablissementInconnu'
        '401':
          description: "Non authentifie"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: |
            Role insuffisant, ou etablissement dont le catalogue vient de
            KLASSCI (`catalogue_managed_by_klassci`, #1184).
            Aussi, sans `reason` : etablissement desactive ou supprime (ResolveInstitution, #961).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: |
            Aucun etablissement resolu. Controle AVANT le droit du
            catalogue (#910). Motif `no_institution`. Par HTTP, la porte
            des comptes sans etablissement repond 403 avant.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RefusMotive'
              example:
                success: false
                message: "Aucun établissement résolu."
                reason: no_institution
        '422':
          description: |
            Libelle manquant ou ponderation hors bornes ; ou code deja employe par
            une autre matiere locale de l ecole (#1653), motif
            `subject_code_already_used` sur `code`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /matieres/{matiere}:
    patch:
      tags:
        - Session de formation
      summary: "Modifier une Matiere locale"
      description: |
        #1653. Modifie une matiere LOCALE de l ecole de l appelant : seuls les
        champs ENVOYES changent. Un `code` vide ou nul EFFACE le code.

        Le code d une matiere locale est unique dans son ecole, sans tenir
        compte de la casse ni des blancs : la BASE le tranche (colonne generee
        `code_local`, unique `(institution_id, code_local)`), et sa violation
        rend 422 `subject_code_already_used`. Les matieres miroir de KLASSCI
        en sont exclues : leurs codes sont a KLASSCI.
      security:
        - sanctum: []
      parameters:
        - name: matiere
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MatiereUpdateInput'
      responses:
        '200':
          description: "Matiere modifiee, relue"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MatiereCreated'
        '400':
          $ref: '#/components/responses/EtablissementInconnu'
        '401':
          description: "Non authentifie"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: |
            Role insuffisant ; etablissement dont le catalogue vient de KLASSCI,
            ou matiere MIROIR de KLASSCI (`catalogue_managed_by_klassci`).
            Aussi, sans `reason` : etablissement desactive ou supprime (ResolveInstitution, #961).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: "Aucune matiere de ce numero dans l ecole de l appelant"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: |
            Libelle vide, ponderation hors bornes, ou code deja employe par une
            autre matiere locale de l ecole (`subject_code_already_used` sur `code`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /lms/teacher/classes:
    get:
      tags:
        - Classes
      operationId: listMyTeachingClasses
      summary: "Les classes de l appelant"
      description: |
        Les classes de l appelant, pour l ecran « Mes classes ». La route admet
        enseignant et coordinateur. La source est choisie par le mode DECLARE de
        l ecole, au point de liaison, jamais par le client.

        **Ecole creee depuis KLASSCI.** Les classes que KLASSCI reconnait a
        l enseignant, avec les identifiants KLASSCI, triees par libelle ; a
        defaut, le miroir local des classes reliees a KLASSCI. Un echec de
        KLASSCI n est pas une erreur : la liste se replie sur le miroir.

        **Ecole creee depuis le LMS**, ou basculee en mode autonome. Les classes
        ou l appelant est designe formateur d au moins une matiere du programme
        local (`classe_matiere`), triees par libelle puis par identifiant, avec
        les identifiants locaux, sans aucun appel a KLASSCI. Le programme local
        ne designe qu'un compte de role enseignant : un coordinateur recoit une
        liste vide. `effectif` vaut `null` et `effectif_actuel` compte les
        inscriptions actives d'eleves de l'etablissement.

        **Ecole basculee.** Le referentiel que l'ecran fusionne par `id`
        (`/proxy/classes`) suit le mode, et rend les memes identifiants locaux.
      security:
        - sanctum: []
      responses:
        '200':
          description: "Les classes de l appelant"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MesClassesListe'
        '400':
          $ref: '#/components/responses/EtablissementInconnu'
        '401':
          description: "Non authentifie (sans `reason`)."
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RefusKlassci'
        '403':
          description: |
            Role non admis, etablissement desactive, ou compte sans etablissement
            (`reason: no_institution`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RefusClasseEleves'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          description: "Erreur non rattrapee, rendue par le gestionnaire global, sans `error`."
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VisioErreurInterne'

  /lms/teacher/my-matieres:
    get:
      tags:
        - Matieres
      operationId: listMyTeachingSubjects
      summary: "Les matieres qu enseigne l appelant"
      description: |
        Les matieres ou l appelant est designe formateur, avec les classes ou il
        les enseigne et quatre compteurs, qui ne portent que sur SES lecons. La
        route dit « my » : dans la source locale, seul un compte de role
        enseignant peut etre designe formateur, et un coordinateur ou un
        superAdmin, que la route admet, recoit donc une liste vide.

        Deux sources, choisies par l etablissement au point de liaison, jamais
        par le client : KLASSCI (`me/teacher-dashboard`, avec le jeton du
        compte), ou le programme local (`classe_matiere`) dans une ecole
        independante. Les ids sont ceux de la source.
      security:
        - sanctum: []
      responses:
        '200':
          description: "Les matieres de l appelant"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MesMatieresListe'
        '400':
          $ref: '#/components/responses/EtablissementInconnu'
        '401':
          description: |
            Non authentifie, ou, dans un etablissement relie a KLASSCI, compte
            sans jeton KLASSCI (`reason: klassci_token_missing`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RefusKlassci'
        '403':
          description: |
            Role non admis (la route admet enseignant et coordinateur, et le
            superAdmin passe toute garde de role d etablissement),
            compte sans etablissement (`reason: no_institution`), etablissement
            desactive, ou refus relaye de KLASSCI (source KLASSCI).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PageMatiereRefus'
        '404':
          description: "Refus relaye de KLASSCI (profil enseignant introuvable), source KLASSCI seulement"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PageMatiereRefus'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          description: |
            Defaillance interne, journalisee (base de donnees comprise). Le corps
            ne porte jamais le detail technique.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PageMatiereRefus'
        '503':
          description: |
            Source KLASSCI injoignable ou mal configuree. En-tete `Retry-After`.
            Les autres 4xx de KLASSCI sont relayes avec leur statut.
          headers:
            Retry-After:
              schema:
                type: integer
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PageMatiereRefus'

  /lms/matieres/{matiereId}:
