                $ref: '#/components/schemas/MessageOnly'
        '403':
          description: |
            Role insuffisant, enseignant non proprietaire, coordinateur sur une
            evaluation non terminee (dans son ecole). Seul le refus du coordinateur
            porte `reason: preview_requires_finished_evaluation`.
            Aussi, sans `reason` : etablissement desactive ou supprime (ResolveInstitution, #961).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RefusApercuEvaluation'
        '404':
          description: "Evaluation introuvable (#1782) : absente, supprimee ou d une autre ecole, avec le meme corps dans les trois cas. Un 403 dirait qu elle existe ailleurs."
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          description: "Erreur interne"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorWithDetail'

  /evaluations/{id}/submissions:
    get:
      tags:
        - Evaluations
      operationId: listEvaluationSubmissions
      summary: "Copies d une evaluation"
      description: |
        Toutes les tentatives, entrainements compris, triees par remise
        decroissante. Lecture : enseignant proprietaire, coordinateur de
        l etablissement, administrateur.

        L eleve est nomme par l auteur de la copie (`student_id`), puis, pour une
        ligne d avant D72, par son identite KLASSCI : deux recherches bornees a
        l etablissement de l evaluation (D72, E3).
      security:
        - sanctum: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: "Copies"
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: integer
                        evaluation_id:
                          type: integer
                        student_id:
                          type: integer
                          nullable: true
                          description: "L auteur (compte local). Nul pour une ligne d avant D72 non rattrapee."
                        klassci_etudiant_id:
                          type: integer
                          nullable: true
                          description: "Nul pour une copie d une ecole creee depuis le LMS (D72)."
                        student_name:
                          type: string
                          description: |
                            `Etudiant #<id>` quand aucun compte de l etablissement ne
                            correspond (l identite KLASSCI, sinon l auteur).
                        attempt:
                          type: integer
                        status:
                          type: string
                          enum: [en_cours, soumis, corrige, verrouille]
                          description: "`verrouille` : copie hors delai (C28), visible, jamais notee."
                        started_at:
                          type: string
                          format: date-time
                          nullable: true
                        submitted_at:
                          type: string
                          format: date-time
                          nullable: true
                        score:
                          type: string
                          pattern: '^-?\d+\.\d{2}$'
                          nullable: true
                        note_sur_20:
                          type: string
                          pattern: '^-?\d+\.\d{2}$'
                          nullable: true
                        synced_to_klassci:
                          type: boolean
                        synced_at:
                          type: string
                          format: date-time
                          nullable: true
        '400':
          $ref: '#/components/responses/EtablissementInconnu'
        '401':
          description: "Non authentifie"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageOnly'
        '403':
          description: |
            Role insuffisant, enseignant non proprietaire (dans son ecole).
            Aussi, sans `reason` : etablissement desactive ou supprime (ResolveInstitution, #961).
          content:
            application/json:
