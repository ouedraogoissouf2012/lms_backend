  /lms/emargement:
    post:
      tags:
        - Visio
      operationId: signerParCode
      summary: "L'eleve signe une seance par son code d'emargement"
      description: |
        #1680. Le code (casse et espaces indifferents) est cherche dans l'ecole
        de l'eleve. Seul un eleve ACTIF de la classe de la seance signe. Marque
        `present`, ou `late` au-dela du seuil apres le debut ; origine `code`.
        Rejouee, la signature ne double rien (`deja_signe`). Le code n'ecrase
        jamais la marque de l'enseignant (409 `already_marked_by_teacher`).
        Chaque code inconnu ou perime compte un echec : 10 par eleve sur 10
        minutes, puis 429 `attendance_code_attempts_exceeded` avec
        `Retry-After`. Ecole KLASSCI : 409.
      security:
        - sanctum: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [code]
              properties:
                code:
                  type: string
                  minLength: 4
                  maxLength: 12
      responses:
        '200':
          description: "La signature"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SignatureParCode'
        '400':
          $ref: '#/components/responses/EtablissementInconnu'
        '401':
