  /lms/classes/{classeId}/etudiants:
    get:
      tags:
        - Classes
      summary: "Les eleves actifs d'une classe"
      description: |
        Reserve aux roles enseignant, coordinateur et admin, alias compris
        (`teacher`, `coordinator`, `administrateur`, `administrator`). La garde de
        role laisse aussi passer `superAdmin`. La source est choisie par le mode
        DECLARE de l'ecole, au point de liaison, jamais par le client.

        **Ecole creee depuis le LMS**, ou basculee en mode autonome. `classeId`
        est l'identifiant local. Les eleves dont l'inscription est active, lus
        dans les tables locales, sans aucun appel a KLASSCI : toute classe de
        l'etablissement pour la gestion, une classe ou il est designe formateur
        pour un enseignant. Sinon, 404. Ecart connu : la garde de role admet
        l'alias `administrator`, que la grille d'acces ne reconnait pas ; un tel
        compte y est traite comme un eleve, et recoit 404.

        **Ecole creee depuis KLASSCI.** `classeId` est l'identifiant KLASSCI. Lit
        le roster dans l'enveloppe KLASSCI `classes/{id}`, avec le jeton KLASSCI
        du compte, et ne garde que les eleves de statut `actif` ou sans statut.
        Sans jeton KLASSCI, la route rend le 401 `klassci_token_missing` avant
        tout appel.

        Un refus de KLASSCI (4xx) est relaye avec son statut et le message du
        catalogue, jamais le message amont : 401 (`klassci_session_expired`),
        403, et tout autre code de 400 a 499. Une panne de KLASSCI, une reponse
        illisible ou une enveloppe sans roster rendent le 503, avec
        `Retry-After`. Une reponse 2xx en echec (`success: false`, ou sans
        roster) n'est gardee en cache que ce delai ; les autres erreurs ne sont
        pas gardees.
      security:
        - sanctum: []
      parameters:
        - name: classeId
          in: path
          required: true
          description: "Identifiant KLASSCI dans une ecole creee depuis KLASSCI, identifiant local dans une ecole creee depuis le LMS."
          schema:
            type: integer
      responses:
        '200':
          description: "Les eleves actifs de la classe, et leur nombre."
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClasseEleves'
        '400':
          description: |
            Requete refusee par KLASSCI, relayee (message par defaut du
            catalogue). Ou, sans jeton porteur, un en-tete `X-Institution`
            inconnu : refuse avant l'authentification.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RefusClasseEleves'
        '401':
          description: |
            Jeton porteur absent ou invalide (sans `reason`). Dans une ecole creee
            depuis KLASSCI : compte sans jeton KLASSCI (`reason:
            klassci_token_missing`), ou session refusee par KLASSCI (`reason:
            klassci_session_expired`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RefusKlassci'
        '403':
          description: |
            Sans `reason` : role non admis, etablissement desactive, ou refus de
            KLASSCI relaye. `no_institution` : compte sans etablissement.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RefusClasseEleves'
        '404':
          description: |
            « Classe non trouvee » : dans une ecole creee depuis le LMS, une
            classe que l'appelant n'atteint pas. Ou aucune donnee KLASSCI pour ce
            compte, relaye.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RefusClasseEleves'
        '409':
          description: "Conflit signale par KLASSCI, relaye."
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RefusClasseEleves'
        '422':
          description: "Donnees refusees par KLASSCI, relaye. Sans detail par champ."
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RefusClasseEleves'
        '429':
          description: |
            KLASSCI limite les requetes, relaye, SANS son en-tete `Retry-After`.
            Aussi : limite de débit des lectures, par famille et par compte (#947).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RefusClasseEleves'
        '4XX':
          description: |
            Tout autre refus de KLASSCI de 400 a 499 est relaye avec son statut et
            le message par defaut du catalogue.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RefusClasseEleves'
        '500':
          description: |
            Erreur interne. Rattrapee par le controleur : avec `error`. Sans
            `error` : erreur sans detail, ou gestionnaire global (par exemple un
            `classeId` non numerique).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VisioErreurInterne'
        '503':
          description: |
            KLASSCI indisponible (panne, circuit ouvert, transport, URL absente),
            reponse illisible, ou enveloppe sans roster.
          headers:
            Retry-After:
              schema:
                type: integer
              description: "Secondes a attendre avant de reessayer."
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KlassciIndisponible'

  /lms/classes/{classe}/resultats:
    get:
      tags:
        - Classes
      operationId: getBilanDeClasse
      summary: "Moyennes, rangs et reussite d une classe (#1676)"
      description: |
        `classe` est l identifiant de l ESPACE SOURCE de l ecole, comme pour
        `/lms/classes/{classeId}/etudiants` : l identifiant local dans une ecole creee depuis
        le LMS, l identite KLASSCI dans une ecole KLASSCI (resolue sur le miroir local de la
        classe ; tant que ce miroir n existe pas, 404). Une classe d une autre ecole, ou
        inexistante : 404 `class_out_of_scope`.

        **Les memes regles que « Mes notes »** (`/my-grades`) : seules les copies FINALES
        comptent (corrigees, ou remises sans question a correction manuelle ; ni
        entrainement, ni evaluation non publiee), la plus recente par eleve et par
        evaluation. Seules les evaluations aux resultats VISIBLES (`show_results`) comptent :
        une note non publiee n entre pas dans le rang (quand la publication des notes
        deviendra un geste explicite, #1699, le rang suivra). La moyenne d une matiere est
        ponderee par le coefficient de chaque evaluation ; la moyenne generale par le
        coefficient de la MATIERE dans la classe (`classe_matiere.coefficient`, a defaut
        celui de la matiere, a defaut 1). Rien a moyenner : `null`, jamais un 0 fabrique ;
        une note manquante n entre dans aucune moyenne.

        **Rang** de competition, avec ex aequo (1, 2, 2, 4). Un eleve sans moyenne n est pas
        classe (`rang: null`) et n entre ni dans `moyenne_classe` ni dans `taux_reussite`.
        **Taux de reussite** : la part des eleves classes dont la moyenne atteint
        `seuil_reussite` (reglage de l ecole `settings.seuil_reussite`, 10 sur 20 par defaut).

        **Source** : `source: "lms"`. Les deux types d ecole calculent sur les notes du LMS ;
        dans une ecole KLASSCI, KLASSCI peut tenir d autres notes, que ce bilan ne voit pas.
        Les eleves : les inscriptions actives (ecole creee depuis le LMS), ou le roster
        KLASSCI lu avec le jeton du lecteur (ecole KLASSCI ; sans jeton, 401
        `klassci_token_missing` ; panne, 503).

        **Acces** : le coordinateur et l admin de l ecole voient la classe entiere ;
        l enseignant aussi, s il y est designe formateur d une matiere (sinon 403
        `class_not_taught`). L eleve ne recoit que SA ligne, sans `statistiques` ni
        `couverture` ; son `rang` n y figure que si l ecole l autorise
        (`settings.rang_visible_eleve`). Hors de la classe : 403 `not_in_class`.

        Concu pour le carnet de notes (#1698) : `evaluations` (les colonnes) et
        `eleves[].notes` forment la grille eleves x evaluations.
      security:
        - sanctum: []
      parameters:
        - name: classe
          in: path
          required: true
          description: "Identifiant de l espace source : local dans une ecole creee depuis le LMS, KLASSCI dans une ecole KLASSCI."
          schema:
            type: integer
        - name: du
          in: query
          required: false
          description: "Debut de la periode, sur la date d evaluation (incluse). Sans borne : l annee entiere."
          schema:
            type: string
            format: date
        - name: au
          in: query
          required: false
          description: "Fin de la periode (incluse), egale ou posterieure a `du`."
          schema:
            type: string
            format: date
      responses:
        '200':
          description: "Le bilan de la classe (ou la seule ligne de l eleve)."
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success:
                    type: boolean
                  message:
                    type: string
                  data:
                    $ref: '#/components/schemas/BilanDeClasse'
        '401':
          $ref: '#/components/responses/KlassciUnauthorized'
        '400':
          $ref: '#/components/responses/EtablissementInconnu'
        '403':
          description: "Classe non enseignee (`class_not_taught`), eleve hors de la classe (`not_in_class`), role sans acces, ou etablissement desactive : celui du compte (refus de la resolution de l ecole, avant la route)."
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: "Classe introuvable dans l etablissement (`class_out_of_scope`)."
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: "Periode invalide (`du`, `au`)."
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '503':
          description: "Roster KLASSCI indisponible (ecole KLASSCI)."
          headers:
            Retry-After:
              schema:
                type: integer
              description: "Secondes a attendre avant de reessayer."
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KlassciIndisponible'

