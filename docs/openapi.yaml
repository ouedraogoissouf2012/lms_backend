        - Evaluations
      operationId: getMyGrades
      summary: "Notes de l eleve, par matiere"
      description: |
        Ne compte que les notes FINALES : copies `corrige`, ou `soumis` sans
        question a correction manuelle ; les tentatives d entrainement
        (`feedback` commencant par `[PRACTICE]`) et les evaluations non
        publiees sont exclues.

        `moyenne` est ponderee par `coefficient` ; `moyenne_generale` est la
        moyenne simple des moyennes de matiere. Toutes deux valent `0` (entier)
        quand il n y a rien a moyenner.
      security:
        - sanctum: []
      responses:
        '200':
          description: "Notes agregees"
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: object
                    properties:
                      matieres:
                        type: array
                        items:
                          type: object
                          properties:
                            matiere_id:
                              type: integer
                              description: "`0` quand l evaluation n a pas de matiere KLASSCI"
                            matiere_nom:
                              type: string
                            moyenne:
                              type: number
                            total_evaluations:
                              type: integer
                            evaluations:
                              type: array
                              items:
                                type: object
                                properties:
                                  evaluation_id:
                                    type: integer
                                  titre:
                                    type: string
                                  type:
                                    type: string
                                  note:
                                    type: string
                                    pattern: '^-?\d+\.\d{2}$'
                                    nullable: true
                                    description: "Note sur 20, decimal en chaine"
                                  coefficient:
                                    description: "Decimal en chaine ; l entier `1` quand l evaluation n en a pas"
                                  date_evaluation:
                                    type: string
                                    format: date-time
                                    nullable: true
                                  date_soumission:
                                    type: string
                                    format: date-time
                                    nullable: true
                                  temps_passe:
                                    nullable: true
                                    description: "Toujours `null` aujourd hui : aucune donnee ne l alimente."
                      moyenne_generale:
                        type: number
                      total_matieres:
                        type: integer
                      total_evaluations:
                        type: integer
        '401':
          description: "Non authentifie, ou compte sans identifiant KLASSCI synchronise"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageOnly'
        '500':
          description: "Erreur interne"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorWithDetail'

  /evaluations/{id}/start:
    post:
      tags:
        - Evaluations
      operationId: startEvaluation
      summary: "Demarrer (ou reprendre) une tentative"
      description: |
        Reservee aux eleves. Aucun corps de requete : l identite vient du jeton.

        Si une tentative `en_cours` existe, elle est REPRISE (meme `id`) ;
        sinon une nouvelle copie est creee. Une evaluation terminee se passe
        en mode entrainement (`is_practice: true`) : fenetre, quota et reprise
        n y sont pas appliques, et la note n est pas officielle.

        Limite : 300 requetes / minute.
      security:
        - sanctum: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: |
            Tentative demarree (« Evaluation demarree », « Mode entrainement
            demarre ») ou reprise (« Reprise de la tentative en cours »).
            `window` et `is_practice` sont a la RACINE, hors de `data`.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  message:
                    type: string
                  data:
                    $ref: '#/components/schemas/EvaluationSubmissionRecord'
                  window:
                    $ref: '#/components/schemas/EvaluationWindow'
                  is_practice:
                    type: boolean
        '401':
          description: "Non authentifie, ou compte sans jeton KLASSCI"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageOnly'
        '403':
          description: |
            L un de ces refus, que `message` nomme :
            - l appelant n est pas eleve (message generique) ;
            - fenetre fermee — la reponse porte alors `window` a la racine ;
            - nombre maximum de tentatives atteint ;
            - reprise interdite (`allow_retake: false`) ;
            - evaluation qui ne se passe pas en ligne.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  message:
                    type: string
                  window:
                    $ref: '#/components/schemas/EvaluationWindow'
        '404':
          description: "Evaluation inexistante ou non publiee (« Evaluation non disponible »)"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageOnly'
        '422':
          description: "L evaluation n a encore aucune question"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageOnly'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '503':
          description: |
            Fenetre non verifiable : KLASSCI injoignable. Refus par prudence
            (aucune tentative creee) — reessayer.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageOnly'

  /evaluations/{id}/submit:
    post:
      tags:
        - Evaluations
      operationId: submitEvaluation
      summary: "Rendre la tentative en cours"
      description: |
        Clot la tentative `en_cours` ouverte par `/start` — n en cree jamais.
        La correction automatique s applique ; les dissertations attendent une
        notation manuelle (`/submissions/{submission}/grade`).

        Quand `show_results` est faux, `score` et `note_sur_20` sont RETIRES
        de la reponse (a la racine de `data` comme dans `data.submission`).

        Limite : 60 requetes / minute.
      security:
        - sanctum: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - answers
              properties:
                answers:
                  type: object
                  minProperties: 1
                  description: |
                    MAP indexee par identifiant de question. Chaque valeur est
                    une chaine (<= 10 000 caracteres), ou un tableau de chaines
                    pour `qcm_multiple` (<= 200 elements). `""`, `[]` ou `null` =
                    question non repondue (0 point).
                  additionalProperties:
                    oneOf:
                      - type: string
                        maxLength: 10000
                        nullable: true
                      - type: array
                        maxItems: 200
                        items:
                          type: string
                          maxLength: 10000
                  example:
                    "12": "A"
                    "13": ["A", "C"]
                submitted_at:
                  type: string
                  description: "Format `Y-m-d\\TH:i:s\\Z` ; l heure du serveur par defaut."
                  example: "2026-09-25T14:30:00Z"
      responses:
        '201':
          description: "Copie rendue"
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  message:
                    type: string
                  data:
                    type: object
                    properties:
                      submission:
                        allOf:
                          - $ref: '#/components/schemas/EvaluationSubmissionRecord'
                          - type: object
                            properties:
                              evaluation:
                                $ref: '#/components/schemas/EvaluationRecord'
                      score:
                        type: string
                        pattern: '^-?\d+\.\d{2}$'
                        nullable: true
                        description: "Absent quand `show_results` est faux"
                      note_sur_20:
                        type: string
                        pattern: '^-?\d+\.\d{2}$'
                        nullable: true
                        description: "Absent quand `show_results` est faux"
        '401':
          description: "Non authentifie"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageOnly'
        '403':
          description: |
            Message generique. L appelant n est pas eleve, OU l evaluation
            n existe pas / n est pas publiee, OU sa date limite est passee :
            une evaluation inconnue rend 403, pas 404.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageOnly'
        '409':
          description: "Aucune tentative en cours : la demarrer avec `/start` avant de la rendre"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageOnly'
        '422':
          description: "`answers` absent, vide, ou d un type refuse"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationFailed'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          description: "Erreur interne"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageOnly'

  /evaluations/{id}/time-status:
    get:
      tags:
        - Evaluations
      operationId: getEvaluationTimeStatus
      summary: "Fenetre de passage et heure du serveur"
      description: |
        Informatif : si KLASSCI est injoignable, `window` vaut `null` et la
        reponse reste 200. C est `/start` qui refuse, pas cette route.
      security:
        - sanctum: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: "Etat temporel"
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: object
                    properties:
                      window:
                        $ref: '#/components/schemas/EvaluationWindow'
                      server_time:
                        type: string
                        format: date-time
        '401':
          description: "Non authentifie, ou compte sans jeton KLASSCI"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageOnly'
        '404':
          description: "Evaluation non trouvee"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageOnly'

  /evaluations/{id}/my-submission:
    get:
      tags:
        - Evaluations
      operationId: getMySubmission
      summary: "Derniere copie de l eleve, et son corrige apres delai"
      description: |
        Rend la tentative de plus haut numero, quel que soit son statut.

        Le corrige (`correct_answers`, `explanation` sur chaque question)
        n apparait qu a partir de `correction_available_at` : 7 jours apres
        la remise. Avant, les questions sont rendues sans lui. Quand
        `show_results` est faux, `score` et `note_sur_20` valent `null`.
      security:
        - sanctum: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: "La copie"
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: object
                    properties:
                      id:
                        type: integer
                      evaluation_id:
                        type: integer
                      attempt:
                        type: integer
                      status:
                        type: string
                        enum: [en_cours, soumis, corrige]
                      started_at:
                        type: string
                        format: date-time
                        nullable: true
                      submitted_at:
                        type: string
                        format: date-time
                        nullable: true
                      score:
                        type: string
                        pattern: '^-?\d+\.\d{2}$'
                        nullable: true
                      note_sur_20:
                        type: string
                        pattern: '^-?\d+\.\d{2}$'
                        nullable: true
                      feedback:
                        type: string
                        nullable: true
                      questions:
                        type: array
                        items:
                          allOf:
                            - $ref: '#/components/schemas/EvaluationQuestionPublic'
                            - type: object
                              properties:
                                correct_answers:
                                  description: "Present seulement une fois `correction_available` vrai"
                                explanation:
                                  type: string
                                  nullable: true
                                  description: "Present seulement une fois `correction_available` vrai"
                      answers:
                        type: object
                        additionalProperties: true
                      correction_available:
                        type: boolean
                      correction_available_at:
                        type: string
                        format: date-time
                        nullable: true
                      correction_delay_days:
                        type: integer
                        example: 7
                      evaluation:
                        type: object
                        properties:
                          id:
                            type: integer
                          titre:
                            type: string
                          bareme:
                            $ref: '#/components/schemas/Decimal2'
                          coefficient:
                            $ref: '#/components/schemas/Decimal2'
        '401':
          description: "Non authentifie, ou compte sans identifiant KLASSCI synchronise"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageOnly'
        '404':
          description: "Evaluation non trouvee, ou aucune copie de l eleve pour elle"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageOnly'
        '500':
          description: "Erreur interne"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageOnly'

  /evaluations/{id}/publish:
    post:
      tags:
        - Evaluations
      operationId: publishEvaluation
      summary: "Publier une evaluation"
      description: |
        Rend l evaluation visible aux eleves : `is_published` vrai, `status`
        `planifiee`. Aucun corps de requete. Republier une evaluation deja
        publiee est accepte.

        Roles : enseignant (proprietaire de l evaluation) ou administrateur.
        Les coordinateurs ne publient pas.
      security:
        - sanctum: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: "Evaluation publiee"
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  message:
                    type: string
                  data:
                    $ref: '#/components/schemas/EvaluationRecord'
        '401':
          description: "Non authentifie"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageOnly'
        '403':
          description: |
            Role insuffisant, coordinateur, enseignant non proprietaire — ou
            evaluation inconnue dans cet etablissement : elle rend 403, pas 404.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageOnly'
        '422':
          description: "Aucune question, ou evaluation deja terminee"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageOnly'

  /evaluations/{id}/preview:
    get:
      tags:
        - Evaluations
      operationId: previewEvaluation
      summary: "Previsualiser une evaluation, sans son corrige"
      description: |
        Roles : enseignant, coordinateur, administrateur. Un coordinateur ne
        previsualise que les evaluations terminees. `correct_answers` n est
        jamais expose ici.
      security:
        - sanctum: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: "Apercu"
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: object
                    properties:
                      id:
                        type: integer
                      titre:
                        type: string
                      description:
                        type: string
                        nullable: true
                      type:
                        type: string
                      duree_minutes:
                        type: integer
                        nullable: true
                      coefficient:
                        $ref: '#/components/schemas/Decimal2'
                      bareme:
                        $ref: '#/components/schemas/Decimal2'
                      date_evaluation:
                        type: string
                        format: date-time
                        nullable: true
                      questions:
                        type: array
                        items:
                          type: object
                          properties:
                            id:
                              type: integer
                            question:
                              type: string
                            type:
                              type: string
                            points:
                              $ref: '#/components/schemas/Decimal2'
                            ordre:
                              type: integer
                            options:
                              nullable: true
                      questions_count:
                        type: integer
                      total_points:
                        type: number
                        description: "Somme des points — un NOMBRE, contrairement a `points` par question"
                      is_preview:
                        type: boolean
                        example: true
        '401':
          description: "Non authentifie"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageOnly'
        '403':
          description: "Role insuffisant, ou coordinateur sur une evaluation non terminee"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageOnly'
        '404':
          description: "Evaluation non trouvee"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageOnly'
        '500':
          description: "Erreur interne"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorWithDetail'

  /evaluations/{id}/submissions:
    get:
      tags:
        - Evaluations
      operationId: listEvaluationSubmissions
      summary: "Copies d une evaluation"
      description: |
        Toutes les tentatives, entrainements compris, triees par remise
        decroissante. Lecture : enseignant proprietaire, coordinateur de
        l etablissement, administrateur.
      security:
        - sanctum: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: "Copies"
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: integer
                        evaluation_id:
                          type: integer
                        klassci_etudiant_id:
                          type: integer
                        student_name:
                          type: string
                          description: "`Etudiant #<id>` quand aucun compte local ne correspond"
                        attempt:
                          type: integer
                        status:
                          type: string
                          enum: [en_cours, soumis, corrige]
                        started_at:
                          type: string
                          format: date-time
                          nullable: true
                        submitted_at:
                          type: string
                          format: date-time
                          nullable: true
                        score:
                          type: string
                          pattern: '^-?\d+\.\d{2}$'
                          nullable: true
                        note_sur_20:
                          type: string
                          pattern: '^-?\d+\.\d{2}$'
                          nullable: true
                        synced_to_klassci:
                          type: boolean
                        synced_at:
                          type: string
                          format: date-time
                          nullable: true
        '401':
          description: "Non authentifie"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageOnly'
        '403':
          description: |
            Role insuffisant, enseignant non proprietaire — ou evaluation
            inconnue dans cet etablissement : elle rend 403, pas 404.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageOnly'
        '500':
          description: "Erreur interne"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorWithDetail'

  /evaluations/{id}/submissions/{submission}/grade:
    post:
      tags:
        - Evaluations
      operationId: gradeEvaluationSubmission
      summary: "Noter les dissertations d une copie"
      description: |
        Attribue les points des questions `dissertation`, recalcule
        `note_sur_20` et passe la copie en `corrige`. Chaque dissertation de
        l evaluation doit recevoir des points. Les points des autres questions
        restent ceux de la correction automatique.

        Enseignant proprietaire ou administrateur ; les coordinateurs ne
        notent pas. `data.student` est le compte complet de l eleve : au-dela
        des champs de `User`, il porte notamment `klassci_id`, `klassci_data`,
        `phone`, `institution_id`.
      security:
        - sanctum: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
        - name: submission
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - points
              properties:
                points:
                  type: object
                  minProperties: 1
                  description: "MAP `{ \"<question_id>\": points }`, points >= 0"
                  additionalProperties:
                    type: number
                    minimum: 0
                  example:
                    "14": 4
                feedback:
                  type: string
                  maxLength: 1000
                  nullable: true
      responses:
        '200':
          description: "Copie notee"
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  message:
                    type: string
                  data:
                    allOf:
                      - $ref: '#/components/schemas/EvaluationSubmissionRecord'
                      - type: object
                        properties:
                          student:
                            $ref: '#/components/schemas/User'
        '401':
          description: "Non authentifie"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageOnly'
        '403':
          description: |
            Role insuffisant, coordinateur, enseignant non proprietaire — ou
            evaluation inconnue dans cet etablissement : elle rend 403, pas 404.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageOnly'
        '404':
          description: "Copie inexistante, ou appartenant a une autre evaluation"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageOnly'
        '409':
          description: "Copie encore `en_cours` : elle ne peut pas etre notee"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageOnly'
        '422':
          description: |
            `points` absent ou invalide (forme `ValidationFailed`) ; ou
            evaluation sans dissertation, ou dissertation sans points (forme
            `MessageOnly`).
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/ValidationFailed'
                  - $ref: '#/components/schemas/MessageOnly'

  /evaluations/{id}/results-by-class:
    get:
      tags:
        - Evaluations
      operationId: getEvaluationResultsByClass
      summary: "Resultats par eleve de la classe, et statistiques"
      description: |
        Une ligne par eleve de la classe (liste lue sur KLASSCI), qu il ait
        passe l evaluation ou non (`status: non_passee`). Les tentatives
        d entrainement sont ignorees. Lecture : enseignant proprietaire,
        coordinateur de l etablissement, admin d etablissement (`superAdmin`).

        `data.evaluation` est l evaluation enrichie : ses questions (sans
        corrige), toutes ses copies, et des champs de presentation.

        Une erreur 4xx renvoyee par KLASSCI est relayee avec SON statut, et un
        message generique.
      security:
        - sanctum: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: "Resultats"
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: object
                    properties:
                      evaluation:
                        allOf:
                          - $ref: '#/components/schemas/EvaluationRecord'
                          - type: object
                            properties:
                              questions:
                                type: array
                                items:
                                  $ref: '#/components/schemas/EvaluationQuestionPublic'
                              submissions:
                                type: array
                                items:
                                  $ref: '#/components/schemas/EvaluationSubmissionRecord'
                              classe:
                                nullable: true
                              matiere:
                                nullable: true
                              enseignant:
                                nullable: true
                              date_evaluation_formatted:
                                type: string
                                nullable: true
                                example: "28/09/2026 à 16:44"
                              date_evaluation_short:
                                type: string
                                nullable: true
                                example: "28/09/2026"
                              can_be_edited:
                                type: boolean
                              submissions_count:
                                type: integer
                              questions_count:
                                type: integer
                              effective_status:
                                type: string
                      resultats:
                        type: array
                        items:
                          type: object
                          properties:
                            etudiant_id:
                              type: integer
                            etudiant_nom:
                              type: string
                            etudiant_prenom:
                              type: string
                            etudiant_nom_complet:
                              type: string
                            note:
                              type: string
                              pattern: '^-?\d+\.\d{2}$'
                              nullable: true
                              description: "Note sur 20"
                            score:
                              type: string
                              pattern: '^-?\d+\.\d{2}$'
                              nullable: true
                            status:
                              type: string
                              enum: [non_passee, en_cours, soumis, corrige]
                            submitted_at:
                              type: string
                              format: date-time
                              nullable: true
                            attempt:
                              type: integer
                              nullable: true
                            feedback:
                              type: string
                              nullable: true
                      statistiques:
                        type: object
                        properties:
                          total_etudiants:
                            type: integer
                          etudiants_soumis:
                            type: integer
                            description: "Copies `soumis` ou `corrige`"
                          etudiants_en_cours:
                            type: integer
                          etudiants_non_passes:
                            type: integer
                          taux_participation:
                            type: number
                            description: "Pourcentage, arrondi a 2 decimales"
                          moyenne_classe:
                            type: number
                            nullable: true
                          note_max:
                            type: number
                            nullable: true
                          note_min:
                            type: number
                            nullable: true
        '401':
          description: "Non authentifie, ou enseignant sans jeton KLASSCI"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageOnly'
        '403':
          description: |
            Role insuffisant, enseignant non proprietaire — ou evaluation
            inconnue dans cet etablissement : elle rend 403, pas 404.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageOnly'
        '503':
          description: "KLASSCI indisponible (en-tete `Retry-After`)"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageOnly'
        '500':
          description: "Erreur interne"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorWithDetail'

  /evaluations/{id}/sync-klassci:
    post:
      tags:
        - Evaluations
      operationId: syncEvaluationNotesToKlassci
      summary: "Envoyer les notes a KLASSCI"
      description: |
        Envoie a KLASSCI la note sur 20 de chaque copie `soumis` ou `corrige`
        (entrainements exclus), puis marque l evaluation `notes_published` et
        ses copies `synced_to_klassci`. Aucun corps de requete.

        Bloque (409) tant qu une copie a dissertation n est pas notee.
        `data` est la reponse de KLASSCI, relayee telle quelle.

        Roles : enseignant, coordinateur, administrateur.
      security:
        - sanctum: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: "Notes envoyees"
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  message:
                    type: string
                  data:
                    description: "Reponse de KLASSCI, forme non garantie par le LMS"
        '400':
          description: "L evaluation n est liee a aucune evaluation KLASSCI"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageOnly'
        '401':
          description: "Non authentifie, ou compte sans jeton KLASSCI"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageOnly'
        '403':
          description: "Role insuffisant"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageOnly'
        '404':
          description: "Evaluation non trouvee"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageOnly'
        '409':
          description: "Une copie a dissertation n est pas encore notee"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageOnly'
        '500':
          description: "Echec, y compris une panne de KLASSCI (rendue en 500, pas en 503)"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorWithDetail'

  /evaluations/{id}/sync-notes:
    post:
      tags:
        - Evaluations
      operationId: markEvaluationNotesSynced
      summary: "Marquer les copies comme synchronisees (ne transmet rien)"
      description: |
        ATTENTION : cette route ne transmet AUCUNE note a KLASSCI. Elle marque
        `synced_to_klassci` les copies `soumis` qui ne l etaient pas, et compte
        combien elle en a marquees. Pour envoyer reellement les notes, utiliser
        `/evaluations/{id}/sync-klassci`.

        Bloque (409) tant qu une copie a dissertation n est pas notee. Une
        evaluation inconnue rend 500, pas 404.

        Roles : enseignant, coordinateur, administrateur.
      security:
        - sanctum: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: |
            Copies marquees. `synced_count` et `errors` sont a la RACINE ;
            `errors` est absent quand il n y avait rien a marquer.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  message:
                    type: string
                  synced_count:
                    type: integer
                  errors:
                    type: array
                    items:
                      type: object
                      properties:
                        submission_id:
                          type: integer
                        student_id:
                          type: integer
                        error:
                          type: string
        '401':
          description: "Non authentifie"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageOnly'
        '403':
          description: "Role insuffisant"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageOnly'
        '409':
          description: "Une copie a dissertation n est pas encore notee"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageOnly'
        '500':
          description: "Echec, y compris evaluation inconnue"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorWithDetail'

  # ============ DASHBOARD ============
  /dashboard/student:
    get:
      tags:
        - Dashboard
      summary: "Student dashboard"
      security:
        - sanctum: []
      responses:
        '200':
          description: "Student dashboard data"
        '401':
          description: "Unauthenticated"

  /dashboard/teacher:
    get:
      tags:
        - Dashboard
      summary: "Teacher dashboard"
      security:
        - sanctum: []
      responses:
        '200':
          description: "Teacher dashboard data"
        '401':
          description: "Unauthenticated"

  # ============ CHAPTERS ============
  /lessons/{lessonId}/chapters:
    get:
      tags:
        - Chapters
      summary: "List chapters of a lesson"
      security:
        - sanctum: []
      parameters:
        - name: lessonId
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: "List of chapters"

    post:
      tags:
        - Chapters
      summary: "Create chapter in a lesson"
      security:
        - sanctum: []
      parameters:
        - name: lessonId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                titre:
                  type: string
      responses:
        '201':
          description: "Chapter created"
        '422':
          description: "Validation error"

  /chapters/{chapter}/video:
    get:
      tags:
        - Chapters
      summary: "Stream a session recording (signed URL, no bearer)"
      description: >
        Sert l'enregistrement d'une seance depuis le disque PRIVE (#824).
        Volontairement sans `auth:sanctum` : une balise `<video>` ne peut pas
        envoyer d'en-tete `Authorization`. La signature tient lieu de jeton ;
        elle n'est emise que dans la reponse d'un `GET /api/chapters/{id}`
        authentifie, et vaut 4 h. Les requetes `Range` sont prises en charge.
      security: []
      parameters:
        - name: chapter
          in: path
          required: true
          schema:
            type: integer
        - name: signature
          in: query
          required: true
          schema:
            type: string
        - name: expires
          in: query
          required: true
          schema:
            type: integer
        - name: Range
          in: header
          required: false
          schema:
            type: string
          example: "bytes=0-1048575"
      responses:
        '200':
          description: "Media complet (video/mp4)"
        '206':
          description: "Contenu partiel, en reponse a un en-tete Range"
        '403':
          description: "Signature absente, alteree ou expiree"
        '404':
          description: "Chapitre inconnu, sans enregistrement, ou media purge"

  /chapters/{id}:
    get:
      tags:
        - Chapters
      summary: "Get chapter details"
      security:
        - sanctum: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: "Chapter details"
        '404':
          description: "Chapter not found"

    put:
      tags:
        - Chapters
      summary: "Update chapter"
      security:
        - sanctum: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: "Chapter updated"

    delete:
      tags:
        - Chapters
      summary: "Delete chapter"
      security:
        - sanctum: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: "Chapter deleted"

  # ============ NOTIFICATIONS ============
  /notifications:
    get:
      tags:
        - Notifications
      summary: "List notifications"
      security:
        - sanctum: []
      parameters:
        - name: read
          in: query
          schema:
            type: string
            enum: [true, false]
        - name: per_page
          in: query
          schema:
            type: integer
            default: 10
      responses:
        '200':
          description: "List of notifications"

  /notifications/unread-count:
    get:
      tags:
        - Notifications
      summary: "Get unread count"
      security:
        - sanctum: []
      responses:
        '200':
          description: "Unread count"

  /notifications/{id}/mark-as-read:
    post:
      tags:
        - Notifications
      summary: "Mark notification as read"
      security:
        - sanctum: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: "Marked as read"

  # ============ FILES ============
  /files:
    get:
      tags:
        - Files
      summary: "List files"
      security:
        - sanctum: []
      responses:
        '200':
          description: "List of files"

  # L'upload vit sous /files/upload, pas sous /files (#876) : la spec le
  # documentait en `POST /files`, que le serveur refuse en 405.
  /files/upload:
    post:
      tags:
        - Files
      summary: "Upload file"
      description: "30 Mo maximum, types limités par UploadFileRequest. Limité à 60 requêtes par minute."
      security:
        - sanctum: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - file
              properties:
                file:
                  type: string
                  format: binary
                  description: "pdf, doc, docx, xls, xlsx, ppt, pptx, jpg, jpeg, png ou gif"
                category:
                  type: string
                  enum: [course_material, assignment, resource, other, forum_attachment, profile_picture, general]
                fileable_type:
                  type: string
                  description: "Clé déclarée dans config/fileables.php (morph_map)"
                fileable_id:
                  type: integer
                  minimum: 1
                description:
                  type: string
                  maxLength: 500
                is_public:
                  type: boolean
      responses:
        '201':
          description: "File uploaded"
        '401':
          description: "Unauthenticated"
        '422':
          description: "Validation error"
        '429':
          description: "Too many requests"
        '500':
          description: "Storage failure"

  /files/{id}/download:
    get:
      tags:
        - Files
      summary: "Download file"
      security:
        - sanctum: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: "File downloaded"

  /webhooks/visio/recording-ready:
    post:
      tags:
        - Visio
      summary: "Webhook enregistrement visio prêt (#469)"
      security: []
      responses:
        '202':
          description: "Accepted for processing"
        '401':
          description: "Invalid signature"

# Security (global)
security:
  - sanctum: []

tags:
  - name: "Authentication"
    description: "User authentication and session management"
  - name: "Proxy / KLASSCI"
    description: "Routes proxying to KLASSCI API with authentication"
  - name: "Evaluations"
    description: "Student evaluations and assessments"
  - name: "Dashboard"
    description: "Dashboard endpoints for students and teachers"
  - name: "Chapters"
    description: "Course chapters and content"
  - name: "Notifications"
    description: "User notifications"
  - name: "Files"
    description: "File upload and download"
