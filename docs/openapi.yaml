  /training-sessions:
    get:
      tags:
        - Session de formation
      summary: "Lister les Periodes de son etablissement"
      description: |
        Bornee a l etablissement de l appelant, explicitement et pas seulement
        par le scope global : ce dernier est fail-open quand aucun tenant n est
        resolu. Paginee.

        Par defaut, les Periodes `archivee` et `purgee` sont ecartees (#1208).
        `archivees=1` fait revenir les archivees ; une Periode purgee n y revient
        jamais (fin d une politique de retention, pas une decision humaine).
      security:
        - sanctum: []
      parameters:
        - name: per_page
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 25
        - name: archivees
          in: query
          required: false
          description: "`1` pour inclure les Periodes archivees. Une valeur non booleenne rend 422."
          schema:
            type: integer
            enum: [0, 1]
            default: 0
      responses:
        '200':
          description: "Page de Periodes"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TrainingSessionPage'
        '400':
          $ref: '#/components/responses/EtablissementInconnu'
        '401':
          description: "Non authentifie"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: "Role insuffisant. Ecole creee depuis KLASSCI : `catalogue_managed_by_klassci` (#1184), les sessions de formation n existent que dans une ecole autonome. Aussi, sans `reason` : etablissement desactive ou supprime (ResolveInstitution, #961)."
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: "`per_page` hors bornes (#911), ou `archivees` non booleen (#1208)."
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          $ref: '#/components/responses/TooManyRequests'
    post:
      tags:
        - Session de formation
      summary: "Creer une Periode — la session de formation datee"
      description: |
        L entite racine du monde autonome : elle porte les dates, le tarif et
        les inscriptions.

        Les cinq dates sont FACULTATIVES — un brouillon se cree avant qu elles
        soient arretees — mais celles qui sont fournies doivent rester
        ordonnees : `enrollment_opens_at` <= `enrollment_closes_at` <=
        `starts_on` <= `ends_on` <= `certificate_available_at`. Chaque date est
        comparee a la PRECEDENTE RENSEIGNEE, de sorte que l ordre tienne meme
        quand une date intermediaire manque. La base porte la meme contrainte
        en dernier recours.

        `status` et `institution_id` ne sont JAMAIS acceptes : une Periode nait
        `brouillon` — publier est une decision distincte — et l etablissement
        vient du tenant resolu.

        Le `program_id` doit appartenir a l etablissement de l appelant : sinon
        le message d erreur revelerait quels identifiants existent ailleurs.
      security:
        - sanctum: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TrainingSessionInput'
      responses:
        '201':
          description: "Periode creee, en statut brouillon"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TrainingSessionCreated'
        '400':
          $ref: '#/components/responses/EtablissementInconnu'
        '401':
          description: "Non authentifie"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: "Role insuffisant. Ecole creee depuis KLASSCI : `catalogue_managed_by_klassci` (#1184), les sessions de formation n existent que dans une ecole autonome. Aussi, sans `reason` : etablissement desactive ou supprime (ResolveInstitution, #961)."
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: |
            Dates desordonnees, ou Programme inconnu dans cet etablissement.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /auth/login:
