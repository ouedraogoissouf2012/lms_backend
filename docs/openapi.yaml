    # Entree en visio et validation d'un participant (lot B).
    ParticipantValide:
      type: object
      description: |
        Deux formes sous le meme statut 200. `authorized: true` : l'acces est
        accorde, avec `role` et `message`. `authorized: false` : un REFUS rendu
        en 200, motif `invalid_role`, pour un compte dont le role n'est ni du
        personnel ni un eleve. Le client lit `authorized`, pas le statut.
      additionalProperties: false
      required:
        - success
        - authorized
      properties:
        success:
          type: boolean
          enum:
            - true
        authorized:
          type: boolean
        role:
          type: string
          description: "Present si l'acces est accorde : `moderator` pour un coordinateur ou un administrateur."
          enum:
            - moderator
            - teacher
            - student
        message:
          type: string
        reason:
          type: string
          description: "Present si l'acces est refuse."
          enum:
            - invalid_role
        user_role:
          type: string
          description: "Le role brut du compte refuse."

    RefusParticipant:
      type: object
      description: |
        Les refus 403 de la validation d'un participant et de l'entree en visio.
        Trois sources sous ce statut : la garde de role ou un etablissement
        desactive (`message` seul) ; la porte des comptes sans etablissement
        (`reason: no_institution`) ; la decision d'acces (`authorized: false` et
        `reason`). Faute de `oneOf` dans l'outillage de contrat, le schema admet
        toutes ces formes : il ne lie pas un motif a sa forme.
      additionalProperties: false
      required:
        - success
        - message
      properties:
        success:
          type: boolean
          enum:
            - false
        message:
          type: string
        authorized:
          type: boolean
          enum:
            - false
        reason:
          type: string
          enum:
            - no_institution
            - visio_not_enabled
            - visio_ended
            - actor_not_authorized
            - teacher_not_owner
            - no_classe_id
            - not_enrolled

    ParticipantIntrouvable:
      type: object
      description: "Le compte vise a ete supprime. Sans `message`."
      additionalProperties: false
      required:
        - success
        - authorized
        - reason
      properties:
        success:
          type: boolean
          enum:
            - false
        authorized:
          type: boolean
          enum:
            - false
        reason:
          type: string
          enum:
            - user_not_found

    VisioNonActive:
      type: object
      additionalProperties: false
      required:
        - success
        - message
        - reason
      properties:
        success:
          type: boolean
          enum:
            - false
        message:
          type: string
        reason:
          type: string
          description: "L'etat de la visio : programmee, terminee, ou non activee."
          enum:
            - visio_not_started
            - visio_ended
            - visio_not_enabled

    VisioRejointe:
      type: object
      additionalProperties: false
      required:
        - success
        - message
        - data
      properties:
        success:
          type: boolean
          enum:
            - true
        message:
          type: string
        data:
          type: object
          additionalProperties: false
          required:
            - visio_room_id
            - participants_count
            - visio_token
            - visio_token_available
            - can_manage_recording
          properties:
            visio_room_id:
              type: string
              nullable: true
            participants_count:
              type: integer
              minimum: 0
              description: "Participants connectes, lus avant l'enregistrement de cet appel : un appelant deja connecte (rechargement) y est compte."
            visio_token:
              type: string
              nullable: true
              description: "Cle d'entree de CE salon pour CET utilisateur. Null si Jitsi n'est pas configure, ou sans salon."
            visio_token_available:
              type: boolean
            can_manage_recording:
              type: boolean
              description: "Decide par le serveur : coordinateur, administrateur ou enseignant de la seance."

    ErrorWithDetail:
      type: object
      description: |
        Forme de 500 portee par quelques routes anciennes : une cle `error`
        AU SINGULIER, hors de l enveloppe canonique. Conservee telle quelle
        pour ne pas casser le client.
      properties:
        success:
          type: boolean
          example: false
        message:
          type: string
        error:
          type: string
          example: "Une erreur est survenue."

    # #961 — le corps des deux refus de `ResolveInstitution` : ni `error_code`,
    # ni `reason`.
    RefusDeLaResolution:
      type: object
      additionalProperties: false
      required:
        - success
        - message
      properties:
        success:
          type: boolean
          enum:
            - false
        message:
          type: string

    # #1275 — l'administration definit le mot de passe d'un compte : jamais en reponse.
    MotDePasseDefini:
      type: object
      additionalProperties: false
      required:
        - success
        - message
      properties:
        success:
          type: boolean
          enum:
            - true
        message:
          type: string
          example: "Mot de passe défini."

    MotDePasseDefinitionRefusee:
      type: object
      additionalProperties: false
      required:
        - success
        - message
      properties:
        success:
          type: boolean
          enum:
            - false
        message:
          type: string
        reason:
          type: string
          description: "Absent sur le 403 d'un compte hors de l'administration, d'une cible de rang egal ou superieur, ou de soi-meme."
          enum:
            - password_managed_by_klassci

    # #906 — un refus qui dit POURQUOI, pour que le front traduise par son
    # propre catalogue sans lire le message du serveur. Le motif va dans le
    # CORPS : le front de production est cross-origin, et `exposed_headers: []`
    # lui cache tout en-tete non standard. Convention : ADR-906-01.
    # P5-a : toute route authentifiee non marquee `plateforme` peut aussi rendre
    # ce refus en 403, motif `no_institution`, pour un compte sans
    # etablissement (EnsureSchoolMemberOrPlatformRoute). Ce refus est global :
    # il n est pas recopie route par route.
    RefusMotive:
      type: object
      required:
        - success
        - message
        - reason
      properties:
        success:
          type: boolean
          example: false
        message:
          type: string
        reason:
          type: string
          enum:
            - enrolment_not_active
            - no_institution
            - attendance_managed_by_klassci
            - seance_not_started
            - student_not_in_seance
            - attendance_code_unknown
            - attendance_code_expired
            - already_marked_by_teacher
            - seance_not_justifiable
            - no_absence_in_range
            - justification_already_decided
            - klassci_account_refused
            - account_quota_exceeded
            - account_daily_cap_reached
            - institution_cap_reached
            - ip_quota_exceeded
            - ip_daily_cap_reached
            - seance_past
            - evaluation_locked
            - class_full

    # #806 — `reason` est FACULTATIF ici : un 401 Sanctum n en porte aucun.
    RefusKlassci:
      type: object
      required:
        - success
        - message
      properties:
        success:
          type: boolean
          example: false
        message:
          type: string
        reason:
          type: string
          enum:
            - klassci_token_missing
            - klassci_session_expired

    # #919 — le corps d'erreur que l'API emet REELLEMENT : RespondsWithJson::
    # errorResponse() et les rendus de bootstrap/app.php. Aucun `error_code` :
    # le code machine est `reason` (ADR-906-01, ADR-919-01).
    CategorieDeQuestions:
      type: object
      description: "#1702 : une categorie de la banque de questions d un enseignant, pour une matiere (id local)."
      required: [id, matiere_id, enseignant_id, libelle, nombre_de_questions]
      properties:
        id:
          type: integer
        matiere_id:
          type: integer
        enseignant_id:
          type: integer
        libelle:
          type: string
        nombre_de_questions:
          type: integer
    CategorieDeQuestionsSaisie:
      type: object
      required: [matiere_id, libelle]
      properties:
        matiere_id:
          type: integer
          description: "Une matiere de l ecole (id local)."
        libelle:
          type: string
          maxLength: 150
    QuestionDeBanque:
      type: object
      description: "#1702 : une question de la banque, avec les champs d une question d evaluation. Le tirage la COPIE dans l evaluation a sa publication."
      required: [id, categorie_id, question, type, points, options, correct_answers, explanation]
      properties:
        id:
          type: integer
        categorie_id:
          type: integer
        question:
          type: string
        type:
          type: string
          enum: [qcm, qcm_multiple, vrai_faux, reponse_courte, dissertation]
        points:
          type: number
        options:
          type: array
          nullable: true
          items:
            type: string
        correct_answers:
          type: array
          nullable: true
          items:
            type: string
        explanation:
          type: string
          nullable: true
    QuestionDeBanqueSaisie:
      type: object
      description: "Les regles d une question d evaluation (options bornees, vrai_faux = Vrai/Faux, bonnes reponses parmi les options)."
      required: [question, type]
      properties:
        question:
          type: string
          maxLength: 1000
        type:
          type: string
          enum: [qcm, qcm_multiple, vrai_faux, reponse_courte, dissertation]
        points:
          type: number
          minimum: 0
          nullable: true
        options:
          type: array
          nullable: true
          items:
            type: string
        correct_answers:
          type: array
          nullable: true
          items:
            type: string
        explanation:
          type: string
          nullable: true
          maxLength: 2000
    BilanDeClasse:
      type: object
      description: "#1676 : moyennes, rangs et reussite d une classe. L eleve ne recoit que `eleves` (sa ligne), sans `statistiques` ni `couverture`."
      required: [classe, periode, source, seuil_reussite, evaluations, matieres, eleves]
      properties:
        classe:
          type: object
          properties:
            id:
              type: integer
            libelle:
              type: string
        periode:
          type: object
          properties:
            du:
              type: string
              format: date
              nullable: true
            au:
              type: string
              format: date
              nullable: true
        source:
          type: string
          enum: [lms]
          description: "Les seules notes du LMS : dans une ecole KLASSCI, KLASSCI peut en tenir d autres."
        seuil_reussite:
          type: number
        evaluations:
          type: array
          description: "Les colonnes de la grille : les evaluations publiees, aux resultats visibles, de la periode."
          items:
            type: object
            properties:
              id:
                type: integer
              titre:
                type: string
              matiere_id:
                type: integer
                nullable: true
                description: "Id LOCAL de la matiere ; `null` sans matiere."
              date_evaluation:
                type: string
                format: date-time
                nullable: true
              coefficient:
                type: number
        matieres:
          type: array
          items:
            type: object
            properties:
              matiere_id:
                type: integer
              libelle:
                type: string
                nullable: true
              coefficient:
                type: number
                description: "Coefficient de la matiere dans la classe : il pondere la moyenne generale."
        eleves:
          type: array
          items:
            type: object
            properties:
              compte_id:
                type: integer
                nullable: true
                description: "Le compte local ; `null` pour un eleve du roster KLASSCI sans compte LMS."
              nom:
                type: string
              moyenne_generale:
                type: number
                nullable: true
              rang:
                type: integer
                nullable: true
                description: "Absent pour l eleve si l ecole ne l autorise pas ; `null` pour un eleve non classe."
              matieres:
                type: array
                items:
                  type: object
                  properties:
                    matiere_id:
                      type: integer
                      nullable: true
                    moyenne:
                      type: number
                      nullable: true
              notes:
                type: array
                items:
                  type: object
                  properties:
                    evaluation_id:
                      type: integer
                    note:
                      type: number
              notes_manquantes:
                type: array
                description: "Les evaluations de la periode sans note finale de l eleve."
                items:
                  type: integer
              cellules:
                type: array
                description: "#1698 : le carnet de notes. Une case par evaluation, dans l ordre de `evaluations`. Seule une case `rendu` porte une note et compte dans les moyennes : `a_corriger` (remise, correction manuelle attendue), `en_retard` (remise refusee apres l echeance, copie verrouillee), `manquant` (rien de remis)."
                items:
                  type: object
                  required: [evaluation_id, etat, note]
                  properties:
                    evaluation_id:
                      type: integer
                    etat:
                      type: string
                      enum: [rendu, a_corriger, en_retard, manquant]
                    note:
                      type: number
                      nullable: true
        statistiques:
          type: object
          properties:
            effectif:
              type: integer
            classes:
              type: integer
              description: "Les eleves qui ont une moyenne generale."
            moyenne_classe:
              type: number
              nullable: true
            taux_reussite:
              type: number
              nullable: true
              description: "Pourcentage des eleves classes dont la moyenne atteint le seuil."
        couverture:
          type: object
          properties:
            matieres_sans_evaluation:
              type: array
              items:
                type: object
                properties:
                  matiere_id:
                    type: integer
                  libelle:
                    type: string
                    nullable: true
            evaluations_sans_note:
              type: array
              items:
                type: integer

    ErrorResponse:
      type: object
      properties:
        success:
          type: boolean
          enum:
            - false
        message:
          type: string
          example: "Unauthenticated."
        errors:
          type: object
          description: "Facultatif : le detail par champ d un refus de validation (422)."
          additionalProperties:
            type: array
            items:
              type: string
        reason:
          type: string
          description: "Facultatif : le motif d un refus a plusieurs sens (ADR-906-01)."
      required:
        - success
        - message

    # Auth Schemas
    LoginRequest:
      type: object
      properties:
        email:
          type: string
          format: email
          example: "user@example.com"
        password:
          type: string
          format: password
          example: "password123"
      required:
        - email
        - password

    AuthResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        data:
          type: object
          properties:
            token:
              type: string
              example: "token_string_here"
            user:
              type: object
              description: "Le compte connecte : ses identifiants, chacun dans son espace (#1409, #1536)."
              properties:
                id:
                  type: integer
                  description: "users.id LOCAL"
                klassci_id:
                  type: integer
                  nullable: true
                  description: "Numero de COMPTE KLASSCI ; null sans compte KLASSCI."
                klassci_enseignant_id:
                  type: integer
                  nullable: true
                  description: |
                    Identite d'ENSEIGNANT KLASSCI, l'espace des listes d'enseignants
                    (`/proxy/enseignants`, `/lms/enseignants`) et de l'enseignant d'une
                    evaluation (#873) ; null hors enseignant KLASSCI, et en ecole
                    autonome.
                id_dans_l_annuaire:
                  type: integer
                  nullable: true
                  description: |
                    #1536 : l'`id` que l'annuaire des enseignants de son ecole
                    (`/proxy/enseignants`) emet pour ce compte. Le client y reconnait sa
                    propre fiche sans connaitre le mode de l'ecole (#805). null pour un
                    compte qui n'est pas enseignant, ou que l'annuaire ecarte.

    User:
      type: object
      properties:
        id:
          type: integer
          example: 1
        klassci_id:
          type: integer
          nullable: true
          description: "Numero de COMPTE KLASSCI ; null sans compte KLASSCI."
        klassci_enseignant_id:
          type: integer
          nullable: true
          description: "Identite d'ENSEIGNANT KLASSCI (#1409) ; null hors enseignant KLASSCI."
        id_dans_l_annuaire:
          type: integer
          nullable: true
          description: |
            #1536 : l'`id` que l'annuaire des enseignants de son ecole emet pour ce compte ;
            null hors enseignant, ou si l'annuaire l'ecarte. Present dans les reponses qui
            decrivent le compte CONNECTE (`/auth/me`), absent ailleurs.
        email:
          type: string
          example: "user@example.com"
        name:
          type: string
          example: "John Doe"
        role:
          type: string
          enum: [etudiant, enseignant, coordinateur, admin, superAdmin]

    # Visio d'une seance KLASSCI : activation et bascule (#990).
    VisioActivee:
      type: object
      additionalProperties: false
      required:
        - success
        - message
        - data
      properties:
        success:
          type: boolean
          enum:
            - true
        message:
          type: string
        data:
          type: object
          additionalProperties: false
          required:
            - visio_enabled
            - visio_status
            - visio_room_id
            - notifications_sent
            - notifications_queued
            - classe_synced
          properties:
            visio_enabled:
              type: boolean
              enum:
                - true
            visio_status:
              type: string
              enum:
                - programmee
            visio_room_id:
              type: string
            notifications_sent:
              type: integer
              minimum: 0
              description: "Toujours 0 : les notifications sont planifiees, pas envoyees pendant la requete."
            notifications_queued:
              type: boolean
              description: "Toujours vrai, meme si la planification a echoue (l'echec est journalise, pas rendu)."
            classe_synced:
              type: boolean
              description: "La classe et ses eleves ont ete relus dans KLASSCI pour les notifications. Toujours faux dans une ecole en mode autonome : rien n'y est relu dans KLASSCI."

    VisioBasculeInput:
      type: object
      additionalProperties: false
      required:
        - enabled
      properties:
        enabled:
          type: boolean
        visio_type:
          type: string
          nullable: true
          description: "Seul Jitsi est cable. Absent ou null : `jitsi`."
          enum:
            - jitsi
            - null

    VisioBasculee:
      type: object
      additionalProperties: false
      required:
        - success
        - message
        - data
      properties:
        success:
          type: boolean
          enum:
            - true
        message:
          type: string
        data:
          type: object
          additionalProperties: false
          required:
            - seance_id
            - visio_enabled
            - visio_type
            - visio_room_id
            - visio_active
            - notifications_sent
            - notifications_queued
          properties:
            seance_id:
              type: integer
              description: "L'identifiant recu dans le chemin : KLASSCI en mode KLASSCI, local en mode autonome."
            visio_enabled:
              type: boolean
            visio_type:
              type: string
              nullable: true
              description: "`jitsi` a l'activation, null a la desactivation."
              enum:
                - jitsi
                - null
            visio_room_id:
              type: string
              nullable: true
              description: "Mode KLASSCI : un salon neuf a chaque activation, y compris d'une seance deja activee. Mode autonome : le salon deja attribue est garde. Null a la desactivation."
            visio_active:
              type: boolean
            notifications_sent:
              type: integer
              minimum: 0
              description: "Toujours 0 : les notifications sont planifiees, pas envoyees pendant la requete."
            notifications_queued:
              type: boolean
              description: "Vrai a l'activation, meme si la planification a echoue ; faux a la desactivation."

    VisioErreurInterne:
      type: object
      description: |
        `error` n'est present que si le service a rattrape l'erreur. Le
        gestionnaire global rend `success` et `message` seuls.
        Forme partagee des 500 rattrapes, au-dela de la visio (les eleves
        d'une classe, par exemple) : le nom est plus etroit que l'usage.
      additionalProperties: false
      required:
        - success
        - message
      properties:
        success:
          type: boolean
          enum:
            - false
        message:
          type: string
        error:
          type: string
          example: "Une erreur est survenue."

# Paths
paths:
  # ============ AUTHENTICATION ============
  /school-requests:
    post:
      tags:
        - School registration
      summary: "Deposer une demande d'ouverture d'ecole"
      description: |
        Porte d'entree du monde autonome (ADR-803-01). SEULE ecriture non
        authentifiee du systeme.

        N'ecrit qu'une ligne inerte, hors perimetre multi-tenant : ni compte,
        ni etablissement, ni reservation du `slug_souhaite`. La demande ne
        devient rien tant qu'un supradmin plateforme n'a pas tranche.

        Ne requiert PAS l'en-tete `X-Institution` : il n'y a pas encore
        d'etablissement a resoudre.

        Une seule demande en attente par adresse : un second depot met a jour
        la premiere au lieu d'en creer une seconde.

        Debit limite a 5 requetes par minute et par IP.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SchoolRegistrationRequestInput'
      responses:
        '201':
          description: |
            Demande enregistree. La reponse ne rend NI l'identifiant NI le
            statut : l'endpoint est anonyme, et les exposer offrirait de quoi
            enumerer les dossiers ou confirmer qu'une adresse a deja depose.

            Elle ne promet aucun courriel : le produit n'a aucun canal d'envoi.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: "Votre demande est enregistree. Elle sera examinee par notre equipe."
        '400':
          $ref: '#/components/responses/EtablissementInconnu'
        '403':
          $ref: '#/components/responses/EtablissementDesactive'
        '422':
          description: "Validation error"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          description: "Trop de demandes depuis cette adresse IP"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /lms/classes/local/{classeId}:
    get:
      tags:
        - Classes
      operationId: getLocalClassPage
      summary: "Details d'une classe designee par son identifiant LOCAL"
      description: |
        Porte jumelle de `/lms/classes/{classeId}`. Ouverte a tout compte de
        l'etablissement, sans garde de role. La source est choisie par le mode
        DECLARE de l'ecole, au point de liaison, jamais par le client.

        **Ecole creee depuis KLASSCI.** Le LMS y connait deux numerotations
        independantes pour la meme classe : la cle primaire locale, et
        l'identifiant KLASSCI. En production, elles divergent, avec des
        collisions franches. Un appelant qui detient un identifiant LOCAL — par
        exemple celui rendu par `classes_concernees` — doit donc utiliser CETTE
        porte : l'envoyer a la porte historique rend la fiche d'une autre
        classe, en 200, sans erreur. La classe est d'abord resolue localement,
        avant toute lecture de sa fiche : 404 si l'etablissement n'a pas cette
        classe, 409 (`classe_local_only`) si elle a ete creee dans le LMS et n'a
        donc pas d'identifiant KLASSCI. Sinon, la fiche est lue dans KLASSCI,
        avec le jeton KLASSCI du compte : 401 `klassci_token_missing` sans ce
        jeton. Un refus de KLASSCI (4xx) est relaye avec son statut et le
        message du catalogue, 401 avec `klassci_session_expired` ; une panne, un
        circuit ouvert ou une reponse illisible rendent le 503 avec
        `Retry-After`.

        **Ecole creee depuis le LMS**, ou basculee en mode autonome. La fiche
        est lue dans les tables locales, pour l'id local, sans aucun appel a
        KLASSCI et sans 409 : la meme fiche que par la porte historique. La
        gestion lit toute classe de l'etablissement, un enseignant une classe
        ou il est designe formateur, un eleve une classe ou son inscription est
        active, sans la liste des eleves. Sinon, 404.
      security:
        - sanctum: []
      parameters:
        - name: classeId
          in: path
          required: true
          description: "Cle primaire LOCALE de la classe (table `classes`)."
          schema:
            type: integer
            minimum: 1
      responses:
        '400':
          description: |
            Sans jeton porteur, un en-tete `X-Institution` inconnu : refuse
            avant l'authentification. Ou requete refusee par KLASSCI, relayee.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClasseLocaleRefus'
        '200':
          description: "La fiche de la classe, la meme que par la porte historique."
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FicheClasse'
        '401':
          description: |
            Jeton porteur absent ou invalide (sans `reason`). Dans une ecole creee
            depuis KLASSCI, pour une classe qui a une fiche KLASSCI : compte sans
            jeton KLASSCI (`reason: klassci_token_missing`), ou session refusee
            par KLASSCI (`reason: klassci_session_expired`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RefusKlassci'
        '403':
          description: |
            Sans `reason` : etablissement desactive ou supprime, ou refus de
            KLASSCI relaye. `no_institution` : compte sans etablissement, ou
            gestionnaire de la plateforme (`supradmin`), meme rattache a un
            etablissement.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RefusClasseEleves'
        '404':
          description: |
            Aucune classe ne porte cet identifiant local dans l'etablissement de
            l'appelant ; dans une ecole creee depuis le LMS, une classe que
            l'appelant n'atteint pas ; KLASSCI repond 2xx sans fiche de classe, ou
            404, relaye ; ou l'identifiant n'est pas numerique (la route ne le
            trouve pas). Sans motif.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClasseLocaleRefus'
        '409':
          description: |
            Ecole creee depuis KLASSCI seulement. La classe existe mais a ete
            creee dans le LMS : elle n'a aucune fiche KLASSCI a afficher. Un 404
            mentirait, la classe est bien la. Motif `classe_local_only`. Sans
            motif : conflit signale par KLASSCI, relaye. Ecole creee depuis le
            LMS : eleve de cette classe, inscription non active (D57, #1095),
            motif `enrolment_not_active`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClasseLocaleRefus'
        '422':
          description: "Donnees refusees par KLASSCI, relaye. Sans detail par champ."
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClasseLocaleRefus'
        '429':
          description: "KLASSCI limite les requetes, relaye, SANS son en-tete `Retry-After`. Aussi : limite de débit des lectures, par famille et par compte (#947)."
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClasseLocaleRefus'
        '4XX':
          description: |
            Tout autre refus de KLASSCI de 400 a 499 est relaye avec son statut et
            le message par defaut du catalogue.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClasseLocaleRefus'
        '500':
          description: |
            Panne interne, base de donnees comprise : « Une erreur est survenue. »,
            sans `error`, rapportee une fois au journal. Ou erreur non rattrapee,
            rendue par le gestionnaire global, sans `error`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VisioErreurInterne'
        '503':
          description: |
            Ecole creee depuis KLASSCI : KLASSCI indisponible (panne, circuit
            ouvert), ou reponse illisible.
          headers:
            Retry-After:
              schema:
                type: integer
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KlassciIndisponible'

  /lms/classes/etablissement:
    get:
      tags:
        - Classes
      operationId: listInstitutionClassesByLocalId
      summary: "Classes de l etablissement, par leur identifiant LOCAL"
      description: |
        Les classes de l etablissement de l appelant, `{id, libelle}`, triees
        par libelle (#1709). L `id` est la cle primaire LOCALE dans les DEUX
        volets : celle des classes creees dans le LMS, et celle des miroirs des
        classes KLASSCI — jamais leur identifiant KLASSCI. C est l identifiant
        qu attend le filtre `classe_id` de `POST /admin/reports/attendance`.

        Une classe KLASSCI pas encore miroitee n a pas d id local : elle n y
        figure pas. Aucune donnee du code d inscription (`GET /classes` la
        sert a qui l emet).

        Meme garde que le rapport par classe : la gestion (coordinateur,
        admin, superAdmin).
      security:
        - sanctum: []
      parameters:
        - name: per_page
          in: query
          required: false
          description: "Entre 1 et 100 ; absent vaut 25. Hors bornes ou non entier : 422 (spec #548)"
          schema:
            type: integer
            minimum: 1
            maximum: 100
        - name: page
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
      responses:
        '200':
          description: "Classes de l etablissement, triees par libelle"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClassesDeLEtablissementPage'
        '400':
          $ref: '#/components/responses/EtablissementInconnu'
        '401':
          description: "Non authentifie"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: "Role hors gestion, ou compte sans etablissement (`no_institution`). Aussi, sans `reason` : etablissement desactive ou supprime (ResolveInstitution, #961)."
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: "`per_page` ou `page` hors bornes, ou non entier (spec #548)"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationFailed'
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /lms/eleves/{eleve}/documents:
    post:
      tags:
        - Session de formation
      summary: "Emettre un document de scolarite (certificat, attestation) en PDF"
      description: |
        #1662. Pour un eleve de l ecole ayant une inscription ACTIVE. Le document recoit un numero par
        ecole, par type et par annee (`CS-2026-0001`, `AF-2026-0001`, tire sous le verrou de l ecole),
        un code de verification, et l emission est inscrite au journal d audit. Le PDF est rendu.

        L attestation ne porte pas encore de taux de presence (dette tracee : la regle vit dans le lot 6).
        Ecole KLASSCI : 403, les documents officiels relevent de KLASSCI.
      security:
        - sanctum: []
      parameters:
        - name: eleve
          in: path
          required: true
          schema:
            type: integer
            minimum: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [type]
              properties:
                type:
                  type: string
                  enum: [certificat_scolarite, attestation_frequentation]
      responses:
        '200':
          description: "Le document, en piece jointe (`<numero>.pdf`)"
          content:
            application/pdf:
              schema:
                type: string
                format: binary
        '400':
          $ref: '#/components/responses/EtablissementInconnu'
        '401':
          description: "Non authentifie"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: "Role insuffisant (garde `gestion`), ou ecole KLASSCI (`catalogue_managed_by_klassci`). Aussi, sans `reason` : etablissement desactive ou supprime (ResolveInstitution, #961)."
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: "Eleve introuvable DANS CET ETABLISSEMENT"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: "`student_not_enrolled` : l eleve n a aucune inscription active dans l ecole"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RefusMotive'
        '422':
          description: "`type` absent ou inconnu"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationFailed'
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /documents/verification/{code}:
    get:
      tags:
        - Session de formation
      summary: "Verifier un document de scolarite par son code (public)"
      description: |
        #1662. PUBLIQUE et bornee en debit. Ne rend que ce qui est imprime sur le document : type, numero,
        date d emission, ecole, titulaire. Un code inconnu et un code mal forme recoivent le meme 404.
      security: []
      parameters:
        - name: code
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: "Le document existe"
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: object
                    properties:
                      type:
                        type: string
                        enum: [certificat_scolarite, attestation_frequentation]
                      numero:
                        type: string
                      emis_le:
                        type: string
                        format: date
                      ecole:
                        type: string
                      titulaire:
                        type: string
        '400':
          $ref: '#/components/responses/EtablissementInconnu'
        '404':
          description: "Aucun document ne porte ce code"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /lms/classes/export:
    get:
      tags:
        - Classes
      summary: "Exporter la liste des classes de l ecole (CSV, PDF)"
      description: |
        #1656. Lue par le lecteur de `GET /proxy/classes` (KLASSCI ou local). Colonnes : libelle, code,
        filiere, niveau, inscrits, places ; triee par libelle. Synchrone, bornee a 2 000 lignes.
      security:
        - sanctum: []
      parameters:
        - name: format
          in: query
          required: true
          description: "`csv` (UTF-8 avec BOM, separateur `;`, formules neutralisees) ou `pdf`. Absent ou autre : 422."
          schema:
            type: string
            enum: [csv, pdf]
      responses:
        '200':
          description: "Le fichier, en piece jointe (`Content-Disposition: attachment`)"
          content:
            text/csv:
              schema:
                type: string
            application/pdf:
              schema:
                type: string
                format: binary
        '400':
          $ref: '#/components/responses/EtablissementInconnu'
        '401':
          description: "Non authentifie, ou (ecole KLASSCI) compte sans jeton KLASSCI : le refus de la lecture des classes, en JSON"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: "Role insuffisant (garde `personnel`). Aussi, sans `reason` : etablissement desactive ou supprime (ResolveInstitution, #961)."
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: "Hors de la portee du lecteur (classe d une autre ecole, enseignant hors de sa classe), en JSON"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: "`format` absent ou inconnu ; ou `export_too_large` (plus de 2 000 lignes)"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationFailed'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '503':
          description: |
            Ecole creee depuis KLASSCI : KLASSCI indisponible (panne, circuit ouvert), ou reponse illisible.
          headers:
            Retry-After:
              schema:
                type: integer
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KlassciIndisponible'

  /lms/classes/{classeId}:
    get:
      tags:
        - Classes
      operationId: getClassPage
      summary: "La fiche d'une classe (porte historique)"
      description: |
        La fiche ouverte depuis la carte d'une classe (`TeacherClassCard.vue`) et
        la liste d'administration. Ouverte a tout compte de l'etablissement, sans
        garde de role. La source est choisie par le mode DECLARE de l'ecole, au
        point de liaison, jamais par le client.

        **Ecole creee depuis KLASSCI.** `classeId` est l'identifiant KLASSCI. La
        fiche est lue dans KLASSCI avec le jeton KLASSCI du compte : 401
        `klassci_token_missing` sans ce jeton, avant tout appel. Un refus de
        KLASSCI (4xx) est relaye avec son statut et le message du catalogue, 401
        avec `klassci_session_expired` ; une panne, un circuit ouvert ou une
        reponse illisible rendent le 503 avec `Retry-After`. KLASSCI repond 2xx
        sans fiche : 404. Les evaluations programmees sont lues a part ; leur
        echec laisse la liste vide.

        **Ecole creee depuis le LMS**, ou basculee en mode autonome. `classeId`
        est l'identifiant local, et la fiche est celle de la porte locale
        (`/lms/classes/local/{classeId}`), lue dans les tables locales sans aucun
        appel a KLASSCI. La gestion lit toute classe de l'etablissement, un
        enseignant une classe ou il est designe formateur, un eleve une classe
        ou son inscription est active, sans la liste des eleves. Sinon, 404.

        **Ecole basculee.** Ses classes gardent leur `klassci_id`, mais la liste
        d'administration (`/proxy/classes`) suit le mode et donne les
        identifiants LOCAUX : un identifiant de la liste ouvre la meme classe.
      security:
        - sanctum: []
      parameters:
        - name: classeId
          in: path
          required: true
          description: "Identifiant KLASSCI dans une ecole creee depuis KLASSCI, identifiant local dans une ecole creee depuis le LMS ou basculee."
          schema:
            type: integer
      responses:
        '200':
          description: "La fiche de la classe."
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FicheClasse'
        '400':
          description: |
            Requete refusee par KLASSCI, relayee. Ou, sans jeton porteur, un
            en-tete `X-Institution` inconnu : refuse avant l'authentification.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RefusClasseEleves'
        '401':
          description: |
            Jeton porteur absent ou invalide (sans `reason`). Dans une ecole creee
            depuis KLASSCI : compte sans jeton KLASSCI (`reason:
            klassci_token_missing`), ou session refusee par KLASSCI (`reason:
            klassci_session_expired`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RefusKlassci'
        '403':
          description: |
            Sans `reason` : etablissement desactive, ou refus de KLASSCI relaye.
            `no_institution` : compte sans etablissement, ou gestionnaire de la
            plateforme (`supradmin`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RefusClasseEleves'
        '404':
          description: |
            « Classe non trouvee » : KLASSCI repond 2xx sans fiche, ou, dans une
            ecole creee depuis le LMS, une classe que l'appelant n'atteint pas.
            Ou refus 404 de KLASSCI, relaye. Sans motif.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RefusClasseEleves'
        '409':
          description: |
            Conflit signale par KLASSCI, relaye. Ou, dans une ecole creee depuis le
            LMS : eleve de cette classe, inscription non active (D57, #1095), motif
            `enrolment_not_active`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RefusClasseEleves'
        '422':
          description: "Donnees refusees par KLASSCI, relaye. Sans detail par champ."
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RefusClasseEleves'
        '429':
          description: "KLASSCI limite les requetes, relaye, SANS son en-tete `Retry-After`. Aussi : limite de débit des lectures, par famille et par compte (#947)."
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RefusClasseEleves'
        '4XX':
          description: |
            Tout autre refus de KLASSCI de 400 a 499 est relaye avec son statut et
            le message par defaut du catalogue.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RefusClasseEleves'
        '500':
          description: |
            Erreur interne, toujours rapportee une fois au journal. Panne de base
            ou autre erreur d'execution : « Une erreur est survenue. », sans
            `error`. Toute autre erreur, rattrapee par le controleur : avec
            `error`. Gestionnaire global (par exemple un `classeId` non
            numerique) : sans `error`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VisioErreurInterne'
        '503':
          description: |
            Ecole creee depuis KLASSCI : KLASSCI indisponible (panne, circuit
            ouvert), ou reponse illisible.
          headers:
            Retry-After:
              schema:
                type: integer
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KlassciIndisponible'

  /lms/seances:
    post:
      tags:
        - Visio
      summary: "Creer une seance locale"
      description: |
        Cree une seance LOCALE dans une ecole AUTONOME : aucun identifiant KLASSCI
        n'est pose, tous les `klassci_*` valent nul, et `institution_id` est celui
        de l'auteur.

        **Ecole creee depuis KLASSCI (#1182)** : la seance se cree dans KLASSCI, le
        LMS la recupere. La creation locale est refusee, 403
        `seance_managed_by_klassci` (le motif de la modification), rien n'est ecrit.

        `classe_id` est FACULTATIF : une seance peut se creer avant que la
        classe soit arretee. S'il est fourni, la classe doit etre de
        l'etablissement de l'auteur. Sinon 404, le meme refus pour une classe
        inexistante et pour celle d'une autre ecole : la reponse ne dit pas
        quels identifiants existent ailleurs.

        Reserve au personnel de l'etablissement : `enseignant` (alias `teacher`),
        `coordinateur` (alias `coordinator`), `admin` et `superAdmin` (D502 : l'admin
        d'ecole a les droits du coordinateur). Le role est garde une seule fois, par
        la garde `personnel` de la route (`User::isStaff()`), en correspondance
        EXACTE : une variante de casse (`Enseignant`) est refusee. Le 403 a
        plusieurs sources, et le client ne doit pas lire le message :
        - la garde de la route, qui refuse tout autre role, l'eleve compris
          (« Accès refusé - Permissions insuffisantes ») ;
        - un etablissement desactive ou introuvable (« Établissement désactivé.
          Accès suspendu, contactez votre administration. ») ;
        - un compte sans etablissement, refuse par la porte des comptes sans
          etablissement, avec le motif `no_institution`.
      security:
        - sanctum: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SeanceLocaleInput'
      responses:
        '201':
          description: "Seance creee."
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SeanceLocaleCreated'
        '400':
          $ref: '#/components/responses/EtablissementInconnu'
        '401':
          description: "Non authentifie"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SeanceLocaleRefus'
        '403':
          description: "Ecole creee depuis KLASSCI (`seance_managed_by_klassci`, #1182), role non admis a creer une seance, compte sans etablissement, ou enseignant qui force un conflit d'horaire (`conflict_override_forbidden`, #1668). Aussi, sans `reason` : etablissement desactive ou supprime (ResolveInstitution, #961)."
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SeanceLocaleInterdite'
        '404':
          description: "Classe ou matiere introuvable dans l'etablissement de l'auteur (inexistante, ou d'une autre ecole) : le meme refus, son motif dit laquelle."
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SeanceLocaleHorsEtablissement'
        '409':
          description: "Le creneau chevauche une seance du meme enseignant ou de la meme classe (`seance_schedule_conflict`, #1668) ; `conflicts` les nomme."
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConflitDHoraireRefus'
        '422':
          description: "Charge invalide (`errors`), ou matiere hors du programme de la classe (`reason` `subject_not_in_class_program`)."
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/SeanceLocaleInvalide'
                  - $ref: '#/components/schemas/SeanceLocaleHorsProgramme'

  /lms/seances/{seanceId}/appel:
    get:
      tags:
        - Visio
      operationId: lireLAppel
      parameters:
        - name: seanceId
          in: path
          required: true
          description: "Identifiant LOCAL de la seance."
          schema:
            type: integer
            minimum: 1
      summary: "L'appel d'une seance : la classe et ses marques"
      description: |
        #1649. Les eleves ACTIFS de la classe de la seance, tries par nom, chacun
        avec sa marque (`null` sans marque). Ecole creee depuis le LMS ; une
        ecole KLASSCI saisit l'appel dans KLASSCI (409).
      security:
        - sanctum: []
      responses:
        '200':
          description: "L'appel"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AppelDeLaSeance'
        '400':
          $ref: '#/components/responses/EtablissementInconnu'
        '401':
          description: "Non authentifie"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: "Ni l'auteur de la seance ni la gestion, role hors du personnel ; aussi, sans `reason` : etablissement desactive ou supprime (ResolveInstitution, #961)."
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: "Seance introuvable dans l'etablissement."
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: "Ecole KLASSCI : l'appel se saisit dans KLASSCI (`attendance_managed_by_klassci`)."
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RefusMotive'
        '429':
          $ref: '#/components/responses/TooManyRequests'
    put:
      tags:
        - Visio
      operationId: saisirLAppel
      parameters:
        - name: seanceId
          in: path
          required: true
          description: "Identifiant LOCAL de la seance."
          schema:
            type: integer
            minimum: 1
      summary: "Saisir ou corriger l'appel d'une seance"
      description: |
        #1649. L'auteur de la seance ou la gestion marque present, absent, en
        retard ou excuse, pour les seuls eleves ACTIFS de la classe, des le DEBUT
        de la seance. La marque porte son origine (`delegated`), qui l'a posee et
        quand ; une transaction pour le lot. L'historique reste corrigeable, et
        chaque correction est auditee (avant, apres). La marque l'emporte sur le
        statut visio dans tout comptage de presence. Rend l'appel relu.
      security:
        - sanctum: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [marques]
              properties:
                marques:
                  type: array
                  minItems: 1
                  maxItems: 500
                  items:
                    type: object
                    additionalProperties: false
                    required: [user_id, mark]
                    properties:
                      user_id:
                        type: integer
                        minimum: 1
                      mark:
                        type: string
                        enum: [present, absent, late, excused]
      responses:
        '200':
          description: "L'appel relu"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AppelDeLaSeance'
        '400':
          $ref: '#/components/responses/EtablissementInconnu'
        '401':
          description: "Non authentifie"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: "Ni l'auteur de la seance ni la gestion, role hors du personnel ; aussi, sans `reason` : etablissement desactive ou supprime (ResolveInstitution, #961)."
          content:
            application/json:
