name: Security Audit

# Step 1 of the CI security pipeline (issue #65).
# Subsequent PRs will add : PHPStan + Larastan, Semgrep SAST, OWASP ZAP DAST.
#
# Defense-in-depth on dependencies :
#   - composer-audit job        → reactive : blocks merge if a known CVE
#                                  is in composer.lock at PR time
#   - dependency-review job     → reactive : blocks merge if the PR
#                                  ADDS a vulnerable dependency
#   - .github/dependabot.yml    → proactive : opens fix PRs daily
#                                  when an advisory is published

on:
  pull_request:
    branches:
      - lms
  push:
    branches:
      - lms

permissions:
  contents: read
  pull-requests: read  # required by dependency-review-action

jobs:
  composer-audit:
    name: Composer Audit (CVE scan)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP 8.3
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          coverage: none
          tools: composer:v2

      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: vendor
          key: composer-${{ hashFiles('composer.lock') }}
          restore-keys: composer-

      # Production install: only `require` (not `require-dev`).
      # Reflects exactly what ships to prod — auditing dev deps would
      # produce noise (Tinker, Faker, etc. are never in prod).
      - name: Install production dependencies
        run: composer install --no-interaction --no-progress --prefer-dist --no-dev --no-scripts

      # `composer audit` checks `composer.lock` against the public
      # Packagist advisory database (https://packagist.org/security-advisories).
      # --abandoned=ignore : do NOT fail on abandoned packages
      #   (that's a maintenance signal, not a CVE — handle separately).
      # --no-dev was already set at install time.
      - name: Run composer audit (fail on HIGH/CRITICAL CVE)
        run: composer audit --abandoned=ignore --no-interaction

      # Visibility-only: list outdated packages without failing the build.
      # Helps maintenance planning ; never blocks merges.
      - name: List outdated production packages (informational only)
        if: always()
        continue-on-error: true
        run: composer outdated --direct --no-interaction

  dependency-review:
    # GitHub's native Dependency Review action analyses ONLY what the PR
    # adds/removes vs. the base branch. Catches a vulnerable dependency
    # introduced by the PR itself, even if it's not yet known to Packagist
    # (e.g. malicious package via typosquatting).
    #
    # Only runs on pull_request — push events have no diff to review.
    name: Dependency Review (PR-level diff)
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Dependency Review
        uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high
          comment-summary-in-pr: on-failure
