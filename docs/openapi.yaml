openapi: 3.0.0
info:
  title: "LMS Backend API"
  description: |
    API complète pour la plateforme LMS - Learning Management System avec intégration KLASSCI.

    ## Rate limiting (#214)

    Les routes proxy KLASSCI sont limitées par utilisateur authentifié :
      - `GET /proxy/*` (lecture) : **100 requêtes / minute / utilisateur**.
      - écritures `/proxy/evaluations/{id}/notes`, `/proxy/cours/{id}/presences`,
        `/proxy/cours/{id}/statut` : **30 requêtes / minute / utilisateur**.

    Le rôle `supradmin` (gestionnaire plateforme) est exempté.

    Chaque réponse expose les en-têtes `X-RateLimit-Limit` et
    `X-RateLimit-Remaining`. Au dépassement, l'API répond `429 Too Many
    Requests` avec `Retry-After` (secondes) et `X-RateLimit-Reset`.
  version: "1.0.0"
  contact:
    name: "LMS Team"
    email: "support@lms.local"
  license:
    name: "MIT"

servers:
  - url: "http://localhost:8000/api"
    description: "Development Server"
  - url: "https://api.lms.local/api"
    description: "Production Server"

# Security Schemes
components:
  securitySchemes:
    sanctum:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: "Sanctum token authentication"

  responses:
    # Réponse standard de dépassement du rate limit (#214/#219).
    TooManyRequests:
      description: "Rate limit dépassé (voir en-têtes X-RateLimit-* et Retry-After)."
      headers:
        Retry-After:
          schema:
            type: integer
          description: "Secondes à attendre avant de réessayer."
        X-RateLimit-Limit:
          schema:
            type: integer
          description: "Quota maximum par minute."
        X-RateLimit-Remaining:
          schema:
            type: integer
          description: "Requêtes restantes dans la fenêtre courante."
      content:
        application/json:
          schema:
            type: object
            properties:
              success:
                type: boolean
                example: false
              message:
                type: string
                example: "Trop de requêtes. Veuillez réessayer plus tard."

  schemas:
    ProgramInput:
      type: object
      required:
        - titre
      properties:
        titre:
          type: string
          maxLength: 191
        description:
          type: string
          maxLength: 5000
          nullable: true

    ProgramCreated:
      type: object
      properties:
        success:
          type: boolean
        message:
          type: string
        data:
          type: object
          properties:
            id:
              type: integer
            titre:
              type: string
            version:
              type: integer

    MatiereInput:
      type: object
      required:
        - libelle
      properties:
        libelle:
          type: string
          maxLength: 191
        code:
          type: string
          maxLength: 50
          nullable: true
          description: |
            FACULTATIF, et volontairement SANS contrainte d unicite : mesure
            faite sur app/, aucun acces ne retrouve une matiere par son code.
            En poser une garderait un chemin qui n existe pas.
        description:
          type: string
          maxLength: 2000
          nullable: true
        coefficient:
          type: integer
          minimum: 1
          maximum: 20
          default: 1
        credit:
          type: integer
          minimum: 1
          maximum: 60
          default: 1

    MatiereCreated:
      type: object
      properties:
        success:
          type: boolean
        message:
          type: string
        data:
          type: object
          properties:
            id:
              type: integer
            libelle:
              type: string
            code:
              type: string
              nullable: true
            coefficient:
              type: integer
            credit:
              type: integer

    ClasseMatiereInput:
      type: object
      required:
        - matiere_id
      properties:
        matiere_id:
          type: integer
          minimum: 1
        enseignant_id:
          type: integer
          minimum: 1
          nullable: true
          description: |
            FACULTATIF : on compose souvent un programme avant de savoir qui
            l assurera. S il est nomme, il doit appartenir a l etablissement ET
            avoir le role enseignant.

    ClasseMatiereLinked:
      type: object
      properties:
        success:
          type: boolean
        message:
          type: string
        data:
          type: object
          properties:
            classe_id:
              type: integer
            matiere_id:
              type: integer
            enseignant_id:
              type: integer
              nullable: true

    ClasseInput:
      type: object
      required:
        - libelle
      properties:
        libelle:
          type: string
          maxLength: 191
        code:
          type: string
          maxLength: 50
          nullable: true
          description: |
            Code de la classe, FACULTATIF. Unique par etablissement parmi les
            classes qui en portent un : une chaine vide est normalisee en nul,
            sans quoi la deuxieme classe sans code entrerait en collision.
        description:
          type: string
          maxLength: 2000
          nullable: true
        effectif:
          type: integer
          minimum: 0
          maximum: 10000
          default: 0

    ClasseCreated:
      type: object
      properties:
        success:
          type: boolean
        message:
          type: string
        data:
          type: object
          properties:
            id:
              type: integer
            libelle:
              type: string
            code:
              type: string
              nullable: true
            effectif:
              type: integer

    TrainingSessionInput:
      type: object
      required:
        - program_id
        - libelle
      properties:
        program_id:
          type: integer
          description: "Doit appartenir a l etablissement de l appelant."
        libelle:
          type: string
          maxLength: 191
        enrollment_opens_at:
          type: string
          format: date
          nullable: true
        enrollment_closes_at:
          type: string
          format: date
          nullable: true
        starts_on:
          type: string
          format: date
          nullable: true
        ends_on:
          type: string
          format: date
          nullable: true
        certificate_available_at:
          type: string
          format: date
          nullable: true
        min_enrollments:
          type: integer
          minimum: 1
          nullable: true
          description: "Alerte de sous-inscription, pas un verrou."
        tarif:
          type: integer
          minimum: 0
          nullable: true
          description: "Plus petite unite monetaire. Jamais un flottant."
        devise:
          type: string
          minLength: 3
          maxLength: 3
          nullable: true
        heures_stagiaires:
          type: integer
          minimum: 0
          nullable: true

    TrainingSessionView:
      type: object
      properties:
        id:
          type: integer
        libelle:
          type: string
        status:
          type: string
          enum: [brouillon, publiee, annulee, cloturee, archivee, purgee]
          description: "Decision humaine, STOCKEE."
        phase:
          type: string
          enum: [a_venir, inscriptions_ouvertes, en_cours, terminee]
          description: |
            DERIVEE des dates, jamais stockee. Aucune colonne ne la porte : une
            colonne exigerait un job nocturne qui finirait par diverger.
        program_id:
          type: integer
        enrollment_opens_at:
          type: string
          format: date
          nullable: true
        enrollment_closes_at:
          type: string
          format: date
          nullable: true
        starts_on:
          type: string
          format: date
          nullable: true
        ends_on:
          type: string
          format: date
          nullable: true
        certificate_available_at:
          type: string
          format: date
          nullable: true
        min_enrollments:
          type: integer
          nullable: true
        tarif:
          type: integer
          nullable: true
        devise:
          type: string
          nullable: true

    TrainingSessionCreated:
      type: object
      properties:
        success:
          type: boolean
        message:
          type: string
        data:
          $ref: '#/components/schemas/TrainingSessionView'

    TrainingSessionPage:
      type: object
      properties:
        success:
          type: boolean
        data:
          type: array
          items:
            $ref: '#/components/schemas/TrainingSessionView'
        meta:
          type: object
          properties:
            current_page:
              type: integer
            last_page:
              type: integer
            per_page:
              type: integer
            total:
              type: integer

    MessageOnly:
      type: object
      properties:
        success:
          type: boolean
          example: true
        message:
          type: string

    ActivationInput:
      type: object
      required:
        - token
        - password
        - password_confirmation
      properties:
        token:
          type: string
          maxLength: 128
          description: "Le jeton extrait du lien d'activation."
        password:
          type: string
          minLength: 8
          description: "Le secret que le titulaire choisit ; personne d'autre ne l'a connu."
        password_confirmation:
          type: string
          description: "Sur un ecran sans renvoi possible du lien, une faute de frappe enfermerait le titulaire dehors."

    SchoolRequestQueue:
      type: object
      properties:
        success:
          type: boolean
        data:
          type: array
          items:
            type: object
            properties:
              id:
                type: integer
              nom_demandeur:
                type: string
              email_demandeur:
                type: string
              telephone_demandeur:
                type: string
                nullable: true
              nom_ecole:
                type: string
              slug_souhaite:
                type: string
                nullable: true
              usage_prevu:
                type: string
              created_at:
                type: string
                format: date-time
        meta:
          type: object
          properties:
            current_page:
              type: integer
            last_page:
              type: integer
            per_page:
              type: integer
            total:
              type: integer

    SchoolRequestValidated:
      type: object
      properties:
        success:
          type: boolean
        message:
          type: string
        data:
          type: object
          properties:
            institution:
              type: object
              properties:
                id:
                  type: integer
                slug:
                  type: string
                name:
                  type: string
            activation_url:
              type: string
              format: uri
              description: |
                Lien vers l'application WEB, jamais vers l'API. Affiche UNE
                SEULE FOIS : le jeton n'est stocke qu'en empreinte SHA-256.

    VisioConsentInput:
      type: object
      required:
        - captation
        - diffusion
        - reutilisation
      properties:
        captation:
          type: boolean
          description: "Etre filme pendant la seance."
        diffusion:
          type: boolean
          description: "Rediffusion de l'enregistrement au groupe de la seance."
        reutilisation:
          type: boolean
          description: "Reutilisation sur une autre session que celle d'origine."

    VisioConsentState:
      type: object
      properties:
        success:
          type: boolean
          example: true
        data:
          type: object
          properties:
            captation:
              type: boolean
            diffusion:
              type: boolean
            reutilisation:
              type: boolean

    SchoolRegistrationRequestInput:
      type: object
      required:
        - nom_demandeur
        - email_demandeur
        - nom_ecole
        - usage_prevu
      properties:
        nom_demandeur:
          type: string
          maxLength: 191
          description: "Futur superAdmin de l'etablissement, si la demande est validee."
          example: "Awa Kouassi"
        email_demandeur:
          type: string
          format: email
          maxLength: 191
          example: "awa.kouassi@cabinet-kf.ci"
        telephone_demandeur:
          type: string
          maxLength: 40
          nullable: true
          example: "+225 07 00 00 00 00"
        nom_ecole:
          type: string
          maxLength: 191
          example: "Cabinet Kouassi Formation"
        slug_souhaite:
          type: string
          maxLength: 50
          nullable: true
          pattern: '^[a-z0-9\-]+$'
          description: |
            Souhait, JAMAIS une reservation. Le supradmin l'arbitre a la
            validation, collision avec un etablissement existant comprise.
          example: "cabinet-kouassi"
        usage_prevu:
          type: string
          minLength: 10
          maxLength: 2000
          description: "Texte libre. Obligatoire : il augmente le cout d'un depot automatise."
          example: "Formations comptabilite OHADA, promotions de 25 stagiaires."

    # Rejoindre une classe avec un code, deja connecte (#885). Meme forme en
    # 201 et en 200 : l apprenant lit la classe qu il a rejointe dans les deux cas.
    ClasseRejointeResponse:
      type: object
      properties:
        success:
          type: boolean
        message:
          type: string
        data:
          type: object
          properties:
            classe:
              type: object
              properties:
                id:
                  type: integer
                libelle:
                  type: string

    # Error Response
    # --- Cycle evaluation (#892) -------------------------------------------
    # Formes MESUREES par appel reel des routes, pas deduites des noms.

    Decimal2:
      type: string
      pattern: '^-?\d+\.\d{2}$'
      example: "16.00"
      description: |
        Nombre decimal SERIALISE EN CHAINE : le cast Eloquent `decimal:2`
        (`EvaluationSubmission`, `Evaluation`, `EvaluationQuestion`) rend
        `"16.00"`, jamais `16`. Un client type doit le convertir.

    EvaluationWindow:
      type: object
      nullable: true
      description: |
        Fenetre de passage relayee depuis KLASSCI (`programmation.window`).
        `null` quand l evaluation n en a pas, ou quand KLASSCI n a pas pu etre
        joint. Le LMS ne lit que les cles ci-dessous ; les autres passent telles
        quelles.
      additionalProperties: true
      properties:
        is_open:
          type: boolean
        has_started:
          type: boolean
        has_ended:
          type: boolean
        start_at:
          type: string
          format: date-time
        end_at:
          type: string
          format: date-time

    EvaluationSubmissionRecord:
      type: object
      description: |
        Une copie (`evaluation_submissions`), serialisee telle quelle.

        Une copie TOUT JUSTE CREEE n expose que les colonnes ecrites a sa
        creation (`id`, `evaluation_id`, `student_id`, `klassci_etudiant_id`,
        `attempt`, `status`, `started_at`, `institution_id`, `feedback`,
        `created_at`, `updated_at`) ; une copie relue les expose toutes.
      properties:
        id:
          type: integer
        evaluation_id:
          type: integer
        student_id:
          type: integer
          nullable: true
        klassci_etudiant_id:
          type: integer
        attempt:
          type: integer
        status:
          type: string
          enum: [en_cours, soumis, corrige]
        started_at:
          type: string
          format: date-time
          nullable: true
        submitted_at:
          type: string
          format: date-time
          nullable: true
        answers:
          type: object
          nullable: true
          description: "MAP `{ \"<question_id>\": reponse }` (chaine, ou tableau de chaines pour `qcm_multiple`)."
          additionalProperties: true
        manual_points:
          type: object
          nullable: true
          description: "Points attribues a la main, par question (dissertations)."
          additionalProperties:
            type: number
        score:
          type: string
          pattern: '^-?\d+\.\d{2}$'
          nullable: true
          description: "Decimal en chaine (voir `Decimal2`)."
        note_sur_20:
          type: string
          pattern: '^-?\d+\.\d{2}$'
          nullable: true
          description: "Decimal en chaine (voir `Decimal2`)."
        feedback:
          type: string
          nullable: true
          description: "Commence par `[PRACTICE]` pour une tentative d entrainement (note non officielle)."
        graded_by:
          type: integer
          nullable: true
        graded_at:
          type: string
          format: date-time
          nullable: true
        synced_to_klassci:
          type: boolean
        synced_at:
          type: string
          format: date-time
          nullable: true
        institution_id:
          type: integer
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    EvaluationRecord:
      type: object
      description: "Une evaluation (`evaluations`), serialisee telle quelle (seul `klassci_link_guard` est masque)."
      additionalProperties: true
      properties:
        id:
          type: integer
        institution_id:
          type: integer
        klassci_evaluation_id:
          type: integer
          nullable: true
        klassci_matiere_id:
          type: integer
          nullable: true
        klassci_classe_id:
          type: integer
          nullable: true
        klassci_enseignant_id:
          type: integer
          nullable: true
        titre:
          type: string
        description:
          type: string
          nullable: true
        type:
          type: string
        status:
          type: string
          description: "Statut STOCKE (`brouillon`, `planifiee`, `en_cours`, `terminee`…)."
        date_evaluation:
          type: string
          format: date-time
          nullable: true
        deadline_at:
          type: string
          format: date-time
          nullable: true
        duree_minutes:
          type: integer
          nullable: true
        coefficient:
          $ref: '#/components/schemas/Decimal2'
        bareme:
          $ref: '#/components/schemas/Decimal2'
        is_online:
          type: boolean
        allow_retake:
          type: boolean
        max_attempts:
          type: integer
          nullable: true
        shuffle_questions:
          type: boolean
        show_results:
          type: boolean
        is_published:
          type: boolean
        notes_published:
          type: boolean
        is_locked:
          type: boolean
        locked_at:
          type: string
          format: date-time
          nullable: true
        matiere_nom:
          type: string
          nullable: true
        classe_nom:
          type: string
          nullable: true
        enseignant_nom:
          type: string
          nullable: true
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        deleted_at:
          type: string
          format: date-time
          nullable: true

    EvaluationQuestionPublic:
      type: object
      description: "Une question SANS son corrige (`correct_answers` et `explanation` sont masques sur le modele)."
      properties:
        id:
          type: integer
        evaluation_id:
          type: integer
        question:
          type: string
        type:
          type: string
          enum: [qcm, qcm_multiple, vrai_faux, reponse_courte, dissertation]
        ordre:
          type: integer
        points:
          $ref: '#/components/schemas/Decimal2'
        options:
          nullable: true
          description: "Choix proposes (qcm) ; `null` pour les autres types."
        is_required:
          type: boolean
        institution_id:
          type: integer
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    ValidationFailed:
      type: object
      properties:
        success:
          type: boolean
          example: false
        message:
          type: string
          example: "Validation failed"
        errors:
          type: object
          description: "Messages par champ."
          additionalProperties:
            type: array
            items:
              type: string

    ErrorWithDetail:
      type: object
      description: |
        Forme de 500 portee par quelques routes anciennes : une cle `error`
        AU SINGULIER, hors de l enveloppe canonique. Conservee telle quelle
        pour ne pas casser le client.
      properties:
        success:
          type: boolean
          example: false
        message:
          type: string
        error:
          type: string
          example: "Une erreur est survenue."

    ErrorResponse:
      type: object
      properties:
        success:
          type: boolean
          example: false
        error_code:
          type: string
          example: "UNAUTHENTICATED"
        message:
          type: string
          example: "Unauthenticated."
      required:
        - success
        - error_code
        - message

    # Auth Schemas
    LoginRequest:
      type: object
      properties:
        email:
          type: string
          format: email
          example: "user@example.com"
        password:
          type: string
          format: password
          example: "password123"
      required:
        - email
        - password

    AuthResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        data:
          type: object
          properties:
            token:
              type: string
              example: "token_string_here"
            user:
              type: object

    User:
      type: object
      properties:
        id:
          type: integer
          example: 1
        email:
          type: string
          example: "user@example.com"
        name:
          type: string
          example: "John Doe"
        role:
          type: string
          enum: [etudiant, enseignant, coordinateur, admin, superAdmin]

# Paths
paths:
  # ============ AUTHENTICATION ============
  /school-requests:
    post:
      tags:
        - School registration
      summary: "Deposer une demande d'ouverture d'ecole"
      description: |
        Porte d'entree du monde autonome (ADR-803-01). SEULE ecriture non
        authentifiee du systeme.

        N'ecrit qu'une ligne inerte, hors perimetre multi-tenant : ni compte,
        ni etablissement, ni reservation du `slug_souhaite`. La demande ne
        devient rien tant qu'un supradmin plateforme n'a pas tranche.

        Ne requiert PAS l'en-tete `X-Institution` : il n'y a pas encore
        d'etablissement a resoudre.

        Une seule demande en attente par adresse : un second depot met a jour
        la premiere au lieu d'en creer une seconde.

        Debit limite a 5 requetes par minute et par IP.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SchoolRegistrationRequestInput'
      responses:
        '201':
          description: |
            Demande enregistree. La reponse ne rend NI l'identifiant NI le
            statut : l'endpoint est anonyme, et les exposer offrirait de quoi
            enumerer les dossiers ou confirmer qu'une adresse a deja depose.

            Elle ne promet aucun courriel : le produit n'a aucun canal d'envoi.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: "Votre demande est enregistree. Elle sera examinee par notre equipe."
        '422':
          description: "Validation error"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          description: "Trop de demandes depuis cette adresse IP"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /lms/classes/local/{classeId}:
    get:
      tags:
        - Classes
      summary: "Details d'une classe designee par son identifiant LOCAL"
      description: |
        Porte jumelle de `/lms/classes/{classeId}`, qui parle l'espace KLASSCI.

        Le LMS connait deux numerotations independantes pour la meme classe :
        la cle primaire locale, et l'identifiant KLASSCI. Rien n'interdit que
        l'une egale l'autre sur des lignes differentes — mesure du 19/09/2026 en
        production : sept classes sur vingt-et-une sont dans ce cas.

        Un appelant qui detient un identifiant LOCAL — par exemple celui rendu
        par `classes_concernees` — doit donc utiliser CETTE porte. L'envoyer a
        la porte KLASSCI rend la fiche d'une autre classe, en 200, sans erreur.

        La traduction est faite au seuil ; le reste du traitement est partage
        avec la porte historique.
      security:
        - sanctum: []
      parameters:
        - name: classeId
          in: path
          required: true
          description: "Cle primaire LOCALE de la classe (table `classes`)."
          schema:
            type: integer
            minimum: 1
      responses:
        '200':
          description: "Details de la classe, identiques a ceux de la porte KLASSCI."
          content:
            application/json:
              schema:
                type: object
        '401':
          description: "Non authentifie, ou compte sans jeton KLASSCI."
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: |
            Aucune classe ne porte cet identifiant local dans l'etablissement de
            l'appelant. Un compte sans etablissement ne resout rien.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: |
            La classe existe mais a ete creee localement : elle n'a aucune fiche
            KLASSCI a afficher. Un 404 mentirait, la classe est bien la.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /lms/visio/consent:
    post:
      tags:
        - Visio
      summary: "Deposer son consentement de captation visio"
      description: |
        Les trois finalites sont obligatoires et independantes : accepter
        d'etre filme pour le groupe n'est pas accepter la rediffusion, ni la
        reutilisation sur une autre session.

        Le sujet est TOUJOURS le porteur du jeton : aucun `user_id` n'est
        accepte dans la charge utile.

        La table de consentements est append-only — chaque depot y ajoute trois
        lignes et n'en retire aucune. D'ou la limite de 10 requetes par minute.
      security:
        - sanctum: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VisioConsentInput'
      responses:
        '200':
          description: "Consentement enregistre ; l'etat courant des trois finalites est renvoye."
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VisioConsentState'
        '401':
          description: "Non authentifie"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: |
            Charge invalide, ou compte sans etablissement — un consentement se
            rattache a un etablissement.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          description: "Trop de depots successifs"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    get:
      tags:
        - Visio
      summary: "Lire son consentement de captation visio"
      security:
        - sanctum: []
      responses:
        '200':
          description: "Etat courant des trois finalites pour le porteur du jeton."
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VisioConsentState'
        '401':
          description: "Non authentifie"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /activation:
    post:
      tags:
        - School registration
      summary: "Poser son mot de passe depuis un lien d'activation"
      description: |
        Route ANONYME par nature : celui qui active n'a pas encore de quoi
        s'authentifier. Le jeton EST l'autorisation.

        Le produit n'ayant aucun canal de courriel, le lien circule hors bande
        (WhatsApp, SMS, de vive voix). Il est a usage unique et expirant.

        Debit limite a 5 requetes par minute et par IP.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ActivationInput'
      responses:
        '200':
          description: "Mot de passe enregistre ; le titulaire peut se connecter."
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageOnly'
        '410':
          description: |
            Jeton inconnu, deja consomme, ou perime. Les trois cas rendent le
            MEME code : les distinguer dirait a un inconnu qu'un lien a existe
            pour cette valeur, donc qu'un compte l'attend.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: "Mot de passe absent, trop court, ou confirmation differente"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          description: "Trop de tentatives"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /admin/school-requests:
    get:
      tags:
        - School registration
      summary: "La file des demandes d'ouverture en attente"
      description: |
        Reserve au supradmin PLATEFORME (`role:supradmin` + `platform.supradmin`).

        Seules les demandes en attente sont listees : une demande tranchee
        n'appelle plus de decision. Paginee — cette file est alimentee par un
        endpoint anonyme, et un throttle borne le debit d'entree, pas le volume
        accumule.
      security:
        - sanctum: []
      parameters:
        - name: per_page
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 25
      responses:
        '200':
          description: "Page de demandes en attente"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SchoolRequestQueue'
        '401':
          description: "Non authentifie"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: "Reserve au supradmin plateforme"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /admin/school-requests/{schoolRequest}/validate:
    post:
      tags:
        - School registration
      summary: "Valider une demande : ouvrir l'ecole et son premier compte"
      description: |
        UNE transaction : l'institution (autonome, `klassci_api_url` a null), son
        premier compte en `superAdmin`, et le passage de la demande en validee.
        Si l'une echoue, aucune n'est ecrite.

        Aucun mot de passe n'est choisi ni transmis. La reponse contient un LIEN
        D'ACTIVATION a usage unique, affiche UNE SEULE FOIS : il n'est stocke
        nulle part en clair et ne sera pas reaffiche.

        Le `slug` du corps est facultatif : le demandeur n'a exprime qu'un
        souhait, jamais une reservation, et c'est ici que le supradmin arbitre
        une collision avec un etablissement existant.
      security:
        - sanctum: []
      parameters:
        - name: schoolRequest
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                slug:
                  type: string
                  maxLength: 50
                  pattern: '^[a-z0-9\-]+$'
                  nullable: true
      responses:
        '200':
          description: "Ecole ouverte ; le lien d'activation est renvoye une seule fois."
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SchoolRequestValidated'
        '401':
          description: "Non authentifie"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: "Reserve au supradmin plateforme"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: "Demande deja tranchee"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          description: |
            `ACTIVATION_URL_FRONT` n'est pas configuree : le lien serait mort
            chez son destinataire. Refus fail-closed, rien n'est ecrit.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /admin/school-requests/{schoolRequest}/refuse:
    post:
      tags:
        - School registration
      summary: "Refuser une demande d'ouverture"
      description: |
        Le motif est OBLIGATOIRE : le demandeur peut redeposer un dossier —
        l'unicite partielle ne borne que les demandes en attente — et
        l'exploitant doit pouvoir savoir pourquoi il avait tranche.

        Ne cree ni institution ni compte.
      security:
        - sanctum: []
      parameters:
        - name: schoolRequest
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - motif_refus
              properties:
                motif_refus:
                  type: string
                  minLength: 10
                  maxLength: 2000
      responses:
        '200':
          description: "Demande refusee"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageOnly'
        '401':
          description: "Non authentifie"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: "Reserve au supradmin plateforme"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: "Demande deja tranchee"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: "Motif absent ou trop court"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /admin/institutions/{id}/mode:
    patch:
      tags:
        - Institutions
      summary: "Basculer le mode d'un etablissement"
      description: |
        Declare si l'etablissement tient sa propre liste d'inscrits
        (`standalone`) ou la recoit de KLASSCI (`klassci`).

        Le mode voulu est EXIGE dans le corps, il n'est pas inverse : avec deux
        valeurs aujourd'hui et une troisieme possible demain, une inversion
        implicite deviendrait un piege.

        Cette bascule a sa propre route pour ne jamais etre l'effet de bord d'un
        `PUT` de branding. Elle est tracee dans `audit_logs`
        (`institution.mode_changed`).

        Ce qu'elle change : l'inscription locale devient permise ou interdite —
        l'assistant d'import et la capacite publiee a la connexion. Ce qu'elle ne
        change PAS : les inscriptions deja ecrites et l'acces des eleves a leurs
        cours, la source d'inscription ne consultant jamais le mode. La bascule
        est donc reversible.
      security:
        - sanctum: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - mode
              properties:
                mode:
                  type: string
                  enum: [klassci, standalone]
      responses:
        '200':
          description: "Mode mis a jour ; l'institution est renvoyee a jour."
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  message:
                    type: string
                  data:
                    type: object
        '401':
          description: "Non authentifie"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: "Reserve au supradmin plateforme"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: "Institution introuvable"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: "Mode absent ou hors de la liste fermee"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /programs:
    post:
      tags:
        - Session de formation
      summary: "Creer un Programme"
      description: |
        Le Programme est le contenu pedagogique VERSIONNABLE : il ne porte ni
        dates ni tarif. Ceux-la vivent sur la Periode — poser le tarif ici
        obligerait a dupliquer le contenu pour chaque variante tarifaire.

        `institution_id` n est jamais accepte : il vient du tenant resolu.
        `version` non plus — un Programme nait en version 1.

        Reserve aux roles coordinateur, admin et superAdmin : organiser une
        formation est un acte de gestion.
      security:
        - sanctum: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProgramInput'
      responses:
        '201':
          description: "Programme cree"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProgramCreated'
        '401':
          description: "Non authentifie"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: "Role insuffisant"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: "Charge invalide"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /classes:
    post:
      tags:
        - Session de formation
      summary: "Creer une Classe sans KLASSCI"
      description: |
        Avant cette route, le SEUL createur d une Classe du depot etait la
        synchronisation KLASSCI : une ecole autonome n en avait aucune, jamais,
        et l import CSV produisait des apprenants qui n appartenaient a rien.

        Reservee aux etablissements qui tiennent leur propre catalogue. Le droit
        est une CAPACITE verifiee au point d ecriture, jamais une comparaison de
        mode : un etablissement branche a KLASSCI recoit 403, parce que deux
        sources ecrivant la meme realite est la cause racine de #673.

        `institution_id` et `klassci_id` ne sont JAMAIS acceptes : le premier
        vient du tenant resolu, et une classe locale n a pas d identifiant
        KLASSCI — lui en inventer un la rendrait indiscernable d une classe
        miroitee.

        L unicite du `code` est portee par la BASE et non par une validation
        prealable, qui ouvrirait une fenetre que deux requetes concurrentes
        franchiraient toutes les deux.
      security:
        - sanctum: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ClasseInput'
      responses:
        '201':
          description: "Classe creee"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClasseCreated'
        '401':
          description: "Non authentifie"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: |
            Role insuffisant, ou etablissement dont le catalogue vient de
            KLASSCI.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: "Aucun etablissement resolu"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: "Libelle manquant, ou code deja employe dans cet etablissement"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /inscriptions:
    post:
      tags:
        - Session de formation
      summary: "S inscrire dans une classe avec un code"
      description: |
        La troisieme porte d ADR-803-03 : l apprenant s inscrit LUI-MEME.
        L import suppose que l ecole detienne deja la liste ; c est faux d un
        formateur qui diffuse son code par WhatsApp.

        Route ANONYME — celui qui s inscrit n a pas encore de compte. Le code
        EST son autorisation, et il choisit son mot de passe : contrairement a
        l import, il est present et n a besoin d aucun lien d activation.

        En-tete `X-Institution` OBLIGATOIRE : le code n est unique que par
        etablissement, donc une requete qui ne porterait que le code serait
        ambigue entre deux ecoles.

        Debit borne par un seau NOMME a deux bornes, dont une journaliere
        globale : la borne par IP seule ne freine pas une enumeration repartie.

        La reponse ne rend NI jeton NI session : l inscrit se connecte ensuite
        avec le mot de passe qu il vient de choisir.
      security: []
      parameters:
        - name: X-Institution
          in: header
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - code
                - nom
                - password
                - password_confirmation
              properties:
                code:
                  type: string
                  minLength: 4
                  maxLength: 12
                  example: BUR7K2
                nom:
                  type: string
                  maxLength: 191
                email:
                  type: string
                  format: email
                  nullable: true
                telephone:
                  type: string
                  maxLength: 40
                  nullable: true
                  description: "Une adresse OU un numero est exige, sans imposer lequel."
                password:
                  type: string
                  minLength: 8
                password_confirmation:
                  type: string
      responses:
        '201':
          description: "Inscription enregistree"
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  message:
                    type: string
                  data:
                    type: object
                    properties:
                      classe:
                        type: object
                        properties:
                          id:
                            type: integer
                          libelle:
                            type: string
        '400':
          description: "En-tete X-Institution absent, ou etablissement non resolu"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: |
            Ce code n ouvre aucune inscription. Un code INCONNU, un code
            RETIRE et le code d un etablissement dont la liste des apprenants
            vient de KLASSCI rendent le MEME message : les separer dirait qu un
            code a existe pour cette valeur.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: |
            Un compte existe deja avec ces coordonnees. Il n est PAS touche —
            ni mot de passe, ni role, ni inscription. Sur un endpoint anonyme,
            une adresse n est pas une preuve de propriete (#812).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: "Charge invalide, ou ni adresse ni telephone"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          description: "Debit depasse"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /me/inscriptions:
    post:
      tags:
        - Session de formation
      summary: "Rejoindre une classe avec un code, deja connecte"
      description: |
        La MEME troisieme porte d ADR-803-03, authentifiee (#885). La porte
        anonyme `/inscriptions` refuse tout compte existant — une adresse n y
        prouve rien — et renvoie l apprenant ici. Meme code, meme resolution,
        meme service.

        L etablissement vient du COMPTE, jamais d un en-tete : un
        `X-Institution` est ignore.

        Un code fait ENTRER, il ne rouvre pas : une adhesion existante non
        active (suspendue, abandonnee, expiree...) est refusee sans etre
        touchee. Seul l etablissement la rouvre.

        Debit compte PAR APPRENANT, jamais par IP : une classe entiere rejoint
        depuis le wifi de l ecole.
      security:
        - sanctum: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - code
              properties:
                code:
                  type: string
                  minLength: 4
                  maxLength: 12
                  example: BUR7K2
      responses:
        '201':
          description: "Adhesion creee"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClasseRejointeResponse'
        '200':
          description: "L apprenant etait deja inscrit : rien n est reecrit"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClasseRejointeResponse'
        '401':
          description: "Non authentifie"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: |
            Le compte n est pas un apprenant — y compris l administrateur
            d etablissement, que la garde de route laisserait passer.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: |
            Ce code n ouvre aucune inscription dans l etablissement du compte.
            Inconnu, retire, d une autre ecole, ou d un etablissement dont la
            liste des apprenants vient de KLASSCI : MEME message.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: |
            Une adhesion non active existe deja pour cette classe, ou le compte
            n est rattache a aucun etablissement. Rien n est ecrit.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: "Code absent ou hors bornes"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          description: |
            Debit depasse : soit le seau du compte (10/min, 30/jour), soit le
            plafond d ECHECS de l etablissement (200/jour), qui ferme alors la
            porte a tous ses apprenants jusqu au lendemain.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /classes/{classe}/code-inscription:
    post:
      tags:
        - Session de formation
      summary: "Emettre le code d inscription d une classe"
      description: |
        Le code court qu on dicte pour rejoindre une classe (ADR-803-03).

        Rendu EN CLAIR, et c est voulu : contrairement au lien d activation, il
        circule par telephone et par WhatsApp, se reaffiche autant que
        necessaire, et se revoque. Le hacher le rendrait indictable.

        SIX caracteres tires dans un alphabet de 31, sans `0` `1` `I` `L` `O` —
        les glyphes qu on confond en dictant. Casse normalisee EN PHP, jamais
        par la collation : SQLite est sensible a la casse, MySQL ne l est pas.

        Emettre REMPLACE le code precedent, qui cesse aussitot de fonctionner,
        et rouvre une classe dont le code avait ete retire. Aucune inscription
        deja faite n est touchee.

        Reserve aux etablissements qui tiennent leur propre catalogue : un
        etablissement branche a KLASSCI recoit 403.
      security:
        - sanctum: []
      parameters:
        - name: classe
          in: path
          required: true
          schema:
            type: integer
            minimum: 1
      responses:
        '201':
          description: "Code emis"
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  message:
                    type: string
                  data:
                    type: object
                    properties:
                      classe_id:
                        type: integer
                      code_inscription:
                        type: string
                        example: BUR7K2
        '403':
          description: "Role insuffisant, ou catalogue venant de KLASSCI"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: "Classe introuvable DANS CET ETABLISSEMENT"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          description: |
            Aucun code disponible apres cinq tirages. Sur 31^6 combinaisons par
            etablissement, signale une source d alea en panne, pas de la
            malchance.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    delete:
      tags:
        - Session de formation
      summary: "Retirer le code d inscription d une classe"
      description: |
        Ferme la porte aux suivants SANS desinscrire personne : les inscriptions
        vivent dans `classe_etudiant`, que ce chemin ne touche pas.

        La valeur du code DEMEURE en base. L effacer perdrait l unicite d un
        code tout juste dicte, qui pourrait alors etre reattribue ailleurs.
      security:
        - sanctum: []
      parameters:
        - name: classe
          in: path
          required: true
          schema:
            type: integer
            minimum: 1
      responses:
        '200':
          description: "Code retire"
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  message:
                    type: string
        '403':
          description: "Role insuffisant, ou catalogue venant de KLASSCI"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: "Classe introuvable DANS CET ETABLISSEMENT"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: "Cette classe n a pas de code a retirer"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /classes/{classe}/matieres:
    post:
      tags:
        - Session de formation
      summary: "Composer le programme d une classe"
      description: |
        Troisieme et dernier lot de l ADR-848-01 : apres la Classe et la
        Matiere, ce qui les relie — et le formateur qui l assure.

        Ecrit `classe_matiere`, le pivot LOCAL que LocalEnrollmentSource lit
        DEJA pour repondre « quelles classes ce formateur enseigne-t-il ».
        `matiere_enseignant` n est PAS touchee : c est le miroir KLASSCI.

        TROIS appartenances sont verifiees, pas une : la classe, la matiere ET
        le formateur doivent etre de cet etablissement. Controler la classe
        seule laisserait rattacher la matiere d une autre ecole — une ligne
        d apparence normale, donc une fuite silencieuse.

        Le 404 ne distingue pas « n existe pas » de « appartient a quelqu un
        d autre » : les separer dirait a un etablissement quels identifiants
        existent chez ses voisins.

        Rejouer le meme rattachement REAFFECTE le formateur au lieu d echouer :
        `classe_matiere` porte un unique (classe_id, matiere_id), et reaffecter
        un cours est une operation courante.
      security:
        - sanctum: []
      parameters:
        - name: classe
          in: path
          required: true
          schema:
            type: integer
            minimum: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ClasseMatiereInput'
      responses:
        '201':
          description: "Matiere rattachee a la classe"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClasseMatiereLinked'
        '401':
          description: "Non authentifie"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: |
            Role insuffisant, ou etablissement dont le programme vient de
            KLASSCI.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: |
            Classe, matiere ou formateur introuvable DANS CET ETABLISSEMENT.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: "Aucun etablissement resolu"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: "matiere_id manquant ou invalide"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /matieres:
    post:
      tags:
        - Session de formation
      summary: "Creer une Matiere sans KLASSCI"
      description: |
        Le SEUL createur d une Matiere du depot etait la synchronisation
        KLASSCI. Une ecole autonome avait des classes depuis #860, mais aucune
        matiere : un formateur n avait rien a enseigner.

        Second des trois verrous de l ADR-848-01, et le premier a exiger une
        MIGRATION avant son ecrivain : `matieres.klassci_id` etait NOT NULL sans
        valeur par defaut.

        Reservee aux etablissements qui tiennent leur propre catalogue. Le droit
        est une CAPACITE verifiee au point d ecriture, jamais une comparaison de
        mode : un etablissement branche a KLASSCI recoit 403.

        `institution_id` et `klassci_id` ne sont JAMAIS acceptes. Inventer un
        identifiant KLASSCI ferait entrer la matiere dans les correspondances
        par `whereIn('klassci_id', ...)`, ou elle n a rien a faire.

        `coefficient` et `credit` valent 1 par defaut : une matiere se cree
        souvent avant d etre ponderee.
      security:
        - sanctum: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MatiereInput'
      responses:
        '201':
          description: "Matiere creee"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MatiereCreated'
        '401':
          description: "Non authentifie"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: |
            Role insuffisant, ou etablissement dont le catalogue vient de
