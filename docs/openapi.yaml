    RapportInvalide:
      type: object
      additionalProperties: false
      required:
        - success
        - message
        - errors
      properties:
        success:
          type: boolean
          enum:
            - false
        message:
          type: string
        errors:
          type: object
          additionalProperties:
            type: array
            items:
              type: string

    VisioConsentInput:
      type: object
      required:
        - captation
        - diffusion
        - reutilisation
      properties:
        captation:
          type: boolean
          description: "Etre filme pendant la seance."
        diffusion:
          type: boolean
          description: "Rediffusion de l'enregistrement au groupe de la seance."
        reutilisation:
          type: boolean
          description: "Reutilisation sur une autre session que celle d'origine."

    VisioConsentState:
      type: object
      properties:
        success:
          type: boolean
          example: true
        data:
          type: object
          properties:
            captation:
              type: boolean
            diffusion:
              type: boolean
            reutilisation:
              type: boolean

    SchoolRegistrationRequestInput:
      type: object
      required:
        - nom_demandeur
        - email_demandeur
        - nom_ecole
        - usage_prevu
      properties:
        nom_demandeur:
          type: string
          maxLength: 191
          description: "Futur superAdmin de l'etablissement, si la demande est validee."
          example: "Awa Kouassi"
        email_demandeur:
          type: string
          format: email
          maxLength: 191
          example: "awa.kouassi@cabinet-kf.ci"
        telephone_demandeur:
          type: string
          maxLength: 40
          nullable: true
          example: "+225 07 00 00 00 00"
        nom_ecole:
          type: string
          maxLength: 191
          example: "Cabinet Kouassi Formation"
        slug_souhaite:
          type: string
          maxLength: 50
          nullable: true
          pattern: '^[a-z0-9\-]+$'
          description: |
            Souhait, JAMAIS une reservation. Le supradmin l'arbitre a la
            validation, collision avec un etablissement existant comprise.
          example: "cabinet-kouassi"
        usage_prevu:
          type: string
          minLength: 10
          maxLength: 2000
          description: "Texte libre. Obligatoire : il augmente le cout d'un depot automatise."
          example: "Formations comptabilite OHADA, promotions de 25 stagiaires."

    # Rejoindre une classe avec un code, deja connecte (#885). Meme forme en
    # 201 et en 200 : l apprenant lit la classe qu il a rejointe dans les deux cas.
    ClasseRejointeResponse:
      type: object
      properties:
        success:
          type: boolean
        message:
          type: string
        data:
          type: object
          properties:
            classe:
              type: object
              properties:
                id:
                  type: integer
                libelle:
                  type: string

    # Error Response
    # --- Cycle evaluation (#892) -------------------------------------------
    # Formes MESUREES par appel reel des routes, pas deduites des noms.

    Decimal2:
      type: string
      pattern: '^-?\d+\.\d{2}$'
      example: "16.00"
      description: |
        Nombre decimal SERIALISE EN CHAINE : le cast Eloquent `decimal:2`
        (`EvaluationSubmission`, `Evaluation`, `EvaluationQuestion`) rend
        `"16.00"`, jamais `16`. Un client type doit le convertir.

    EvaluationWindow:
      type: object
      nullable: true
      description: |
        Fenetre de passage relayee depuis KLASSCI (`programmation.window`).
        `null` quand l evaluation n en a pas, ou quand KLASSCI n a pas pu etre
        joint. Le LMS ne lit que les cles ci-dessous ; les autres passent telles
        quelles.
      additionalProperties: true
      properties:
        is_open:
          type: boolean
        has_started:
          type: boolean
        has_ended:
          type: boolean
        start_at:
          type: string
          format: date-time
        end_at:
          type: string
          format: date-time

    EvaluationSubmissionRecord:
      type: object
      description: |
        Une copie (`evaluation_submissions`), serialisee telle quelle.

        Une copie TOUT JUSTE CREEE n expose que les colonnes ecrites a sa
        creation (`id`, `evaluation_id`, `student_id`, `klassci_etudiant_id`,
        `attempt`, `status`, `started_at`, `institution_id`, `feedback`,
        `created_at`, `updated_at`) ; une copie relue les expose toutes.
      properties:
        id:
          type: integer
        evaluation_id:
          type: integer
        student_id:
          type: integer
          nullable: true
        klassci_etudiant_id:
          type: integer
        attempt:
          type: integer
        status:
          type: string
          enum: [en_cours, soumis, corrige]
        started_at:
          type: string
          format: date-time
          nullable: true
        submitted_at:
          type: string
          format: date-time
          nullable: true
        answers:
          type: object
          nullable: true
          description: "MAP `{ \"<question_id>\": reponse }` (chaine, ou tableau de chaines pour `qcm_multiple`)."
          additionalProperties: true
        manual_points:
          type: object
          nullable: true
          description: "Points attribues a la main, par question (dissertations)."
          additionalProperties:
            type: number
        score:
          type: string
          pattern: '^-?\d+\.\d{2}$'
          nullable: true
          description: "Decimal en chaine (voir `Decimal2`)."
        note_sur_20:
          type: string
          pattern: '^-?\d+\.\d{2}$'
          nullable: true
          description: "Decimal en chaine (voir `Decimal2`)."
        feedback:
          type: string
          nullable: true
          description: "Commence par `[PRACTICE]` pour une tentative d entrainement (note non officielle)."
        graded_by:
          type: integer
          nullable: true
        graded_at:
          type: string
          format: date-time
          nullable: true
        synced_to_klassci:
          type: boolean
        synced_at:
          type: string
          format: date-time
          nullable: true
        institution_id:
          type: integer
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    EvaluationRecord:
      type: object
      description: "Une evaluation (`evaluations`), serialisee telle quelle (seul `klassci_link_guard` est masque)."
      additionalProperties: true
      properties:
        id:
          type: integer
        institution_id:
          type: integer
        klassci_evaluation_id:
          type: integer
          nullable: true
        klassci_matiere_id:
          type: integer
          nullable: true
        klassci_classe_id:
          type: integer
          nullable: true
        klassci_enseignant_id:
          type: integer
          nullable: true
        classe_id:
          type: integer
          nullable: true
          description: "D72 : classe LOCALE (ecole creee depuis le LMS). Nulle pour une evaluation KLASSCI."
        matiere_id:
          type: integer
          nullable: true
          description: "D72 : matiere LOCALE (ecole creee depuis le LMS). Nulle pour une evaluation KLASSCI."
        enseignant_id:
          type: integer
          nullable: true
          description: "D72 : l'auteur (users.id), ecrit a chaque creation. Nul pour une ligne d'avant D72."
        titre:
          type: string
        description:
          type: string
          nullable: true
        type:
          type: string
        status:
          type: string
          description: "Statut STOCKE (`brouillon`, `planifiee`, `en_cours`, `terminee`…)."
        date_evaluation:
          type: string
          format: date-time
          nullable: true
        deadline_at:
          type: string
          format: date-time
          nullable: true
        duree_minutes:
          type: integer
          nullable: true
        coefficient:
          $ref: '#/components/schemas/Decimal2'
        bareme:
          $ref: '#/components/schemas/Decimal2'
        is_online:
          type: boolean
        allow_retake:
          type: boolean
        max_attempts:
          type: integer
          nullable: true
        shuffle_questions:
          type: boolean
        show_results:
          type: boolean
        is_published:
          type: boolean
        notes_published:
          type: boolean
        is_locked:
          type: boolean
        locked_at:
          type: string
          format: date-time
          nullable: true
        matiere_nom:
          type: string
          nullable: true
        classe_nom:
          type: string
          nullable: true
        enseignant_nom:
          type: string
          nullable: true
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        deleted_at:
          type: string
          format: date-time
          nullable: true

    EvaluationQuestionPublic:
      type: object
      description: "Une question SANS son corrige (`correct_answers` et `explanation` sont masques sur le modele)."
      properties:
        id:
          type: integer
        evaluation_id:
          type: integer
        question:
          type: string
        type:
          type: string
          enum: [qcm, qcm_multiple, vrai_faux, reponse_courte, dissertation]
        ordre:
          type: integer
        points:
          $ref: '#/components/schemas/Decimal2'
        options:
          nullable: true
          description: "Choix proposes (qcm) ; `null` pour les autres types."
        is_required:
          type: boolean
        institution_id:
          type: integer
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    ValidationFailed:
      type: object
      properties:
        success:
          type: boolean
          example: false
        message:
          type: string
          example: "Validation failed"
        errors:
          type: object
          description: "Messages par champ."
          additionalProperties:
            type: array
            items:
              type: string

    # Entree en visio et validation d'un participant (lot B).
    ParticipantValide:
      type: object
      description: |
        Deux formes sous le meme statut 200. `authorized: true` : l'acces est
        accorde, avec `role` et `message`. `authorized: false` : un REFUS rendu
        en 200, motif `invalid_role`, pour un compte dont le role n'est ni du
        personnel ni un eleve. Le client lit `authorized`, pas le statut.
      additionalProperties: false
      required:
        - success
        - authorized
      properties:
        success:
          type: boolean
          enum:
            - true
        authorized:
          type: boolean
        role:
          type: string
          description: "Present si l'acces est accorde : `moderator` pour un coordinateur ou un administrateur."
          enum:
            - moderator
            - teacher
            - student
        message:
          type: string
        reason:
          type: string
          description: "Present si l'acces est refuse."
          enum:
            - invalid_role
        user_role:
          type: string
          description: "Le role brut du compte refuse."

    RefusParticipant:
      type: object
      description: |
        Les refus 403 de la validation d'un participant et de l'entree en visio.
        Trois sources sous ce statut : la garde de role ou un etablissement
        desactive (`message` seul) ; la porte des comptes sans etablissement
        (`reason: no_institution`) ; la decision d'acces (`authorized: false` et
        `reason`). Faute de `oneOf` dans l'outillage de contrat, le schema admet
        toutes ces formes : il ne lie pas un motif a sa forme.
      additionalProperties: false
      required:
        - success
        - message
      properties:
        success:
          type: boolean
          enum:
            - false
        message:
          type: string
        authorized:
          type: boolean
          enum:
            - false
        reason:
          type: string
          enum:
            - no_institution
            - visio_not_enabled
            - visio_ended
            - actor_not_authorized
            - teacher_not_owner
            - no_classe_id
            - not_enrolled

    ParticipantIntrouvable:
      type: object
      description: "Le compte vise a ete supprime. Sans `message`."
      additionalProperties: false
      required:
        - success
        - authorized
        - reason
      properties:
        success:
          type: boolean
          enum:
            - false
        authorized:
          type: boolean
          enum:
            - false
        reason:
          type: string
          enum:
            - user_not_found

    VisioNonActive:
      type: object
      additionalProperties: false
      required:
        - success
        - message
        - reason
      properties:
        success:
          type: boolean
          enum:
            - false
        message:
          type: string
        reason:
          type: string
          description: "L'etat de la visio : programmee, terminee, ou non activee."
          enum:
            - visio_not_started
            - visio_ended
            - visio_not_enabled

    VisioRejointe:
      type: object
      additionalProperties: false
      required:
        - success
        - message
        - data
      properties:
        success:
          type: boolean
          enum:
            - true
        message:
          type: string
        data:
          type: object
          additionalProperties: false
          required:
            - visio_room_id
            - participants_count
            - visio_token
            - visio_token_available
            - can_manage_recording
          properties:
            visio_room_id:
              type: string
              nullable: true
            participants_count:
              type: integer
              minimum: 0
              description: "Participants connectes, lus avant l'enregistrement de cet appel : un appelant deja connecte (rechargement) y est compte."
            visio_token:
              type: string
              nullable: true
              description: "Cle d'entree de CE salon pour CET utilisateur. Null si Jitsi n'est pas configure, ou sans salon."
            visio_token_available:
              type: boolean
            can_manage_recording:
              type: boolean
              description: "Decide par le serveur : coordinateur, administrateur ou enseignant de la seance."

    ErrorWithDetail:
      type: object
      description: |
        Forme de 500 portee par quelques routes anciennes : une cle `error`
        AU SINGULIER, hors de l enveloppe canonique. Conservee telle quelle
        pour ne pas casser le client.
      properties:
        success:
          type: boolean
          example: false
        message:
          type: string
        error:
          type: string
          example: "Une erreur est survenue."

    # #906 — un refus qui dit POURQUOI, pour que le front traduise par son
    # propre catalogue sans lire le message du serveur. Le motif va dans le
    # CORPS : le front de production est cross-origin, et `exposed_headers: []`
    # lui cache tout en-tete non standard. Convention : ADR-906-01.
    # P5-a : toute route authentifiee non marquee `plateforme` peut aussi rendre
    # ce refus en 403, motif `no_institution`, pour un compte sans
    # etablissement (EnsureSchoolMemberOrPlatformRoute). Ce refus est global :
    # il n est pas recopie route par route.
    RefusMotive:
      type: object
      required:
        - success
        - message
        - reason
      properties:
        success:
          type: boolean
          example: false
        message:
          type: string
        reason:
          type: string
          enum:
            - account_exists
            - enrolment_not_active
            - no_institution
            - account_quota_exceeded
            - account_daily_cap_reached
            - institution_cap_reached
            - ip_quota_exceeded
            - global_cap_reached

    # #806 — `reason` est FACULTATIF ici : un 401 Sanctum n en porte aucun.
    RefusKlassci:
      type: object
      required:
        - success
        - message
      properties:
        success:
          type: boolean
          example: false
        message:
          type: string
        reason:
          type: string
          enum:
            - klassci_token_missing
            - klassci_session_expired

    ErrorResponse:
      type: object
      properties:
        success:
          type: boolean
          example: false
        error_code:
          type: string
          example: "UNAUTHENTICATED"
        message:
          type: string
          example: "Unauthenticated."
      required:
        - success
        - error_code
        - message

    # Auth Schemas
    LoginRequest:
      type: object
      properties:
        email:
          type: string
          format: email
          example: "user@example.com"
        password:
          type: string
          format: password
          example: "password123"
      required:
        - email
        - password

    AuthResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        data:
          type: object
          properties:
            token:
              type: string
              example: "token_string_here"
            user:
              type: object

    User:
      type: object
      properties:
        id:
          type: integer
          example: 1
        email:
          type: string
          example: "user@example.com"
        name:
          type: string
          example: "John Doe"
        role:
          type: string
          enum: [etudiant, enseignant, coordinateur, admin, superAdmin]

    # Visio d'une seance KLASSCI : activation et bascule (#990).
    VisioActivee:
      type: object
      additionalProperties: false
      required:
        - success
        - message
        - data
      properties:
        success:
          type: boolean
          enum:
            - true
        message:
          type: string
        data:
          type: object
          additionalProperties: false
          required:
            - visio_enabled
            - visio_status
            - visio_room_id
            - notifications_sent
            - notifications_queued
            - classe_synced
          properties:
            visio_enabled:
              type: boolean
              enum:
                - true
            visio_status:
              type: string
              enum:
                - programmee
            visio_room_id:
              type: string
            notifications_sent:
              type: integer
              minimum: 0
              description: "Toujours 0 : les notifications sont planifiees, pas envoyees pendant la requete."
            notifications_queued:
              type: boolean
              description: "Toujours vrai, meme si la planification a echoue (l'echec est journalise, pas rendu)."
            classe_synced:
              type: boolean
              description: "La classe et ses eleves ont ete relus dans KLASSCI pour les notifications. Toujours faux dans une ecole en mode autonome : rien n'y est relu dans KLASSCI."

    VisioBasculeInput:
      type: object
      additionalProperties: false
      required:
        - enabled
      properties:
        enabled:
          type: boolean
        visio_type:
          type: string
          nullable: true
          description: "Seul Jitsi est cable. Absent ou null : `jitsi`."
          enum:
            - jitsi
            - null

    VisioBasculee:
      type: object
      additionalProperties: false
      required:
        - success
        - message
        - data
      properties:
        success:
          type: boolean
          enum:
            - true
        message:
          type: string
        data:
          type: object
          additionalProperties: false
          required:
            - seance_id
            - visio_enabled
            - visio_type
            - visio_room_id
            - visio_active
            - notifications_sent
            - notifications_queued
          properties:
            seance_id:
              type: integer
              description: "L'identifiant KLASSCI recu dans le chemin."
            visio_enabled:
              type: boolean
            visio_type:
              type: string
              nullable: true
              description: "`jitsi` a l'activation, null a la desactivation."
              enum:
                - jitsi
                - null
            visio_room_id:
              type: string
              nullable: true
              description: "Un salon neuf a chaque activation, y compris d'une seance deja activee ; null a la desactivation."
            visio_active:
              type: boolean
            notifications_sent:
              type: integer
              minimum: 0
              description: "Toujours 0 : les notifications sont planifiees, pas envoyees pendant la requete."
            notifications_queued:
              type: boolean
              description: "Vrai a l'activation, meme si la planification a echoue ; faux a la desactivation."

    VisioErreurInterne:
      type: object
      description: |
        `error` n'est present que si le service a rattrape l'erreur. Le
        gestionnaire global rend `success` et `message` seuls.
        Forme partagee des 500 rattrapes, au-dela de la visio (les eleves
        d'une classe, par exemple) : le nom est plus etroit que l'usage.
      additionalProperties: false
      required:
        - success
        - message
      properties:
        success:
          type: boolean
          enum:
            - false
        message:
          type: string
        error:
          type: string
          example: "Une erreur est survenue."

# Paths
paths:
  # ============ AUTHENTICATION ============
  /school-requests:
    post:
      tags:
        - School registration
      summary: "Deposer une demande d'ouverture d'ecole"
      description: |
        Porte d'entree du monde autonome (ADR-803-01). SEULE ecriture non
        authentifiee du systeme.

        N'ecrit qu'une ligne inerte, hors perimetre multi-tenant : ni compte,
        ni etablissement, ni reservation du `slug_souhaite`. La demande ne
        devient rien tant qu'un supradmin plateforme n'a pas tranche.

        Ne requiert PAS l'en-tete `X-Institution` : il n'y a pas encore
        d'etablissement a resoudre.

        Une seule demande en attente par adresse : un second depot met a jour
        la premiere au lieu d'en creer une seconde.

        Debit limite a 5 requetes par minute et par IP.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SchoolRegistrationRequestInput'
      responses:
        '201':
          description: |
            Demande enregistree. La reponse ne rend NI l'identifiant NI le
            statut : l'endpoint est anonyme, et les exposer offrirait de quoi
            enumerer les dossiers ou confirmer qu'une adresse a deja depose.

            Elle ne promet aucun courriel : le produit n'a aucun canal d'envoi.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: "Votre demande est enregistree. Elle sera examinee par notre equipe."
        '422':
          description: "Validation error"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          description: "Trop de demandes depuis cette adresse IP"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /lms/classes/local/{classeId}:
    get:
      tags:
        - Classes
      operationId: getLocalClassPage
      summary: "Details d'une classe designee par son identifiant LOCAL"
      description: |
        Porte jumelle de `/lms/classes/{classeId}`. Ouverte a tout compte de
        l'etablissement, sans garde de role. La source est choisie par le mode
        DECLARE de l'ecole, au point de liaison, jamais par le client.

        **Ecole creee depuis KLASSCI.** Le LMS y connait deux numerotations
        independantes pour la meme classe : la cle primaire locale, et
        l'identifiant KLASSCI. En production, elles divergent, avec des
        collisions franches. Un appelant qui detient un identifiant LOCAL — par
        exemple celui rendu par `classes_concernees` — doit donc utiliser CETTE
        porte : l'envoyer a la porte historique rend la fiche d'une autre
        classe, en 200, sans erreur. La classe est d'abord resolue localement,
        avant toute lecture de sa fiche : 404 si l'etablissement n'a pas cette
        classe, 409 (`classe_local_only`) si elle a ete creee dans le LMS et n'a
        donc pas d'identifiant KLASSCI. Sinon, la fiche est lue dans KLASSCI,
        avec le jeton KLASSCI du compte : 401 `klassci_token_missing` sans ce
        jeton. Un refus de KLASSCI (4xx) est relaye avec son statut et le
        message du catalogue, 401 avec `klassci_session_expired` ; une panne, un
        circuit ouvert ou une reponse illisible rendent le 503 avec
        `Retry-After`.

        **Ecole creee depuis le LMS**, ou basculee en mode autonome. La fiche
        est lue dans les tables locales, pour l'id local, sans aucun appel a
        KLASSCI et sans 409 : la meme fiche que par la porte historique. La
        gestion lit toute classe de l'etablissement, un enseignant une classe
        ou il est designe formateur, un eleve une classe ou son inscription est
        active, sans la liste des eleves. Sinon, 404.
      security:
        - sanctum: []
      parameters:
        - name: classeId
          in: path
          required: true
          description: "Cle primaire LOCALE de la classe (table `classes`)."
          schema:
            type: integer
            minimum: 1
      responses:
        '400':
          description: |
            Sans jeton porteur, un en-tete `X-Institution` inconnu : refuse
            avant l'authentification. Ou requete refusee par KLASSCI, relayee.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClasseLocaleRefus'
        '200':
          description: "La fiche de la classe, la meme que par la porte historique."
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FicheClasse'
        '401':
          description: |
            Jeton porteur absent ou invalide (sans `reason`). Dans une ecole creee
            depuis KLASSCI, pour une classe qui a une fiche KLASSCI : compte sans
            jeton KLASSCI (`reason: klassci_token_missing`), ou session refusee
            par KLASSCI (`reason: klassci_session_expired`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RefusKlassci'
        '403':
          description: |
            Sans `reason` : etablissement desactive ou supprime, ou refus de
            KLASSCI relaye. `no_institution` : compte sans etablissement, ou
            gestionnaire de la plateforme (`supradmin`), meme rattache a un
            etablissement.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RefusClasseEleves'
        '404':
          description: |
            Aucune classe ne porte cet identifiant local dans l'etablissement de
            l'appelant ; dans une ecole creee depuis le LMS, une classe que
            l'appelant n'atteint pas ; KLASSCI repond 2xx sans fiche de classe, ou
            404, relaye ; ou l'identifiant n'est pas numerique (la route ne le
            trouve pas). Sans motif.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClasseLocaleRefus'
        '409':
          description: |
            Ecole creee depuis KLASSCI seulement. La classe existe mais a ete
            creee dans le LMS : elle n'a aucune fiche KLASSCI a afficher. Un 404
            mentirait, la classe est bien la. Motif `classe_local_only`. Sans
            motif : conflit signale par KLASSCI, relaye.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClasseLocaleRefus'
        '422':
          description: "Donnees refusees par KLASSCI, relaye. Sans detail par champ."
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClasseLocaleRefus'
        '429':
          description: "KLASSCI limite les requetes, relaye, SANS son en-tete `Retry-After`."
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClasseLocaleRefus'
        '4XX':
          description: |
            Tout autre refus de KLASSCI de 400 a 499 est relaye avec son statut et
            le message par defaut du catalogue.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClasseLocaleRefus'
        '500':
          description: |
            Panne interne, base de donnees comprise : « Une erreur est survenue. »,
            sans `error`, rapportee une fois au journal. Ou erreur non rattrapee,
            rendue par le gestionnaire global, sans `error`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VisioErreurInterne'
        '503':
          description: |
            Ecole creee depuis KLASSCI : KLASSCI indisponible (panne, circuit
            ouvert), ou reponse illisible.
          headers:
            Retry-After:
              schema:
                type: integer
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KlassciIndisponible'

  /lms/classes/{classeId}:
    get:
      tags:
        - Classes
      operationId: getClassPage
      summary: "La fiche d'une classe (porte historique)"
      description: |
        La fiche ouverte depuis la carte d'une classe (`TeacherClassCard.vue`) et
        la liste d'administration. Ouverte a tout compte de l'etablissement, sans
        garde de role. La source est choisie par le mode DECLARE de l'ecole, au
        point de liaison, jamais par le client.

        **Ecole creee depuis KLASSCI.** `classeId` est l'identifiant KLASSCI. La
        fiche est lue dans KLASSCI avec le jeton KLASSCI du compte : 401
        `klassci_token_missing` sans ce jeton, avant tout appel. Un refus de
        KLASSCI (4xx) est relaye avec son statut et le message du catalogue, 401
        avec `klassci_session_expired` ; une panne, un circuit ouvert ou une
        reponse illisible rendent le 503 avec `Retry-After`. KLASSCI repond 2xx
        sans fiche : 404. Les evaluations programmees sont lues a part ; leur
        echec laisse la liste vide.

        **Ecole creee depuis le LMS**, ou basculee en mode autonome. `classeId`
        est l'identifiant local, et la fiche est celle de la porte locale
        (`/lms/classes/local/{classeId}`), lue dans les tables locales sans aucun
        appel a KLASSCI. La gestion lit toute classe de l'etablissement, un
        enseignant une classe ou il est designe formateur, un eleve une classe
        ou son inscription est active, sans la liste des eleves. Sinon, 404.

        **Ecole basculee.** Ses classes gardent leur `klassci_id`, mais la liste
        d'administration (`/proxy/classes`) suit le mode et donne les
        identifiants LOCAUX : un identifiant de la liste ouvre la meme classe.
      security:
        - sanctum: []
      parameters:
        - name: classeId
          in: path
          required: true
          description: "Identifiant KLASSCI dans une ecole creee depuis KLASSCI, identifiant local dans une ecole creee depuis le LMS ou basculee."
          schema:
            type: integer
      responses:
        '200':
          description: "La fiche de la classe."
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FicheClasse'
        '400':
          description: |
            Requete refusee par KLASSCI, relayee. Ou, sans jeton porteur, un
            en-tete `X-Institution` inconnu : refuse avant l'authentification.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RefusClasseEleves'
        '401':
          description: |
            Jeton porteur absent ou invalide (sans `reason`). Dans une ecole creee
            depuis KLASSCI : compte sans jeton KLASSCI (`reason:
            klassci_token_missing`), ou session refusee par KLASSCI (`reason:
            klassci_session_expired`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RefusKlassci'
        '403':
          description: |
            Sans `reason` : etablissement desactive, ou refus de KLASSCI relaye.
            `no_institution` : compte sans etablissement, ou gestionnaire de la
            plateforme (`supradmin`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RefusClasseEleves'
        '404':
          description: |
            « Classe non trouvee » : KLASSCI repond 2xx sans fiche, ou, dans une
            ecole creee depuis le LMS, une classe que l'appelant n'atteint pas.
            Ou refus 404 de KLASSCI, relaye. Sans motif.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RefusClasseEleves'
        '409':
          description: "Conflit signale par KLASSCI, relaye."
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RefusClasseEleves'
        '422':
          description: "Donnees refusees par KLASSCI, relaye. Sans detail par champ."
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RefusClasseEleves'
        '429':
          description: "KLASSCI limite les requetes, relaye, SANS son en-tete `Retry-After`."
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RefusClasseEleves'
        '4XX':
          description: |
            Tout autre refus de KLASSCI de 400 a 499 est relaye avec son statut et
            le message par defaut du catalogue.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RefusClasseEleves'
        '500':
          description: |
            Erreur interne, toujours rapportee une fois au journal. Panne de base
            ou autre erreur d'execution : « Une erreur est survenue. », sans
            `error`. Toute autre erreur, rattrapee par le controleur : avec
            `error`. Gestionnaire global (par exemple un `classeId` non
            numerique) : sans `error`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VisioErreurInterne'
        '503':
          description: |
            Ecole creee depuis KLASSCI : KLASSCI indisponible (panne, circuit
            ouvert), ou reponse illisible.
          headers:
            Retry-After:
              schema:
                type: integer
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KlassciIndisponible'

  /lms/seances:
    post:
      tags:
        - Visio
      summary: "Creer une seance locale"
      description: |
        Cree une seance LOCALE, dans les deux volets (ecole KLASSCI et ecole
        autonome) : aucun identifiant KLASSCI n'est pose, tous les `klassci_*`
        valent nul, et `institution_id` est celui de l'auteur.

        `classe_id` est FACULTATIF : une seance peut se creer avant que la
        classe soit arretee. S'il est fourni, la classe doit etre de
        l'etablissement de l'auteur. Sinon 404, le meme refus pour une classe
        inexistante et pour celle d'une autre ecole : la reponse ne dit pas
        quels identifiants existent ailleurs.

        Reserve aux roles `enseignant` (alias `teacher`), `coordinateur` (alias
        `coordinator`) et `superAdmin`. Le role est garde une seule fois, par la
        route, qui compare sans la casse : une variante (`Enseignant`) est
        admise. Le 403 a plusieurs sources, et le client ne doit pas lire le
        message :
        - le role de la route, qui refuse tout autre role, `admin` compris
          (« Accès refusé - Permissions insuffisantes ») ;
        - un etablissement desactive ou introuvable (« Établissement désactivé.
          Accès suspendu, contactez votre administration. ») ;
        - un compte sans etablissement, refuse par la porte des comptes sans
          etablissement, avec le motif `no_institution`.
      security:
        - sanctum: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SeanceLocaleInput'
      responses:
        '201':
          description: "Seance creee."
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SeanceLocaleCreated'
        '401':
          description: "Non authentifie"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SeanceLocaleRefus'
        '403':
          description: "Role non admis a creer une seance, ou compte sans etablissement"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SeanceLocaleInterdite'
        '404':
          description: "Classe ou matiere introuvable dans l'etablissement de l'auteur (inexistante, ou d'une autre ecole) : le meme refus, son motif dit laquelle."
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SeanceLocaleHorsEtablissement'
        '422':
          description: "Charge invalide (`errors`), ou matiere hors du programme de la classe (`reason` `subject_not_in_class_program`)."
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/SeanceLocaleInvalide'
                  - $ref: '#/components/schemas/SeanceLocaleHorsProgramme'

  /admin/reports/attendance:
    post:
      tags:
        - Reports
      summary: "Rapport de presences"
      description: |
        ASYNCHRONE par defaut : la reponse est un 202, et le rapport se
        suit par `status_url` puis se recupere par `download_url` (chemins
        relatifs, prefixe `/api` compris), pendant 24 heures apres son dernier
        changement d etat. Le rendu synchrone (200, le PDF) est un opt-out
        explicite : `sync` (parametre de requete ou champ du corps JSON) ou
        `Prefer: respond-sync`.

        Le 403 a plusieurs sources, et le client ne doit pas lire le message :
        - le role de la route (« Accès refusé - Permissions insuffisantes ») ;
        - l'autorisation de la requete, rendue par le gestionnaire generique :
          « This action is unauthorized. » si `APP_DEBUG` est vrai, « Une
          erreur est survenue. » sinon, ce qui est le cas en production ;
        - un etablissement desactive (« Établissement désactivé… ») ;
        - un compte sans etablissement (motif `no_institution`).

        Route ouverte a `coordinateur`, `superAdmin` et `enseignant`. Sans
        `seance_id`, la requete n'admet que le coordinateur et l'administrateur :
        un enseignant recoit 403 avant tout envoi. AVEC `seance_id`, le rendu est
        TOUJOURS synchrone (200, PDF ou tableur selon `format`) ; une seance
        d'une autre ecole et une seance inexistante rendent le meme 403.
      security:
        - sanctum: []
      parameters:
        - name: sync
          in: query
          required: false
          description: "Opt-out EXPLICITE du defaut asynchrone : le PDF est rendu dans la reponse (200). Lu aussi dans le corps JSON."
          schema:
            type: boolean
        - name: async
          in: query
          required: false
          description: "Opt-in asynchrone, accepte pour retro-compatibilite. S'il coexiste avec sync, l'asynchrone l'emporte. Lu aussi dans le corps JSON."
          schema:
            type: boolean
        - name: Prefer
          in: header
          required: false
          description: "`respond-sync` vaut `?sync=1`, `respond-async` vaut `?async=1`."
          schema:
            type: string
            enum:
              - respond-sync
              - respond-async
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RapportPresencesInput'
      responses:
        '202':
          description: "Rapport accepte, a suivre par status_url."
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RapportAccepte'
        '200':
          description: "Rendu synchrone (opt-out) : le fichier, en piece jointe."
          content:
            application/pdf:
              schema:
                type: string
                format: binary
            application/vnd.ms-excel:
              schema:
                type: string
                format: binary
        '401':
          description: "Non authentifie"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RapportRefus'
        '403':
          description: "Role ou requete non admis, etablissement desactive, ou compte sans etablissement"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RapportInterdit'
        '422':
          description: "Charge invalide"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RapportInvalide'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          description: |
            Defaillance interne. L echec d un rendu synchrone porte une cle
            `error` ; une mise en file impossible, ou l echec du rapport d une
            seance, rend le corps generique `{success, message}`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorWithDetail'

