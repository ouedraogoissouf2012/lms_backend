  /users:
    post:
      tags:
        - Users
      summary: "Creer un compte dans l'ecole de l'acteur"
      description: |
        #1625. Reserve au coordinateur et a l'admin d'ecole (`admin`, `superAdmin`). Le
        compte nait dans l'etablissement de l'ACTEUR (#1181), jamais dans celui que
        le corps nommerait.

        Le role demande doit etre STRICTEMENT inferieur a celui de l'acteur
        (`AssignableRole`) : un role egal ou superieur, ou hors liste, est un 422
        sur `role`, pas un 403.
      security:
        - sanctum: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - name
                - email
                - password
                - password_confirmation
                - role
              properties:
                name:
                  type: string
                  maxLength: 255
                email:
                  type: string
                  format: email
                  description: "Unique dans l'ecole de l'acteur (un compte supprime de la meme ecole est signale)."
                password:
                  type: string
                  minLength: 8
                password_confirmation:
                  type: string
                  description: "Egal a `password`."
                role:
                  type: string
                  enum: [etudiant, enseignant, coordinateur, admin, superAdmin]
                  description: "Strictement inferieur au role de l'acteur."
                klassci_id:
                  type: integer
                  nullable: true
      responses:
        '201':
          description: "Compte cree, relu avec son etablissement"
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                  - success
                  - message
                  - data
                properties:
                  success:
                    type: boolean
                    enum:
                      - true
                  message:
                    type: string
                    example: "Utilisateur créé avec succès"
                  data:
                    type: object
                    description: "Le compte cree, relu avec son etablissement (`institution`)."
                    required:
                      - id
                      - name
                      - email
                      - role
                      - institution_id
                    properties:
                      id:
                        type: integer
                      name:
                        type: string
                      email:
                        type: string
                      role:
                        type: string
                        enum: [etudiant, enseignant, coordinateur, admin, superAdmin]
                      institution_id:
                        type: integer
                      klassci_id:
                        type: integer
                        nullable: true
                      institution:
                        type: object
                        nullable: true
        '400':
          $ref: '#/components/responses/EtablissementInconnu'
        '401':
          description: "Non authentifie"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: |
            Role de l'acteur hors gestion (eleve, enseignant), ou acteur sans
            etablissement (`reason: no_institution`). Aussi, sans `reason` :
            etablissement desactive ou supprime (ResolveInstitution, #961).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: |
            Validation, detail par champ dans `errors` : `name` ou `email` absent,
            `email` deja pris dans l'ecole, `password` de moins de 8 caracteres ou
            non confirme, `role` hors liste, egal ou superieur a celui de l'acteur.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /admin/audit-log:
    get:
      tags:
        - Audit
      summary: "Le journal d'audit, toutes ecoles confondues"
      description: |
        Route PLATEFORME (D51) : reservee au supradmin, qui lit les entrees de
        toutes les ecoles pour diagnostiquer. Le superAdmin d'une ecole n'y a pas
        acces. Lecture seule, triee de la plus recente a la plus ancienne.

        Chaque entree porte son ecole, `institution: {id, name}` (D127), y compris
        une ecole supprimee depuis (suppression logique). `institution` vaut
        `null` quand l'entree n'a pas d'ecole (`institution_id` nul), ou quand
        l'ecole a ete purgee physiquement depuis. L'ecole d'une entree est celle
        de l'utilisateur authentifie AU MOMENT de l'ecriture : les connexions
        (`login`, `login_failed`) et les actions du supradmin n'en ont pas.

        Le filtre `action` n'accepte que les neuf valeurs historiques ; les
        actions plus recentes (voir `AuditLogEntry.action`) se lisent sans filtre.
      security:
        - sanctum: []
      parameters:
        - name: per_page
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 50
        - name: page
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
        - name: action
          in: query
          required: false
          schema:
            type: string
            enum: [create, update, delete, view, export, import, login, logout, login_failed]
        - name: user_id
          in: query
          required: false
          schema:
            type: integer
      responses:
        '200':
          description: "Une page du journal"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuditLogPage'
        '400':
          $ref: '#/components/responses/EtablissementInconnu'
        '401':
          description: "Non authentifie"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuditLogRefus'
        '403':
          description: "Reserve au supradmin plateforme (le superAdmin d'une ecole est refuse). Aussi, sans `reason` : etablissement desactive ou supprime (ResolveInstitution, #961)."
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuditLogRefus'
        '422':
          description: "Filtre invalide (`per_page` hors de 1-100, `action` hors liste, `user_id` inconnu)"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationFailed'
        '429':
          $ref: '#/components/responses/TooManyRequests'

