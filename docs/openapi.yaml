  /evaluations/{id}/start:
    post:
      tags:
        - Evaluations
      operationId: startEvaluation
      summary: "Demarrer (ou reprendre) une tentative"
      description: |
        Reservee aux eleves. Aucun corps de requete : l identite vient du jeton.

        Si une tentative `en_cours` existe, elle est REPRISE (meme `id`) ;
        sinon une nouvelle copie est creee. Une evaluation terminee se passe
        en mode entrainement (`is_practice: true`) : fenetre, quota et reprise
        n y sont pas appliques, et la note n est pas officielle.

        Limite : 300 requetes / minute.
      security:
        - sanctum: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: |
            Tentative demarree (« Evaluation demarree », « Mode entrainement
            demarre ») ou reprise (« Reprise de la tentative en cours »).
            `window` et `is_practice` sont a la RACINE, hors de `data`.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  message:
                    type: string
                  data:
                    $ref: '#/components/schemas/EvaluationSubmissionRecord'
                  window:
                    $ref: '#/components/schemas/EvaluationWindow'
                  is_practice:
                    type: boolean
        '401':
          $ref: '#/components/responses/KlassciUnauthorized'
        '403':
          description: |
            L un de ces refus. `message` le nomme ; `reason`, motif stable que le
            client traduit, le designe :
            - fenetre fermee : `evaluation_window_closed` ; la reponse porte
              alors `window` a la racine ;
            - nombre maximum de tentatives atteint : `evaluation_max_attempts` ;
            - reprise interdite (`allow_retake: false`) :
              `evaluation_retake_forbidden` ;
            - evaluation qui ne se passe pas en ligne : `evaluation_offline_only`.

            Les autres refus de cette route, communs a toutes :
            - compte sans etablissement : `no_institution` ;
            - etablissement desactive : sans `reason` ;
            - appelant d un etablissement qui n est pas eleve : refus generique,
              sans `reason`.

            Ces quatre refus n existent que dans l ecole creee depuis KLASSCI :
            dans l ecole creee depuis le LMS, le demarrage s arrete avant, faute
            de jeton KLASSCI (401).
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                  - success
                  - message
                properties:
                  success:
                    type: boolean
                    enum:
                      - false
                  message:
                    type: string
                  reason:
                    type: string
                    enum:
                      - evaluation_window_closed
                      - evaluation_max_attempts
                      - evaluation_retake_forbidden
                      - evaluation_offline_only
                      - no_institution
                  window:
                    $ref: '#/components/schemas/EvaluationWindow'
        '404':
          description: |
            « Evaluation non disponible » : l evaluation ne figure pas dans la
            liste de l eleve (`GET /evaluations/student`), quelle qu en soit la
            raison — la meme regle que le detail `GET /evaluations/{id}`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageOnly'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '503':
          description: |
            KLASSCI injoignable : refus par prudence, aucune tentative creee.
            Reessayer apres `Retry-After` (la valeur de toute indisponibilite
            KLASSCI du depot).
            - la fenetre ne peut pas etre verifiee :
              `reason: evaluation_window_unverifiable` ;
            - la classe de l eleve ne peut pas etre lue : le refus canonique
              d une indisponibilite KLASSCI, `reason: klassci_unavailable`.
          headers:
            Retry-After:
              description: "Secondes avant de reessayer"
              schema:
                type: integer
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                  - success
                  - message
                  - reason
                properties:
                  success:
                    type: boolean
                    enum:
                      - false
                  message:
                    type: string
                  reason:
                    type: string
                    enum:
                      - evaluation_window_unverifiable
                      - klassci_unavailable

  /evaluations/{id}/submit:
    post:
      tags:
        - Evaluations
      operationId: submitEvaluation
      summary: "Rendre la tentative en cours"
      description: |
        Clot la tentative `en_cours` ouverte par `/start` — n en cree jamais.
        La correction automatique s applique ; les dissertations attendent une
        notation manuelle (`/submissions/{submission}/grade`).

        Quand `show_results` est faux, `score` et `note_sur_20` sont RETIRES
        de la reponse (a la racine de `data` comme dans `data.submission`).

        Limite : 60 requetes / minute.
      security:
        - sanctum: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - answers
              properties:
                answers:
                  type: object
                  minProperties: 1
                  description: |
                    MAP indexee par identifiant de question. Chaque valeur est
                    une chaine (<= 10 000 caracteres), ou un tableau de chaines
                    pour `qcm_multiple` (<= 200 elements). `""`, `[]` ou `null` =
                    question non repondue (0 point).
                  additionalProperties:
                    oneOf:
                      - type: string
                        maxLength: 10000
                        nullable: true
                      - type: array
                        maxItems: 200
                        items:
                          type: string
                          maxLength: 10000
                  example:
                    "12": "A"
                    "13": ["A", "C"]
                submitted_at:
                  type: string
                  description: "Format `Y-m-d\\TH:i:s\\Z` ; l heure du serveur par defaut."
                  example: "2026-09-25T14:30:00Z"
      responses:
        '201':
          description: "Copie rendue"
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  message:
                    type: string
                  data:
                    type: object
                    properties:
                      submission:
                        allOf:
                          - $ref: '#/components/schemas/EvaluationSubmissionRecord'
                          - type: object
                            properties:
                              evaluation:
                                $ref: '#/components/schemas/EvaluationRecord'
                      score:
                        type: string
                        pattern: '^-?\d+\.\d{2}$'
                        nullable: true
                        description: "Absent quand `show_results` est faux"
                      note_sur_20:
                        type: string
                        pattern: '^-?\d+\.\d{2}$'
                        nullable: true
                        description: "Absent quand `show_results` est faux"
        '401':
          description: "Non authentifie"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageOnly'
        '403':
          description: |
            Message generique. L appelant n est pas eleve, OU l evaluation
            n existe pas / n est pas publiee, OU sa date limite est passee :
            une evaluation inconnue rend 403, pas 404.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageOnly'
        '409':
          description: "Aucune tentative en cours : la demarrer avec `/start` avant de la rendre"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageOnly'
        '422':
          description: "`answers` absent, vide, ou d un type refuse"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationFailed'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          description: "Erreur interne"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageOnly'

  /evaluations/{id}/time-status:
    get:
      tags:
        - Evaluations
      operationId: getEvaluationTimeStatus
      summary: "Fenetre de passage et heure du serveur"
      description: |
        Informatif : si KLASSCI est injoignable, `window` vaut `null` et la
        reponse reste 200. C est `/start` qui refuse, pas cette route.
      security:
