      operationId: getMySubmission
      summary: "Derniere copie de l eleve, et son corrige apres delai"
      description: |
        Rend la tentative de plus haut numero, quel que soit son statut.

        Le corrige (`correct_answers`, `explanation` sur chaque question)
        n apparait qu a partir de `correction_available_at` : 7 jours apres
