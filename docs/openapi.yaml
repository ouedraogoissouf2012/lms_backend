            name:
              type: string
            email:
              type: string
              nullable: true
            role:
              type: string
        institution:
          type: object
          nullable: true
          description: "L'ecole de l'entree, supprimee logiquement ou non ; null sans ecole ou apres une purge physique (D127)"
          additionalProperties: false
          required:
            - id
            - name
          properties:
            id:
              type: integer
            name:
              type: string

    SchoolRequestQueue:
      type: object
