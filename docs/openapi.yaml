      responses:
        '200':
          description: "Schedule data"
        '400':
          $ref: '#/components/responses/EtablissementInconnu'
        '401':
          $ref: '#/components/responses/KlassciUnauthorized'
        '403':
          $ref: '#/components/responses/EtablissementDesactive'
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /proxy/test-connection:
    get:
      tags:
        - Proxy / KLASSCI
      summary: "Test KLASSCI connection"
      description: "Admin/Coordinator only - Test connection to KLASSCI API"
      security:
        - sanctum: []
      responses:
        '200':
          description: "Connection successful"
        '400':
          $ref: '#/components/responses/EtablissementInconnu'
        '401':
          $ref: '#/components/responses/KlassciUnauthorized'
        '403':
          description: "Insufficient permissions (requires coordinateur or admin role). Aussi, sans `reason` : etablissement desactive ou supprime (ResolveInstitution, #961)."
        '429':
          $ref: '#/components/responses/TooManyRequests'

  # ============ EVALUATIONS ============
  /evaluations:
    get:
      tags:
        - Evaluations
      operationId: listEvaluations
      summary: "Evaluations de l etablissement, pour le personnel"
      description: |
        Reservee au personnel (`ListEvaluationsRequest`). Triees par date
        decroissante, `limit` au plus 100. Chaque element est une
        `EvaluationEnrichie` : `submissions_count` (compte par la requete, il
        survit a un enrichissement fail-soft) et les questions sans corrige ; les
        copies ne sont PAS livrees.

        Les filtres `classe_id` et `matiere_id` portent sur les identifiants de
        l espace de l ecole (D72, E4b, C27) : `klassci_classe_id` et
        `klassci_matiere_id` dans une ecole creee depuis KLASSCI, `classe_id` et
        `matiere_id` locaux dans une ecole creee depuis le LMS. Dans cette
        derniere, ni la liste ni la fiche n appellent KLASSCI : les libelles
        viennent de la ligne.
      security:
        - sanctum: []
      parameters:
        - name: classe_id
          in: query
          schema:
            type: integer
            minimum: 1
        - name: matiere_id
          in: query
          schema:
            type: integer
            minimum: 1
        - name: status
          in: query
          schema:
            type: string
        - name: is_published
          in: query
          schema:
            type: boolean
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
      responses:
        '200':
          description: "Evaluations (eventuellement aucune)"
          content:
            application/json:
              schema:
                type: object
                required:
                  - success
                  - data
                additionalProperties: false
                properties:
                  success:
                    type: boolean
                  message:
                    type: string
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/EvaluationEnrichie'
        '400':
          $ref: '#/components/responses/EtablissementInconnu'
        '401':
          description: "Unauthenticated"
        '403':
          description: "Role hors du personnel. Aussi, sans `reason` : etablissement desactive ou supprime (ResolveInstitution, #961)."
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageOnly'
        '429':
          $ref: '#/components/responses/TooManyRequests'

    post:
      tags:
        - Evaluations
      summary: "Create evaluation"
      description: |
        D72. Le rattachement depend du type d'ecole (meme route, autre source, ADR-EI-01) :
        - ecole creee depuis KLASSCI : mise en ligne d'une evaluation PROGRAMMEE dans KLASSCI,
          designee par `klassci_evaluation_id` (exige), `klassci_classe_id`, `klassci_matiere_id` ;
        - ecole creee depuis le LMS : programmation dans le LMS, sur `classe_id` et `matiere_id`
          LOCAUX (exiges), couple programme dans l'ecole ou l'auteur est designe (la gestion :
          tout couple programme).
        Jamais d'id local sous un nom `klassci_*` (D132) : chaque source refuse la famille de
        l'autre (422 `identifier_out_of_scope`). L'auteur (`enseignant_id`) vient du jeton.
      security:
        - sanctum: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - titre
                - type
                - duree_minutes
              properties:
                klassci_evaluation_id:
                  type: integer
                  nullable: true
                  description: "Ecole creee depuis KLASSCI seulement : l'evaluation programmee a mettre en ligne."
                klassci_classe_id:
                  type: integer
                  nullable: true
                  description: "Ecole creee depuis KLASSCI seulement."
                klassci_matiere_id:
                  type: integer
                  nullable: true
                  description: "Ecole creee depuis KLASSCI seulement."
                classe_id:
                  type: integer
                  nullable: true
                  description: "Ecole creee depuis le LMS seulement : la classe locale."
                matiere_id:
                  type: integer
                  nullable: true
                  description: "Ecole creee depuis le LMS seulement : la matiere locale."
                titre:
                  type: string
                  minLength: 3
                  maxLength: 255
                description:
                  type: string
                  nullable: true
                type:
                  type: string
                  enum: [qcm, reponse_courte, dissertation, mixte]
                date_evaluation:
                  type: string
                  format: date-time
                  nullable: true
                duree_minutes:
                  type: integer
                  minimum: 1
                  maximum: 1440
                coefficient:
                  type: number
                  minimum: 0
                  nullable: true
                bareme:
                  type: number
                  minimum: 0
                  nullable: true
                status:
                  type: string
                  nullable: true
                max_attempts:
                  type: integer
                  minimum: 1
                  nullable: true
                allow_retake:
                  type: boolean
                  nullable: true
                is_online:
                  type: boolean
                  nullable: true
                shuffle_questions:
                  type: boolean
                  nullable: true
                show_results:
                  type: boolean
                  nullable: true
                questions:
                  type: array
                  items:
                    type: object
      responses:
        '201':
          description: "Evaluation created"
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  message:
                    type: string
                  data:
                    $ref: '#/components/schemas/EvaluationRecord'
        '400':
          $ref: '#/components/responses/EtablissementInconnu'
        '403':
          description: |
            Refus de programmation : compte sans identite enseignant KLASSCI (ecole creee depuis
            KLASSCI), ou auteur non designe pour ce couple classe x matiere (ecole creee depuis le LMS).
            Un 403 du role (coordinateur, apprenant) ne porte pas de `reason` ; un compte sans
            etablissement recoit `no_institution` (middleware d'appartenance).
            Aussi, sans `reason` : etablissement desactive ou supprime (ResolveInstitution, #961).
          content:
            application/json:
              schema:
                type: object
                required:
                  - success
                  - message
                properties:
                  success:
                    type: boolean
                    example: false
                  message:
                    type: string
                  reason:
                    type: string
                    enum:
                      - klassci_teacher_identity_missing
                      - teacher_not_assigned
                      - no_institution
        '409':
          description: "Une version en ligne existe deja pour cette evaluation KLASSCI."
          content:
            application/json:
              schema:
                type: object
                required:
                  - success
                  - message
                properties:
                  success:
                    type: boolean
                    example: false
                  message:
                    type: string
                  data:
                    description: "La version en ligne existante."
                    nullable: true
                    oneOf:
                      - $ref: '#/components/schemas/EvaluationRecord'
        '422':
          description: |
            Erreur de validation (`errors`), classe ou matiere hors de l'ecole (`errors`), ou refus
            motive : programmation KLASSCI absente dans une ecole creee depuis KLASSCI
            (`klassci_scheduling_required`), identifiant de l'autre famille (`identifier_out_of_scope`), bonne
            reponse absente des options d'une question a options, ou `vrai_faux` dont les options ne sont pas
            exactement `["Vrai", "Faux"]`, ordre compris (`correct_answer_not_among_options`, D532).
          content:
            application/json:
              schema:
                type: object
                required:
                  - success
                  - message
                properties:
                  success:
                    type: boolean
                    example: false
                  message:
                    type: string
                  errors:
                    type: object
                    additionalProperties:
                      type: array
                      items:
                        type: string
                  reason:
                    type: string
                    enum:
                      - klassci_scheduling_required
                      - identifier_out_of_scope
                      - correct_answer_not_among_options
        '500':
          description: "Echec transactionnel de la creation (rollback, journalise)."
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: false
                  message:
                    type: string
                  error:
                    type: string

  /evaluations/{id}:
    get:
      tags:
        - Evaluations
      summary: "Get evaluation details"
      security:
        - sanctum: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: "Evaluation details"
        '400':
          $ref: '#/components/responses/EtablissementInconnu'
        '403':
          $ref: '#/components/responses/EtablissementDesactive'
        '404':
          description: "Evaluation not found"
        '429':
          $ref: '#/components/responses/TooManyRequests'

    put:
      tags:
        - Evaluations
      summary: "Update evaluation"
      description: |
        C14 : seuls les champs ci-dessous sont ecrits (liste blanche = validation). Un champ hors de
        cette liste est ignore (`notes_published`, `is_locked`, `locked_at`, `deadline_at`, les
        libelles, les identifiants). `is_published` est refuse quelle que soit sa valeur (`true`,
        `false`, `null`) : la publication passe par `POST /evaluations/{id}/publish`.
      security:
        - sanctum: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                titre:
                  type: string
                  minLength: 3
                  maxLength: 255
                description:
                  type: string
                  nullable: true
                status:
                  type: string
                  enum: [brouillon, planifiee, en_cours, terminee, annulee]
                date_evaluation:
                  type: string
                  description: "Une date lisible par la regle `date` de Laravel."
                  nullable: true
                duree_minutes:
                  type: integer
                  minimum: 1
                  maximum: 1440
                type:
                  type: string
                  enum: [qcm, reponse_courte, dissertation, mixte]
                coefficient:
                  type: number
                  minimum: 0
                  nullable: true
                bareme:
                  type: number
                  minimum: 0
                  nullable: true
                max_attempts:
                  type: integer
                  minimum: 1
                allow_retake:
                  type: boolean
                is_online:
                  type: boolean
                shuffle_questions:
                  type: boolean
                show_results:
                  type: boolean
                questions:
                  type: array
                  maxItems: 200
                  description: "Remplacement complet des questions. 200 au plus (`QuestionCountLimit`)."
                  items:
                    type: object
                    required:
                      - question
                      - type
                    properties:
                      question:
                        type: string
                        maxLength: 1000
                      type:
                        type: string
                        enum: [qcm, qcm_multiple, vrai_faux, reponse_courte, dissertation]
                      points:
                        type: number
                        minimum: 0
                        nullable: true
                      options:
                        type: array
                        nullable: true
                        maxItems: 26
                        description: "Choix proposes : une liste de textes, ou `null`. 26 options au plus, de 1 000 caracteres chacune (`QuestionOptionLimits`)."
                        items:
                          type: string
                          maxLength: 1000
                      correct_answers:
                        type: array
                        nullable: true
                        maxItems: 26
                        description: |
                          Les bonnes reponses, des textes. Pour `qcm`, `qcm_multiple` et `vrai_faux`, chacune
                          est une des `options` (sinon 422 `correct_answer_not_among_options`) ; au plus une
                          pour `qcm` et `vrai_faux`, sans doublon pour `qcm_multiple`. Vide ou nulle est
                          accepte a l'enregistrement (un brouillon).
                        items:
                          type: string
                          maxLength: 1000
                      explanation:
                        type: string
                        maxLength: 2000
                        nullable: true
      responses:
        '200':
          description: "Evaluation updated"
        '400':
          $ref: '#/components/responses/EtablissementInconnu'
        '403':
          description: "Permission denied. Aussi, sans `reason` : etablissement desactive ou supprime (ResolveInstitution, #961)."
        '409':
          description: |
            Evaluation verrouillee (`reason: evaluation_locked`, #1113) : une copie est
            deja remise, ou le drapeau `is_locked` est pose. Elle ne peut plus etre
            modifiee. Les droits sont acquis : c'est l'etat qui refuse (409, et non 403).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RefusMotive'
        '404':
          description: "Evaluation introuvable (#1782) : absente, supprimee ou d une autre ecole, avec le meme corps dans les trois cas. Un 403 dirait qu elle existe ailleurs."
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: |
            Erreur de validation (`errors`), `is_published` envoye (`publish_via_dedicated_route`, la
            publication passe par sa route), ou remplacement qui viderait une evaluation publiee
            (`evaluation_without_questions`, C16 : publiee est relu sur la ligne verrouillee, avant toute ecriture),
            ou bonne reponse absente des options d'une question a options, ou `vrai_faux` dont les options ne
            sont pas exactement `["Vrai", "Faux"]`, ordre compris (`correct_answer_not_among_options`, D532).
          content:
            application/json:
              schema:
                type: object
                required:
                  - success
                  - message
                properties:
                  success:
                    type: boolean
                    example: false
                  message:
                    type: string
                  errors:
                    type: object
                    additionalProperties:
                      type: array
                      items:
                        type: string
                  reason:
                    type: string
                    enum:
                      - publish_via_dedicated_route
                      - evaluation_without_questions
                      - correct_answer_not_among_options

    delete:
      tags:
        - Evaluations
      summary: "Delete evaluation"
      security:
        - sanctum: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: "Evaluation deleted"
        '400':
          $ref: '#/components/responses/EtablissementInconnu'
        '403':
          description: "Permission denied. Aussi, sans `reason` : etablissement desactive ou supprime (ResolveInstitution, #961)."
        '409':
          description: |
            Evaluation verrouillee (`reason: evaluation_locked`, #1113) : une copie est
            deja remise, ou le drapeau `is_locked` est pose. Elle ne peut plus etre
            supprimee. Les droits sont acquis : c'est l'etat qui refuse (409, et non 403).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RefusMotive'
        '404':
          description: "Evaluation introuvable (#1782) : absente, supprimee ou d une autre ecole, avec le meme corps dans les trois cas. Un 403 dirait qu elle existe ailleurs."
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  # ============ CYCLE EVALUATION (#892) ============
  # Chaque code et chaque cle ci-dessous a ete MESURE par appel reel de la
  # route (app.debug=false, comme en production). Les references au code
  # sont dans la PR qui a ecrit ce bloc.

  /evaluations/student:
    get:
      tags:
        - Evaluations
      operationId: listMyEvaluations
      summary: "Evaluations publiees de la classe de l eleve"
      description: |
        Ecole creee depuis KLASSCI : la classe est lue sur KLASSCI (`me/dashboard`).
        Ecole creee depuis le LMS (D72, E2a) : les classes actives de l eleve, sans
        appel a KLASSCI ; `classe` et `matiere` se lisent sur l evaluation, et
        `programmation.window` est calculee sur la ligne. Ne remonte que les
        evaluations publiees, de statut `planifiee`, `en_cours` ou `terminee`,
        ayant au moins une question — triees par date decroissante.

        Chaque element est l evaluation enrichie : `questions_count`, la
        derniere copie de l eleve (`student_submission`, sans `score`, `note_sur_20`
        ni `manual_points` quand `show_results` est faux : C25), et, relayes depuis
        KLASSCI sans garantie de forme, `programmation`, `lms_integration`,
        `classe`, `matiere`. Les questions et les copies des autres eleves ne
        sont PAS chargees.

        Une erreur 4xx renvoyee par KLASSCI est relayee avec SON statut, et un
        message generique.
      security:
        - sanctum: []
      responses:
        '200':
          description: "Liste (eventuellement vide)"
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: array
                    items:
                      type: object
                      description: |
                        Une evaluation (champs de `EvaluationRecord`, portes par
                        `additionalProperties`), enrichie des cles ci-dessous.
                      required:
                        - id
                        - questions_count
                      additionalProperties: true
                      properties:
                        id:
                          type: integer
                        titre:
                          type: string
                        classe_id:
                          type: integer
                          nullable: true
                        matiere_id:
                          type: integer
                          nullable: true
                        questions_count:
                          type: integer
                        student_submission:
                          nullable: true
                          oneOf:
                            - $ref: '#/components/schemas/EvaluationSubmissionRecord'
                        programmation:
                          nullable: true
                          description: |
                            Objet, ou tableau vide quand KLASSCI relaie un objet vide (un `{}`
                            decode puis reencode ressort en `[]`).
                          oneOf:
                            - type: array
                              items: {}
                            - type: object
                              additionalProperties: true
                              properties:
                                window:
                                  nullable: true
                                  description: |
                                    La fenetre de passage. Ecole creee depuis KLASSCI : relayee
                                    depuis KLASSCI. Ecole creee depuis le LMS : ouverture a
                                    `date_evaluation`, fermeture a `deadline_at`, sinon a
                                    `date_evaluation + duree_minutes` ; fermee sans date.
                                  oneOf:
                                    - type: array
                                      items: {}
                                    - type: object
                                      additionalProperties: true
                                      properties:
                                        is_open:
                                          type: boolean
                                        has_started:
                                          type: boolean
                                        has_ended:
                                          type: boolean
                                        start_at:
                                          type: string
                                          nullable: true
                                        end_at:
                                          type: string
                                          nullable: true
                        lms_integration:
                          nullable: true
                          oneOf:
                            - type: array
                              items: {}
                            - type: object
                              additionalProperties: true
                        classe:
                          type: object
                          nullable: true
                          description: |
                            L identite de la classe de l evaluation, et rien d autre : le
                            LMS ne relaie plus l enveloppe KLASSCI de la classe, qui
                            portait la liste des eleves.
                          properties:
                            id:
                              oneOf:
                                - type: integer
                                - type: string
                            nom:
                              type: string
                              nullable: true
                        matiere:
                          nullable: true
                          description: |
                            Ecole creee depuis KLASSCI : relaye depuis KLASSCI, d autres cles
                            possibles (ou tableau vide pour un objet vide). Ecole creee depuis le
                            LMS : `{id, nom}` de la matiere locale de l evaluation.
                          oneOf:
                            - type: array
                              items: {}
                            - type: object
                              additionalProperties: true
                              properties:
                                id:
                                  nullable: true
                                  oneOf:
                                    - type: integer
                                    - type: string
                                nom:
                                  type: string
                                  nullable: true
        '400':
          $ref: '#/components/responses/EtablissementInconnu'
        '401':
          $ref: '#/components/responses/KlassciUnauthorized'
        '403':
          $ref: '#/components/responses/EtablissementDesactive'
        '404':
          description: "KLASSCI ne rattache l eleve a aucune classe (« Classe non trouvee »)"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageOnly'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '503':
          description: "KLASSCI indisponible (en-tete `Retry-After`)"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageOnly'
        '500':
          description: "Erreur interne"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageOnly'

  /my-grades:
    get:
      tags:
        - Evaluations
      operationId: getMyGrades
      summary: "Notes de l eleve, par matiere"
      description: |
        Ne compte que les notes FINALES : copies `corrige`, ou `soumis` sans
        question a correction manuelle ; les tentatives d entrainement
        (`feedback` commencant par `[PRACTICE]`) et les evaluations non
        publiees sont exclues. UNE copie par evaluation (#1715) : la plus recente
        des copies finales, comme le bilan de la classe ; une evaluation a
        plusieurs tentatives ne pese qu une fois.

        `moyenne` est ponderee par le `coefficient` de chaque evaluation ;
        `moyenne_generale` est la moyenne des moyennes de matiere MESUREES,
        ponderee par le `coefficient` de la MATIERE (#1676, la regle du bilan d une
        classe ; avec tous les coefficients a 1, la moyenne simple). Regle unique des agregats
        sans mesure : toutes deux valent `null` quand il n y a rien a moyenner
        (aucune note visible, ou un coefficient total nul), jamais un 0 fabrique.

        `show_results` (C30, regle A de l utilisateur) : une evaluation qui cache
        ses resultats GARDE sa ligne, mais SANS la cle `note` (la forme de la
        liste), et n entre dans aucune moyenne. Meme regle que la liste,
        « ma copie », la remise et la page matiere (C25).

        Par type d ecole (D72, E4a) :
        - ecole creee depuis KLASSCI : identite KLASSCI exigee (sinon 401) ;
          matieres regroupees par leur identite KLASSCI, nommees par KLASSCI ;
        - ecole creee depuis le LMS : aucune identite ni aucun appel KLASSCI ;
          matieres regroupees par leur id local, nommees par leur libelle dans
          l etablissement.
      security:
        - sanctum: []
      responses:
        '200':
          description: "Notes agregees"
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: object
                    properties:
                      matieres:
                        type: array
                        items:
                          type: object
                          properties:
                            matiere_id:
                              type: integer
                              description: |
                                L id de la matiere dans l espace de l ecole : l identite
                                KLASSCI dans une ecole KLASSCI, l id local dans une ecole
                                creee depuis le LMS. `0` quand l evaluation n a pas de matiere.
                            matiere_nom:
                              type: string
                            moyenne:
                              type: number
                              nullable: true
                              description: "`null` quand la matiere n a aucune note a moyenner"
                            coefficient:
                              type: number
                              description: |
                                #1676 : le coefficient de la MATIERE, qui pondere `moyenne_generale` :
                                celui de la matiere dans la classe de sa copie la plus recente
                                (`classe_matiere`), a defaut celui de la matiere, a defaut 1.
                            total_evaluations:
                              type: integer
                            evaluations:
                              type: array
                              items:
                                type: object
                                properties:
                                  evaluation_id:
                                    type: integer
                                  titre:
                                    type: string
                                  type:
                                    type: string
                                  note:
                                    type: string
                                    pattern: '^-?\d+\.\d{2}$'
                                    nullable: true
                                    description: "Note sur 20, decimal en chaine. ABSENTE quand l evaluation cache ses resultats (C30)."
                                  coefficient:
                                    description: "Decimal en chaine ; l entier `1` quand l evaluation n en a pas"
                                    oneOf:
                                      - type: string
                                        pattern: '^-?\d+\.\d{2}$'
                                      - type: integer
                                        enum: [1]
                                  date_evaluation:
                                    type: string
                                    format: date-time
                                    nullable: true
                                  date_soumission:
                                    type: string
                                    format: date-time
                                    nullable: true
                                  temps_passe:
                                    type: integer
                                    nullable: true
                                    description: "Duree de la copie en minutes, remise moins debut, la minute entamee comptee (#901) ; `null` sans debut, sans remise, ou si les dates se contredisent."
                      moyenne_generale:
                        type: number
                        nullable: true
                        description: "`null` quand aucune matiere n a de moyenne"
                      total_matieres:
                        type: integer
                      total_evaluations:
                        type: integer
        '400':
          $ref: '#/components/responses/EtablissementInconnu'
        '401':
          $ref: '#/components/responses/KlassciUnauthorized'
        '403':
          $ref: '#/components/responses/EtablissementDesactive'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          description: "Erreur interne"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorWithDetail'

  /evaluations/{id}/start:
    post:
      tags:
        - Evaluations
      operationId: startEvaluation
      summary: "Demarrer (ou reprendre) une tentative"
      description: |
        Reservee aux eleves. Aucun corps de requete : l identite vient du jeton.

        Si une tentative `en_cours` existe, elle est REPRISE (meme `id`) ;
        sinon une nouvelle copie est creee. Deux demarrages simultanes : l unique
        des copies arbitre, et le perdant REPREND la tentative de la requete
        gagnante (D72, E2b) ; si elle est deja remise, 409.

        Fenetre : ecole creee depuis KLASSCI, la programmation KLASSCI (jeton de
        l eleve exige, sinon 401) ; ecole creee depuis le LMS, calculee sur la
        ligne (ouverture a `date_evaluation`, fermeture a `deadline_at`, sinon a
        `date_evaluation + duree_minutes` ; fermee sans date), sans jeton.

        Une evaluation terminee se passe
        en mode entrainement (`is_practice: true`) : fenetre, quota et reprise
        n y sont pas appliques, et la note n est pas officielle.

        Limite : 300 requetes / minute.
      security:
        - sanctum: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: |
            Tentative demarree (« Evaluation demarree », « Mode entrainement
            demarre ») ou reprise (« Reprise de la tentative en cours »).
            `window` et `is_practice` sont a la RACINE, hors de `data`.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  message:
                    type: string
                  data:
                    $ref: '#/components/schemas/EvaluationSubmissionRecord'
                  window:
                    $ref: '#/components/schemas/EvaluationWindow'
                  is_practice:
                    type: boolean
        '400':
          $ref: '#/components/responses/EtablissementInconnu'
        '401':
          $ref: '#/components/responses/KlassciUnauthorized'
        '403':
          description: |
            L un de ces refus. `message` le nomme ; `reason`, motif stable que le
            client traduit, le designe :
            - fenetre fermee : `evaluation_window_closed` ; la reponse porte
              alors `window` a la racine ;
            - nombre maximum de tentatives atteint : `evaluation_max_attempts` ;
            - reprise interdite (`allow_retake: false`) :
              `evaluation_retake_forbidden` ;
            - evaluation qui ne se passe pas en ligne : `evaluation_offline_only`.

            Les autres refus de cette route, communs a toutes :
            - compte sans etablissement : `no_institution` ;
            - etablissement desactive : sans `reason` ;
            - appelant d un etablissement qui n est pas eleve : refus generique,
              sans `reason`.

            Ces refus valent dans les deux types d ecole. Depuis D72 (E2b), l ecole
            creee depuis le LMS n exige plus de jeton KLASSCI : sa fenetre est
            calculee sur la ligne. Le 401 du jeton absent n existe que dans l ecole
            creee depuis KLASSCI.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                  - success
                  - message
                properties:
                  success:
                    type: boolean
                    enum:
                      - false
                  message:
                    type: string
                  reason:
                    type: string
                    enum:
                      - evaluation_window_closed
                      - evaluation_max_attempts
                      - evaluation_retake_forbidden
                      - evaluation_offline_only
                      - no_institution
                  window:
                    $ref: '#/components/schemas/EvaluationWindow'
        '404':
          description: |
            « Evaluation non disponible » : l evaluation ne figure pas dans la
            liste de l eleve (`GET /evaluations/student`), quelle qu en soit la
            raison — la meme regle que le detail `GET /evaluations/{id}`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageOnly'
        '409':
          description: |
            Course perdue entre deux demarrages simultanes, et la tentative de la
            requete gagnante est deja remise : rien n est cree ni repris.
          content:
            application/json:
              schema:
                type: object
                required:
                  - success
                  - message
                  - reason
                properties:
                  success:
                    type: boolean
                    example: false
                  message:
                    type: string
                  reason:
                    type: string
                    enum:
                      - evaluation_attempt_conflict
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '503':
          description: |
            KLASSCI injoignable : refus par prudence, aucune tentative creee.
            Reessayer apres `Retry-After` (la valeur de toute indisponibilite
            KLASSCI du depot).
            - la fenetre ne peut pas etre verifiee :
              `reason: evaluation_window_unverifiable` ;
            - la classe de l eleve ne peut pas etre lue : le refus canonique
              d une indisponibilite KLASSCI, `reason: klassci_unavailable`.
          headers:
            Retry-After:
              description: "Secondes avant de reessayer"
              schema:
                type: integer
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                  - success
                  - message
                  - reason
                properties:
                  success:
                    type: boolean
                    enum:
                      - false
                  message:
                    type: string
                  reason:
                    type: string
                    enum:
                      - evaluation_window_unverifiable
                      - klassci_unavailable

  /evaluations/{id}/submit:
    post:
      tags:
        - Evaluations
      operationId: submitEvaluation
      summary: "Rendre la tentative en cours"
      description: |
        Clot la tentative `en_cours` ouverte par `/start` — n en cree jamais.
        La correction automatique s applique ; les dissertations attendent une
        notation manuelle (`/submissions/{submission}/grade`).

        Echeance (C28, les deux types d ecole) : la remise est acceptee jusqu a
        `ends_at` + 60 s (la remise automatique du front part jusqu a 30 s apres
        la fin de la fenetre). Apres, elle est REFUSEE (409
        `evaluation_attempt_locked`) : la copie passe `verrouille`, garde les
        reponses recues, n est pas notee. Aucun appel a KLASSCI a la remise.

        Quand `show_results` est faux, `score` et `note_sur_20` sont RETIRES
        de la reponse (a la racine de `data` comme dans `data.submission`).

        Limite : 60 requetes / minute.
      security:
        - sanctum: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - answers
              properties:
                answers:
                  type: object
                  minProperties: 1
                  description: |
                    MAP indexee par identifiant de question. Chaque valeur est
                    une chaine (<= 10 000 caracteres), ou un tableau de chaines
                    pour `qcm_multiple` (<= 200 elements). `""`, `[]` ou `null` =
                    question non repondue (0 point).
                  additionalProperties:
                    oneOf:
                      - type: string
                        maxLength: 10000
                        nullable: true
                      - type: array
                        maxItems: 200
                        items:
                          type: string
                          maxLength: 10000
                  example:
                    "12": "A"
                    "13": ["A", "C"]
                submitted_at:
                  type: string
                  description: "Format `Y-m-d\\TH:i:s\\Z` ; l heure du serveur par defaut."
                  example: "2026-09-25T14:30:00Z"
      responses:
        '201':
          description: "Copie rendue"
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  message:
                    type: string
                  data:
                    type: object
                    properties:
                      submission:
                        $ref: '#/components/schemas/EvaluationSubmissionRecord'
                      score:
                        type: string
                        pattern: '^-?\d+\.\d{2}$'
                        nullable: true
                        description: "Absent quand `show_results` est faux"
                      note_sur_20:
                        type: string
                        pattern: '^-?\d+\.\d{2}$'
                        nullable: true
                        description: "Absent quand `show_results` est faux"
        '400':
          $ref: '#/components/responses/EtablissementInconnu'
        '401':
          description: "Non authentifie"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageOnly'
        '403':
          description: |
            Message generique. L appelant n est pas eleve, OU l evaluation
            n existe pas / n est pas publiee, OU sa date limite est passee :
            une evaluation inconnue rend 403, pas 404.
            Aussi, sans `reason` : etablissement desactive ou supprime (ResolveInstitution, #961).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageOnly'
        '409':
          description: |
            - `reason: evaluation_attempt_not_started` : aucune tentative en cours ; la
              demarrer avec `/start` avant de la rendre (#922).
            - `reason: evaluation_attempt_locked` : l echeance est depassee (C28).
              La copie est verrouillee, gardee avec ses reponses, et ne sera pas
              notee ; toute nouvelle remise rend le meme refus, sans rien ecrire.
            - `reason: evaluation_attempt_conflict` : remise tardive perdue contre une
              remise dans le delai d une requete concurrente ; la copie est remise,
              rien n est ecrit.
          content:
            application/json:
              schema:
                type: object
                required:
                  - success
                  - message
                properties:
                  success:
                    type: boolean
                    example: false
                  message:
                    type: string
                  reason:
                    type: string
                    enum:
                      - evaluation_attempt_not_started
                      - evaluation_attempt_locked
                      - evaluation_attempt_conflict
        '422':
          description: "`answers` absent, vide, ou d un type refuse"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationFailed'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          description: "Erreur interne"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageOnly'

  /evaluations/{id}/time-status:
    get:
      tags:
        - Evaluations
      operationId: getEvaluationTimeStatus
      summary: "Fenetre de passage et heure du serveur"
      description: |
        Informatif : si KLASSCI est injoignable, `window` vaut `null` et la
        reponse reste 200. C est `/start` qui refuse, pas cette route.

        Ecole creee depuis KLASSCI : la fenetre KLASSCI, jeton de l eleve exige
        (sinon 401). Ecole creee depuis le LMS (D72, E2b) : la fenetre calculee
        sur la ligne, sans jeton ni appel a KLASSCI.
      security:
        - sanctum: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: "Etat temporel"
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: object
                    properties:
                      window:
                        $ref: '#/components/schemas/EvaluationWindow'
                      server_time:
                        type: string
                        format: date-time
        '400':
          $ref: '#/components/responses/EtablissementInconnu'
        '401':
          $ref: '#/components/responses/KlassciUnauthorized'
        '403':
          $ref: '#/components/responses/EtablissementDesactive'
        '404':
          description: |
            « Evaluation non trouvee » : l evaluation ne figure pas dans la liste
            de l eleve — la meme regle que `/start`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageOnly'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '503':
          description: "KLASSCI injoignable : la classe de l eleve ne peut pas etre lue (en-tete `Retry-After`)."
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageOnly'

  /evaluations/{id}/my-submission:
    get:
      tags:
        - Evaluations
      operationId: getMySubmission
      summary: "Derniere copie de l eleve, et son corrige une fois ouvert"
      description: |
        Rend la tentative de plus haut numero, quel que soit son statut.

        Le corrige (`correct_answers`, `explanation` sur chaque question)
        n apparait que si `correction_available` est vrai (#1699). La regle suit
        `correction_release`, choisi par l enseignant. Dans tous les modes, le
        corrige ne s ouvre jamais avant la fermeture de l evaluation pour tous.
        La fermeture est le `end_at` programme par KLASSCI, sinon la fin de
        l evaluation. Une fenetre illisible, ou une evaluation sans fin connue,
        laisse le corrige ferme. Avant son ouverture, les questions sont rendues
        sans lui.

        Quand `show_results` est faux (notes non publiees), `score`,
        `note_sur_20` et `feedback` valent `null`.
      security:
        - sanctum: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: "La copie"
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: object
                    properties:
                      id:
                        type: integer
                      evaluation_id:
                        type: integer
                      attempt:
                        type: integer
                      status:
                        type: string
                        enum: [en_cours, soumis, corrige, verrouille]
                        description: "`verrouille` : remise refusee hors delai, ou tentative echue jamais remise (C28)."
                      started_at:
                        type: string
                        format: date-time
                        nullable: true
                      ends_at:
                        type: string
                        format: date-time
                        nullable: true
                        description: "Echeance de la tentative (C28), pour le minuteur ; nulle sans echeance."
                      submitted_at:
                        type: string
                        format: date-time
                        nullable: true
                      score:
                        type: string
                        pattern: '^-?\d+\.\d{2}$'
                        nullable: true
                      note_sur_20:
                        type: string
                        pattern: '^-?\d+\.\d{2}$'
                        nullable: true
                      feedback:
                        type: string
                        nullable: true
                        description: "Commentaire de l enseignant ; `null` tant que les notes ne sont pas publiees (#1699)."
                      questions:
                        type: array
                        items:
                          $ref: '#/components/schemas/EvaluationQuestionDeLaCopie'
                      answers:
                        type: object
                        additionalProperties: true
                        description: |
                          MAP `{ "<question_id>": reponse }`. Toujours un objet : `{}` quand la copie
                          n a pas de reponse (jamais un tableau).
                      correction_available:
                        type: boolean
                      correction_available_at:
                        type: string
                        format: date-time
                        nullable: true
                        description: "L instant d ouverture du corrige, passe ou a venir, s il est connu. Nul sinon : jamais, notes non publiees, ou fermeture inconnue."
                      correction_delay_days:
                        type: integer
                        nullable: true
                        deprecated: true
                        description: "Toujours `null` depuis #1699 : il n y a plus de delai fixe. Lire `correction_available_at`."
                      evaluation:
                        type: object
                        properties:
                          id:
                            type: integer
                          titre:
                            type: string
                          bareme:
                            $ref: '#/components/schemas/Decimal2'
                          coefficient:
                            $ref: '#/components/schemas/Decimal2'
                          show_results:
                            type: boolean
                            description: "Notes publiees (#1699). Faux : « notes pas encore publiees », a distinguer d une copie pas encore corrigee."
                          correction_release:
                            type: string
                            enum: [never, with_results, after_close, at_date]
                            description: "Le mode d ouverture du corrige, choisi par l enseignant (#1699)."
        '400':
          $ref: '#/components/responses/EtablissementInconnu'
        '401':
          $ref: '#/components/responses/KlassciUnauthorized'
        '403':
          $ref: '#/components/responses/EtablissementDesactive'
        '404':
          description: |
            « Aucune soumission trouvee pour cette evaluation » : l eleve n a pas
            de copie sur cette evaluation dans son etablissement. Le meme corps
            vaut pour une evaluation inexistante. Le droit de lire sa copie tient
            a la copie, pas a la classe actuelle de l eleve.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageOnly'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          description: "Erreur interne"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageOnly'

  /evaluations/{id}/publish:
    post:
      tags:
        - Evaluations
      operationId: publishEvaluation
      summary: "Publier une evaluation"
      description: |
        Rend l evaluation visible aux eleves : `is_published` vrai, `status`
        `planifiee`. Aucun corps de requete. Republier une evaluation deja
        publiee est accepte.

        Roles : enseignant (proprietaire de l evaluation) ou administrateur.
        Les coordinateurs ne publient pas.
      security:
        - sanctum: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: "Evaluation publiee"
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  message:
                    type: string
                  data:
                    $ref: '#/components/schemas/EvaluationRecord'
        '400':
          $ref: '#/components/responses/EtablissementInconnu'
        '401':
          description: "Non authentifie"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageOnly'
        '403':
          description: |
            Role insuffisant, coordinateur, enseignant non proprietaire (dans son ecole).
            Aussi, sans `reason` : etablissement desactive ou supprime (ResolveInstitution, #961).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageOnly'
        '404':
          description: "Evaluation introuvable (#1782) : absente, supprimee ou d une autre ecole, avec le meme corps dans les trois cas. Un 403 dirait qu elle existe ailleurs."
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: |
            Aucune question (`reason: evaluation_without_questions`, C16, le meme refus que la mise
            a jour d une evaluation publiee), ou evaluation deja terminee (sans `reason`).
          content:
            application/json:
              schema:
                type: object
                required:
                  - success
                  - message
                properties:
                  success:
                    type: boolean
                    example: false
                  message:
                    type: string
                  reason:
                    type: string
                    enum:
                      - evaluation_without_questions

