  /classes:
    post:
      tags:
        - Session de formation
      summary: "Creer une Classe sans KLASSCI"
      description: |
        Avant cette route, le SEUL createur d une Classe du depot etait la
        synchronisation KLASSCI : une ecole autonome n en avait aucune, jamais,
        et l import CSV produisait des apprenants qui n appartenaient a rien.

        Reservee aux etablissements qui tiennent leur propre catalogue. Le droit
        est une CAPACITE verifiee au point d ecriture, jamais une comparaison de
        mode : un etablissement branche a KLASSCI recoit 403, parce que deux
        sources ecrivant la meme realite est la cause racine de #673.

        `institution_id` et `klassci_id` ne sont JAMAIS acceptes : le premier
        vient du tenant resolu, et une classe locale n a pas d identifiant
        KLASSCI — lui en inventer un la rendrait indiscernable d une classe
        miroitee.

        L unicite du `code` est portee par la BASE et non par une validation
        prealable, qui ouvrirait une fenetre que deux requetes concurrentes
        franchiraient toutes les deux.
      security:
        - sanctum: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ClasseInput'
      responses:
        '201':
          description: "Classe creee"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClasseCreated'
        '400':
          $ref: '#/components/responses/EtablissementInconnu'
        '401':
          description: "Non authentifie"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: |
            Role insuffisant, ou etablissement dont le catalogue vient de
            KLASSCI (`catalogue_managed_by_klassci`, #1184).
            Aussi, sans `reason` : etablissement desactive ou supprime (ResolveInstitution, #961).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: |
            Aucun etablissement resolu. Controle AVANT le droit du
            catalogue (#910). Motif `no_institution`. Par HTTP, la porte
            des comptes sans etablissement repond 403 avant.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RefusMotive'
              example:
                success: false
                message: "Aucun établissement résolu."
                reason: no_institution
        '422':
          description: "Libelle manquant, code deja employe dans cet etablissement, ou Periode refusee (`training_session_id`, #1208)"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    get:
      operationId: listLocalClasses
      tags:
        - Session de formation
      summary: "Lister les classes locales et leur code d inscription"
      description: |
        La collection de `POST /classes` (#905, ADR-905-01) : les classes
        LOCALES de l etablissement de l appelant — sans identifiant KLASSCI.
        Rien ne les listait : la liste d administration vient de KLASSCI, et
        `GET /lms/classes/local/{id}` repond 409 a une classe sans identifiant
        KLASSCI, parce qu elle traduit vers KLASSCI.

        Le code d inscription revient avec la classe : le RELIRE ne le
        regenere plus, donc n invalide plus celui deja dicte. Sa valeur ne
        sort que s il est `actif` ; un code retire ne sort plus.

        Pas d `effectif` : pour une classe locale, cette colonne vaut toujours 0.

        Meme droit que l emission : un etablissement branche a KLASSCI recoit
        403. Meme garde de role : un apprenant ne lit pas les codes des classes.

        Filtres (#1652), facultatifs et cumulables : `statut` (active / archivee)
        et `places` (disponibles / pleine). Sans filtre : toutes les classes.
      security:
        - sanctum: []
      parameters:
        - name: statut
          in: query
          required: false
          description: "`active` : sans date d archive ; `archivee` : archivee. Autre valeur : 422."
          schema:
            type: string
            enum: [active, archivee]
        - name: places
          in: query
          required: false
          description: |
            `pleine` : capacite renseignee et atteinte par les adhesions ACTIVES (la regle
            qui refuse une inscription, `class_full`). `disponibles` : tout le reste, une
            capacite non renseignee comprise. Autre valeur : 422.
          schema:
            type: string
            enum: [disponibles, pleine]
        - name: per_page
          in: query
          required: false
          description: "Entre 1 et 100 ; absent vaut 25. Hors bornes ou non entier : 422 (spec #548)"
          schema:
            type: integer
            minimum: 1
            maximum: 100
        - name: page
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
      responses:
        '200':
          description: "Classes locales, triees par libelle"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClassesLocalesPage'
        '400':
          $ref: '#/components/responses/EtablissementInconnu'
        '401':
          description: "Non authentifie"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: "Role insuffisant, ou catalogue venant de KLASSCI (`catalogue_managed_by_klassci`, #1184). Aussi, sans `reason` : etablissement desactive ou supprime (ResolveInstitution, #961)."
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: |
            Le compte n est rattache a aucun etablissement — compte de
            plateforme. Controle AVANT le droit du catalogue : sans
            etablissement, aucune classe ne sort, d aucune ecole. Motif
            `no_institution` (#924).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RefusMotive'
              example:
                success: false
                message: "Aucun établissement résolu."
                reason: no_institution
        '422':
          description: "`per_page` ou `page` hors bornes, ou non entier (spec #548) ; `statut` ou `places` inconnu (#1652)"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationFailed'
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /classes/{classe}:
    patch:
      tags:
        - Session de formation
      summary: "Modifier une Classe locale"
      description: |
        #1652. Modifie une classe LOCALE de l ecole de l appelant : libelle, code,
        description. Seuls les champs ENVOYES changent ; un `code` vide ou nul
        EFFACE le code. Le code est unique dans l ecole : la BASE le tranche, et
        sa violation rend 422 `class_code_already_used` sur `code`. Une classe
        MIROIR de KLASSCI ne se modifie pas ici. La filiere et le niveau
        attendront #1648 ; capacite, periode et code d inscription ont leurs routes.
      security:
        - sanctum: []
      parameters:
        - name: classe
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ClasseUpdateInput'
      responses:
        '200':
          description: "Classe modifiee, relue"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClasseCreated'
        '400':
          $ref: '#/components/responses/EtablissementInconnu'
        '401':
          description: "Non authentifie"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: |
            Role insuffisant ; etablissement dont le catalogue vient de KLASSCI,
            ou classe MIROIR de KLASSCI (`catalogue_managed_by_klassci`).
            Aussi, sans `reason` : etablissement desactive ou supprime (ResolveInstitution, #961).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: "Aucune classe de ce numero dans l ecole de l appelant"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: "Libelle vide, ou code deja employe dans l ecole (`class_code_already_used` sur `code`)"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /inscriptions:
    post:
      operationId: registerWithEnrolmentCode
      tags:
        - Session de formation
      summary: "S inscrire dans une classe avec un code"
      description: |
        La troisieme porte d ADR-803-03 : l apprenant s inscrit LUI-MEME.
        L import suppose que l ecole detienne deja la liste ; c est faux d un
        formateur qui diffuse son code par WhatsApp.

        Route ANONYME — celui qui s inscrit n a pas encore de compte. Le code
        EST son autorisation, et il choisit son mot de passe : contrairement a
        l import, il est present et n a besoin d aucun lien d activation.

        En-tete `X-Institution` OBLIGATOIRE : le code n est unique que par
        etablissement, donc une requete qui ne porterait que le code serait
        ambigue entre deux ecoles.

        Debit (#915) : le seau NOMME de la route ne borne que l inondation
        (60 requetes par minute et par adresse). Les codes FAUX sont bornes a
        part, et seuls eux : 5 par minute et 30 par jour par adresse, 200 par
        jour par etablissement (partages avec la porte authentifiee). Une
        inscription reussie n est jamais un essai de trop.

        La reponse ne rend NI jeton NI session : l inscrit se connecte ensuite
        avec le mot de passe qu il vient de choisir.

        Un compte qui existe deja avec ces coordonnees recoit la MEME reponse
        qu un compte neuf (#914) : il n est PAS touche (ni mot de passe, ni role,
        ni inscription, #812), et rien ne dit lequel des deux cas s est produit.
        L apprenant qui a deja un compte rejoint sa classe par la porte
        authentifiee `/me/inscriptions`.
      security: []
      parameters:
        - name: X-Institution
          in: header
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - code
                - nom
                - password
                - password_confirmation
              properties:
                code:
                  type: string
                  minLength: 4
                  maxLength: 12
                  example: BUR7K2
                nom:
                  type: string
                  maxLength: 191
                email:
                  type: string
                  format: email
                  nullable: true
                telephone:
                  type: string
                  maxLength: 40
                  nullable: true
                  description: "Une adresse OU un numero est exige, sans imposer lequel."
                password:
                  type: string
                  minLength: 8
                password_confirmation:
                  type: string
      responses:
        '202':
          description: "Demande enregistree : compte cree, ou compte existant laisse intact (la meme reponse)"
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  message:
                    type: string
                  data:
                    type: object
                    properties:
                      classe:
                        type: object
                        properties:
                          id:
                            type: integer
                          libelle:
                            type: string
        '400':
          description: "En-tete X-Institution absent, ou etablissement non resolu"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: |
            Ce code n ouvre aucune inscription. Un code INCONNU, un code
            RETIRE et le code d un etablissement dont la liste des apprenants
            vient de KLASSCI rendent le MEME message : les separer dirait qu un
            code a existe pour cette valeur.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: |
            `class_full` : la classe a atteint sa capacite (#1115). Rien n est
            ecrit, aucun compte n est cree. Un compte existant et un compte neuf
            recoivent la MEME reponse (#914). Ce refus n est pas un echec compte.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RefusMotive'
        '422':
          description: "Charge invalide, ou ni adresse ni telephone"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationFailed'
        '429':
          description: |
            Debit depasse. Le motif dit QUEL budget (#906, #915) :
            - `ip_quota_exceeded` : 60 requetes par minute depuis cette adresse
              (seau de route, avec `Retry-After`), ou 5 codes faux par minute ;
            - `ip_daily_cap_reached` : 30 codes faux par jour depuis cette adresse ;
            - `institution_cap_reached` : 200 codes faux par jour dans cet
              etablissement.
            Les plafonds de codes faux sont des refus metier, sans `Retry-After`.
          headers:
            Retry-After:
              schema:
                type: integer
              description: "Secondes a attendre avant de reessayer."
            X-RateLimit-Limit:
              schema:
                type: integer
              description: "Quota de la borne qui a refuse."
            X-RateLimit-Remaining:
              schema:
                type: integer
              description: "Requetes restantes dans la fenetre courante."
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RefusMotive'

  /me/inscriptions:
    post:
      operationId: joinClassWithEnrolmentCode
      tags:
        - Session de formation
      summary: "Rejoindre une classe avec un code, deja connecte"
      description: |
        La MEME troisieme porte d ADR-803-03, authentifiee (#885). La porte
        anonyme `/inscriptions` refuse tout compte existant — une adresse n y
        prouve rien — et renvoie l apprenant ici. Meme code, meme resolution,
        meme service.

        L etablissement vient du COMPTE, jamais d un en-tete : un
        `X-Institution` est ignore.

        Un code fait ENTRER, il ne rouvre pas : une adhesion existante non
        active (suspendue, abandonnee, expiree...) est refusee sans etre
        touchee. Seul l etablissement la rouvre.

        Debit compte PAR APPRENANT, jamais par IP : une classe entiere rejoint
        depuis le wifi de l ecole.
      security:
        - sanctum: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - code
              properties:
                code:
                  type: string
                  minLength: 4
                  maxLength: 12
                  example: BUR7K2
      responses:
        '201':
          description: "Adhesion creee"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClasseRejointeResponse'
        '200':
          description: "L apprenant etait deja inscrit : rien n est reecrit"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClasseRejointeResponse'
        '400':
          $ref: '#/components/responses/EtablissementInconnu'
        '401':
          description: "Non authentifie"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: |
            Le compte n est pas un apprenant — y compris l administrateur
            d etablissement, que la garde de route laisserait passer.
            Aussi, sans `reason` : etablissement desactive ou supprime (ResolveInstitution, #961).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: |
            Ce code n ouvre aucune inscription dans l etablissement du compte.
            Inconnu, retire, d une autre ecole, ou d un etablissement dont la
            liste des apprenants vient de KLASSCI : MEME message.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: |
            Rien n est ecrit. Trois sens, trois motifs (#906) :
            - `enrolment_not_active` : une adhesion non active existe deja —
              decision de l etablissement, pas une panne ;
            - `no_institution` : le compte n est rattache a aucun etablissement ;
            - `class_full` : la classe a atteint sa capacite (#1115). Un membre
              deja actif n est pas concerne (201 inchange).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RefusMotive'
        '422':
          description: "Code absent ou hors bornes"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationFailed'
        '429':
          description: |
            Debit depasse. Le motif dit QUEL budget (#906) :
            - `account_quota_exceeded` : le seau du compte, borne de la
              minute (10/min), avec `Retry-After` ;
            - `account_daily_cap_reached` : le meme seau, borne du jour
              (30/jour) ;
            - `institution_cap_reached` : le plafond d ECHECS de l etablissement
              (200/jour), qui ferme la porte a tous ses apprenants jusqu au
              lendemain.
          headers:
            Retry-After:
              schema:
                type: integer
              description: "Secondes a attendre avant de reessayer. Absent sur `institution_cap_reached`, refus metier et non seau."
            X-RateLimit-Limit:
              schema:
                type: integer
              description: "Quota de la borne qui a refuse. Sur `institution_cap_reached`, decrit le seau du COMPTE, pas le plafond de l etablissement."
            X-RateLimit-Remaining:
              schema:
                type: integer
              description: "Requetes restantes dans la fenetre courante. Sur `institution_cap_reached`, decrit le seau du COMPTE, pas le plafond de l etablissement."
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RefusMotive'

  /classes/{classe}/periode:
