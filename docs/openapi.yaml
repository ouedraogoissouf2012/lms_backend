                $ref: '#/components/schemas/ErrorResponse'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          description: "Erreur interne"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorWithDetail'

  /evaluations/{id}/submissions/{submission}/grade:
    post:
      tags:
        - Evaluations
      operationId: gradeEvaluationSubmission
      summary: "Noter les dissertations d une copie"
      description: |
        Attribue les points des questions `dissertation`, recalcule
        `note_sur_20` et passe la copie en `corrige`. Chaque dissertation de
        l evaluation doit recevoir des points. Les points des autres questions
        restent ceux de la correction automatique.

        Enseignant proprietaire ou administrateur ; les coordinateurs ne
        notent pas. `data.student` est le compte complet de l eleve : au-dela
        des champs de `User`, il porte notamment `klassci_id`, `klassci_data`,
        `phone`, `institution_id`.
      security:
        - sanctum: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
        - name: submission
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - points
              properties:
                points:
                  type: object
                  minProperties: 1
                  description: "MAP `{ \"<question_id>\": points }`, points >= 0"
                  additionalProperties:
                    type: number
                    minimum: 0
                  example:
                    "14": 4
                feedback:
                  type: string
                  maxLength: 1000
                  nullable: true
      responses:
        '200':
          description: "Copie notee"
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  message:
                    type: string
                  data:
                    $ref: '#/components/schemas/EvaluationSubmissionRecord'
        '400':
          $ref: '#/components/responses/EtablissementInconnu'
        '401':
          description: "Non authentifie"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageOnly'
        '403':
          description: |
            Role insuffisant, coordinateur, enseignant non proprietaire (dans son ecole).
            Aussi, sans `reason` : etablissement desactive ou supprime (ResolveInstitution, #961).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageOnly'
        '404':
          description: "Evaluation introuvable (#1782) : absente, supprimee ou d une autre ecole, avec le meme corps dans les trois cas. Un 403 dirait qu elle existe ailleurs. Aussi : copie inexistante, ou appartenant a une autre evaluation"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageOnly'
        '409':
          description: |
            - `reason: evaluation_submission_not_gradable` : copie encore `en_cours`,
              elle ne peut pas encore etre notee (#922).
            - `reason: evaluation_attempt_locked` : copie hors delai (C28), remise
              refusee ou tentative echue. Elle est visible, jamais notee.
          content:
            application/json:
              schema:
                type: object
                required:
                  - success
                  - message
                properties:
                  success:
                    type: boolean
                    example: false
                  message:
                    type: string
                  reason:
                    type: string
                    enum:
                      - evaluation_submission_not_gradable
                      - evaluation_attempt_locked
        '422':
          description: |
            `points` absent ou invalide (forme `ValidationFailed`) ; ou
            evaluation sans dissertation, ou dissertation sans points (forme
            `MessageOnly`).
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/ValidationFailed'
                  - $ref: '#/components/schemas/MessageOnly'

  /evaluations/{id}/results-by-class:
    get:
      tags:
        - Evaluations
      operationId: getEvaluationResultsByClass
      summary: "Resultats par eleve de la classe, et statistiques"
      description: |
        Une ligne par eleve de la classe, qu il ait passe l evaluation ou non
        (`status: non_passee`). Les tentatives d entrainement sont ignorees ; la
        ligne porte la derniere copie de l eleve, rattachee par son auteur
        (`student_id`), puis, pour une ligne d avant D72, par son identite
        KLASSCI. Lecture : enseignant proprietaire, coordinateur de
        l etablissement, admin d etablissement (`superAdmin`).

        Ecole creee depuis KLASSCI : la liste des eleves est lue sur KLASSCI, et
        l evaluation est presentee avec le catalogue KLASSCI. `etudiant_id` est
        l identite KLASSCI de l eleve.

        Ecole creee depuis le LMS (D72, E3) : les eleves dont l inscription a la
        classe de l evaluation (`classe_id`) est ACTIVE, sans jeton ni appel a
        KLASSCI. `etudiant_id` est le compte local ; `etudiant_nom` et
        `etudiant_nom_complet` portent son nom, `etudiant_prenom` est vide.

        Aucune copie remise n est jamais invisible : l auteur d une copie hors
        du roster (admis par le repli `user_classes`, desinscrit apres sa remise,
        sorti du roster KLASSCI) a sa ligne, marquee `inscription: null`, dans
        l etablissement de l evaluation. Il est compte dans `total_etudiants`,
        jamais parmi les absents.

        `data.evaluation` est l evaluation enrichie : ses questions (sans
        corrige), toutes ses copies, et des champs de presentation.

        Une erreur 4xx renvoyee par KLASSCI est relayee avec SON statut, et un
        message generique.
      security:
        - sanctum: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: "Resultats"
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: object
                    properties:
                      evaluation:
                        $ref: '#/components/schemas/EvaluationEnrichie'
                      resultats:
                        type: array
                        items:
                          type: object
                          properties:
                            etudiant_id:
                              type: integer
                              nullable: true
                              description: |
                                L identite KLASSCI (ecole creee depuis KLASSCI) ou le compte
                                local (ecole creee depuis le LMS). Nul pour une copie hors
                                roster sans identite dans cet espace.
                            etudiant_nom:
                              type: string
                            etudiant_prenom:
                              type: string
                            etudiant_nom_complet:
                              type: string
                            note:
                              type: string
                              pattern: '^-?\d+\.\d{2}$'
                              nullable: true
                              description: "Note sur 20"
                            score:
                              type: string
                              pattern: '^-?\d+\.\d{2}$'
                              nullable: true
                            status:
                              type: string
                              enum: [non_passee, en_cours, soumis, corrige, verrouille]
                              description: "`verrouille` : copie hors delai (C28), visible, jamais notee."
                            submitted_at:
                              type: string
                              format: date-time
                              nullable: true
                            attempt:
                              type: integer
                              nullable: true
                            feedback:
                              type: string
                              nullable: true
                            inscription:
                              type: string
                              nullable: true
                              enum: [active, null]
                              description: |
                                `active` : l eleve est au roster de la classe. `null` :
                                l auteur d une copie hors du roster.
                      statistiques:
                        type: object
                        properties:
                          total_etudiants:
                            type: integer
                            description: "Toutes les lignes : le roster et les auteurs hors roster"
                          etudiants_soumis:
                            type: integer
                            description: "Copies `soumis` ou `corrige`"
                          etudiants_en_cours:
                            type: integer
                          etudiants_hors_delai:
                            type: integer
                            description: "Copies `verrouille` (C28) : remises refusees, ou tentatives echues jamais remises"
                          etudiants_non_passes:
                            type: integer
                          taux_participation:
                            type: number
                            description: "Pourcentage, arrondi a 2 decimales"
                          moyenne_classe:
                            type: number
                            nullable: true
                          note_max:
                            type: number
                            nullable: true
                          note_min:
                            type: number
                            nullable: true
        '400':
          $ref: '#/components/responses/EtablissementInconnu'
        '401':
          # Ecole creee depuis KLASSCI seulement : sans jeton KLASSCI.
          $ref: '#/components/responses/KlassciUnauthorized'
        '403':
          description: |
            Role insuffisant, enseignant non proprietaire (dans son ecole).
            Aussi, sans `reason` : etablissement desactive ou supprime (ResolveInstitution, #961).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageOnly'
        '404':
          description: "Evaluation introuvable (#1782) : absente, supprimee ou d une autre ecole, avec le meme corps dans les trois cas. Un 403 dirait qu elle existe ailleurs."
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '503':
          description: "KLASSCI indisponible (en-tete `Retry-After`)"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageOnly'
        '500':
          description: "Erreur interne"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorWithDetail'

  /evaluations/{id}/release:
    patch:
      tags:
        - Evaluations
      operationId: releaseEvaluation
      summary: "Publier les notes et regler l ouverture du corrige"
      description: |
        #1699 : publier les notes est un geste distinct de leur saisie. `show_results`
        vrai rend a l eleve sa note, son score et le commentaire de l enseignant. Faux
        les lui retire. `correction_release` choisit quand le corrige s ouvre (voir
        `EvaluationRecord`). Dans tous les modes, jamais avant la fermeture de
        l evaluation pour tous.

        Permise sur une evaluation VERROUILLEE (copies remises) : elle ne touche ni
        aux questions ni aux copies. `PUT /evaluations/{id}` rend 409 des la premiere
        copie, et c etait la seule voie vers `show_results`.

        Au moins un reglage. `correction_release_at` n existe qu avec `at_date`, qui
        l exige ; un autre mode efface la date.

        Roles : enseignant (proprietaire de l evaluation) ou administrateur. Les
        coordinateurs ne publient pas.
      security:
        - sanctum: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              minProperties: 1
              properties:
                show_results:
                  type: boolean
                correction_release:
                  type: string
                  enum: [never, with_results, after_close, at_date]
                correction_release_at:
                  type: string
                  format: date-time
                  nullable: true
                  description: "Requise pour `at_date`, interdite sinon."
      responses:
        '200':
          description: "Reglage enregistre"
          content:
            application/json:
              schema:
                type: object
                required:
                  - success
                  - data
                properties:
                  success:
                    type: boolean
                  message:
                    type: string
                  data:
                    $ref: '#/components/schemas/EvaluationRecord'
        '400':
          $ref: '#/components/responses/EtablissementInconnu'
        '401':
          description: "Non authentifie"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageOnly'
        '403':
          description: |
            Role insuffisant, coordinateur, eleve, enseignant non proprietaire. Aussi,
            sans `reason` : etablissement desactive ou supprime (ResolveInstitution, #961).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageOnly'
        '404':
          description: |
            Evaluation introuvable : absente, supprimee, ou d une AUTRE ecole. Le meme
            corps dans les trois cas (isolation : un 403 confirmerait qu elle existe).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageOnly'
        '422':
          description: "Aucun reglage, mode inconnu, ou date absente, illisible ou orpheline."
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationFailed'
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /evaluations/{id}/sync-klassci:
    post:
      tags:
        - Evaluations
      operationId: syncEvaluationNotesToKlassci
      summary: "Envoyer les notes a KLASSCI"
      description: |
        Envoie a KLASSCI la note sur 20 de chaque copie `soumis` ou `corrige`
        (entrainements exclus), puis marque l evaluation `notes_published` et
        ses copies `synced_to_klassci`. Aucun corps de requete.

        Bloque (409) tant qu une copie a dissertation n est pas notee.
        `data` est la reponse de KLASSCI, relayee telle quelle.

        Un echec de KLASSCI suit la regle commune des routes adossees a
        KLASSCI : jeton refuse en 401 motive, refus 4xx relaye avec son statut,
        panne en 503 avec `Retry-After`. Un echec que KLASSCI declare en 2xx
        (`success: false`) rend 503. Dans tous ces cas, rien n est marque.

        Enseignant proprietaire de l evaluation ou administrateur. Les
        coordinateurs ne synchronisent pas, comme ils ne publient pas.
      security:
        - sanctum: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: "Notes envoyees"
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  message:
                    type: string
                  data:
                    description: "Reponse de KLASSCI, forme non garantie par le LMS"
        '400':
          $ref: '#/components/responses/EtablissementInconnu'
        '401':
          $ref: '#/components/responses/KlassciUnauthorized'
        '403':
          description: |
            Role insuffisant, coordinateur, enseignant non proprietaire (dans son ecole).
            Aussi, sans `reason` : etablissement desactive ou supprime (ResolveInstitution, #961).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageOnly'
        '404':
          description: "Evaluation introuvable (#1782) : absente, supprimee ou d une autre ecole, avec le meme corps dans les trois cas. Un 403 dirait qu elle existe ailleurs. Aussi : KLASSCI ne connait pas cette evaluation, relaye. Rien n est marque."
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageOnly'
        '422':
          description: |
            Sans `reason` : KLASSCI refuse les notes, relaye, sans detail par champ.
            Rien n est marque.

            `evaluation_not_linked_to_klassci` : l evaluation n est liee a aucune
            evaluation KLASSCI (`klassci_evaluation_id` nul) : celle d une ecole creee
            depuis le LMS, ou une ligne jamais liee. Refus motive, avant tout
            traitement : rien n est envoye ni marque (D72, E3).

            `no_submission_to_sync` : aucune copie a synchroniser (remise, hors
            entrainement : `submissions_to_sync_count` vaut 0). Refus motive avant tout
            appel a KLASSCI : rien n est envoye ni marque (D539).
          content:
            application/json:
              schema:
                type: object
                required:
                  - success
                  - message
                properties:
                  success:
                    type: boolean
                    example: false
                  message:
                    type: string
                  reason:
                    type: string
                    enum:
                      - evaluation_not_linked_to_klassci
                      - no_submission_to_sync
        '409':
          description: |
            Une copie a dissertation n est pas encore notee, ou KLASSCI signale un
            conflit (relaye).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageOnly'
        '429':
          description: "KLASSCI limite les requetes, relaye, SANS son en-tete `Retry-After`. Rien n est marque."
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageOnly'
        '503':
          description: |
            KLASSCI est indisponible (panne, reseau, circuit ouvert), ou il declare
            un echec en 2xx (`success: false`). Avec `Retry-After`. Rien n est marque.
          headers:
            Retry-After:
              schema:
                type: integer
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KlassciIndisponible'
        '500':
          description: "Panne interne du LMS"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorWithDetail'

