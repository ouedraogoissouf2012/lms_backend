  /lms/seances/{seanceId}:
    put:
      tags:
        - Visio
      operationId: updateSeance
      summary: "Modifier une seance"
      description: |
        #1121, decision du user du 17/11. PUT et PATCH ont le meme effet :
        chaque champ est facultatif, seuls les champs recus changent. La
        matiere ne se change pas.

        **Ecole creee depuis le LMS.** L'auteur de la seance ou la gestion de
        l'etablissement (la regle de la suppression) modifie le titre, la date
        (ISO 8601 avec decalage) et la classe. Les regles de la creation
        s'appliquent : la classe de l'etablissement, au programme de la matiere
        de la seance. Une seance passee (`seance_past`, #1107) et une seance
        dont la visio est en cours (`seance_visio_active`) ne se modifient pas.
        Deplacer une seance dans le passe reste permis, comme a la creation.

        **Ecole creee depuis KLASSCI.** La seance se modifie dans KLASSCI ; le
        LMS refuse (403 `seance_managed_by_klassci`), y compris pour une seance
        creee dans le LMS. Rien n'est ecrit.

        Les cartes de seance portent `can_be_edited` (`SeanceCalendrier`).
      security:
        - sanctum: []
      parameters:
        - name: seanceId
          in: path
          required: true
