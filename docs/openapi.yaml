              type: object
              required:
                - training_session_id
              properties:
                training_session_id:
                  type: integer
                  minimum: 1
                  nullable: true
      responses:
        '200':
          description: "Classe rattachee, ou detachee"
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  message:
                    type: string
                  data:
                    type: object
                    properties:
                      id:
                        type: integer
                      training_session_id:
                        type: integer
                        nullable: true
        '400':
          $ref: '#/components/responses/EtablissementInconnu'
        '401':
          description: "Non authentifie"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: "Role insuffisant, ou catalogue venant de KLASSCI (`catalogue_managed_by_klassci`, #1184). Aussi, sans `reason` : etablissement desactive ou supprime (ResolveInstitution, #961)."
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: "Classe introuvable DANS CET ETABLISSEMENT"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: "`training_session_id` absent, mal forme, ou Periode refusee (inexistante, d un autre etablissement, ou ne recevant plus d inscriptions)."
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /classes/{classe}/capacite:
    put:
      tags:
        - Session de formation
      summary: "Regler la capacite d une classe"
      description: |
        Un geste NOMME (#1358), sur le modele de la Periode, pas une modification
        generale de la classe. `effectif` est la CAPACITE que l inscription par code
        respecte (#1115) : une classe complete refuse les NOUVELLES adhesions.

        `effectif` est EXIGE, nul compris : `null` ou 0 retire la limite. Baisser la
        capacite sous l effectif actuel n expulse personne.

        Reserve aux etablissements qui tiennent leur propre catalogue : en ecole
        KLASSCI, la capacite vient de KLASSCI (403 `catalogue_managed_by_klassci`).
      security:
        - sanctum: []
      parameters:
        - name: classe
          in: path
          required: true
          schema:
            type: integer
            minimum: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - effectif
              properties:
                effectif:
                  type: integer
                  minimum: 0
                  maximum: 10000
                  nullable: true
      responses:
        '200':
          description: "Capacite enregistree, ou retiree"
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  message:
                    type: string
                  data:
                    type: object
                    properties:
                      id:
                        type: integer
                      effectif:
                        type: integer
                        nullable: true
                        description: "La capacite ; `null` sans limite."
        '400':
          $ref: '#/components/responses/EtablissementInconnu'
        '401':
          description: "Non authentifie"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: "Role insuffisant, ou catalogue venant de KLASSCI (`catalogue_managed_by_klassci`, #1184). Aussi, sans `reason` : etablissement desactive ou supprime (ResolveInstitution, #961)."
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: "Classe introuvable DANS CET ETABLISSEMENT"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: "`effectif` absent, ou hors de 0 a 10000."
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /classes/{classe}/archiver:
    post:
      operationId: archiveLocalClass
      tags:
        - Session de formation
      summary: "Archiver une classe locale"
      description: |
        Un geste NOMME (#1652). La classe recoit sa date d archive et son code
        d inscription est retire (la valeur demeure). Plus aucune inscription n y
        entre, par aucune porte : codes (meme 404 qu un code inconnu), service
        d inscription (409 `class_archived`), import. Ses eleves, ses notes et ses
        presences restent lisibles. Archiver deux fois garde la premiere date.
      security:
        - sanctum: []
      parameters:
