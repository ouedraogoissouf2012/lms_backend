                  type: integer
                  nullable: true
                  description: "`null` si aucune matiere ne porte d'heures ; 0 sans matiere."
                total_seances:
                  type: integer
                  nullable: true
                  description: "Toujours `null` : aucune des deux sources ne porte cette donnee."

    MatiereAdministration:
      type: object
      additionalProperties: false
      required:
        - id
        - nom
        - code
        - couleur
        - heures_total
        - nb_evaluations
        - nb_seances_programmees
        - nb_lecons
        - combinaisons
      properties:
        id:
          description: "Ecole creee depuis le LMS : l'identifiant LOCAL. Ecole creee depuis KLASSCI : celui de KLASSCI, tel quel."
          nullable: true
          oneOf:
            - type: integer
            - type: string
        nom:
          type: string
          description: "`N/A` si absent."
        code:
          type: string
          description: "`N/A` si absent."
        description:
          type: string
          nullable: true
        coefficient:
          description: "Tel que la source le porte."
          nullable: true
          oneOf:
            - type: number
            - type: string
        couleur:
          type: string
          example: "#6366f1"
        heures_total:
          type: integer
          nullable: true
          description: "Toujours `null` dans une ecole creee depuis le LMS : aucune heure n'est tenue."
        nb_evaluations:
          type: integer
          nullable: true
          description: "Ecole creee depuis le LMS : toutes les evaluations de l etablissement dans la matiere (D72, E4c)."
        nb_seances_programmees:
          type: integer
          nullable: true
          description: "Toujours `null` : la donnee n'est pas connue."
        nb_lecons:
          type: integer
          nullable: true
          description: "Ecole creee depuis le LMS : les lecons de la matiere, tous statuts. Ecole creee depuis KLASSCI : `null`."
        combinaisons:
          type: array
          description: "Toujours vide dans une ecole creee depuis le LMS : aucune filiere ni aucun niveau local."
          items:
            type: object
        edition:
          type: object
          description: |
            #1653. Les valeurs BRUTES d une matiere LOCALE, pour l ecran qui la
            modifie (`PATCH /matieres/{matiere}`). ABSENTE pour une matiere miroir
            de KLASSCI et dans une ecole KLASSCI : son absence dit que la matiere
            ne se modifie pas ici. Les champs affiches ci-dessus ne changent pas
            (`code` y garde son `N/A`).
          properties:
            libelle:
              type: string
            code:
              type: string
              nullable: true
            description:
              type: string
              nullable: true
            coefficient:
              type: integer
            credit:
              type: integer

